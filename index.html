     24 Aug — a collision became a refusal rather than a "Book anyway" caution):
       1. it is on the account                    → Booked (inert)
       2. it collides with something booked       → an inert LABEL (One per day / Clashes):
          same studio already taken that day, or a time overlap. Above the waitlist states
          because every action this slot could offer — book now, save the date, join the
          waitlist — ends in a class he cannot attend or FIT will refuse.
       3. full AND its window is open, waitlist   → Join Waitlist
       4. full AND its window is open, no waitlist→ an inert LABEL, not a disabled button:
          a shape is what says "press me", so removing the shape removes the question.
          Rendered as a <span> for the same reason.
       5. a pick will take this occurrence        → Booked (inert)
       6. its window has not opened               → Book, which saves a pick
       7. otherwise                               → Book, right now
     The `open &&` guard on 3 and 4 is what keeps a not-yet-open row out of them: before a
     window opens nobody can hold a place in the class, so a "full" flag on a future row is
     stale data from the week the app copied it, and offering a waitlist against it would be
     inventing a fact. 3 and 4 sit above 5 because FIT's answer outranks our intention. */
  let actHTML;
  if(!!mine){
    actHTML = '<span class="wlpill go">'+G.check+'<span>Booked</span></span>';
  } else if(block){
    /* A collision is a refusal, not a question (24 Aug). Inert for the same reason the
       full states are: no shape, no poke. The longform line below carries the why, so the
       refusal is never silent (P-18). Grey, not red — nothing is wrong, he is simply
       already committed, and the amber line beneath is the explanation. */
    actHTML = '<span class="wlpill">'+G.noentry+'<span>'+
      (block.kind==='studio' ? 'One per day' : 'Clashes')+'</span></span>';
  } else if(open && av.full && av.waitlist){
    /* A full class you do not hold outranks a pick's claim on it: the pick will try and be
       refused, and meanwhile there is a real waitlist place to be had. */
    actHTML = '<button class="bookpill wl" data-book="'+esc(c.bid)+'" data-mode="waitlist" '+
      'aria-label="Join the waitlist for '+esc(c.name || c.studio)+'">'+
      '<span class="wlj">Join</span><span class="wln">Waitlist</span></button>';
  } else if(open && av.full){
    actHTML = '<span class="wlpill bad">'+G.noentry+'<span>Waitlist full</span></span>';
  } else if(shownBooked){
    actHTML = '<span class="wlpill go">'+G.check+'<span>Booked</span></span>';
  } else if(!open){
    actHTML = '<button class="bookpill" data-book="'+esc(c.bid)+'" data-mode="pick" '+
      'aria-label="Book '+esc(c.name || c.studio)+' on '+esc(longDate(c.date))+'">Book</button>';
  } else {
    actHTML = '<button class="bookpill" data-book="'+esc(c.bid)+'" '+
      'data-mode="now" aria-label="Book this class now">Book</button>';
  }

  return '<div class="crow'+(shownBooked?' isbooked':'')+(av.full&&!shownBooked?' isfull':'')+
    '" data-bid="'+esc(c.bid)+'" id="row-'+esc(c.bid)+'">'+
    '<div class="ctime"><b>'+esc(t.h)+'</b><span>'+t.ap.toUpperCase()+'</span></div>'+
    '<div class="cbody">'+
      '<div class="cname">'+esc(c.name || c.studio)+'</div>'+
      '<div class="cmeta">'+
        (stTxt ? '<span class="cst '+stCls+'">'+stG+'<span>'+esc(stTxt)+'</span></span>' : '')+
        '<span class="ctail"><i class="sdot" style="background:'+(SCOLOR[c.studio]||'var(--ink3)')+'"></i>'+
          '<span>'+esc(tail)+'</span></span>'+
      '</div>'+
      /* a warning gets its own full-width line so it can wrap instead of truncate */
      (block ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
        '<span>'+esc(blockLine(block, c))+'</span></span></div>' : '')+
      (clash ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
        '<span>Clashes with your '+esc(fmt12(clash.time).full)+' pick</span></span></div>' : '')+
    '</div>'+
    '<div class="cact">'+
      actHTML+
      /* The glyph is now the WEEKLY control and nothing else — it presses and unpresses
         against the recurring pick alone. It used to toggle "whatever pick exists", which
         under the new split would have made the Book button's own one-off vanish on the
         next tap of a control that reads as unrelated. */
      /* role=switch + aria-checked, matching the sheet's control for the same setting, and
         a FIXED label. Flipping the label with the state made VoiceOver read "Stop booking
         this every Thursday, selected" when it was on — which says the opposite of the
         truth. The state is the state's job. */
      '<button class="ptog" role="switch" data-pick="'+esc(c.bid)+'" aria-checked="'+hasRec+'" '+
        'aria-label="Book this every '+esc(WD_LONG[dowMon0(c.date)])+'">'+
        '<span class="pk">'+G.repeat+'</span></button>'+
    '</div>'+
  '</div>';
}

/* ── Book screen ────────────────────────────────────────────── */
function renderBook(){
  const w = $('#w-book');
  /* AUDIT — weekStart was re-clamped only in syncWeek(), reached only from indexDates(). The
     studio chip, the day swipe and the idle re-render all call renderBook() directly, so an
     app left open across Sydney midnight kept yesterday's anchor and drew two dead days as
     ordinary live cells — and they were tappable, because removing the `past` branch removed
     the guard with it. One clamp here covers every path into the strip. */
  /* pageOf() also RE-ALIGNS: clampWeek alone only bounds, so an anchor left over from
     yesterday stayed a day off the page grid and tapping the leftmost cell slid the strip
     backwards a week. pageOf is idempotent on an anchor that is already aligned. */
  weekStart = pageOf(weekStart || firstWeek());
  /* AUDIT round 2 — the memo was dropped in renderAll() and on pick edits only, and every
     direct renderBook()/renderPicks() path (a day tap, a week step, a chip, flushTab)
     skipped it. pickState reads the clock, so a Book tab redrawn 25 minutes later showed
     clash warnings computed against a window the bot had already passed. It is a null
     assignment; do it wherever a render begins. */
  resetDerived();
  if(!allDates.length){
    w.innerHTML = offlineBanner() +
      '<div class="emptystate"><div class="eg">'+G.big_cal+'</div>'+
      '<div class="et">'+(loadError?'No timetable on this device':'No timetable yet')+'</div>'+
      '<div class="es">'+(loadError
        ? 'Nothing has been cached here yet and the booking service is unreachable. It will fill in by itself once you have a connection.'
        : 'Your classes are on their way. Pull down to refresh.')+'</div></div>';
    return;
  }
  const list = classesFor(selDate);
  /* The day heading carried "N left · M open". It is gone with the heading: the bucket
     headings already count their own rows, and "open" stopped meaning anything once every
     future class got a Book button too. A summary that restates the screen under it is noise. */

  const buckets = [
    {k:'Morning',   f:c=>Number(String(c.time).split(':')[0]) < 12},
    {k:'Afternoon', f:c=>{const h=Number(String(c.time).split(':')[0]); return h>=12 && h<17;}},
    {k:'Evening',   f:c=>Number(String(c.time).split(':')[0]) >= 17}
  ];
  let listHTML = '';
  if(!list.length){
    /* AUDIT — "already started" was the only wording here, and with a 28-day strip it was
       routinely shown for a date three weeks away. On a future day an empty list means FIT
       has not published (or has closed) that day, which is a different fact. */
    /* AUDIT (round 2) — the discriminator is not "is this day in the future" but "did this
       day ever have classes". Today with nothing published is the one case where "every
       class has already started" is both false and least obviously so. */
    /* AUDIT (18 Aug) — and it has to be measured against the SAME set the list drew from.
       Computed over the unfiltered timetable it told the reader that every Run class on a
       Sunday had "already started" — on a Sunday six days away, for a studio that has
       never run a Sunday class. Eight such cells in the current timetable. */
    const anyThatDay = (timetable.classes||[]).some(c => c && c.date === selDate &&
      (studioFilter==='all' || c.studio===studioFilter));
    const anyAtAll = (timetable.classes||[]).some(c => c && c.date === selDate);
    /* Two different silences, and they are not interchangeable: a day with nothing on it
       INSIDE the published fortnight is FIT publishing no classes for that day, while a
       day past the end of the scrape is FIT not having published that week at all (the
       projection can leave such holes — it shifts by whole weeks and never projects inside
       the bookable window). Compare against the last REAL date, not against today. */
    let lastReal = '';
    (timetable.classes||[]).forEach(c=>{ if(c && !c.projected && c.date > lastReal) lastReal = c.date; });
    const unpublished = !anyAtAll && !!lastReal && selDate > lastReal;
    listHTML = '<div class="emptystate"><div class="eg">'+G.big_cal+'</div>'+
      '<div class="et">'+(anyThatDay ? 'Nothing left here' : 'Nothing here')+'</div><div class="es">'+
      (studioFilter==='all'
        ? (anyThatDay ? 'Every class on this day has already started.'
           : unpublished ? 'FIT publishes about two weeks ahead — this day isn’t out yet.'
                         : 'FIT hasn’t published any classes for this day.')
        : 'No '+esc(SLABEL[studioFilter]||studioFilter)+' classes '+(anyThatDay?'left on':'on')+
          ' this day — try All.')+'</div></div>';
  } else {
    buckets.forEach(b=>{
      const rows = list.filter(b.f);
      if(!rows.length) return;
      listHTML += '<div class="ghead tight">'+b.k+'<span class="gh-r">'+rows.length+'</span></div>'+
                  '<div class="group">'+rows.map(c=>classRowHTML(c)).join('')+'</div>';
    });
    /* The footer explained the two controls, the booking window and what a tap does. The
       controls say all of that by being a Book button and a repeat glyph, and the rest was
       a description of machinery this app is not supposed to have. */
  }

  const nowRule = (selDate === sydToday())
    ? '<div class="nowrule"><i></i><span>Now</span><em>'+esc(sydNowClock())+'</em><s></s></div>' : '';


  /* F10 + AUDIT (18 Aug) — renderBook rewrites #w-book wholesale, which recreates #chips
     with scrollLeft 0. renderAll() and the chip handler each saved and restored it; every
     other route into here (a day tap, a week step, a pick toggle, jumpToClass) did not, so
     the rail snapped back to the left while the filter stayed on. At 440 px that puts the
     SELECTED chip off-screen entirely and leaves five chips all reading unselected — the
     control says "no filter" while the list shows one studio. One owner, here. */
  const chipsLeft = (function(){ const el = $('#chips'); return el ? el.scrollLeft : 0; })();
  w.innerHTML =
    offlineBanner()+
    '<div class="stickybar">'+
      '<div class="railwrap"><div class="railslide" id="railslide">'+
        '<div class="rail" id="rail">'+railHTML()+'</div>'+
      '</div></div>'+
      '<div class="chipwrap"><div class="chips" id="chips">'+chipsHTML()+'</div></div>'+
    '</div>'+
    alertsHTML('book')+
    '<div class="dayslide" id="dayslide">'+
      nowRule+
      listHTML+
      '<div class="spacer"></div>'+
    '</div>';
  syncWeekNav();
  const chipsEl = $('#chips');
  if(chipsEl){
    if(chipsLeft) chipsEl.scrollLeft = chipsLeft;
    /* and never let the active filter be the one chip you cannot see */
    const sel = chipsEl.querySelector('.chip[aria-selected="true"]');
    if(sel){
      const l = sel.offsetLeft, r = l + sel.offsetWidth;
      if(l < chipsEl.scrollLeft) chipsEl.scrollLeft = Math.max(0, l - 8);
      else if(r > chipsEl.scrollLeft + chipsEl.clientWidth)
        chipsEl.scrollLeft = r - chipsEl.clientWidth + 8;
    }
  }
}

/* ── week paging ────────────────────────────────────────────── */
function stepWeek(delta){
  if(!weekStart) return;
  const next = clampWeek(addDays(weekStart, delta*7));
  const slide = $('#railslide');
  if(next === weekStart){
    if(slide){ slide.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
               slide.style.transform='translateX('+(delta>0?-10:10)+'px)';
               setTimeout(()=>{ slide.style.transform=''; setTimeout(()=>{ slide.style.transition=''; },320); },130); }
    return;
  }
  if(slide) slide.classList.add(delta > 0 ? 'out-l' : 'out-r');
  weekStart = next;
  /* AUDIT (18 Aug) — paging the strip moved `weekStart` and left `selDate` behind, so the
     screen showed a week header for 24–30 Aug, no selected cell anywhere, and underneath
     it "Tomorrow · 41 left · 27 open" with live Book buttons for the 18th. The two halves
     of one screen described different weeks, indefinitely, and the strip — the dominant
     control — was the one that was wrong. Carry the day with the page. */
  const want = clampDate(addDays(selDate, delta*7));
  if(want !== selDate){ selDate = want; scrollMemo.book = 0; }
  setTimeout(()=>{
    try{ renderBook(); }catch(e){ safeRender('book', renderBook); }
    const s2 = $('#railslide');
    if(s2){
      s2.classList.add(delta > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
    updateNav();
  }, slide ? 150 : 0);
}

/* ── Booked screen ──────────────────────────────────────────── */
/* correctness #10 — mirrors fitbot.booking_studio(), which deliberately returns None
   rather than guessing ("an unknown row must not block a real pick"). The old single
   guesser could never say "I don't know": every unclassifiable booking — a PT session, a
   renamed class — became a phantom "Exhale booked that day" that both suppressed a real
   exhale pick and claimed on screen that the bot had won it.
   `studioOfBooking` is the honest one and is what any CLAIM must use. `studioFromBooking`
   is the always-answer sibling used only where a string is structurally required — and it
   now answers 'unknown', never 'exhale'. Guessing 'exhale' collapsed an unclassifiable
   booking onto the key of a real exhale booking at the same time, and the cancel path then
   hid one row and cancelled the other. 'unknown' matches no studio the bot knows, so the
   bot falls through to its date+time path and REFUSES to guess if that is ambiguous. */
function studioOfBooking(b){
  const s = (((b&&b.name)||'')+' '+((b&&b.location)||'')).toLowerCase();
  if(s.indexOf('reformer')>=0) return 'reformer';
  if(s.indexOf('sauna')>=0 || s.indexOf('nurture')>=0) return 'nurture';
  if(s.indexOf('cycle')>=0) return 'cycle';
  /* word-start match so a future class called "Core Crunch" isn't mapped to run */
  if(s.indexOf('bolt')>=0 || s.indexOf('afterburner')>=0 || /\brun/.test(s) || /\bwod\b/.test(s)) return 'run';
  if(/\b(exhale|yoga|pilates|barre|vinyasa|hatha|yin|meditation|stretch|mobility)\b/.test(s)) return 'exhale';
  return null;
}
function studioFromBooking(b){ return studioOfBooking(b) || 'unknown'; }
/* Resolve a Sydney wall-clock date+time to a real instant.
   A hard-coded +10:00 is wrong for half the year (AEDT is +11:00) and that error
   lands squarely on the free-cancel / strike boundary, so solve it against the same
   Intl formatter everything else uses instead of guessing the offset. */
function sydWallToMs(dateStr, hhmm){
  const a = String(dateStr).split('-').map(Number);
  const b = String(hhmm).split(':').map(Number);
  if(a.length < 3 || b.length < 2 || a.some(isNaN) || b.some(isNaN)) return null;
  let ms = Date.UTC(a[0], a[1]-1, a[2], b[0]-10, b[1]);   // seed at AEST, then correct
  let ok = false;
  for(let k=0;k<4;k++){
    const p = sydParts(new Date(ms));
    const drift = (Number(p.hour)*60 + Number(p.minute)) - (b[0]*60 + b[1]);
    if(!drift){ ok = true; break; }
    /* wrap a drift that crossed midnight (±23h) back into ±12h */
    const d = drift > 720 ? drift - 1440 : (drift < -720 ? drift + 1440 : drift);
    ms -= d * 60000;
  }
  /* correctness #19c — the hour skipped by spring-forward does not exist (2026-10-04
     02:30 has no instant). The loop used to give up and hand back 01:30, a plausible-
     looking wrong answer that would land on the free-cancel/strike boundary. Say null. */
  if(!ok || !isFinite(ms)) return null;
  return ms;
}
/* ── the bot's own actionable outcomes (contract §7) ─────────────────────────────────
   The activity list is gone and is not coming back, but a handful of bot log entries are
   not activity — they are unfinished business that only the user can close, and the worst
   of them is `cancel_failed`: the class is STILL on the FIT account, so not acting on it
   is a no-show and a strike. Those are derived from the `log` the app already fetches and
   attached to the row they belong to, where the user is already looking.

   Only the LAST cancel-related entry per booking counts, and a warning is only shown while
   the booking it describes is still on the account — so it retires itself the moment the
   thing it warns about is genuinely resolved. */
function logBookingId(e){
  const t = (e && e.target) || {};
  return String(e && e.booking_id ? e.booking_id : (t.booking_id || '')) || '';
}
function logRowKey(e){
  const id = logBookingId(e);
  if(id) return 'id:'+id;
  const t = (e && e.target) || {};
  const d = t.date || e.date || '', tm = t.time || e.time || '';
  return (d && tm) ? 'dt:'+d+'|'+tm : '';
}
function bookingRowKeys(b){
  const out = [];
  const id = bookingId(b);
  if(id) out.push('id:'+id);
  if(b && b.date && b.time) out.push('dt:'+b.date+'|'+b.time);
  return out;
}
/* ── every kind fitbot.log_event() can emit, and where it reaches the user ───────────
   §7: the app must never claim success from a bot log kind it does not understand, and
   skips/failures must be visually distinct from successes. That only holds if the set of
   kinds is written down, so this table IS the mapping — a kind missing from it is a
   mapping bug and says so in the console (developers only; never the user).
     'row'   — inline warning on the booking row it is about   (botRowWarnings)
     'alert' — persistent notice on Booked, no row to hang off (syncBotAlerts)
     'note'  — freshness note on Booked                        (botStaleNote)
     ''      — deliberately no user surface, for the reason grouped above it            */
const BOT_LOG_SURFACE = {
  /* unfinished business only the user can close */
  cancel_failed:'row', cancel_notfound:'row', cancel_unknown:'row',
  waitlisted:'alert', book_unknown:'alert', booknow_unknown:'alert',
  refresh_failed:'note',

  /* GOOD news, and identical in effect to a clean success: the request failed in transit
     but the action is CONFIRMED on the FIT account — it IS booked / it IS cancelled. Each
     is always followed in the same run by the ordinary `booked` / `booknow` / `cancelled`
     entry, and the Booked list already shows the result, so a surface of its own could
     only make something that went right read like something that went wrong. What these
     must do instead is CLEAR doubt raised earlier, and they do: both are settling kinds
     below, so a recovered booking retires an earlier "couldn't tell" notice. */
  book_recovered:'', cancel_recovered:'',

  /* intermediate diagnostics. A step failed, so the bot went and read the FIT account
     before saying anything at all — none of these is an outcome and none of them means
     the action failed. The outcome is a separate entry, and that one is mapped. */
  book_transport_error:'', cancel_transport_error:'', recheck:'', book_attempt:'',

  /* outcomes and housekeeping the screens already show better than a log line can:
     a booking appears on Booked, a pick shows its own state on Picks, a failed scrape
     shows as stale data. */
  refresh:'', booked:'', booknow:'', cancelled:'',
  /* AUDIT (18 Aug) — these two were '' under "the screens already show this better than a
     log line can: a booking appears on Booked". True of `booked`/`booknow`; the exact
     OPPOSITE of true here, because these are the bot saying it did not book and the whole
     point is that nothing appears. The only other reporter is the in-memory settle window,
     which does not survive iOS purging a backgrounded app — i.e. tap Book, pocket the
     phone, and a definite failure was reported on no surface anywhere. */
  booknow_notfound:'alert', booknow_ambiguous:'alert',
  scrape_error:'', cred_fallback:'',
  form_checkbox_skipped:'', picks_unreadable:'', pick_removed:'', pick_bad_date:'',
  pick_day_mismatch:'', pick_name_drift:'', pick_unusable:'',
  /* a booking pass that genuinely failed — shown on the pick row it belongs to, by
     pickMiss(), which replaced a stopwatch that guessed at this */
  snipe_full:'row', snipe_rejected:'row', snipe_failed:'row',
  /* AUDIT — these three were '' under the note "a pick shows its own state on Picks". After
     the pickState grace it no longer did: the occurrence they are about is skipped, so the
     row read "Booking scheduled" while a real, still-fixable miss went unsaid on every
     surface. They are pickMiss() kinds now, and pickMiss draws on the row. */
  snipe_late:'row', snipe_notfound:'row', snipe_skipped_studio_limit:'row',
  /* 17 Aug 2026. The booking pass could not sign in to FIT, so nothing was booked and
     nothing was checked. It is not attached to one pick — it is the whole run — so it
     cannot go on a row; it is the same shape as refresh_failed and gets the same surface. */
  snipe_login_failed:'note',
  snipe_waiting:'',
  snipe_nopicks:'', snipe_skipped:'', snipe_nothing_due:'',

  /* ── confirm-or-it-cancels ────────────────────────────────────────────────────────
     The sweep cancels bot-booked classes the user never confirmed. Every one of these
     describes something done to a REAL booking without being asked, so the bar for
     showing it is lower than anywhere else in this table: silence here means a class
     disappeared and nothing said so. */
  auto_cancelled:'alert',            // it is gone, and he needs to know why
  auto_cancel_failed:'row',          // still booked after the attempt — a coming no-show
  auto_cancel_unknown:'row',         // couldn't be verified — treat as still booked
  sweep_too_late:'row',              // unconfirmed and now inside the late-cancel window
  sweep_uncancellable:'row',         // unconfirmed, due, and FIT gives no cancel link
  sweep_no_start:'row',              // on the roster but its deadline can't be computed
  sweep_would_cancel:'alert',        // DRY RUN: what it would have cancelled
  sweep_no_confirm_source:'note',    // the sweep stood down; nothing was cancelled

  /* recovered/transport are the same "went wrong in transit, outcome still proven" pair
     as their manual twins, and settle doubt rather than raising it */
  auto_cancel_recovered:'', auto_cancel_transport_error:'',
  /* housekeeping: the roster write, the per-run summary, and a failed prune. The Confirm
     button appearing on a row is a better surface for `autobook_tagged` than any notice,
     and `autobook_untagged` means only that a class will NOT be auto-cancelled — i.e.
     exactly the behaviour that existed before this feature. */
  autobook_tagged:'', autobook_untagged:'', sweep:'', sweep_error:'',
  /* CONTRACT §9b, found 17 Aug and left for a session that was not already shipping: the
     bot emits both of these and neither was a key here, so they fell through to the
     console warning and rendered nothing — including the one that says "check the app
     shows it as confirmed". Both fail toward NOT cancelling, so the exposure was bounded,
     but the advice could never reach anyone. Same surface as refresh_failed: a quiet line,
     because neither is an instruction the member can act on beyond re-checking. */
  confirm_unreadable:'note', confirm_push_failed:'note'
};
const unmappedKinds = {};
function checkLogKinds(){
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    const k = e && e.kind;
    if(!k || BOT_LOG_SURFACE.hasOwnProperty(k) || unmappedKinds[k]) return;
    unmappedKinds[k] = true;
    /* Console only, once per kind. An unknown kind is never rendered as anything — least
       of all as a success — but it must not vanish without trace either. */
    if(window.console && console.warn) console.warn('bot log kind not mapped in BOT_LOG_SURFACE:', k);
  });
}

/* the cancel-related kinds that describe ONE booking; the last one wins.
   The sweep's own outcomes are in here for the same reason the manual ones are: they are
   statements about whether a specific booking is still on the account, and a later one
   must be able to supersede an earlier one. `auto_cancelled` is a settling kind — it
   retires a warning rather than raising one, exactly like `cancelled`. */
const CANCEL_OUTCOME_KINDS = {cancel_failed:1, cancelled:1, cancel_notfound:1,
                              cancel_unknown:1, cancel_recovered:1,
                              auto_cancelled:1, auto_cancel_failed:1,
                              auto_cancel_unknown:1, auto_cancel_recovered:1,
                              sweep_too_late:1, sweep_uncancellable:1, sweep_no_start:1};
/* {rowKey: {tone, text}} for rows that need a persistent inline warning */
function botRowWarnings(){
  const latest = {};
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!CANCEL_OUTCOME_KINDS[e.kind]) return;
    const k = logRowKey(e);
    if(!k) return;
    /* The log is written by append, so ARRAY ORDER is the chronology and the last entry
       about a booking is the current one. It used to compare `ts` as a STRING, and Sydney
       wall clock repeats an hour every April: at the fall-back, 02:30+11:00 is followed by
       02:30+10:00, which sorts LOWER. A `cancelled` that resolved a `cancel_failed` would
       lose that comparison and the row would keep telling the user it was still booked —
       for a booking that no longer exists. */
    latest[k] = e;
  });
  const out = {};
  Object.keys(latest).forEach(k=>{
    const e = latest[k];
    if(e.kind === 'cancel_failed'){
      out[k] = {tone:'bad', text:'This didn’t cancel — you are still booked in. Cancel it again, or at the club, or it becomes a no-show'};
    } else if(e.kind === 'cancel_unknown'){
      /* The cancel request failed AND the FIT account list could not be read, so whether
         this is still booked is genuinely unknown. Only one of the two possible beliefs
         can cost a strike — "it's cancelled" when it is not — so the app takes the other
         one and says so on the row, which is still here precisely because nothing has
         proved it gone. It retires itself: a later `cancelled` supersedes this entry, and
         a booking that leaves the account takes its row (and this line) with it. */
      out[k] = {tone:'bad', text:'This cancel couldn’t be confirmed — treat it as STILL BOOKED. Check before the class and cancel it again, or it becomes a no-show'};
    } else if(e.kind === 'cancel_notfound' && e.ambiguous){
      out[k] = {tone:'bad', text:'Another booking at the same time can’t be told apart from this one, so neither was cancelled — cancel this one at the club'};
    } else if(e.kind === 'auto_cancel_failed'){
      /* The auto-cancel ran and the booking is STILL there. Worse than an ordinary failed
         cancel, because he never asked for this one and has no reason to be watching for
         it — the class is one he was on course to skip. */
      out[k] = {tone:'bad', text:'You didn’t confirm this and it could not be released — it is STILL booked. Cancel it, or at the club, or it becomes a no-show'};
    } else if(e.kind === 'auto_cancel_unknown'){
      out[k] = {tone:'bad', text:'This couldn’t be confirmed released — treat it as STILL BOOKED. Check before the class and cancel it again, or it becomes a no-show'};
    } else if(e.kind === 'sweep_too_late'){
      /* The one case the bot deliberately refuses. Cancelling inside FIT's last hour is a
         late cancel, which is a strike exactly like a no-show, so it left the booking
         alone. Both remaining options are his and both are said out loud. */
      out[k] = {tone:'bad', text:'You never confirmed this and it’s now too late to cancel it safely — go to the class, or cancel and take the strike'};
    } else if(e.kind === 'sweep_uncancellable'){
      out[k] = {tone:'bad', text:'This can’t be cancelled from here — cancel it at the club, or go to the class'};
    } else if(e.kind === 'sweep_no_start'){
      out[k] = {tone:'bad', text:'This booking’s start time can’t be read, so it will NOT be released for you — cancel it yourself if you’re not going'};
    }
    /* `cancelled` and `cancel_recovered` deliberately produce nothing: both mean the
       booking is confirmed gone, and both are here so they can supersede a warning. */
  });

  /* ── remember it, so a 200-entry log cannot quietly retract a no-show warning ──── */
  const before = JSON.stringify(stickyWarn);
  Object.keys(latest).forEach(k=>{
    /* The log has since REACHED A CONCLUSION about this booking — that outranks anything
       remembered, in both directions — but only if the conclusion is NEWER than what is
       remembered. An entry the app already knew about when it raised the warning cannot
       retire it (see setStickyRowWarn). */
    const held = stickyWarn[k];
    const entryMs = Date.parse((latest[k] && latest[k].ts) || '');
    const staleWord = held && held.at && isFinite(entryMs) && entryMs < held.at;
    if(staleWord) return;
    if(out[k]) stickyWarn[k] = out[k];
    else delete stickyWarn[k];
  });
  /* Only ever judged against a list that actually arrived: before the first payload lands
     realBookings() is empty, and pruning against that would drop every remembered warning
     on a cold launch — which is the exact moment it is most needed. */
  if(lastDataJson !== null){
    const live = {};
    realBookings().forEach(b => bookingRowKeys(b).forEach(k => { live[k] = true; }));
    /* A row this app is optimistically HIDING is not a row that has left the FIT account —
       it is a row we have decided not to draw yet. Counting it as gone would let a retry of
       a cancel that already failed once erase the very warning that says it failed, for as
       long as the retry is pending, and permanently if the app were killed in that window.
       The warning belongs to the booking, and the booking is still there. */
    pendingCancels.forEach(p => { if(p && p.b) bookingRowKeys(p.b).forEach(k => { live[k] = true; }); });
    Object.keys(stickyWarn).forEach(k=>{ if(!live[k]) delete stickyWarn[k]; });
  }
  Object.keys(stickyWarn).forEach(k=>{ if(!out[k]) out[k] = stickyWarn[k]; });
  /* A confirmation answers the three sweep warnings that are ABOUT not having confirmed.
     Two of them end "cancel it in the FIT app / cancel it yourself if you're not going",
     so leaving them up tells him to cancel a class he has just said he is attending.
     auto_cancel_failed / auto_cancel_unknown deliberately survive: those are about a
     booking still sitting on the account, which confirming does not change. */
  const SWEEP_ASKS = {sweep_too_late:1, sweep_uncancellable:1, sweep_no_start:1};
  const cs = confirmState();
  realBookings().forEach(b=>{
    const id = bookingId(b);
    if(!id || !cs.conf[id]) return;
    bookingRowKeys(b).forEach(k=>{
      const e = latest[k];
      if(e && SWEEP_ASKS[e.kind]){ delete out[k]; delete stickyWarn[k]; }
    });
  });
  if(JSON.stringify(stickyWarn) !== before) persistStickyWarn();
  return out;
}

/* ── "the bot cannot tell you whether this booked" ───────────────────────────────────
   book_unknown / booknow_unknown: the booking POST's outcome could not be determined AND
   the FIT account list could not be read either, so the bot stopped. It did NOT retry —
   a blind retry after a possible success takes a second spot or trips the
   one-class-per-studio-per-day rule. There is no booking row to attach this to, because
   whether a booking exists is exactly what is in doubt, and BOTH wrong beliefs hurt: a
   class he thinks he has and does not, and a class he has, never sees, and does not
   attend — a no-show, and three in 7 days is a 7-day ban. So it goes up as a persistent
   notice on Booked and stays until something settles it. */
const BOOK_DOUBT_KINDS = {book_unknown:1, booknow_unknown:1};
/* Definite conclusions about the same class, every one of them reached from a FIT account
   read that SUCCEEDED. A later one of these retires the doubt. `book_recovered` is in here
   for its whole purpose: it is the transport failing and the booking existing anyway. */
const BOOK_SETTLED_KINDS = {booked:1, booknow:1, book_recovered:1, snipe_failed:1,
                            snipe_rejected:1, snipe_full:1, waitlisted:1};
/* the class an entry is about — identity is date+time+studio (§6); `name` is a soft label */
function logSlot(e){
  const t = (e && e.target) || {}, p = (e && e.pick) || {};
  const date = t.date || e.date || p.date || '';
  const time = t.time || p.time || e.time || '';
  const studio = String(t.studio || p.studio || e.studio || '').toLowerCase();
  if(!date || !time) return null;
  return {key: date+'|'+time+'|'+(studio||'?'), date:date, time:time, studio:studio,
          name: t.name || e.name || p.name || ''};
}
/* Definite NEGATIVES about one slot: the bot reached FIT, read the account, and the class
   is not on it. Separated from the settled set above because they answer the opposite
   question, and the settle window has to be able to tell them apart. */
const BOOK_FAILED_KINDS = {booknow_notfound:1, booknow_ambiguous:1, snipe_failed:1,
                           snipe_rejected:1, snipe_full:1, snipe_notfound:1};

/* ── "did this PICK get its class?" — a different question, and a different set ──────────
   AUDIT round 4. Round 3 correctly spotted that `snipe_late` and `snipe_skipped_studio_limit`
   were missing from the failure set the pick surfaces read, and the fix put them into
   BOOK_FAILED_KINDS — which is shared with the BOOKING settle window, where they mean
   something else entirely and made it announce a definite failure for a proven booking:

     • `snipe_skipped_studio_limit` with `already_booked` is emitted BECAUSE the account
       already holds this exact slot. It is evidence FOR the booking. Read as a failure it
       overrode a `booknow booked:true` ("confirmed on the FIT account booking list") and told
       the user nothing was booked — which is the no-show this project exists to prevent.
     • `snipe_late` says the bot's own pass booked nothing. In the login-failure branch it is
       written with no account read at all, and it says nothing about whether the user's own
       Book tap landed. Turning it into a definite negative replaced an honest hedge with a
       false assertion.

   So: two questions, two sets. The settle window keeps the six it was written for; the pick
   surfaces get their own, which is allowed to be broader because a pick that did not book is
   a pick, not a claim about a dispatch the user made. */
const PICK_FAILED_KINDS = {snipe_failed:1, snipe_rejected:1, snipe_full:1, snipe_notfound:1,
                           snipe_late:1, snipe_skipped_studio_limit:1,
                           booknow_notfound:1, booknow_ambiguous:1};
function pickFailedFor(date, time, studio){
  let v = false;
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!BOOK_OK_KINDS[e.kind] && !PICK_FAILED_KINDS[e.kind]) return;
    const s = logSlot(e);
    if(!s || s.date !== date || s.time !== time) return;
    if(s.studio && studio && s.studio !== studio) return;
    /* array order is the chronology (see botVerdictFor) — the last word about the slot wins */
    if(BOOK_OK_KINDS[e.kind]){ v = (e.booked === false); return; }
    /* `already_booked` means the account already holds THIS slot: satisfied, not missed */
    if(e.kind === 'snipe_skipped_studio_limit' && e.already_booked){ v = false; return; }
    v = true;
  });
  return v;
}
const BOOK_OK_KINDS = {booked:1, booknow:1, book_recovered:1};
/* What does the bot itself say about this slot — 'ok', 'failed', or '' for nothing?
   The chronology is array order, so the LAST entry about the slot wins. */
function botVerdictFor(date, time, studio, sinceMs){
  let v = '';
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!BOOK_OK_KINDS[e.kind] && !BOOK_FAILED_KINDS[e.kind]) return;
    /* AUDIT round 2 — `cancelled` is in neither set, so it could not supersede an older
       `booked`: a slot booked, cancelled, then re-booked and failed verdicted "ok", and the
       app showed a green "Booked" for a class FIT had never confirmed. When the caller is
       asking about an attempt it just made, only entries written AFTER that attempt can be
       about it. */
    if(sinceMs){ const t = Date.parse(e.ts || ''); if(!isFinite(t) || t < sinceMs) return; }
    const s = logSlot(e);
    if(!s || s.date !== date || s.time !== time) return;
    if(s.studio && studio && s.studio !== studio) return;
    /* `booknow`/`booked` carry the outcome in the entry itself; an explicitly false one is
       the bot saying it could NOT confirm the booking on the account. */
    if(BOOK_OK_KINDS[e.kind]) v = (e.booked === false) ? 'failed' : 'ok';
    else v = 'failed';
  });
  return v;
}

/* The same question, asked about a CANCEL. Added 19 Aug after a queued run made the settle
   window announce a failure that had not happened.

   `cancel_failed` is the only DEFINITE negative the bot has: _do_cancel emits it solely when
   it read the account successfully and the booking was still on it. A request that merely
   threw yields cancel_unknown / cancel_transport_error — which are doubts, not failures, and
   deliberately fall through to '' so the app says the smaller thing.

   Matched on FIT's booking id where there is one. The date+time fallback exists because a
   booking whose id this app cannot read still has to settle, but it is second choice: two
   bookings can share a start time, and the id cannot. */
const CANCEL_OK_KINDS     = {cancelled:1, cancel_recovered:1, auto_cancelled:1};
const CANCEL_FAILED_KINDS = {cancel_failed:1, auto_cancel_failed:1};
function cancelVerdictFor(b, sinceMs){
  const wantId = bookingId(b);
  const wantDate = String(b && b.date || ''), wantTime = String(b && b.time || '');
  let v = '';
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!CANCEL_OK_KINDS[e.kind] && !CANCEL_FAILED_KINDS[e.kind]) return;
    /* Only entries written after the tap can be about it — the mirror of the round-2 fix on
       the booking side, where a stale entry for a re-booked slot satisfied the verdict. */
    if(sinceMs){ const t = Date.parse(e.ts || ''); if(!isFinite(t) || t < sinceMs) return; }
    const eid = bookingId(e);
    /* AUDIT (19 Aug) — this was `if(wantId && eid)`, so a row whose id THIS APP cannot parse
       fell through to a date+time match and could be answered by an entirely different
       booking at the same time. Demonstrated: a `cancelled` for booking B silently dropped
       booking A's row with no warning, while A was still on the account — a no-show. An id
       on EITHER side is now decisive; date+time is only for the case where neither has one,
       and even then it is second best, because two bookings can share a start time and an id
       cannot. */
    if(wantId || eid){
      if(!wantId || !eid || eid !== wantId) return;
    } else {
      const s = logSlot(e);
      if(!s || !wantDate || s.date !== wantDate || s.time !== wantTime) return;
    }
    v = CANCEL_OK_KINDS[e.kind] ? 'ok' : 'failed';
  });
  return v;
}
/* {slotKey: {kind,date,time,studio,name}} — unresolved "did this book?" doubts */
function botBookDoubts(){
  const latest = {};
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!BOOK_DOUBT_KINDS[e.kind] && !BOOK_SETTLED_KINDS[e.kind]) return;
    const s = logSlot(e);
    if(!s) return;
    latest[s.key] = {e:e, s:s};        // array order is the chronology — see botRowWarnings()
  });
  const out = {}, today = sydToday();
  Object.keys(latest).forEach(k=>{
    const r = latest[k];
    if(!BOOK_DOUBT_KINDS[r.e.kind]) return;          // a later run reached a real answer
    if(r.s.date < today) return;                     // the class has been and gone
    /* It is on the account now, so the doubt is answered and the row itself is the
       answer. realBookings() only — an optimistic row this app invented must never be
       read back as evidence. A row whose studio cannot be classified says null rather
       than guessing, and null must not veto the match. */
    const on = realBookings().some(b => b && b.date === r.s.date && b.time === r.s.time &&
      (!r.s.studio || studioOfBooking(b) === null || studioOfBooking(b) === r.s.studio));
    if(on) return;
    out[k] = {kind:r.e.kind, date:r.s.date, time:r.s.time, studio:r.s.studio, name:r.s.name};
  });
  return out;
}

/* ── the bot's own data re-sync failed ───────────────────────────────────────────────
   `refresh_failed` is logged when the sync that runs AFTER a book or cancel could not
   complete: the outcome itself is already in the log, only the data files are stale. So
   the lists may not yet show what the bot just did. Not an instruction, so no notice and
   no toast — a quiet line that removes itself as soon as a sync lands. */
function botStaleNote(){
  const log = Array.isArray(logdata) ? logdata : [];
  let last = null;
  for(let i = log.length - 1; i >= 0; i--){
    const k = log[i] && log[i].kind;
    if(k === 'refresh_failed'){ last = log[i]; break; }
    if(k === 'refresh'){ break; }                    // a later sync succeeded: settled
  }
  if(!last) return '';
  const t = Date.parse(last.ts || '');
  const u = (bookings && bookings.updated) ? Date.parse(bookings.updated) : NaN;
  if(isFinite(t) && isFinite(u) && u >= t) return '';   // the data is newer than the failure
  return '<div class="group" style="margin-top:12px"><div class="rulerow">'+
    '<div class="ri" data-tone="amber">'+G.warn+'</div><div class="rt">'+
    '<b>This list may be out of date</b><span>The last update didn’t finish, '+
    'so anything it booked or cancelled since may not be shown here yet. It keeps '+
    'retrying on its own.</span></div></div></div>';
}
/* Outcomes with no row to hang off, promoted to persistent notices. `waitlisted` is the
   one that matters: it is NOT a booking, but FIT can promote it into one up to an hour
   before the class — which is a class the user never sees, i.e. a no-show. */
function syncBotAlerts(){
  const seen = {};
  checkLogKinds();
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || e.kind !== 'waitlisted') return;
    const d = (e.date || (e.pick && e.pick.date) || '');
    if(d && d < sydToday()) return;                       // the class has been and gone
    const id = 'waitlist:'+d+'|'+String(e.bid||'');
    seen[id] = true;
    pushAlert({id:id, tone:'amber', tab:'booked',
      title:'Waitlisted, not booked',
      body:(e.name || (e.pick && e.pick.name) || 'A class')+(d?' on '+d:'')+
           ' is not booked. If FIT promotes you off the waitlist it becomes a real booking '+
           '— cancel it if you will not attend, or it becomes a no-show.'});
  });
  /* drop waitlist notices whose class has passed out of the log entirely */
  alerts.filter(a => a.id.indexOf('waitlist:') === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));

  /* ── the sweep's own outcomes ──────────────────────────────────────────────────────
     `auto_cancelled` has no row to hang off, because the row is exactly what it removed.
     This is the app taking something away from the user without being asked, so it says
     so plainly and persistently — the spec's "say so where the row was". It is the only
     notice here about something that WORKED, and it earns that by being an action he
     never requested.

     `sweep_would_cancel` is the dry run's whole point: it shows what an armed sweep would
     have taken, so the behaviour can be watched for a few days against real classes
     before it is allowed to touch anything. */
  /* Rate-limited, with classes waiting on it. Persistent, because the consequence lands
     hours later and he will not be looking then. */
  if(sweepPaused && ((bookings && bookings.bookings) || []).some(needsConfirm)){
    seen['sweeppaused'] = true;
    pushAlert({id:'sweeppaused', tone:'bad', tab:'booked',
      title:'Auto-cancel is paused today',
      body:'The service has hit its daily limit, so classes you haven’t confirmed will '+
           'NOT be cancelled for you today. Confirm the ones you are going to, and cancel '+
           'the ones you are not — or they become no-shows.'});
  } else {
    dropAlert('sweeppaused');
  }
  const cstate = confirmState();
  [['auto_cancelled', 'autocancel:'], ['sweep_would_cancel', 'wouldcancel:']].forEach(pair=>{
    const kind = pair[0], pre = pair[1];
    (Array.isArray(logdata) ? logdata : []).forEach(e=>{
      if(!e || e.kind !== kind) return;
      const t = e.target || {};
      const d = t.date || '';
      if(d && d < sydToday()) return;                    // the class has been and gone
      const id = String(e.booking_id || t.booking_id || '');
      if(kind === 'sweep_would_cancel'){
        /* A dry-run notice about a class he has since confirmed is answered and must go —
           otherwise the notice outlives the decision it was asking him to make. */
        if(id && cstate.conf[id]) return;
        /* ...and it must not outlive TEST MODE. Arming the sweep is the planned next step
           for this feature, and the old dry-run entries stay in the 200-entry log after
           it: without this the app tells him "nothing was actually changed on your FIT
           account" while the row beside it correctly says "or this cancels itself", and
           then keeps saying it next to the notice announcing the real cancellation. */
        if(sweepArmed) return;
        /* a later definite outcome for the same booking supersedes it */
        if(id && (Array.isArray(logdata) ? logdata : []).some(x =>
             x && x.kind === 'auto_cancelled' &&
             String(x.booking_id || (x.target && x.target.booking_id) || '') === id)) return;
      }
      const aid = pre + (id || (d + '|' + (t.time || '')));
      seen[aid] = true;
      const what = (t.name || 'A class') + (d ? ' · ' + shortDate(d) : '') +
                   (t.time ? ', ' + fmt12(t.time).full : '');
      if(kind === 'auto_cancelled'){
        pushAlert({id:aid, tone:'amber', tab:'booked',
          title:'Cancelled — you didn’t confirm it',
          body: what + ' was booked automatically and never confirmed, so it was cancelled '+
                '4 hours before it started rather than becoming a no-show. Nothing else to do.'});
      } else {
        pushAlert({id:aid, tone:'amber', tab:'booked',
          title:'Would have been cancelled (test mode)',
          body: what + ' was booked automatically and you haven’t confirmed it. Once '+
                'auto-cancel is switched on, this is the one it would have cancelled — '+
                'nothing was actually changed.'});
      }
    });
  });
  ['autocancel:', 'wouldcancel:'].forEach(pre=>{
    alerts.filter(a => a.id.indexOf(pre) === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));
  });

  /* book_unknown / booknow_unknown — see botBookDoubts(). The strongest thing the app
     can say, because it is the one case where it cannot say anything else honestly. */
  const doubts = botBookDoubts();
  Object.keys(doubts).forEach(k=>{
    const d = doubts[k];
    const id = 'bookdoubt:'+k;
    seen[id] = true;
    const what = (d.name || 'A class') + ' · ' + shortDate(d.date) + ', ' +
                 fmt12(d.time).full + (SLABEL[d.studio] ? ' · ' + SLABEL[d.studio] : '') +
                 (d.kind === 'booknow_unknown' ? ' (you asked for this one)' : '');
    pushAlert({id:id, tone:'bad', tab:'booked',
      title:'Booking not confirmed',
      body: what + '. Your bookings couldn’t be read, so this may or may not have gone '+
            'through. Check before the class: book it again if it isn’t there; if it IS '+
            'there and you won’t go, cancel it or it becomes a no-show.'});
  });
  /* Retire it the moment the log stops saying it: a later definite outcome, the class
     appearing on the account, the date passing, or the entry ageing out of the log. */
  alerts.filter(a => a.id.indexOf('bookdoubt:') === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));

  /* ── a definite booknow failure, from the log ────────────────────────────────────
     The settle window is memory-only and does not survive the app being purged, so the
     bot's own "I did not book it" has to be able to speak for itself. */
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || (e.kind !== 'booknow_notfound' && e.kind !== 'booknow_ambiguous')) return;
    const s = logSlot(e);
    if(!s || s.date < sydToday()) return;
    if(botVerdictFor(s.date, s.time, s.studio) !== 'failed') return;   // a later run booked it
    if(realBookings().some(b => b.date === s.date && b.time === s.time &&
        (studioOfBooking(b) === null || !s.studio || studioOfBooking(b) === s.studio))) return;
    const id = 'booknowfail:'+s.key;
    seen[id] = true;
    pushAlert({id:id, tone:'amber', tab:'booked',
      title:'That booking didn’t go through',
      body:(s.name || 'A class')+' · '+shortDate(s.date)+', '+fmt12(s.time).full+
           (e.kind === 'booknow_ambiguous'
             ? ' — more than one class matched that slot, so nothing was booked rather '+
               'than guessing. Book it again if you still want it.'
            : e.full
             ? ' — that class was full, so nothing was booked. A waitlist place can turn '+
               'into a booking you would have to attend, so only join one if you will go.'
             : ' — that class couldn’t be found, so nothing was booked. '+
               'Book it again if you still want it.')});
  });
  /* A pick retired because the class never turned up. The bot logs snipe_notfound with
     unpublished_pick and then DELETES the pick — so the row that kind is surfaced on is
     destroyed by the same event that writes it, and the class simply vanished off Booked
     with no word at all. It has to have a home that outlives the pick. */
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || e.kind !== 'snipe_notfound' || !e.unpublished_pick) return;
    const s = logSlot(e);
    if(!s || !s.date || s.date < sydToday()) return;
    const id = 'gone:'+s.key;
    seen[id] = true;
    pushAlert({id:id, tone:'amber', tab:'booked',
      title:'That class isn’t running',
      body:(s.name || 'A class')+' on '+shortDate(s.date)+' didn’t end up on the timetable, '+
           'so it has been taken off your list. Nothing was booked.'});
  });
  alerts.filter(a => a.id.indexOf('gone:') === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));

  /* AUDIT round 2 — retiring these on "the log no longer says it" un-warned the user the
     moment the entry aged out of the bot's 200-entry log, which CONTRACT §9 forbids
     precisely because the class is still not booked. Retire only on positive evidence:
     the slot is on the account, or its date has gone. */
  alerts.filter(a => a.id.indexOf('booknowfail:') === 0).forEach(a=>{
    const bits = a.id.slice('booknowfail:'.length).split('|');
    const date = bits[0] || '', time = bits[1] || '', studio = bits[2] === '?' ? '' : (bits[2] || '');
    if(!date || date < sydToday()){ dropAlert(a.id); return; }
    const on = realBookings().some(b => b.date === date && b.time === time &&
      (!studio || studioOfBooking(b) === null || studioOfBooking(b) === studio));
    if(on) dropAlert(a.id);
  });

  /* ── the settle window's own notices ─────────────────────────────────────────────
     AUDIT (18 Aug) — `bookfail:` and `bookunknown:` were the only notices in the app with
     no sweep at all. Reproduced: the booking lands ten seconds after the settle window
     expires, and Booked then shows "…is not on your FIT account. Nothing was booked — try
     again" directly above the booking itself, for ever. And `bookunknown:` persists across
     a relaunch while the pending record, the fast poll and the watch timer do not — so it
     kept promising "the app is checking; it will tell you either way" when nothing was.
     Both are about one slot, so both retire on the same evidence any other notice would
     accept: the class is on the account, or its date has gone. */
  const bookedSlots = {};
  realBookings().forEach(b=>{
    const st = studioOfBooking(b);
    bookedSlots[String(b.date)+'|'+String(b.time)] = true;
    if(st) bookedSlots[String(b.date)+'|'+String(b.time)+'|'+st] = true;
  });
  ['bookfail:', 'bookunknown:'].forEach(pre=>{
    alerts.filter(a => a.id.indexOf(pre) === 0).forEach(a=>{
      const key = a.id.slice(pre.length);
      /* keys are bookingKey() of the optimistic row: 'dts:<date>|<time>|<studio>' */
      if(key.indexOf('dts:') !== 0) return;
      const bits = key.slice(4).split('|');
      const date = bits[0] || '', time = bits[1] || '', studio = bits[2] || '';
      if(!date) return;
      if(date < sydToday()){ dropAlert(a.id); return; }
      if(bookedSlots[date+'|'+time+'|'+studio] || bookedSlots[date+'|'+time]) dropAlert(a.id);
      else if(pre === 'bookunknown:' && botVerdictFor(date, time, studio)) dropAlert(a.id);
    });
  });
  /* A "that cancel didn't go through" / "couldn't confirm that cancel" notice is about ONE
     booking. Once that booking is genuinely off the account there is nothing left to act
     on, so retire it rather than making the user dismiss a solved problem — the notices
     that stay have to mean something or they stop being read. */
  const live = {};
  realBookings().forEach(b => { live[bookingKey(b)] = true; });
  alerts.forEach(a=>{
    ['cancelfail:', 'cancelunknown:'].forEach(pre=>{
      if(a.id.indexOf(pre) === 0 && !live[a.id.slice(pre.length)]) dropAlert(a.id);
    });
  });
  /* "Couldn't confirm that" is raised by confirmBooking()'s catch AFTER it has already
     withdrawn its pending record — so the one place that used to retire it could never
     see that id again, and the notice was permanent unless the user happened to tap
     Confirm successfully. It leaks on the likeliest path of all: /confirm takes longer
     than the app's 12s client timeout while still committing, so the app announces a
     failure for a confirmation that succeeded, and then there is no button left to tap.
     A red banner insisting a confirmed class is unconfirmed and about to auto-cancel is
     the false claim CONTRACT §7 forbids, and acting on it costs the class.
     It keys on the bare FIT id, not on bookingKey(), so it needs its own sweep. */
  const liveIds = {}, cst = confirmState();
  realBookings().forEach(b => { const id = bookingId(b); if(id) liveIds[id] = true; });
  alerts.filter(a => a.id.indexOf('confirmfail:') === 0).forEach(a=>{
    const id = a.id.slice('confirmfail:'.length);
    if(cst.conf[id] || !liveIds[id]) dropAlert(a.id);
  });
}
function bookingStartMs(b){
  if(!b.date || !b.time) return null;
  const c = (timetable.classes||[]).find(x => x.date===b.date && x.time===b.time);
  if(c && c.start_iso) return new Date(c.start_iso).getTime();
  /* No timetable match (e.g. half-hourly sauna slots) — resolve the offset properly.
     The donor class must be CLOSE IN TIME, not merely on the same date: 4 Oct 2026 holds
     both +10:00 and +11:00, so borrowing from an arbitrary class that day puts the start
     an hour out in either direction — and an hour is the whole late-cancel margin. */
  /* AUDIT round 2 — `Number('')` is 0 and `isFinite(0)` is true, so a timetable row with an
     empty time counted as "close to" any booking between midnight and 02:00 and could donate
     the wrong DST offset to it. An hour of error here lands exactly on the free-cancel line.
     Require the hour to have actually parsed. */
  const hour = (t) => {
    const raw = String(t || '');
    if(!/^\d{1,2}:/.test(raw)) return NaN;
    const n = Number(raw.slice(0, raw.indexOf(':')));
    return isFinite(n) ? n : NaN;
  };
  const near = (x) => {
    const a = hour(x.time), c = hour(b.time);
    return isFinite(a) && isFinite(c) && Math.abs(a - c) <= 2;
  };
  const sameDay = (timetable.classes||[]).find(x => x.date===b.date && x.start_iso && near(x))
               || (timetable.classes||[]).find(x => x.date===b.date && x.start_iso && false);
  if(sameDay){
    const off = String(sameDay.start_iso).slice(-6);
    if(/^[+-]\d\d:\d\d$/.test(off)){
      const t = Date.parse(b.date+'T'+b.time+':00'+off);
      if(isFinite(t)) return t;
    }
  }
  return sydWallToMs(b.date, b.time);
}

/* pendingCancelHTML() is GONE. It drew a notice naming the class and how long the cancel
   had been waiting — i.e. it narrated background work on the one screen where the whole
   point is that the row went away. A pending cancel is now completely invisible: the row
   disappears and the app behaves as though it is cancelled, because that is what happens
   in every case except one. That one case — reconcilePending() proving the booking is
   STILL there after SETTLE_MS, or the bot logging cancel_failed / cancel_unknown — puts
   the row back with a persistent alarm on it, which is far louder than a progress notice
   and costs nothing when everything works. */

/* Classes a pick is going to book, as rows for the Booked tab.

   These are LOCAL to this render and are deliberately never pushed onto bookingList(): a row
   this app invented must not be readable back as evidence by anything that makes a claim
   (CONTRACT §7a). realBookings(), alreadyBookedSlot() and bookedStudiosOn() therefore cannot
   see them, which is the whole safety argument for showing them at all.

   One row per pick — the occurrence the bot will actually take next, resolved through
   pickState so this screen cannot disagree with the Picks tab or with the bot (D-39). A
   weekly pick is one upcoming class here, not four. Kinds other than waiting/open are
   excluded on purpose: `booked` already has a real row, `booking` already has a pending one,
   and blocked/missed/expired/missing are picks that will NOT produce a class — the Picks tab
   is where those explain themselves. */
function scheduledRows(){
  const out = [];
  let dup = {};
  try{ dup = pickDupes() || {}; }catch(e){ dup = {}; }
  (picks || []).forEach(function(p){
    let st = null;
    try{ st = pickStateFor(p); }catch(e){ return; }
    if(!st) return;
    let c = st.cls;
    if(st.kind === 'blocked'){
      /* The nearest occurrence is refused because that studio is already booked that day —
         but the pick is a standing choice and every LATER week is unaffected. Showing nothing
         made a live weekly booking vanish off the tab that says what he is doing, while the
         Book tab still called it Booked: the cross-tab disagreement this row exists to end. */
      c = liveOccurrence(p);
    } else if(st.kind !== 'waiting' && st.kind !== 'open'){
      return;
    } else if(pickFailedFor(c.date, c.time, c.studio)){
      /* AUDIT round 3 — the bot already tried THIS occurrence and said no. Walk on rather
         than returning: a weekly pick whose nearest week went full still books next week, and
         returning here blanked it everywhere while the Picks tab said it was scheduled. */
      c = liveOccurrence(p);
    }
    if(!c) return;
    out.push({
      date: c.date,
      time: c.time,
      name: c.name || SLABEL[c.studio] || c.studio,
      location: c.studio,
      time_raw: fmt12(c.time).full,
      __scheduled: true,
      /* AUDIT (19 Aug) — the Book tab warned about two same-studio same-day picks and the
         Picks tab warned about them, and the tab that actually claims "Booked" said nothing.
         FIT books one and refuses the other. Carry the warning to the claim. */
      __dupe: !!dup[pickKey(p)],
      __pickDay: p.day, __pickTime: p.time, __pickStudio: p.studio, __pickDate: pickDate(p)
    });
  });
  return out;
}

/* Does this pick actually produce a class, or is it a pick that will not book?

   AUDIT (19 Aug), found independently by both auditors and the most important finding in the
   batch. `willBook` was "a pick exists", so a pick the app itself knew was dead — its window
   long past (`missed`), its studio already spoken for that day (`blocked`), its class gone
   from the timetable (`missing`) — still made the row read "Booked" AND removed its Book
   button. Three demonstrated consequences, in rising order of cost: a bookable class the app
   refused to offer; a claim of a place in a class that was full; and a 6am row reading
   "Booked" beside a real 6pm booking in the same studio, which is a no-show wearing a
   reassurance. The Picks tab was saying the opposite on all three at the same moment.

   Kind, not date: a weekly pick books EVERY occurrence, so every occurrence may say Booked.
   pickState resolves one of them; the rest are covered by the same standing choice. */
const PICK_LIVE_KINDS = {waiting:1, open:1, booking:1, booked:1};
/* The first occurrence of this pick that is actually going to happen: its window is still
   live, its studio is not already spoken for that day, and the bot has not already tried it
   and failed. One owner for that question, because the row, the sheet and the Booked tab all
   have to answer it identically. */
function liveOccurrence(p){
  let occ = [];
  try{ occ = pickOccurrences(p) || []; }catch(e){ return null; }
  const now = Date.now();
  for(let i = 0; i < occ.length; i++){
    const o = occ[i];
    if(!o || !o.date) continue;
    const om = opensAtMs(o);
    if(!isFinite(om) || om < now - BOOK_GRACE_MS) continue;
    if(bookedStudiosOn(o.date)[o.studio]) continue;
    if(pickFailedFor(o.date, o.time, o.studio)) continue;
    return o;
  }
  return null;
}
function pickIsLive(p, c){
  if(!p) return false;
  let st = null;
  try{ st = pickStateFor(p); }catch(e){ return false; }
  if(!st) return false;
  /* AUDIT round 2 — `blocked` is deliberately reported PER OCCURRENCE (D-28: it is a fact
     about one date, where the studio is already spoken for). Treating it as a property of the
     PICK flattened a standing weekly choice to dead for every other week too, which both hid
     it from the Booked tab and put back a Book button that then did nothing at all. */
  if(st.kind === 'blocked'){
    if(!c || !st.cls || st.cls.date === c.date) return false;
  } else if(!PICK_LIVE_KINDS[st.kind]){
    return false;
  }
  /* The app can hold the bot's own DEFINITE negative about an occurrence — it reached FIT,
     read the account, and the class is not on it — and still call the row "Booked". The Picks
     tab was printing "Didn't book — the class was already full" directly under a green
     "Booking now" at the same moment. A claim goes through proof, and here the proof says no.

     AUDIT round 3 — keyed on the ROW's own occurrence, not on the pick's resolved one. Keyed
     on the resolved one, a single full week retired a standing weekly pick on every week: the
     Book tab and the Booked tab both went blank while Picks still said "Booking scheduled".
     A verdict is about one class on one date, exactly like `blocked` above. */
  const t = c || st.cls;
  if(t && pickFailedFor(t.date, t.time, t.studio)) return false;
  return true;
}

function renderBooked(){
  const w = $('#w-booked');
  /* This tab became a pickState CONSUMER when scheduled rows arrived, so it is now also a
     psCache producer — and a producer that never dropped the memo. Exactly the defect audit
     round 2 found on 18 Aug in the other direction (the memo was dropped only in renderAll,
     so a direct renderBook path reused a window the bot had already passed). It is a null
     assignment; do it wherever a render begins. */
  resetDerived();
  const bks = ((bookings && bookings.bookings) || []).concat(scheduledRows())
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.time||'').localeCompare(String(b.time||'')));

  const warn = botRowWarnings();

  /* Grouped by DATE, each day its own block, because "what am I doing on Thursday" is the
     question this screen is actually asked. One flat list answered it only by making the
     reader scan dates on every row. */
  function bookedRowHTML(b){
    {
      /* A class held by a pick rather than by FIT. It has no booking id, so it can carry no
         bot warning, needs no confirmation (there is nothing on the roster to confirm) and
         is undone by removing the pick rather than by cancelling anything. */
      const sched = !!b.__scheduled;
      /* the bot's own unfinished business for THIS row (cancel_failed, ambiguous refusal) */
      let bw = null;
      if(!sched) bookingRowKeys(b).forEach(k=>{ if(!bw && warn[k]) bw = warn[k]; });
      /* correctness #10 — say "Studio unknown" rather than asserting Exhale */
      const stk = studioOfBooking(b), st = stk || 'exhale';
      const stLabel = stk ? (SLABEL[stk]||stk) : 'Studio unknown';
      // the date is the group heading now; the row says the time and the studio
      const when = (b.time_raw || (b.time ? fmt12(b.time).full : ''));
      const startMs = bookingStartMs(b);
      /* An optimistic row: it is on screen because the user just asked for it, not because
         FIT has confirmed it. It used to announce that with an amber "Booking on FIT…"
         line — a placeholder that told the user about a workflow he cannot influence. It
         now draws as an ORDINARY booked row, because in the overwhelming majority of cases
         that is exactly what it is about to be, and because the failure direction here is
         mild: FIT turns out not to have it, the row is withdrawn with a warning, and he
         turns up to a class without a spot. Annoying — not a strike. (Contrast a pending
         CANCEL, where believing the optimistic answer wrongly IS a no-show; that one is
         invisible too, but it comes back with an alarm rather than a quiet withdrawal.)
         The one thing that must not soften is the guard: no Cancel until FIT confirms it,
         because cancelling something that does not exist yet is how you end up with
         neither. That guard is invisible — the button is simply absent. */
      const pending = !!b.__pending || sched;
      /* correctness #3 — measure against when the BOT will reach FIT, not against now.
         AUDIT (18 Aug) — a pending row showed the full "Free cancel for 1d 9h" countdown
         while deliberately having no Cancel button. CONTRACT §7's free-cancel rule is
         about a cancel that will land in time; there is no cancel to land here, and the
         row is making a durational promise about a booking FIT has not confirmed. */
      let free = '', freeCls = 'go', freeAt = null, freeG = null;
      if(startMs && !pending){
        const freeUntil = startMs - 3600000, dt = freeUntil - Date.now();
        if(dt > CANCEL_LATENCY_MS){
          freeAt = freeUntil - CANCEL_LATENCY_MS;
          free = freeCancelText(freeAt - Date.now());
        } else if(dt > 0){
          free = 'Too close to cancel from here'; freeCls = 'bad'; freeG = G.warnS;
        } else {
          free = 'Late cancel = a strike'; freeCls = 'bad'; freeG = G.warnS;
        }
      }
      /* ── confirm-or-it-cancels ───────────────────────────────────────────────────
         Only rows the BOT booked and the user has not confirmed get any of this. A class
         he booked himself — here, in the FIT app, or at reception — is never on the
         roster, so it renders exactly as it always did.

         The line says what will happen and when, in Sydney wall-clock terms, and it tells
         the truth about whether the sweep is actually armed: during the dry run it must
         not promise a cancellation that will not happen (CONTRACT §7). */
      const nc = !sched && needsConfirm(b);
      let cf = '', cfCls = 'amb', cfAt = null;
      if(nc){
        const dl = confirmDeadlineMs(b), now = Date.now();
        const toStart = startMs ? startMs - now : null;
        if(toStart !== null && toStart <= CONFIRM_FLOOR_MS){
          /* Past the point where cancelling is free. The bot will REFUSE to cancel this —
             a cancel inside FIT's last hour is a late cancel, which is a strike exactly
             like a no-show — so the only two ways out are his. Say both. */
          cf = 'NOT CONFIRMED, and now too close to cancel safely — go to this class, or '+
               'cancel it and take the strike';
          cfCls = 'bad';
        } else if(dl === null){
          cf = 'Confirm this — its start time couldn’t be read, so your place will NOT be '+
               'released for you if you don’t';
          cfCls = 'amb';
        } else if(dl - now <= 0){
          /* Red only when it is actually about to happen. In test mode this is a fact
             about a mechanism that is switched off, and spending the red on it is how a
             colour stops meaning anything. */
          cf = sweepArmed
            ? 'Past the confirm deadline — your place is being released'
            : 'Past the confirm deadline — your place would be released, but that is in test mode';
          cfCls = sweepArmed ? 'bad' : 'amb';
        } else if(dl - now < 12*3600000){
          cfAt = dl;
          cf = confirmWithinText(dl - now);
        } else {
          cf = 'Confirm by ' + sydStampShort(dl) +
               (sweepArmed ? ' to keep your place'
                           : ' to keep your place (test mode — nothing is released yet)');
        }
      }
      /* a row carrying a bad-news warning is a row the app previously hid and has had to
         put back. Make that unmissable rather than glitch-like. */
      /* The row's tint is the loudest thing on it, so it follows the worst news the row
         carries — from the bot's log OR from the confirm state the app worked out itself.
         An unconfirmed booking that is now too close to cancel safely is the single worst
         state this screen has: it is a no-show the system can no longer prevent. It must
         not sit in the same calm amber as one with two days to run. */
      const bad = (bw && bw.tone === 'bad') || cfCls === 'bad';
      return '<div class="crow'+(bad ? ' alarm' : (nc ? ' tocheck' : ''))+'">'+
        '<div class="cbody">'+
          '<div class="cname">'+esc(b.name||'Class')+'</div>'+
          '<div class="cmeta"><span class="ctail"><i class="sdot" style="background:'+(stk?(SCOLOR[stk]||'var(--ink3)'):'var(--ink3)')+'"></i>'+
            '<span>'+esc(when)+' · '+esc(stLabel)+'</span></span></div>'+
          (free ? '<div class="cmeta"><span class="cst '+freeCls+(freeCls==='bad'?' longform':'')+'"'+
                  (freeAt?' data-cd="'+freeAt+'" data-cdmode="free"':'')+'>'+
                  (freeG||G.clock)+'<span>'+esc(free)+'</span></span></div>' : '')+
          /* the confirm deadline. Longform because it wraps — the second half ("or this
             cancels itself") is the half that changes what he does. */
          (cf ? '<div class="cmeta"><span class="cst '+cfCls+' longform"'+
                (cfAt?' data-cd="'+cfAt+'" data-cdmode="confirm"':'')+'>'+G.warnS+
                '<span>'+esc(cf)+'</span></span></div>' : '')+
          /* the bot's last word on this booking, if it was bad news. Persistent: it stays
             on the row for as long as the booking it warns about is still on the account. */
          (bw ? '<div class="cmeta"><span class="cst '+esc(bw.tone)+' longform">'+G.warnS+
                '<span>'+esc(bw.text)+'</span></span></div>' : '')+
          /* no cancel link on the row ⇒ the bot cannot cancel it at all (it only ever acts
             on rows that carry one). Say so instead of offering a button that cannot work. */
          (!pending && !isCancellable(b)
            ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
              '<span>This one can only be cancelled at the club</span></span></div>' : '')+
          (b.__dupe
            ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
              '<span>Two '+esc(stLabel)+' classes on this day — only one of them can be '+
              'booked</span></span></div>' : '')+
        '</div>'+
        '<div class="cact'+(nc && !pending && isCancellable(b) ? ' stack' : '')+'">'+
          /* Confirm comes first and is the filled button: keeping the class is the action
             the row is asking for, and the destructive one stays the quiet red text button
             it has always been. */
          /* Keyed on the row's own identity, never on its position. An index is only
             correct while the list the tap resolves against is the exact list that was
             rendered, and this screen re-renders on a 45s poll, a 5-minute sweep of past
             classes, and every countdown flip. Identity removes the whole class of bug
             rather than making it rare. */
          (nc ? '<button class="btn-sm ink" data-confirm="'+esc(bookingKey(b))+'">Confirm</button>' : '')+
          /* Cancel stays a visible, one-tap control on every row that can take one. It was
             tempting to fold it into the row's sheet for a calmer list, and that would have
             been wrong: the club's rules make an uncancelled class a no-show and a no-show a
             strike, so cancelling has to stay frictionless and visible. */
          (sched ? '<button class="btn-sm redtxt" data-unbook="'+
                     esc(b.__pickDay+'|'+b.__pickTime+'|'+b.__pickStudio+'|'+(b.__pickDate||''))+
                   '">Cancel</button>'
                 : (!pending && isCancellable(b)
                     ? '<button class="btn-sm redtxt" data-cancel="'+esc(bookingKey(b))+'">Cancel</button>' : ''))+
        '</div>'+
      '</div>';
    }
  }

  let rows = '';
  if(bks.length){
    /* One block per date. The heading carries the relative name ("Today", "Tomorrow") and
       the absolute one, because either alone is the wrong half for somebody planning. */
    const byDate = [];
    const seen = {};
    bks.forEach(function(b){
      const d = String(b.date || '');
      if(!(d in seen)){ seen[d] = byDate.length; byDate.push({date:d, items:[]}); }
      byDate[seen[d]].items.push(b);
    });
    rows = byDate.map(function(g){
      /* A booking with no readable date still has to appear — it is on the account whether
         or not this app can parse it — but it cannot claim a day. */
      /* "Today · 19 Aug", "Saturday · 23 Aug". relDayLabel() alone spells the full date back
         out for anything past tomorrow, which the date beside it was already saying. */
      const t0 = sydToday();
      const dayName = g.date === t0 ? 'Today'
                    : g.date === addDays(t0,1) ? 'Tomorrow'
                    : WD_LONG[dowMon0(g.date)];
      const head = g.date
        ? '<div class="ghead tight dayhead">'+esc(dayName)+
            '<span class="gh-d">'+esc(dayNum(g.date)+' '+MON_SHORT[monIdx(g.date)])+'</span>'+
            /* one class a day is the normal case, so a "1" on every heading is eight
               repetitions of no information. Count only when there is something to count. */
            (g.items.length > 1 ? '<span class="gh-r">'+g.items.length+'</span>' : '')+'</div>'
        : '<div class="ghead tight dayhead">Date unknown</div>';
      return head + '<div class="group">' + g.items.map(bookedRowHTML).join('') + '</div>';
    }).join('');
  } else {
    rows = '<div class="emptystate"><div class="eg">'+G.big_chk+'</div>'+
      '<div class="et">Nothing booked</div>'+
      '<div class="es">Classes you book show up here.</div></div>';
  }

  w.innerHTML =
    offlineBanner()+
    botStaleNote()+
    alertsHTML('booked')+
    '<div style="height:2px"></div>'+
    rows+
    /* the static free-vs-late-cancel rule block lived here. Every row already carries its
       own live "Free cancel for 2h 10m" / "Late cancel = a strike" line, and the confirm
       sheet spells out the consequence at the only moment it can change a decision. */
    '<div class="spacer"></div>';
}

/* ── Picks screen ───────────────────────────────────────────── */
/* The "Bot activity" list lived here — LOG_META and its formatters with it. `logdata` still
   arrives from the Worker and is still parsed; nothing renders it. Anything that section was
   the only witness to now has to reach the user as a toast or as a state on the row itself
   (see the "didn't book" branch in pickRowHTML), which is where they were looking anyway. */

/* one saved pick, recurring or one-off */
function pickRowHTML(p, dupe){
  const once = isOneOff(p);
  const st = pickState(p);
  const drift = pickNameDrift(p);
  let miss = pickMiss(p);
  /* AUDIT (round 2) — snipe_skipped_studio_limit drives BOTH the blocked line and this one,
     so the same fact was rendered twice, in two tones, on a screen whose whole rule is that
     only failures show. The blocked line is the better of the two: it names the class that
     is in the way and the time it is at. */
  if(miss && st.kind === 'blocked' && miss.kind === 'snipe_skipped_studio_limit' &&
     st.cls && miss.date === st.cls.date) miss = null;
  let nextTxt, nextCls = 'amb', g = G.clock, opens = null, wide = false;
  if(st.kind === 'open'){
    /* The window is open and the class is still not on the account. For the first few
       minutes that is just the bot on its way. After that it is a failure — and the
       activity log that used to be the only place it was ever visible is gone, so it has
       to be said on the row it belongs to. */
    /* The old branch here read "Open 6d 14h — not booked yet" once the window had been
       open ten minutes. It was a stopwatch standing in for information the app did not
       have, and after the pickState fix the state it was guessing about cannot occur:
       an occurrence past the bot's grace is skipped, so reaching here means the window is
       genuinely open NOW and a pass is due. Whether one actually failed is a fact, and
       facts come from the bot's log — see pickMiss(). */
    nextTxt = 'Booking now'; nextCls = 'go'; g = G.bolt;
  }
  else if(st.kind === 'booking'){
    /* The app has asked FIT and has NOT been answered. This used to read "Booking… not
       confirmed yet" — the Picks-tab twin of the amber placeholder on Booked, and the same
       narration of a workflow in progress. It now reads exactly as any other pick whose
       window is open: quiet, and identical whether or not the app happens to be mid-request.
       It is still NOT a tick — pickState() only returns 'booked' from realBookings(), so an
       optimistic row can never turn this green — and if FIT never confirms it, the settle
       window withdraws the row and warns, which is the surface that matters. */
    nextTxt = 'Booking now'; nextCls = 'go'; g = G.bolt;
  }
  /* No countdown. How many hours until a background job runs is not a thing the owner of
