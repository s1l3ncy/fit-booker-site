       it. 62px is this device's measured island band; on smaller Face-ID phones it is a
       few px generous, which errs cosmetic. LETTERBOXED (missing 40–200) needs NOTHING —
       the old with-cover backstop set --sat = missing here, which would now double-pad. */
    if(missing >= 0 && missing <= 8) root.style.setProperty('--sat', '62px');
  }catch(e){}
}
function fixBottomInset(){
  try{
    if(zoomHeld()) return;
    const root = document.documentElement;
    root.style.removeProperty('--sab');
    if(measuredVar('--sab') > 0) return;           // env() works here — leave it alone
    if(!isStandalone() || !isIOSDevice()) return;
    const missing = containerShortfall();
    /* In BOTH standalone geometries the view's bottom edge is the physical bottom, with
       the home indicator floating over it — restore the device's real 34px inset that
       env() no longer reports. Everything downstream derives from it unchanged
       (--tabpadref = max(--sab − 16px, 6px) → 18px, sheets pad by 8px + --sab).
       Outside both signatures (e.g. a keyboard-resized viewport) leave 0 alone. */
    if(missing <= 8 || (missing >= 40 && missing <= 200)){
      root.style.setProperty('--sab', '34px');
    }
  }catch(e){}
}
fixSafeAreaTop(); fixBottomInset();
/* Re-run rather than latch: every call first REMOVES its own inline value and re-measures,
   so the moment env() starts reporting real insets the overrides are dropped again. Run
   once now (before first paint) and again after load, in case styles resolve late; re-run
   both on resize/rotate because the container geometry is what they read. */
window.addEventListener('load', ()=>{ fixSafeAreaTop(); fixBottomInset(); });
setTimeout(()=>{ fixSafeAreaTop(); fixBottomInset(); }, 400);
window.addEventListener('resize', ()=>{ fixSafeAreaTop(); fixBottomInset(); });
window.addEventListener('orientationchange', ()=> setTimeout(()=>{ fixSafeAreaTop(); fixBottomInset(); }, 250));

/* ── pinch zoom does nothing (24 Aug 2026, owner's request) ─────────────────────────
   Suppressed in JS, NOT in the viewport meta: `maximum-scale` / `user-scalable=no` would
   also kill the OS accessibility zoom (triple-tap / three-finger), and any edit to that
   meta line risks re-opening the WebKit-301994 saga — see the head comment. Safari routes
   a two-finger pinch through its non-standard `gesture*` events (and, standalone, through
   touchmove with a `scale` field); preventing those stops the page zoom and nothing else.
   The system accessibility zoom never reaches these events, so it still works — which is
   also why zoomHeld() stays: visualViewport.scale can still move under accessibility zoom
   on some iOS builds, and holding the safe-area decision mid-zoom costs nothing. */
['gesturestart','gesturechange','gestureend'].forEach(function(t){
  document.addEventListener(t, function(e){ e.preventDefault(); }, {passive:false});
});
document.addEventListener('touchmove', function(e){
  /* ANY multi-finger move is cancelled from its first frame (audit R2-2). A scale
     threshold was tried and dropped: `e.scale` is cumulative, so a pinch's first frames
     sit within any threshold — and WebKit commits the gesture's disposition from those
     first uncancelled frames, after which later touchmoves arrive cancelable:false and
     preventDefault is a no-op. Cancelling from frame one is the only order that works.
     The deliberate cost is two-finger scrolling inside the app, which nothing here uses;
     one-finger scroll, the axis-locked swipes and pull-to-refresh are single-touch and
     untouched. `cancelable` is checked so late native-owned frames are not no-op noise. */
  if(e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
}, {passive:false});

/* ── boot ───────────────────────────────────────────────────── */
(function boot(){
  try{
    /* keys from builds that stored member data globally — never read, always removed */
    try{ LEGACY_KEYS.forEach(k => localStorage.removeItem(k)); }catch(e){}
    /* The nav bar is static chrome, so its per-tab state has to be seeded before the first
       render rather than falling out of a tab switch that has not happened yet. */
    syncAccountControl();
    syncWeekNav();
    if(!session){ renderSetup(''); return; }
    $('#w-book').innerHTML = '<div class="emptystate"><div class="es">Loading your classes…</div></div>';
    /* §3: load, then let the staleness check dispatch a real FIT sync by itself.
       bootLoad() arms `booted` and the pollers whatever the load did — the manual controls
       that used to rescue a stranded app are gone, so this path may never fail to arm. */
    bootLoad();
  }catch(e){
    try{ $('#w-book').innerHTML = errorBlock(e); }catch(x){}
    /* even a throw here must leave a live app rather than a dead screen */
    try{ booted = true; startPolling(); }catch(x){}
  }
})();
</script>
<script>
/* Network-first service worker. Two reasons: (1) the NRL Tips app on the same phone
   registers one and renders full height, making this one of three structural differences
   under test; (2) it independently fixes the offline cold-launch, which today is a WebKit
   error page with no reload button. Network-first, never cache-first — a cache-first worker
   is what pins a home-screen app to a stale build, and this app ships often. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
