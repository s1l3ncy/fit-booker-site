<!-- theme-color is what iOS paints into the ~62px strip below the web view under WebKit
     301994, so these MUST stay identical to --tabbg in each scheme: that is what makes the
     tab bar read as running to the screen edge instead of floating above a band.
     Media-conditional metas are fine — variants S1 (plain light) and S3 (plain dark) both
     still failed, so the media attribute was never the cause of the short viewport. -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<script>
/* WebKit 301994: on iOS 26.1+/27 a home-screen web app is laid out ~62px shorter than the
   screen and apple-mobile-web-app-status-bar-style:black-translucent is ignored. The leading
   theory is that a linked manifest's display:standalone supersedes the Apple meta. iOS reads
   the manifest at Add-to-Home-Screen time, and needs none of it (apple-touch-icon and
   apple-mobile-web-app-title cover icon and name), so link it for everyone EXCEPT iOS. */
(function(){
  var ua = navigator.userAgent || '';
  var iOS = /iPad|iPhone|iPod/.test(ua) ||
            (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
  if(iOS) return;
  var l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'manifest.webmanifest';
  document.head.appendChild(l);
})();
</script>
<!-- F21 — iOS paints the launch screen with the manifest background_color, which cannot
     be media-queried, so every dark-mode cold launch flashed white before the app painted
     #0B0C0D. apple-touch-startup-image CAN be media-queried. These are 1-bit palette PNGs
     of one flat colour (~600 B each, inline, no extra request). If a device ignores
     prefers-color-scheme here the queries simply fail and the manifest colour is used,
     i.e. exactly today's behaviour — never worse. -->

<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABGUAAAmEAQMAAACW60H6AAAABlBMVEULDA0LDA0ma6CAAAABZklEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAvg1HgwABhufKEQAAAABJRU5ErkJggg==">
<title>FIT Booker</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   FIT Booker — single-file iOS-native controller for the booking bot

   Colour has one job each:
     ink    → you act now      (Book, Save, selected day)
     amber  → the bot acts later (picks, countdowns, windows)
     green  → open / free
     red    → full / blocked / destructive
     studio hues → identification only, small and always labelled
   ══════════════════════════════════════════════════════════════════ */
:root{
  --probe-dvh:100dvh;
  --tabpadref:max(calc(var(--sab) - 16px), 6px);
  /* safe-area insets, exposed as custom properties so they are testable */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  --navh:44px;
  --tabh:52px;
  --gx:16px;
  --pl: calc(var(--gx) + var(--sal));
  --pr: calc(var(--gx) + var(--sar));

  /* warm neutral scale */
  --bg:#F3F3F0;
  --bg0:rgba(243,243,240,0);
  --card:#FFFFFF;
  --card2:#EAEAE5;
  --ink:#101113;
  --ink2:#5B6067;
  --ink3:#6E747C;
  --hair:rgba(18,20,24,.15);
  --hair2:rgba(18,20,24,.10);
  --fill:rgba(18,20,24,.055);
  --fill2:rgba(18,20,24,.10);
  --barbg:rgba(243,243,240,.94);
  --tabbg:#FFFFFF;   /* == theme-color: matches the strip iOS leaves below the web view */
  --sheet:#FFFFFF;
  --scrim:rgba(14,16,18,.34);
  --shadow:0 1px 2px rgba(12,14,18,.05),0 8px 22px -14px rgba(12,14,18,.30);

  /* the one variable pair that flips every primary button between themes */
  --btn-ink:#141618;
  --btn-on:#FFFFFF;

  /* semantic */
  --amber:#A76A00;      --amber-bg:#F8EFDB;   --amber-rail:#D08A11;
  --go:#0B7A45;         --go-bg:#E1F2E8;
  --bad:#B02318;        --bad-bg:#FAE6E3;

  /* ink laid ON a saturated tile — never assume #fff, it fails on amber */
  --tile-ink:#FFFFFF;   --on-amber:#26190A;

  /* studios — identification only */
  --s-exhale:#6D4BE0;
  --s-reformer:#0E7C74;
  --s-run:#C2410C;
  --s-cycle:#2563C9;
  --s-nurture:#A03A6E;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0C0D;
    --bg0:rgba(11,12,13,0);
    --card:#17191B;
    --card2:#222528;
    --ink:#F2F3F4;
    --ink2:#A2A8B0;
    --ink3:#767C85;
    --hair:rgba(255,255,255,.13);
    --hair2:rgba(255,255,255,.08);
    --fill:rgba(255,255,255,.075);
    --fill2:rgba(255,255,255,.14);
    --barbg:rgba(12,13,15,.92);
    --tabbg:#000000; /* == dark theme-color */
    --sheet:#1B1D20;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.5);

    --btn-ink:#F2F3F4;
    --btn-on:#0B0C0D;

    --amber:#F2B441;    --amber-bg:#2D2412;   --amber-rail:#F2B441;
    --go:#3ED884;       --go-bg:#0F2A1C;
    --bad:#FF7B6C;      --bad-bg:#2E1614;

    /* dark semantics are BRIGHT fills — white glyphs on them read at ~1.9:1 */
    --tile-ink:#0B0C0D; --on-amber:#26190A;

    --s-exhale:#AF9CFF;
    --s-reformer:#3ED8C6;
    --s-run:#FF8C4B;
    --s-cycle:#7FADFF;
    --s-nurture:#E88ABF;
  }
}
@media (max-width:359px){ :root{ --gx:12px } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* F11 — a long press is what happens when a thumb rests before a swipe. Without these,
   iOS pops the loupe magnifier and blue selection handles on every class row (.crow is a
   <div>, so it is selectable by default) and cancels the in-progress gesture. No native
   list behaves that way. Prose inside sheets stays selectable, where copying is a real
   thing to want. */
.crow,.row,.rulerow,.factrow,.swrow,.dcell,.chip,.tabbtn,.navbtn,
.wknav,.hero,.bookpill,.ptog,.btn,.btn-sm,.as-btn,.grabber,.ghead,.gfoot,
.dayhead,.weekhead,.nowrule,.ltitle,.lsub,.onceTag,#toast{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.detail-title,.detail-when,.sheet-note,.as-title,.setup p,.emptystate .es{
  -webkit-user-select:text;user-select:text;
}
/* nothing outside #app ever scrolls: the shell owns the viewport, each tab owns its
   own scroller. This is also what stops Safari's toolbar from resizing under us. */
html,body{width:100%;max-width:100%;height:100%;overflow:hidden;background:var(--bg)}

/* iOS 26.1+/27 regression (WebKit bug 301994): in a home-screen web app the layout
   viewport comes back ~62px shorter than the physical screen, leaving a system-painted
   strip no DOM element can reach. `lvh` still measures the full screen while `dvh` does
   not, so paint the whole screen from behind everything else. `var(--bg)` means the strip
   follows prefers-color-scheme, which a manifest colour can never do. Harmless where the
   bug is absent: lvh == dvh and this is exactly the viewport.
   NOTE: only this painter uses lvh. Layout MUST stay on dvh — sizing the interactive shell
   to lvh would push the tab bar below the region that actually accepts touches. */
#bleed{
  position:fixed;left:0;right:0;top:0;
  height:100lvh;min-height:100dvh;
  z-index:-1;pointer-events:none;
  background:var(--bg);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
svg{display:block;flex:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hidden{display:none !important}

/* The shell must equal the VISUAL viewport in both standalone PWA and Safari-with-
   toolbars. `inset:0` on a fixed element resolves against the LARGE viewport in
   Safari, which pushes the tab bar down behind the browser chrome and makes it
   look like it "sits higher" than the screen edge. 100dvh tracks the dynamic
   viewport; 100vh is the fallback for engines without dvh. */
#app{
  /* top+bottom (not a computed height) so the shell always spans the real visual
     viewport. 100dvh proved unreliable in the iOS standalone web app — it reported
     short, which stranded the bottom-anchored tab bar well above the screen edge. */
  position:fixed;top:0;left:0;right:0;bottom:0;width:100%;max-width:100%;
  overflow:hidden;
}
/* plain height:100% — matching the sibling app; #app is fixed top/bottom anyway */

/* ── nav bar (translucent material) ──────────────────────────── */
.navbar{
  position:absolute;top:0;left:0;right:0;z-index:60;
  padding-top:var(--sat);
  /* F15 — no backdrop-filter. At alpha .94/.965 the blurred backdrop contributes under 6%
     of the final pixel and diffed to a MAXIMUM of 7-8/255 across the whole bar (measured,
     both themes) — invisible — while forcing a full-screen backdrop sample every frame.
     That construct over a momentum-scrolling layer is the known source of the iOS "fixed
     bar flashes transparent for a frame during a fling" artifact, and it also makes the
     bar a containing block for fixed descendants. Paying nothing for nothing instead. */
  background:var(--barbg);
}
.navbar::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--hair);opacity:0;transition:opacity .2s ease;
}
#app.scrolled .navbar::after{opacity:1}
.nav-inner{
  height:var(--navh);display:flex;align-items:center;position:relative;
  padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar));
  max-width:592px;margin:0 auto;
}
.nav-title{
  position:absolute;left:calc(56px + var(--sal));right:calc(56px + var(--sar));text-align:center;
  font-size:16px;font-weight:650;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(9px);
  transition:opacity .22s ease,transform .22s ease;pointer-events:none;
}
.nav-title .cd{color:var(--amber);font-variant-numeric:tabular-nums}
.nav-spacer{flex:1;min-width:0}
.navbtn{
  width:44px;height:44px;flex:none;border-radius:22px;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
}
.navbtn:active{opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}   /* the PTR ring is the only spinner left */

/* The in-flight hairline (.flightbar / @keyframes flight) is GONE, along with the freshness
   pill, its Sync button, the "Syncing with FIT…" subtitle and the data-age line. Talking to
   FIT is background work and background work gets NO chrome: no bar, no spinner, no status
   line, no colour change. Data simply updates when it updates. The only things that may
   appear are (a) the pull-to-refresh ring, which answers a deliberate gesture, and (b)
   failures — which are loud, on the row they belong to, and persistent. */

/* ── pull to refresh ─────────────────────────────────────────── */
.ptr{
  position:absolute;left:0;right:0;top:calc(var(--sat) + var(--navh));z-index:45;
  height:0;display:flex;align-items:flex-start;justify-content:center;
  pointer-events:none;overflow:visible;
}
.ptr .pring{
  width:30px;height:30px;border-radius:15px;
  background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
  opacity:0;transform:translateY(0) scale(.7);
}
.ptr.anim .pring{transition:opacity .28s ease,transform .38s cubic-bezier(.32,.72,0,1)}
.ptr.ready .pring{color:var(--amber)}
.ptr.spinning .pring svg{animation:spin .85s linear infinite}
.ptr .pring svg{width:17px;height:17px}

/* ── pages ───────────────────────────────────────────────────── */
#pages{position:absolute;inset:0;overflow:hidden}
.page{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  /* F6/F14 — `none`, not `contain`: `contain` only stops CHAINING, it keeps this element's
     own rubber-band, so a pull-to-refresh drag moved twice (the list bounced AND the ring
     came out). `none` removes the bounce so the custom PTR owns the top edge.
     -webkit-overflow-scrolling:touch is a no-op since iOS 13 except for forcing a legacy
     UIScrollView compositing layer — the documented cause of the sticky-bar judder. */
  overscroll-behavior-y:none;overscroll-behavior-x:none;
  display:none;
}
.page.active{display:block}
.page::-webkit-scrollbar{width:0;height:0}
#app.dirty .wrap{padding-bottom:calc(var(--tabpadref) + var(--tabh) + 104px)}
.wrap{
  max-width:592px;margin:0 auto;width:100%;min-width:0;
  padding-top:calc(var(--sat) + var(--navh));
  padding-bottom:calc(var(--tabpadref) + var(--tabh) + 58px);
}

.ltitle{
  font-size:30px;line-height:35px;font-weight:760;letter-spacing:-.7px;
  padding:0 var(--pr) 0 var(--pl);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lsub{
  font-size:13.5px;color:var(--ink2);letter-spacing:-.1px;font-weight:500;
  padding:3px var(--pr) 0 var(--pl);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── grouped inset lists (one list idiom everywhere) ─────────── */
.ghead{
  font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  padding:16px calc(var(--pr) + 4px) 7px calc(var(--pl) + 4px);min-width:0;
  display:flex;align-items:baseline;gap:8px;
}
.ghead.tight{padding-top:9px}
.ghead .gh-r{margin-left:auto;font-weight:600;letter-spacing:.04em;color:var(--ink3);flex:none}
.group{
  background:var(--card);border-radius:16px;overflow:hidden;
  margin-left:var(--pl);margin-right:var(--pr);min-width:0;
  box-shadow:var(--shadow);
}
.gfoot{
  font-size:12.5px;line-height:17px;color:var(--ink3);letter-spacing:-.05px;
  padding:8px calc(var(--pr) + 4px) 0 calc(var(--pl) + 4px);min-width:0;
}
.gfoot .ig{display:inline-flex;vertical-align:-2px;color:var(--amber)}
.spacer{height:16px}

/* generic row */
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 13px;min-height:60px;position:relative;min-width:0;
}
.row + .row::before,.row + .rulerow::before,.rulerow + .row::before{
  content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2);
}
.row.tapme{transition:background-color .12s ease}
.row.tapme:active{background:var(--fill)}
.rbody{flex:1;min-width:0}
.rtitle{font-size:16.5px;font-weight:600;letter-spacing:-.3px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--ink2);margin-top:2px;min-width:0;
  display:flex;align-items:center;gap:6px;letter-spacing:-.05px}
.rsub .txt{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink3);flex:none}

/* ── countdown hero ──────────────────────────────────────────── */
.hero{
  display:block;width:100%;text-align:left;position:relative;min-width:0;overflow:hidden;
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:9px 40px 10px 17px;
  transition:transform .15s ease;
}
.herowrap{padding:7px var(--pr) 0 var(--pl);min-width:0}
.hero:active{transform:scale(.99)}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber-rail)}
.hero.go::before{background:var(--go)}
.hero.none::before{background:var(--ink3);opacity:.5}
.hk{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbig{display:block;font-size:30px;line-height:34px;font-weight:780;letter-spacing:-.045em;color:var(--amber);
  margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero.go .hbig{color:var(--go)}
.hero.none .hbig{color:var(--ink);font-size:22px;line-height:28px}
.hsub{display:block;font-size:13px;line-height:17px;font-weight:500;color:var(--ink2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero.none .hsub{white-space:normal}
.hchev{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink3)}

/* ── sticky date rail + studio chips ─────────────────────────── */
.stickybar{
  position:sticky;top:calc(var(--sat) + var(--navh));z-index:30;
  margin-top:7px;min-width:0;
  background:var(--barbg);              /* F15 — see .navbar */
}
.stickybar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--hair)}

/* week header: ‹ 11 – 17 Aug › */
.weekhead{
  display:flex;align-items:center;gap:4px;min-width:0;
  padding:0 calc(var(--pr) - 8px) 0 calc(var(--pl) - 8px);
}
.wknav{
  width:46px;height:44px;flex:none;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
}
.wknav:active{opacity:.45}
.wknav[disabled]{opacity:.22;pointer-events:none}
.wklabel{
  flex:1;min-width:0;text-align:center;
  font-size:12.5px;font-weight:700;letter-spacing:.01em;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wklabel b{color:var(--ink);font-weight:700}

/* The strip shows EXACTLY one week — seven equal columns that always fit.
   No overflow-x, no fixed cell width: paging + swipe replace scrolling. */
.rail{
  display:flex;gap:6px;min-width:0;width:100%;overflow:hidden;
  padding:3px calc(var(--pr) - 4px) 6px calc(var(--pl) - 4px);
  touch-action:pan-y;
}
.dcell{
  flex:1 1 0;width:auto;min-width:0;height:54px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--card);box-shadow:var(--shadow);overflow:hidden;padding:0 1px;
  transition:background-color .2s ease,color .2s ease,opacity .2s ease;
}
.dcell .dw{font-size:9px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;color:var(--ink3);
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:clip}
.dcell .dn{font-size:18px;font-weight:720;letter-spacing:-.03em;line-height:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.dcell .pips{display:flex;gap:2px;height:4px;align-items:center;max-width:100%;overflow:hidden}
.dcell .pips i{width:4px;height:4px;border-radius:2px;display:block;flex:none}
.dcell.today .dw{color:var(--amber)}
/* NOTE: the modifier is `noclass`, NOT `empty` — `.empty` is the empty-state block
   below and an equal-specificity collision silently reshaped every class-free cell. */
.dcell.noclass{opacity:.38}
/* a day that has already been and gone can never be booked */
.dcell.past{opacity:.3;pointer-events:none;box-shadow:none;background:var(--fill)}
.dcell.past .dn{color:var(--ink3)}
/* belt-and-braces: nothing bolted onto a date cell may change its box.
   `flex:1 1 0` + `min-width:0` is the fitting rule that replaced `width:50px`. */
.dcell[class]{flex:1 1 0;min-width:0;height:54px;gap:2px;padding:0 1px}

.dcell.sel{background:var(--btn-ink)}
.dcell.sel .dn{color:var(--btn-on)}
.dcell.sel .dw{color:var(--btn-on);opacity:.62}
.dcell.sel .pips i{opacity:.95;box-shadow:0 0 0 .5px rgba(255,255,255,.35)}
.dcell:active{opacity:.6}

.railwrap{min-width:0;overflow:hidden}
/* F16 — will-change is a hint for an IMMINENT change. Left on permanently it keeps the
   whole class list promoted to its own compositing layer for the life of the page; it is
   applied by .drag, which is added the moment a drag actually starts. */
.railslide{transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .22s ease}
.railslide.out-l{opacity:0;transform:translateX(-22px)}
.railslide.out-r{opacity:0;transform:translateX(22px)}
.railslide.drag{transition:none}

.chips{
  display:flex;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;
  padding:0 var(--pr) 8px var(--pl);
  scrollbar-width:none;overscroll-behavior-x:contain;   /* F14 */
}
.chips::-webkit-scrollbar{width:0;height:0}
.chip{
  flex:0 0 auto;height:44px;border-radius:12px;padding:0 13px;
  display:flex;align-items:center;gap:7px;
  background:var(--card);box-shadow:var(--shadow);
  font-size:14px;font-weight:600;letter-spacing:-.2px;color:var(--ink2);
}
.chip .cd{width:8px;height:8px;border-radius:4px;flex:none}
.chip .cd.all{width:14px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,var(--s-exhale),var(--s-reformer),var(--s-run),var(--s-cycle),var(--s-nurture))}
.chip[aria-selected="true"]{background:var(--btn-ink);color:var(--btn-on)}
.chip:active{opacity:.6}

/* ── day header + agenda ─────────────────────────────────────── */
.dayhead{display:flex;align-items:baseline;gap:8px;min-width:0;padding:10px var(--pr) 0 var(--pl)}
.dayhead .dh{font-size:20px;font-weight:720;letter-spacing:-.45px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead .dc{font-size:12.5px;font-weight:600;color:var(--ink3);flex:none;margin-left:auto;white-space:nowrap}
.dayhead .dc b{color:var(--go)}

.dayslide{transition:opacity .2s ease,transform .2s ease}
.dayslide.out-l{opacity:0;transform:translateX(-26px)}
.dayslide.out-r{opacity:0;transform:translateX(26px)}
.dayslide.drag{transition:none}
.railslide.drag,.dayslide.drag{will-change:transform}   /* F16 */

.nowrule{
  display:flex;align-items:center;gap:8px;min-width:0;
  padding:11px var(--pr) 0 var(--pl);
}
.nowrule i{width:7px;height:7px;border-radius:4px;background:var(--bad);flex:none}
.nowrule s{flex:1;min-width:0;height:1px;background:var(--bad);opacity:.35;text-decoration:none}
.nowrule span{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--bad);
  flex:none;white-space:nowrap}
.nowrule em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--bad);flex:none;white-space:nowrap;
  font-variant-numeric:tabular-nums;margin-left:-3px}

/* ── class row (2 lines, ~62px) ──────────────────────────────── */
.crow{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 9px 9px 12px;min-height:62px;position:relative;min-width:0;
  transition:background-color .12s ease;
}
.crow + .crow::before{content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2)}
.crow:active{background:var(--fill)}
.crow.ispick{background:var(--amber-bg)}
/* A booking the app hid, and then had to put back because FIT still has it. The row coming
   back IS the alarm, so it must not look like the list glitched: red rule, red tint, and
   the reason on the row itself. Nothing else in the app uses this treatment. */
.crow.alarm{background:var(--bad-bg);box-shadow:inset 3px 0 0 -.5px var(--bad)}
.crow.alarm + .crow::before,.crow + .crow.alarm::before{display:none}
/* A bot-booked class awaiting confirmation. Amber, not red: nothing has gone wrong, but
   this row will delete itself if it is ignored, so it must not read as ordinary. Same
   treatment as a pick, one step louder — a rail, because the consequence is real. */
.crow.tocheck{background:var(--amber-bg);box-shadow:inset 3px 0 0 -.5px var(--amber-rail)}
.crow.tocheck + .crow::before,.crow + .crow.tocheck::before{display:none}
/* ...but two tinted rows in a ROW still need dividing. Suppressing the separator exists
   to stop a hairline colliding with the edge of a tint, which is only a problem at the
   boundary between a tinted row and a plain one. Now that every unconfirmed booking is
   tinted, runs of three or four are normal, and without this they merge into one panel
   with several Confirm/Cancel pairs floating in it — on the one screen whose entire job
   is "which class is this button about". Same tint on both sides ⇒ draw the divider. */
.crow.alarm + .crow.alarm::before,
.crow.tocheck + .crow.tocheck::before{display:block;background:var(--hair2);opacity:.55}
.crow.flash{animation:flash 1.6s ease}
@keyframes flash{0%,55%{background:var(--amber-bg)}100%{background:transparent}}
.ctime{flex:none;width:45px;min-width:0}
.ctime b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.4px;line-height:18px;font-variant-numeric:tabular-nums}
.ctime span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--ink3);margin-top:1px}
.cbody{flex:1;min-width:0}
.cname{font-size:16px;font-weight:620;letter-spacing:-.32px;line-height:20px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.isfull .cname{color:var(--ink2)}
.cmeta{display:flex;align-items:center;flex-wrap:wrap;gap:1px 8px;min-width:0;margin-top:2px;
  font-size:12.5px;line-height:16px;letter-spacing:-.05px}
/* text-overflow is inert on a flex box — the ellipsis has to live on the inner span */
.cst{flex:0 1 auto;min-width:0;max-width:100%;display:flex;align-items:center;gap:4px;
  font-weight:650;color:var(--ink2);overflow:hidden}
.cst > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cst.go{color:var(--go)}
.cst.bad{color:var(--bad)}
.cst.amb{color:var(--amber)}
.cst svg{width:12px;height:12px;flex:none}
/* no modifier bolted onto .cst may change its box (`.wrap` is the tab scroller — a
   name collision here is exactly the bug that mangled .dcell) */
.cst[class]{padding:0;margin:0}
/* a warning that owns its own row wraps instead of truncating — the second half of
   "FIT allows one per day" is the actionable half */
.cst.longform{align-items:flex-start;overflow:visible}
.cst.longform > span{white-space:normal;overflow:visible;text-overflow:clip}
.cst.longform svg{margin-top:2px}
.csep{flex:none;color:var(--ink3);opacity:.7}
.ctail{flex:1 1 92px;min-width:0;color:var(--ink3);display:flex;align-items:center;gap:5px}
.ctail .sdot{width:7px;height:7px;border-radius:4px;flex:none}
.ctail span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cact{flex:none;display:flex;align-items:center;gap:4px;min-width:0}
/* Two actions on one row (Confirm + Cancel) stack instead of sitting side by side. Side
   by side they are ~175px of the 320px narrow phone, which leaves the class name nothing
   to be truncated out of. Stacking keeps both at the full 44px tap target at every
   supported width and costs one taller row on the rows that need attention anyway. */
.cact.stack{flex-direction:column;align-items:stretch;gap:6px}
.cact.stack .btn-sm{width:100%;min-width:84px}
.bookpill{
  height:44px;min-width:56px;padding:0 11px;border-radius:12px;flex:none;
  background:var(--btn-ink);color:var(--btn-on);
  font-size:14.5px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.bookpill:active{opacity:.6}
/* bookable, but you already have that studio today — warn, never block */
.bookpill.caution{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber-rail)}
.ptog{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ptog .pk{
  width:30px;height:30px;border-radius:15px;border:1.6px solid var(--hair);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}
.ptog[aria-pressed="true"] .pk{background:var(--amber-rail);border-color:var(--amber-rail);color:var(--on-amber)}
.ptog:active{transform:scale(.86)}
.ptog.rm .pk{border-color:transparent;background:var(--fill);color:var(--bad)}
/* a ONE-OFF pick reads as temporary: hollow amber ring, not a solid amber fill */
.ptog.once[aria-pressed="true"] .pk{background:transparent;border-color:var(--amber-rail);
  border-style:dashed;color:var(--amber)}
.crow.ispick.once{background:transparent;box-shadow:inset 3px 0 0 -.5px var(--amber-rail)}
/* one-off date tag */
.onceTag{
  flex:none;display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;
  border-radius:6px;background:var(--fill);color:var(--amber);
  font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  border:1px dashed var(--amber-rail);white-space:nowrap;max-width:100%;overflow:hidden;
}
.ghead .gh-k{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--amber);
  border:1px dashed var(--amber-rail);border-radius:5px;padding:1px 5px;text-transform:uppercase;
}

/* ── buttons ─────────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:50px;border-radius:14px;font-size:16.5px;font-weight:650;letter-spacing:-.35px;
  padding:0 18px;width:100%;min-width:0;transition:opacity .15s ease,transform .15s ease;
}
.btn:active{opacity:.7;transform:scale(.985)}
.btn.filled{background:var(--btn-ink);color:var(--btn-on)}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn[disabled]{pointer-events:none;background:var(--fill);color:var(--ink3);font-weight:600}
.btn-sm{
  min-height:44px;padding:0 14px;border-radius:12px;font-size:14.5px;font-weight:650;
  width:auto;flex:none;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn-sm.redtxt{color:var(--bad);background:var(--fill)}
/* dismiss control on a persistent notice row */
.rulerow > .btn-sm{align-self:center;background:var(--fill);color:var(--ink2);font-size:13.5px;padding:0 11px}
.btn-sm.ink{background:var(--btn-ink);color:var(--btn-on)}
.btn-sm:active{opacity:.5}

/* ── save bar (docked material) ──────────────────────────────── */
.savebar{
  position:fixed;left:0;right:0;z-index:55;bottom:calc(var(--tabpadref) + var(--tabh));
  padding:9px var(--pr) 9px var(--pl);
  background:var(--barbg);              /* F15 — see .navbar */
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.32,.9,.32,1),opacity .2s ease;
}
.savebar::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair)}
#app.dirty .savebar{transform:translateY(0);opacity:1;pointer-events:auto}
.savebar-inner{display:flex;align-items:center;gap:12px;max-width:592px;margin:0 auto;min-width:0}
.savebar .sn{flex:1;min-width:0;font-size:12.5px;line-height:16px;color:var(--ink3)}
.savebar .sn b{display:block;color:var(--ink);font-size:14.5px;font-weight:680;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar .sn i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── tab bar ─────────────────────────────────────────────────── */
.tabfade{
  position:fixed;left:0;right:0;z-index:48;pointer-events:none;
  bottom:calc(var(--tabpadref) + var(--tabh));height:40px;
  background:linear-gradient(to top,var(--bg),var(--bg0));
  transition:opacity .2s ease;
}
#app.dirty .tabfade{opacity:0}
/* Flush to the true bottom edge: the bar is anchored at bottom:0 of the dvh-sized
   shell and its BACKGROUND paints through the home-indicator inset, which is applied
   once here as internal padding. --sab is never added again further down the chain,
   so there is no empty strip under the bar in either context. */
.tabbar{
  /* --tabpad: how much of the home-indicator inset we actually reserve. iOS reports
     34px, but the indicator pill is only ~5px tall sitting ~8px off the bottom, so
     reserving all 34px strands the icons visibly high. We keep a comfortable margin
     and still never sit under the pill. */
  --tabpad:var(--tabpadref);
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;min-width:0;
  min-height:calc(var(--tabh) + var(--tabpad));
  padding-bottom:var(--tabpad);padding-left:var(--sal);padding-right:var(--sar);
  background:var(--tabbg);              /* F15 — see .navbar */
}
.tabbar::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair);opacity:1}
.tabbtn{
  flex:1 1 0;min-width:0;height:var(--tabh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink3);position:relative;padding-top:2px;
}
.tabbtn .tl{font-size:10px;font-weight:650;letter-spacing:.02px;line-height:12px;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbtn[aria-selected="true"]{color:var(--ink)}
.tabbtn[aria-selected="true"] svg{stroke-width:2.3}
.tabbtn:active{opacity:.5}
.tabbtn .tbadge{
  position:absolute;top:2px;left:50%;margin-left:5px;
  min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--ink3);color:var(--bg);
  font-size:10.5px;font-weight:800;line-height:17px;text-align:center;
  font-variant-numeric:tabular-nums;
  transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.tabbtn .tbadge.on{transform:scale(1)}
.tabbtn[aria-selected="true"] .tbadge{background:var(--ink);color:var(--bg)}
#app.dirty .tabbtn[data-tab="picks"] .tbadge{background:var(--amber-rail);color:var(--on-amber)}

/* ── empty state ─────────────────────────────────────────────── */
/* deliberately NOT called `.empty`: that name is generic enough to collide with a
   modifier on an unrelated component (it did — on .dcell). */
.emptystate{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;
  padding:40px calc(26px + var(--sar)) 16px calc(26px + var(--sal));
}
.emptystate .eg{color:var(--ink3);opacity:.5;margin-bottom:2px}
.emptystate .et{font-size:19px;font-weight:700;letter-spacing:-.45px}
.emptystate .es{font-size:14.5px;color:var(--ink2);line-height:20px;letter-spacing:-.15px;max-width:300px}

/* ── colour-tiled rule rows ──────────────────────────────────── */
.rulerow{display:flex;gap:12px;padding:12px 13px;align-items:flex-start;min-width:0;position:relative}
.rulerow + .rulerow::before{content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2)}
.rulerow .ri{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.rulerow .rt{flex:1;min-width:0;font-size:14.5px;letter-spacing:-.2px;line-height:19px}
.rulerow .rt b{font-weight:680;display:block}
.rulerow .rt span{color:var(--ink2);font-size:12.5px;line-height:17px;display:block;margin-top:2px}

/* ── tinted icon tiles: background + a legible ink, always as a pair ─── */
.ri[data-tone]{color:var(--tile-ink)}
.ri[data-tone="go"]{background:var(--go)}
.ri[data-tone="bad"]{background:var(--bad)}
.ri[data-tone="n3"]{background:var(--ink3)}
.ri[data-tone="n2"]{background:var(--ink2)}
.ri[data-tone="amber"]{background:var(--amber-rail);color:var(--on-amber)}

/* ── iOS switch ──────────────────────────────────────────────── */
.swrow{display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:58px;min-width:0;position:relative}
.swrow::before{content:'';position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--hair2)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;position:relative;
  transition:background-color .28s cubic-bezier(.32,.9,.32,1)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);
  transition:transform .28s cubic-bezier(.32,.9,.32,1)}
/* the accessible control IS the 44px hit area — role/state live on .swtap itself */
.swtap{width:51px;min-height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.swtap[aria-checked="true"] .sw{background:var(--amber-rail)}
.swtap[aria-checked="true"] .sw i{transform:translateX(20px)}

/* ── sheets ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:100;background:var(--scrim);opacity:0;transition:opacity .32s ease}
.scrim.on{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;min-width:0;
  padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar));
  padding-bottom:calc(8px + var(--sab));
  transform:translateY(110%);transition:transform .44s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:translateY(0)}
.sheet-card{background:var(--sheet);border-radius:18px;overflow:hidden;max-width:576px;margin:0 auto;min-width:0}
/* F13 — `contain` keeps the sheet's own bounce (which reads correctly for a modal) but
   stops the overscroll chaining out into the shell behind the scrim. dvh not vh: vh is the
   LARGE viewport and over-measures whenever browser chrome is present. */
.sheet-scroll{max-height:min(74dvh,640px);overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain}
.sheet-scroll::-webkit-scrollbar{width:0;height:0}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--hair);margin:8px auto 2px}
.detail-head{padding:8px 18px 14px;min-width:0}
.detail-kicker{display:flex;align-items:center;gap:7px;min-width:0;margin-bottom:6px}
.detail-kicker .k{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-title{font-size:25px;font-weight:750;letter-spacing:-.6px;line-height:30px;overflow-wrap:anywhere;min-width:0}
.detail-when{font-size:14.5px;color:var(--ink2);letter-spacing:-.2px;margin-top:5px;overflow-wrap:anywhere;min-width:0}
.factrow{display:flex;align-items:center;gap:10px;padding:11px 18px;min-width:0;position:relative;min-height:46px}
.factrow::before{content:'';position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--hair2)}
.factrow .fk{font-size:14.5px;color:var(--ink2);letter-spacing:-.2px;flex:none}
.factrow .fv{font-size:14.5px;font-weight:600;letter-spacing:-.2px;margin-left:auto;min-width:0;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-actions{padding:14px 18px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sheet-note{font-size:11.5px;line-height:16px;color:var(--ink3);padding:0 18px 16px;min-width:0}

/* UIAlertController-style action sheet */
.asheet{padding-bottom:calc(8px + var(--sab))}
.as-group{background:var(--sheet);border-radius:16px;overflow:hidden;max-width:576px;margin:0 auto 8px;min-width:0}
.as-title{padding:16px 18px;text-align:center;font-size:12.5px;line-height:17px;color:var(--ink2);
  white-space:pre-line;position:relative;min-width:0;overflow-wrap:anywhere}
.as-title b{display:block;color:var(--ink);font-size:15px;font-weight:680;margin-bottom:3px}
.as-btn{width:100%;min-height:57px;display:flex;align-items:center;justify-content:center;
  font-size:19px;letter-spacing:-.4px;color:var(--ink);position:relative;padding:0 18px;text-align:center}
.as-btn::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair2)}
.as-btn:active{background:var(--fill)}
.as-btn.destructive{color:var(--bad)}
.as-btn.bold{font-weight:680}
.as-cancel{background:var(--sheet);border-radius:16px;max-width:576px;margin:0 auto;overflow:hidden}
.as-cancel .as-btn{font-weight:680}
.as-cancel .as-btn::before{display:none}

/* ── toast ───────────────────────────────────────────────────── */
/* F17 — iOS ignores the manifest's "orientation":"portrait" for home-screen web apps, so
   this rotates. In landscape the Dynamic Island sits on a long edge and a flat 12px inset
   put every toast — including every error message — straight underneath it. */
#toast{position:fixed;z-index:200;
  left:calc(12px + var(--sal));right:calc(12px + var(--sar));top:calc(var(--sat) + 6px);
  display:flex;justify-content:center;pointer-events:none}
#toast .tt{
  max-width:100%;min-width:0;background:var(--sheet);color:var(--ink);
  border-radius:22px;padding:11px 18px;
  font-size:13.5px;line-height:18px;font-weight:550;letter-spacing:-.15px;text-align:center;
  box-shadow:0 10px 34px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.10);
  opacity:0;transform:translateY(-16px) scale(.94);overflow-wrap:anywhere;
  transition:opacity .3s ease,transform .42s cubic-bezier(.32,.72,0,1);
}
#toast.on .tt{opacity:1;transform:translateY(0) scale(1)}

/* ── setup ───────────────────────────────────────────────────── */
#app.setupmode .wrap{min-height:100%;display:flex;flex-direction:column}
#app.setupmode .wrap{padding-bottom:calc(var(--sab) + 20px)}
#app.setupmode .navbtn{opacity:0;pointer-events:none}
#app.setupmode .savebar,#app.setupmode .tabfade,#app.setupmode .ptr{display:none}
.setup{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;
  padding:0 calc(24px + var(--sar)) 30px calc(24px + var(--sal))}
.setup .mark{
  width:72px;height:72px;border-radius:20px;margin:0 auto 18px;
  background:linear-gradient(160deg,var(--amber-rail),var(--s-run));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 12px 30px -10px rgba(208,138,17,.55);
}
.setup h1{font-size:27px;font-weight:760;letter-spacing:-.7px;text-align:center}
.setup p{font-size:14.5px;line-height:20px;color:var(--ink2);text-align:center;margin-top:8px;letter-spacing:-.2px}
.setup input{
  width:100%;min-width:0;font-size:17px;font-family:inherit;color:var(--ink);
  background:var(--card);border:0;border-radius:14px;padding:15px 16px;margin-top:22px;min-height:52px;
  box-shadow:var(--shadow);
}
.setup input::placeholder{color:var(--ink3)}
.setup .btn{margin-top:12px}
.setup .warn{font-size:12.5px;line-height:17px;color:var(--amber);text-align:center;margin-top:14px;overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* ── narrow phones (320) — last in the sheet so these actually win ───── */
@media (max-width:359px){
  /* buys back the few px that were eating the studio name in a booked row */
  .cmeta{font-size:12px}
  .crow{gap:8px;padding-left:10px}
  /* seven columns still have to fit — buy the px back from the gutters, not the cells */
  .rail{gap:4px;padding-left:calc(var(--pl) - 6px);padding-right:calc(var(--pr) - 6px)}
  .dcell .dw{font-size:8.5px;letter-spacing:.01em}
  .dcell .dn{font-size:17px}
  .dcell .pips{gap:1.5px}
  .dcell .pips i{width:3.5px}
}
</style>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   Contract constants (§1)
   ════════════════════════════════════════════════════════════════ */
const DAY_ORDER = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const TZ = 'Australia/Sydney';
const STUDIOS = ['exhale','reformer','run','cycle','nurture'];
const SCOLOR = {exhale:'var(--s-exhale)',reformer:'var(--s-reformer)',run:'var(--s-run)',
                cycle:'var(--s-cycle)',nurture:'var(--s-nurture)'};
const SLABEL = {exhale:'Exhale',reformer:'Reformer',run:'Run',cycle:'Cycle',nurture:'Nurture'};

/* The Worker is the ONLY back end this app talks to. It verifies a FIT password (the gym
   portal sends no CORS headers, so the browser cannot ask it directly), and it holds the
   repo credentials server-side, scoping every read and write to the folder of whoever is
   signed in. The app itself has no repo credential of any kind — it only ever holds an
   opaque session string, and a session can only touch its own member's data. */
const WORKER_URL = 'https://fit-login.joshrandall182.workers.dev';

/* Opaque session handle from POST /login. Meaningless to this app: it is passed back to
   the Worker on every call and is the only thing that identifies the member. */
let session = '';
/* Which member is signed in. Display/state only now — the Worker decides which folder a
   session may read and write, so nothing here can widen access. */
let USER = '', USERNAME = '';
try {
  session  = localStorage.getItem('fitbooker_session') || '';
  USER     = localStorage.getItem('fitbooker_user')  || '';
  USERNAME = localStorage.getItem('fitbooker_name')  || '';
} catch(e){ session = ''; }

/* ── per-member storage (correctness: cross-member leak) ─────────────────────────────
   Two people share this phone. Anything keyed globally is a leak: the unsaved-picks
   draft was restored into the OTHER member's session, one tap from writing his picks to
   her account. Every key that holds member data is scoped by member key, and signing out
   (or being bounced to sign-in) erases every trace of the member who left — in storage
   AND in memory — before anyone else can be shown a screen. */
function memberKey(base){ return 'fitbooker_'+base+'_'+(USER||'nobody'); }
const MEMBER_KEY_PREFIXES = ['fitbooker_draft_picks', 'fitbooker_alerts', 'fitbooker_rowwarn'];
/* keys from earlier builds that were global and must never be read again */
const LEGACY_KEYS = ['fitbooker_draft_picks', 'fitbooker_lastsnipe', 'fitbooker_sniped'];
function wipeStoredMemberData(){
  try{
    LEGACY_KEYS.forEach(k => localStorage.removeItem(k));
    const doomed = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && MEMBER_KEY_PREFIXES.some(p => k.indexOf(p) === 0)) doomed.push(k);
    }
    doomed.forEach(k => localStorage.removeItem(k));
    localStorage.removeItem('fitbooker_session');
    localStorage.removeItem('fitbooker_user');
    localStorage.removeItem('fitbooker_name');
  }catch(x){}
}
/* Blank everything that belongs to a member — storage and memory both. Called by
   doSignOut() AND by bailToSetup(): a 401 hands the phone back to the login screen just
   as literally as tapping Sign out does, and the next person to sign in must not be able
   to see, or act on, one byte of the last one's data. */
function wipeMemberState(){
  wipeStoredMemberData();
  session = ''; USER = ''; USERNAME = ''; booted = false;
  timetable = {updated:null, classes:[]};
  bookings  = {updated:null, bookings:[]};
  logdata = []; picks = []; picksSha = null; savedPicksJson = '[]';
  lastDataJson = null;                 // cached payload comparison state
  /* the next member to sign in gets their own three bootstrap syncs — the counter belongs
     to a member's never-synced state, not to this page */
  bootstrapSyncs = 0;
  alerts = [];
  stickyWarn = {};
  pendingCancels = []; pendingBooks = []; pendingConfirms = [];
  /* One member's auto-cancel roster must never be visible to another: it decides which
     rows offer a Confirm button and which claim they will cancel themselves. sweepArmed
     resets to the cautious answer, not to the last member's. */
  confirmData = []; sweepArmed = false; sweepPaused = false;
  allDates = []; selDate = null; weekStart = null; heroCache = null;
  loadError = null; freshFromServer = false;
  scrollMemo = {book:0, booked:0, picks:0};
  try{ $('#app').classList.remove('dirty'); }catch(e){}
}
function signOut(){ wipeMemberState(); }

let timetable = {updated:null, classes:[]};
let bookings  = {updated:null, bookings:[]};
let logdata   = [];
let picks = [], picksSha = null, savedPicksJson = '[]';
let loadError = null, booted = false;
/* Persistent, member-scoped notices. A settle decision ("that cancel didn't go through")
   is strike-relevant: it may not be a toast that the next toast overwrites and that is
   gone the moment the app is backgrounded. These are rendered as inline rows and stay
   until the user dismisses them or the condition they describe resolves. */
let alerts = [];

let activeTab = 'book';
let studioFilter = 'all';
let selDate = null;
let allDates = [];
let weekStart = null;                  // Monday (YYYY-MM-DD) of the week on screen
let scrollMemo = {book:0, booked:0, picks:0};
let heroCache = null;

/* live-data machinery (§3) */
const POLL_MS      = 45000;            // cheap Contents API read while visible
const STALE_MS     = 15*60000;         // older than this ⇒ dispatch a real FIT sync
const DISPATCH_MIN = 5*60000;          // never auto-dispatch refresh.yml more often
const SYNC_MAX_MS  = 150000;           // a dispatch is "in flight" for at most this long
/* After an action that changes state (book or cancel) the app polls hard until the server
   agrees, so the optimistic row on screen is confirmed — or withdrawn — in seconds rather
   than at the mercy of the 45s poll. */
const FAST_POLL_MS  = 8000;
/* A workflow_dispatch takes ~60–90s end to end. Past this, an optimistic row that the
   server still disagrees with is a failure, not latency. */
const SETTLE_MS     = 200000;
/* The fast poll exists to WATCH the settle deadline, so it must outlive it. It used to
   be 180s against a 200s deadline: it always died first, and the decision it was there to
   observe was left to the 45s poll — or, if the app was backgrounded, to nothing. */
const FAST_POLL_MAX = SETTLE_MS + 60000;
/* correctness #3 — a cancel from this app is a workflow_dispatch: queue + runner
   allocation + checkout + setup-python + pip + FIT login all happen BEFORE the POST that
   the gym timestamps. 75s is optimistic, 120s is normal, and relTime() rounds ("1m" can
   mean 89s). Anything inside this margin of the 1-hour free-cancel line WILL land late, so
   the UI must never call it free. Erring towards warning costs nothing; being wrong costs
   a strike, and three strikes in 7 days is a 7-day booking ban. */
const CANCEL_LATENCY_MS = 4*60000;
let pollTimer = null, fastTimer = null, fastUntil = 0;

/* F3 — DISPATCH_MIN was only ever enforced within one page lifetime, and an iOS
   home-screen web app is purged and cold-launched constantly. Every relaunch with stale
   data fired a fresh refresh.yml, so a bot that had STOPPED being able to update the files
   got hammered ~54 times a day forever, with no user-visible signal. Persist the slot. */
const DISPATCH_KEY = 'fitbooker_lastdispatch';
let lastRefreshDispatch = 0;           // ms of the last refresh.yml we fired
try{
  const v = Number(localStorage.getItem(DISPATCH_KEY));
  /* a stamp in the future means the device clock moved backwards — distrust it */
  if(isFinite(v) && v > 0 && v <= Date.now()) lastRefreshDispatch = v;
}catch(e){}
function markDispatch(t){
  lastRefreshDispatch = t;
  try{ localStorage.setItem(DISPATCH_KEY, String(t)); }catch(e){}
}
/* Re-read at decision time, not just at boot: another instance of this app (a second tab,
   or the copy that was running before iOS purged this one) may have claimed the slot since
   this page loaded, and localStorage is the only thing the two share. */
function lastDispatchMs(){
  let v = lastRefreshDispatch;
  try{
    const s = Number(localStorage.getItem(DISPATCH_KEY));
    if(isFinite(s) && s > 0 && s <= Date.now() && s > v){ v = s; lastRefreshDispatch = s; }
  }catch(e){}
  return v;
}

let syncing = false;                   // a refresh.yml is believed to be in flight
let syncStartedAt = 0;                 // WALL CLOCK, so it survives being backgrounded
let autoBusy = false;                  // debounce: one auto-sync attempt at a time
let loadingNow = false;                // debounce: one loadAll() at a time

/* F2 — the only thing that ever cleared `syncing` on the failure path was a 115s
   setTimeout inside pollAfterDispatch(), and visibilitychange clearPostPoll()s it the
   instant the app is backgrounded. Switching apps while a sync ran (entirely normal while
   waiting ~70s for a workflow) came back to syncing===true with nothing alive to clear it,
   which permanently disabled autoSync() AND pull-to-refresh until a force-quit.
   A deadline held as a timestamp and re-evaluated on resume cannot be cancelled by being
   backgrounded. */
function reapSync(){
  if(syncing && syncStartedAt && Date.now() - syncStartedAt > SYNC_MAX_MS){
    syncing = false; syncStartedAt = 0;
  }
}

/* ════════════════════════════════════════════════════════════════
   Helpers
   ════════════════════════════════════════════════════════════════ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

const SYD_PARTS = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',
  day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function sydParts(d){
  const o = {};
  try { SYD_PARTS.formatToParts(d||new Date()).forEach(p=>{ o[p.type]=p.value; }); }
  catch(e){ const x=d||new Date(); o.year=String(x.getFullYear()); o.month=String(x.getMonth()+1).padStart(2,'0');
            o.day=String(x.getDate()).padStart(2,'0'); o.hour=String(x.getHours()).padStart(2,'0'); o.minute='00'; }
  return o;
}
function sydToday(){ const p = sydParts(new Date()); return p.year+'-'+p.month+'-'+p.day; }
function sydNowClock(){ const p = sydParts(new Date()); return fmt12(p.hour+':'+p.minute).full; }

function dstr(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function toUTC(ds){ const a=String(ds).split('-').map(Number); return Date.UTC(a[0],a[1]-1,a[2]); }
function fromUTC(ms){ const d=new Date(ms); return dstr(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
function addDays(ds,n){ return fromUTC(toUTC(ds)+n*86400000); }
function dowMon0(ds){ return (new Date(toUTC(ds)).getUTCDay()+6)%7; }
/* Monday-first (DAY_ORDER) week arithmetic for the one-week-at-a-time strip */
function mondayOf(ds){ return addDays(ds, -dowMon0(ds)); }
function weekDates(ws){ const out=[]; for(let i=0;i<7;i++) out.push(addDays(ws,i)); return out; }
const WD_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WD_SHORT= ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON_LONG= ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayNum(ds){ return Number(String(ds).split('-')[2]); }
function monIdx(ds){ return Number(String(ds).split('-')[1])-1; }
function longDate(ds){ return WD_LONG[dowMon0(ds)]+' '+dayNum(ds)+' '+MON_LONG[monIdx(ds)]; }
function shortDate(ds){ return WD_SHORT[dowMon0(ds)]+' '+dayNum(ds)+' '+MON_SHORT[monIdx(ds)]; }
/* "11 – 17 Aug" / "31 Aug – 6 Sep" */
function weekLabel(ws){
  const a = ws, b = addDays(ws,6);
  return monIdx(a) === monIdx(b)
    ? dayNum(a)+' – '+dayNum(b)+' '+MON_SHORT[monIdx(b)]
    : dayNum(a)+' '+MON_SHORT[monIdx(a)]+' – '+dayNum(b)+' '+MON_SHORT[monIdx(b)];
}
function relDayLabel(ds){
  const t = sydToday();
  if(ds === t) return 'Today';
  if(ds === addDays(t,1)) return 'Tomorrow';
  return longDate(ds);
}

function fmt12(t){
  const a = String(t||'').split(':'); let h = Number(a[0])||0; const m = a[1]||'00';
  const ap = h>=12 ? 'pm' : 'am'; h = h%12 || 12;
  return {h:h+':'+m, ap:ap, full:h+':'+m+' '+ap};
}
function isoClock(iso){ const p = sydParts(new Date(iso)); return fmt12(p.hour+':'+p.minute).full; }
function isoDateStr(iso){ const p = sydParts(new Date(iso)); return p.year+'-'+p.month+'-'+p.day; }

/* coarse "3d 4h" */
function relTime(ms){
  if(ms < 0) ms = 0;
  const s = Math.round(ms/1000);
  if(s < 60) return s+'s';
  const m = Math.round(s/60); if(m < 60) return m+'m';
  const h = Math.floor(m/60), rm = m%60;
  if(h < 24) return rm ? h+'h '+rm+'m' : h+'h';
  const d = Math.floor(h/24), rh = h%24;
  return rh ? d+'d '+rh+'h' : d+'d';
}
/* live hero countdown — seconds inside the hour */
function cdText(ms){
  if(ms <= 0) return 'Open now';
  const s = Math.floor(ms/1000);
  if(s < 3600){ return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'; }
  const h = Math.floor(s/3600);
  if(h < 24) return h+'h '+String(Math.floor((s%3600)/60)).padStart(2,'0')+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function durationMins(c){
  try{
    const m = String(c.end||'').match(/(\d{1,2}):(\d{2})\s*([AaPp])/);
    if(!m) return null;
    let eh = Number(m[1])%12; if(m[3].toLowerCase()==='p') eh += 12;
    const em = Number(m[2]);
    const sa = String(c.time).split(':').map(Number);
    let mins = (eh*60+em) - (sa[0]*60+sa[1]);
    if(mins < 0) mins += 1440;
    return (mins>0 && mins<300) ? mins : null;
  }catch(e){ return null; }
}
function endLabel(c){
  const d = durationMins(c); if(d === null) return '';
  const a = String(c.time).split(':').map(Number);
  const tot = (a[0]*60 + a[1] + d) % 1440;
  return fmt12(String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0')).full;
}

/* availability wording from `avail` + `notfull` */
function availInfo(c){
  const a = String(c.avail||'');
  if(!c.notfull){
    if(a.indexOf('waitlist')>=0 && a.indexOf('no_waitlist')<0)
      return {full:true, label:'Full · waitlist', cls:'bad', long:'Full — waitlist open'};
    return {full:true, label:'Full', cls:'bad', long:'Full'};
  }
  if(a==='less_than_100') return {full:false, label:'Almost full', cls:'', long:'Almost full'};
  if(a==='less_than_90')  return {full:false, label:'Filling up',  cls:'', long:'Filling up'};
  return {full:false, label:'Spaces', cls:'', long:'Spaces'};
}
