/* ════════════════════════════════════════════════════════════════
   Toast + sheets
   ════════════════════════════════════════════════════════════════ */
let toastTimer = null;
function toast(msg, ms){
  const t = $('#toast'); $('#toastText').textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('on'), ms || 2800);
}
function sheetOpen(){ return !!$('#sheetRoot').innerHTML; }
/* F1 — the wipe that finishes the dismiss animation MUST be cancellable and MUST belong to
   the sheet that scheduled it. It used to be a bare setTimeout: any sheet opened inside the
   460ms window (booknow -> confirm, confirm-Cancel -> class sheet, Info -> Data) was deleted
   out from under the user by the PREVIOUS close's timer, and an actionSheet destroyed that
   way never resolved its promise, so bookNow() hung forever and nothing was ever dispatched.
   This is the app's primary booking path. */
let sheetWipeTimer = null;
function cancelSheetWipe(){ if(sheetWipeTimer){ clearTimeout(sheetWipeTimer); sheetWipeTimer = null; } }
function closeSheet(){
  const root = $('#sheetRoot');
  const sc = $('.scrim', root), sh = $('.sheet', root);
  if(sc) sc.classList.remove('on');
  if(sh) sh.classList.remove('on');
  /* F12 — release the shell as soon as the dismiss starts, not when the node is wiped */
  try{ $('#app').removeAttribute('inert'); }catch(e){}
  cancelSheetWipe();
  const mine = sh;                      // key the teardown to THIS sheet instance
  sheetWipeTimer = setTimeout(()=>{
    sheetWipeTimer = null;
    /* if something opened a new sheet in the meantime, `mine` is no longer in the DOM and
       this timer has nothing left to do */
    if(!mine || root.contains(mine)) root.innerHTML = '';
  }, 460);
}
function openSheet(innerHTML, extraClass){
  const root = $('#sheetRoot');
  cancelSheetWipe();                    // F1 — a new sheet cancels the pending wipe
  root.innerHTML = '<div class="scrim"></div><div class="sheet '+(extraClass||'')+
    '" role="dialog" aria-modal="true">'+innerHTML+'</div>';
  const sc = $('.scrim', root), sh = $('.sheet', root);
  sc.addEventListener('click', ()=> closeSheet());
  /* F12 — standalone has no browser chrome to escape to, so the shell behind the scrim has
     to be genuinely unreachable; otherwise VoiceOver swipes straight past it onto Book
     buttons the user cannot see. */
  try{ $('#app').setAttribute('inert',''); }catch(e){}
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ sc.classList.add('on'); sh.classList.add('on'); }); });
  return root;
}
/* UIAlertController-style action sheet — never window.confirm() */
function actionSheet(opts){
  return new Promise(resolve=>{
    const acts = opts.actions || [];
    let html = '<div class="as-group">';
    if(opts.title || opts.message){
      html += '<div class="as-title">'+(opts.title?'<b>'+esc(opts.title)+'</b>':'')+
              (opts.message?esc(opts.message):'')+'</div>';
    }
    acts.forEach((a,i)=>{
      html += '<button class="as-btn '+(a.style==='destructive'?'destructive':'')+' '+
              (a.style==='default'?'bold':'')+'" data-as="'+i+'">'+esc(a.label)+'</button>';
    });
    html += '</div><div class="as-cancel"><button class="as-btn" data-as="-1">'+
            esc(opts.cancelLabel||'Cancel')+'</button></div>';
    const root = openSheet(html, 'asheet');
    const mine = $('.sheet', root);
    let done = false, obs = null;
    const onClick = e=>{
      const b = e.target.closest('[data-as]');
      if(b) finish(Number(b.dataset.as));
      else if(e.target.classList.contains('scrim')) finish(-1);
    };
    const teardown = ()=>{ if(obs) obs.disconnect(); root.removeEventListener('click', onClick); };
    const finish = v => { if(done) return; done = true; teardown(); closeSheet(); resolve(v); };
    /* F1 belt-and-braces: if this sheet is torn out of the DOM by anything other than
       finish() — a stale wipe, another sheet, bailToSetup() — resolve as cancelled rather
       than leaving the awaiting caller hung forever. */
    if(window.MutationObserver){
      obs = new MutationObserver(()=>{
        if(!done && mine && !root.contains(mine)){ done = true; teardown(); resolve(-1); }
      });
      obs.observe(root, {childList:true});
    }
    root.addEventListener('click', onClick);
  });
}

/* ════════════════════════════════════════════════════════════════
   Worker API (contract §2–§4)
   ════════════════════════════════════════════════════════════════ */
/* Every call is the same shape: POST JSON to WORKER_URL + path with the session folded in,
   get JSON back with an `ok` flag. The Worker resolves the session to a member and scopes
   the read/write itself, so a path can never name someone else's data.

   F22 — the 12s abort stops one hung cell pinning `loadingNow` for iOS's full network
   timeout, during which every poll and every pull-to-refresh was a silent no-op.

   Errors are thrown with the HTTP status IN THE MESSAGE, because isAuthErr() (and every
   caller that funnels through handleApiErr) recognises an expired session by finding
   '401' in the text. The raw response is attached as `.res` so the 409 merge path in
   savePicks() can read the server's copy of the list. */
async function wapi(path, payload){
  const ac = ('AbortController' in window) ? new AbortController() : null;
  const kill = ac ? setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, 12000) : null;
  try{
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({session: session}, payload || {})),
      cache:'no-store', signal: ac ? ac.signal : undefined});
    let d = null;
    try{ d = await r.json(); }catch(e){}
    if(!d || !d.ok){
      const err = new Error(((d && d.error) || (path+' failed')) + ' ('+r.status+')');
      err.status = r.status;
      err.res = d || null;
      throw err;
    }
    return d;
  } finally { if(kill) clearTimeout(kill); }
}
async function dispatch(workflow, inputs){
  /* booknow acts on ONE member's account. The Worker stamps the member from the session,
     so sending a `user` input is both pointless and ignored — and that is the whole point
     of the change: a client can no longer ask to act as somebody else. */
  await wapi('/dispatch', {workflow: workflow, inputs: inputs || {}});
}
function isAuthErr(e){ const s = String(e && e.message || e); return s.indexOf('401')>=0 || s.indexOf('403')>=0; }
/* CONTRACT §2: ANY 401/403 clears the session and returns to setup — not just the
   initial load, or an expired session leaves the user tapping Save forever. */
function bailToSetup(msg){
  signOut();
  booted = false;
  stopPolling(); clearPostPoll(); syncing = false; syncStartedAt = 0;
  /* F24 — the in-flight hairline was left animating behind the setup screen forever */
  clearFlight();
  closeSheet();
  renderSetup(msg || 'Your session expired. Sign in again.');
}
function handleApiErr(e){
  if(isAuthErr(e)){ bailToSetup(); return true; }
  return false;
}
function safeParse(txt, fallback){ try { return txt ? JSON.parse(txt) : fallback; } catch(e){ return fallback; } }

/* F22 — returns true when this call actually did the work, false when it was debounced
   away. Pull-to-refresh needs to know, or it tells the user "Up to date" having done
   nothing at all — at the exact moment they are pulling BECAUSE they think it is stuck. */
async function loadAll(silent){
  if(loadingNow) return false;    // debounce: poll + visibility + PTR can all land at once
  loadingNow = true;
  try{ await loadAllInner(silent); return true; } finally { loadingNow = false; }
}
/* F18 — the old four-file read used ETags so a 45s poll that found nothing new was free
   and, more importantly, did not re-render. POST /data is a single unconditional call, so
   the cheap check moves up a layer: stringify what came back and compare it with the last
   payload. Identical ⇒ nothing on screen can legitimately differ, so skip renderAll() and
   leave scroll positions, the chip rail and any open sheet exactly as they were. */
let lastDataJson = null;
async function loadAllInner(silent){
  let unchanged = false;
  /* an identical payload only means "nothing to redraw" if the screen was not showing an
     offline banner a moment ago — clearing that banner IS a change */
  const hadError = loadError !== null;
  /* a background refresh must never silently eat pick edits the user hasn't saved */
  const keepLocalPicks = !!(silent && isDirty());
  try{
    /* ONE call replaces the four file reads. The Worker picks the member from the session,
       so there is no per-member path to get wrong here any more. */
    const d = await wapi('/data', {});
    const fresh = JSON.stringify([d.timetable, d.bookings, d.log, d.picks, d.picksSha]);
    unchanged = (lastDataJson !== null && fresh === lastDataJson);
    lastDataJson = fresh;

    /* the Worker is authoritative about who this session is — keep the local copy in step
       so the Sign out label and the boot-time defaults never drift */
    if(d.user) USER = d.user;
    if(typeof d.name === 'string') USERNAME = d.name;
    try {
      localStorage.setItem('fitbooker_user', USER);
      localStorage.setItem('fitbooker_name', USERNAME);
    } catch(e){}

    const tt = d.timetable;
    if(tt && Array.isArray(tt.classes)) timetable = tt;
    const bk = d.bookings;
    if(bk && Array.isArray(bk.bookings)) bookings = bk;
    /* only replace the activity list when the log actually came back as a list — a
       malformed payload must not blank it while the banner claims a cached view */
    if(Array.isArray(d.log)) logdata = d.log;
    /* correctness #12 — the sha is captured even for an empty list, or every later save
       is rejected as a conflict for a file that never changed. null is legitimate: it
       means this member has never saved, and /picks takes sha:null for that case. */
    picksSha = (typeof d.picksSha === 'string' && d.picksSha) ? d.picksSha : null;
    if(Array.isArray(d.picks)){
      if(keepLocalPicks) savedPicksJson = JSON.stringify(d.picks);   // keep the edits, rebase "saved"
      else picks = d.picks;
    }
    if(!keepLocalPicks) savedPicksJson = JSON.stringify(picks);
    loadError = null;
  }catch(e){
    unchanged = false;
    if(isAuthErr(e)){ bailToSetup(); return; }
    loadError = 'Couldn’t reach the booking service. Showing the last data this device loaded.';
    if(!silent) toast('Offline — showing the cached view', 3200);
  }
  /* F7 — first load after a cold launch: if this device was killed mid-edit, put the draft
     back and leave the app dirty so the save bar reappears. Done here, not earlier, because
     savedPicksJson only becomes the real server baseline once the load has landed. */
  if(!booted){
    try{
      const raw = localStorage.getItem(DRAFT_KEY);
      const draft = raw ? JSON.parse(raw) : null;
      if(Array.isArray(draft) && JSON.stringify(draft) !== savedPicksJson){
        picks = draft;
        toast('Restored unsaved pick changes — tap Save picks', 4200);
      } else if(raw){ localStorage.removeItem(DRAFT_KEY); }
    }catch(e){}
  }
  indexDates();
  booted = true;
  /* a sync we started has landed the moment the stamps move past the baseline */
  if(syncing){
    const t = dataUpdatedMs();
    if(t !== null && (syncBaseline === null || t > syncBaseline)){
      syncing = false; syncStartedAt = 0; clearPostPoll();
    }
  }
  reapSync();                       // F2 — a sync past its deadline is not in flight
  /* the poll's cheap path: byte-identical data and no banner to clear ⇒ nothing on screen
     can legitimately differ, so don't rebuild it. The freshness line still ticks, since
     that is a function of the clock rather than of the data. */
  if(unchanged && !hadError){ try{ updateFresh(); updateNav(); }catch(e){} }
  else renderAll();
}

function indexDates(){
  const set = {};
  (timetable.classes||[]).forEach(c=>{ if(c && c.date) set[c.date] = true; });
  const all = Object.keys(set).sort();
  const today = sydToday();
  /* days already gone can never be booked — keeping them only pushed the strip's
     scroll offset around and made "today" hard to find */
  allDates = all.filter(d => d >= today);
  if(!allDates.length) allDates = all;
  if(!selDate || allDates.indexOf(selDate) < 0){
    if(allDates.indexOf(today) >= 0 && dayHasClasses(today)) selDate = today;
    else selDate = allDates.filter(dayHasClasses)[0] || allDates[0] || today;
  }
  syncWeek();
}

/* ── one-week-at-a-time strip: paging bounds (§2) ───────────────── */
function firstWeek(){ return mondayOf(sydToday()); }          // never a fully-past week
function lastWeek(){
  const last = allDates.length ? allDates[allDates.length-1] : sydToday();
  const m = mondayOf(last);
  return m < firstWeek() ? firstWeek() : m;
}
function clampWeek(ws){
  const a = firstWeek(), b = lastWeek();
  return ws < a ? a : (ws > b ? b : ws);
}
/* the visible week defaults to the one holding the selected day and is never a week
   that is entirely in the past */
function syncWeek(){
  if(!weekStart) weekStart = mondayOf(selDate || sydToday());
  weekStart = clampWeek(weekStart);
}

/* ════════════════════════════════════════════════════════════════
   Picks
   ════════════════════════════════════════════════════════════════ */
/* A pick is either RECURRING  {day,time,studio,name}
   or ONE-OFF               {day,time,studio,name,date:"YYYY-MM-DD"}
   — the bot reads the optional `date` field to restrict a pick to a single day. */
function pickDate(p){ return (p && p.date) ? String(p.date) : ''; }
function isOneOff(p){ return !!pickDate(p); }
function pickKey(p){ return p.day+'|'+p.time+'|'+p.studio+'|'+pickDate(p); }
function samePick(a,b){
  return a.day===b.day && a.time===b.time && a.studio===b.studio && pickDate(a)===pickDate(b);
}
/* index of an exact pick; `date` omitted/'' means the recurring one */
function pickIndex(day,time,studio,date){
  const d = date || '';
  return picks.findIndex(p => p.day===day && p.time===time && p.studio===studio && pickDate(p)===d);
}
/* the pick that covers THIS class occurrence — recurring wins, else a one-off on its date */
function pickFor(c){
  const rec = pickIndex(c.day,c.time,c.studio,'');
  if(rec >= 0) return picks[rec];
  const one = pickIndex(c.day,c.time,c.studio,c.date);
  return one >= 0 ? picks[one] : null;
}
function isPicked(c){ return !!pickFor(c); }

function addPick(day,time,studio,name,date){
  const p = {day:day, time:time, studio:studio, name:name||''};
  if(date) p.date = date;
  if(pickIndex(day,time,studio,date||'') < 0) picks.push(p);
  heroCache = null; syncDirty();
  return true;
}
function removePick(day,time,studio,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) picks.splice(i,1);
  heroCache = null; syncDirty();
  return false;
}
/* legacy signature kept for the recurring path (sheet switch, remove buttons) */
function togglePick(day,time,studio,name,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) return removePick(day,time,studio,date);
  return addPick(day,time,studio,name,date);
}
function isDirty(){ return JSON.stringify(picks) !== savedPicksJson; }
/* F7 — iOS purges backgrounded home-screen web apps without warning, and picks/
   savedPicksJson lived only in memory: an unsaved pick edit had exactly one lifetime,
   until the user took a phone call. Mirror the dirty buffer into localStorage on
   every edit; the key is removed the moment the list matches the server again. */
const DRAFT_KEY = 'fitbooker_draft_picks';
function saveDraft(){
  try{
    if(isDirty()) localStorage.setItem(DRAFT_KEY, JSON.stringify(picks));
    else localStorage.removeItem(DRAFT_KEY);
  }catch(e){}
}
function syncDirty(){
  const app = $('#app'), d = isDirty();
  app.classList.toggle('dirty', d);
  saveDraft();
  if(d){
    const saved = safeParse(savedPicksJson, []);
    const added = picks.filter(p => !saved.some(q=>samePick(q,p))).length;
    const removed = saved.filter(q => !picks.some(p=>samePick(p,q))).length;
    const bits = [];
    if(added) bits.push(added+' added');
    if(removed) bits.push(removed+' removed');
    $('#saveTitle').textContent = bits.join(', ') || 'Picks changed';
    const once = picks.filter(isOneOff).length;
    $('#saveSub').textContent = picks.length + (picks.length===1?' pick':' picks') +
      (once ? ' ('+once+' one-off)' : '') + ' after saving';
  }
  updateBadges();
}
function updateBadges(){
  const nb = ((bookings&&bookings.bookings)||[]).length;
  const bb = $('#badgeBooked');
  bb.textContent = nb > 99 ? '99+' : String(nb);
  bb.classList.toggle('on', nb > 0);
  const np = picks.length;
  const pb = $('#badgePicks');
  pb.textContent = np > 99 ? '99+' : String(np);
  pb.classList.toggle('on', np > 0 || isDirty());
  if(np === 0 && isDirty()) pb.textContent = '0';
}

async function savePicks(){
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let res;
    try{
      res = await wapi('/picks', {picks: picks, sha: picksSha});
    }catch(e1){
      if(e1 && (e1.status === 401 || e1.status === 403)){
        bailToSetup('This app has lost write access to your bookings. Sign in again.');
        return;
      }
      if(!(e1 && e1.status === 409)) throw e1;
      /* correctness #12 — the app KNEW the remote had changed, then invited the user to
         press a button that uploads his in-memory list verbatim over it. (The bot removes
         a one-off the moment it books it; "tap Save again" resurrected it.) MERGE instead:
         keep everything he added, keep everything they added, and honour his removals
         only. Nothing the user typed is ever discarded silently. The Worker hands back the
         current list and sha with the 409, so no extra read is needed. */
      const cur = e1.res || {};
      picksSha = (typeof cur.sha === 'string' && cur.sha) ? cur.sha : null;
      const theirs = Array.isArray(cur.picks) ? cur.picks : null;
      let merged = null;
      if(theirs){
        const base = safeParse(savedPicksJson, []);
        const iAdded   = picks.filter(p => !base.some(q=>samePick(q,p)));
        const iRemoved = base.filter(q => !picks.some(p=>samePick(p,q)));
        merged = theirs.filter(t => !iRemoved.some(q=>samePick(q,t)))
                       .concat(iAdded.filter(p => !theirs.some(t=>samePick(t,p))));
      }
      if(!merged) throw new Error('Picks changed elsewhere — tap Save picks again');
      picks = merged; heroCache = null; syncDirty(); renderPicks(); renderBook();
      /* retry ONCE, against the sha the conflict just handed us. If that also conflicts
         the list is being edited from two places right now — stop and let the user look. */
      try{
        res = await wapi('/picks', {picks: picks, sha: picksSha});
      }catch(e2){
        if(e2 && (e2.status === 401 || e2.status === 403)){
          bailToSetup('This app has lost write access to your bookings. Sign in again.');
          return;
        }
        if(e2 && e2.status === 409 && e2.res && typeof e2.res.sha === 'string') picksSha = e2.res.sha;
        throw new Error('Picks had also changed elsewhere — merged. Check the list, then Save again.');
      }
    }
    if(res && typeof res.sha === 'string' && res.sha) picksSha = res.sha;
    savedPicksJson = JSON.stringify(picks);
    syncDirty();
    heroCache = null;
    renderPicks(); renderBook();
    toast('Picks saved — the bot will book them automatically');
    maybeKickSnipe();
  }catch(e){
    toast(String(e.message || e), 4200);
  }finally{
    btn.disabled = false; btn.textContent = 'Save picks';
  }
}

/* Mirror of the bot's bookable_occurrence (contract §4).
   correctness #6 — the bot subtracts 7 days + 1 hour from an AWARE Australia/Sydney
   datetime, which Python evaluates as WALL-CLOCK arithmetic: 7 calendar days back, then
   one hour. Subtracting 169 hours of absolute time (the old `(7*24*60+60)*60000`) is off
   by exactly 60 minutes for every class starting in the week after a DST change — next on
   4–10 Oct 2026 — so the UI and the bot disagreed about when a window opened.
   correctness #19d — the old scan also walked DEVICE-local days and used setHours(), so
   every countdown shifted if the phone left Sydney while the date strip stayed on Sydney
   dates. Both are solved by doing the whole thing in Sydney wall clock. */
function opensMsForSyd(dateStr, hhmm){
  const a = String(hhmm).split(':').map(Number);
  if(a.length < 2 || isNaN(a[0]) || isNaN(a[1])) return null;
  let h = a[0] - 1, day = String(dateStr);          // minus 1 hour, wall clock…
  if(h < 0){ h += 24; day = addDays(day, -1); }     // …which can cross midnight
  day = addDays(day, -7);                           // …and minus 7 CALENDAR days
  return sydWallToMs(day, String(h).padStart(2,'0')+':'+String(a[1]).padStart(2,'0'));
}
/* the class start itself, as a real instant, from Sydney wall fields */
function scanOpens(p, horizonDays){
  const now = Date.now(), wd = DAY_ORDER.indexOf(p.day);
  if(wd < 0) return null;
  const t0 = sydToday();
  for(let i=0;i<horizonDays;i++){
    const ds = addDays(t0, i);
    if(dowMon0(ds) !== wd) continue;
    const opens = opensMsForSyd(ds, p.time);
    if(opens === null) continue;                    // e.g. inside the DST gap — say nothing
    if(opens >= now - 20*60000) return opens;
  }
  return null;
}
function bookableOpensMs(p){ return scanOpens(p, 10); }
/* display-only: identical maths, longer horizon, so a countdown always exists */
function nextWindowMs(p){ return scanOpens(p, 21); }

/* A ONE-OFF pick is pinned to one calendar date, so its window is that date's
   start − 7d − 1h. bookableOpensMs above is the contract's recurring maths and is
   left byte-for-byte intact; this is the dated sibling, used only when p.date is set. */
function oneOffOpensMs(p){
  const now = Date.now();
  const c = (timetable.classes||[]).find(x => x && x.date===p.date && x.time===p.time && x.studio===p.studio);
  let opens = null;
  if(c && c.opens_iso){ const o = new Date(c.opens_iso).getTime(); if(isFinite(o)) opens = o; }
  if(opens === null) opens = opensMsForSyd(p.date, p.time);   // #6: calendar 7d+1h, not 169h
  if(opens === null) return null;
  return opens >= now - 20*60000 ? opens : null;
}
function pickOpensMs(p){ return isOneOff(p) ? oneOffOpensMs(p) : bookableOpensMs(p); }

async function maybeKickSnipe(){
  const now = Date.now();
  const imminent = picks.some(p => { const o = pickOpensMs(p); return o !== null && (o - now) <= 45*60000; });
  if(imminent){
    try{
      await dispatch('snipe.yml');
      beginFlight('A pick opens within the hour — booking run started now.');
    }catch(e){
      /* correctness #19f — this used to swallow everything. It is the mechanism that
         removes the cron lead-time requirement; if it fails, "the bot will book them
         automatically" is a lie and nothing started. */
      if(!handleApiErr(e))
        toast('Saved, but the instant booking run didn’t start — open Picks and tap ' +
              '“Fire a booking pass”.', 5200);
    }
  }
}

/* ════════════════════════════════════════════════════════════════
   In-flight feedback
   ════════════════════════════════════════════════════════════════ */
/* F24 — these timers were untracked and the reload did not check document.hidden, so a
   backgrounded app still burnt four requests on a screen nobody was looking at, and a
   session bail-out mid-booking left the amber hairline animating forever. */
let flightTimers = [];
function clearFlight(){
  flightTimers.forEach(clearTimeout); flightTimers = [];
  inFlight = 0;
  try{ $('#flightbar').classList.remove('on'); }catch(e){}
}
function beginFlight(msg, ms){
  inFlight++;
  $('#flightbar').classList.add('on');
  if(msg) toast(msg, 4200);
  const wait = ms || 75000;
  const track = fn => {
    const id = setTimeout(()=>{
      flightTimers = flightTimers.filter(x => x !== id);   // don't accumulate dead ids
      fn();
    }, wait);
    flightTimers.push(id);
  };
  track(()=>{
    inFlight = Math.max(0, inFlight-1);
    if(!inFlight) $('#flightbar').classList.remove('on');
  });
  /* match pollAfterDispatch: never burn 4 requests for a screen nobody is looking at —
     visibilitychange already re-loads on the way back in */
  track(()=>{ if(!document.hidden) loadAll(true); });
}

/* ════════════════════════════════════════════════════════════════
   Live data (§3) — poll while visible, auto-dispatch a real FIT sync
   when the files go stale, and show freshness instead of demanding a tap.
   ════════════════════════════════════════════════════════════════ */
/* the OLDER of the two `updated` stamps — both files have to be fresh */
function dataUpdatedMs(){
  let oldest = null;
  [timetable && timetable.updated, bookings && bookings.updated].forEach(u=>{
    if(!u) return;
    const t = new Date(u).getTime();
    if(isFinite(t) && (oldest === null || t < oldest)) oldest = t;
  });
  return oldest;
}
function dataAgeMs(){ const t = dataUpdatedMs(); return t === null ? Infinity : Math.max(0, Date.now()-t); }
function isStale(){ return dataAgeMs() > STALE_MS; }
function ageShort(ms){
  if(!isFinite(ms)) return '—';
  const m = Math.floor(ms/60000);
  if(m < 1) return 'now';
  if(m < 60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function ageLong(ms){
  if(!isFinite(ms)) return 'never synced';
  const m = Math.floor(ms/60000);
  if(m < 1) return 'updated just now';
  if(m === 1) return 'updated 1 min ago';
  if(m < 60) return 'updated '+m+' min ago';
  const h = Math.floor(m/60);
  if(h === 1) return 'updated 1 hour ago';
  if(h < 24) return 'updated '+h+' hours ago';
  const d = Math.floor(h/24);
  return 'updated '+d+(d===1?' day ago':' days ago');
}
function freshnessText(){ return syncing ? 'Syncing…' : ageShort(dataAgeMs()); }
function updateFresh(){
  const b = $('#syncBtn'); if(!b) return;
  const t = $('#freshTxt'); if(t) t.textContent = freshnessText();
  b.classList.toggle('syncing', !!syncing);
  b.classList.toggle('stale', !syncing && isStale());
  b.setAttribute('aria-label', syncing ? 'Syncing with FIT' : 'Data '+ageLong(dataAgeMs())+' — tap for sync options');
}

let postPoll = [], syncBaseline = null;
function clearPostPoll(){ postPoll.forEach(clearTimeout); postPoll = []; }
/* after a dispatch the run takes ~60–75s; poll across that window, non-blocking */
function pollAfterDispatch(){
  clearPostPoll();
  [15000,30000,45000,62000,78000,95000].forEach(ms=>{
    postPoll.push(setTimeout(()=>{ if(!document.hidden) loadAll(true); }, ms));
  });
  /* kept as the fast path while the app stays open; reapSync() is the backstop that
     survives being backgrounded, so this timer being destroyed is no longer fatal */
  postPoll.push(setTimeout(()=>{ if(syncing){ syncing = false; syncStartedAt = 0; updateFresh(); } }, 115000));
}
/* Debounced + rate-limited: at most one attempt in flight, and never more than one
   refresh.yml dispatch per DISPATCH_MIN however many triggers pile up. */
async function autoSync(force){
  reapSync();                            // F2 — never bail out behind a stale latch
  if(!session || !booted || autoBusy || syncing) return false;
  if(!force && !isStale()) return false;
  const now = Date.now();
  if(now - lastDispatchMs() < DISPATCH_MIN){
    loadAll(true);                       // too soon to dispatch — just re-read the files
    return false;
  }
  autoBusy = true;
  markDispatch(now);                     // F3 — claim the slot, across restarts too
  syncBaseline = dataUpdatedMs();
  try{
    await dispatch('refresh.yml');
    syncing = true; syncStartedAt = Date.now();
    updateFresh();
    beginFlight(null, 78000);            // subtle hairline only — never a blocking spinner
    pollAfterDispatch();
    return true;
  }catch(e){
    syncing = false; syncStartedAt = 0; updateFresh();
    if(isAuthErr(e)) bailToSetup();
    return false;
  }finally{ autoBusy = false; }
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(()=>{
    if(document.hidden || !session || !booted) return;
    reapSync();
    loadAll(true);
    if(isStale()) autoSync();
  }, POLL_MS);
  /* F19 — freshTimer used to be started once and never stopped: it kept ticking for the
     whole life of the page, including while hidden. It belongs to the visible-polling
     lifecycle, same as pollTimer. */
  if(!freshTimer) freshTimer = setInterval(()=>{ reapSync(); updateFresh(); }, 15000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if(freshTimer){ clearInterval(freshTimer); freshTimer = null; }
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ stopPolling(); clearPostPoll(); return; }
  reapSync();                      // F2 — hours may have passed; an "in flight" sync expired
  startPolling();
  updateFresh();
  if(!session || !booted) return;
  loadAll(true).then(()=>{ if(isStale()) autoSync(); });
});
/* iOS fires pagehide, not always visibilitychange, when a home-screen web app is put away
   or frozen. Stop the timers there too, and flush the unsaved-pick draft (F7). */
window.addEventListener('pagehide', function(){ stopPolling(); clearPostPoll(); try{ saveDraft(); }catch(e){} });
window.addEventListener('pageshow', function(e){
  if(!e.persisted) return;         // a bfcache restore resumes a page whose timers are gone
  reapSync(); startPolling(); updateFresh();
  if(session && booted) loadAll(true);
});

/* ════════════════════════════════════════════════════════════════
   Derived data
   ════════════════════════════════════════════════════════════════ */
function futureClasses(){
  const now = Date.now();
  return (timetable.classes||[]).filter(c => c && c.start_iso && new Date(c.start_iso).getTime() > now);
}
function classesFor(date){
  const now = Date.now();
  return (timetable.classes||[])
    .filter(c => c && c.date===date && new Date(c.start_iso).getTime() > now)
    .filter(c => studioFilter==='all' || c.studio===studioFilter)
    .sort((a,b)=> String(a.time).localeCompare(String(b.time)) || String(a.studio).localeCompare(String(b.studio)));
}
function dayHasClasses(date){
  const now = Date.now();
  return (timetable.classes||[]).some(c => c && c.date===date && new Date(c.start_iso).getTime() > now);
}
function studiosOn(date){
  const now = Date.now(), seen = {};
  (timetable.classes||[]).forEach(c=>{
    if(c && c.date===date && new Date(c.start_iso).getTime() > now) seen[c.studio] = 1;
  });
  return STUDIOS.filter(s => seen[s]);
}
/* studio already booked on this calendar date (one class per studio per day) */
function bookedStudiosOn(date){
  const out = {};
  /* correctness #10 — only claim a studio is taken when we actually know which studio it
     was. A guessed 'exhale' put a false "already booked today" caution on real classes. */
  ((bookings&&bookings.bookings)||[]).forEach(b=>{
    if(!b || b.date !== date) return;
    const st = studioOfBooking(b);
    if(st) out[st] = b;
  });
  return out;
}
/* another saved pick in the same studio on the same weekday */
function pickClash(c){
  return picks.find(p => p.studio===c.studio && p.day===c.day && p.time!==c.time &&
                         (!isOneOff(p) || pickDate(p)===c.date)) || null;
}

/* Every future timetable occurrence of a saved pick, soonest first. */
function pickOccurrences(p){
  const now = Date.now(), only = pickDate(p);
  return (timetable.classes||[])
    .filter(c => c && c.day===p.day && c.time===p.time && c.studio===p.studio &&
                 (!only || c.date===only) &&
                 new Date(c.start_iso).getTime() > now)
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}
/* correctness #11 — the bot locates a class by NAME SUBSTRING as well as slot, the UI
   only by slot. FIT rotates suffixes (BOLT (LB) -> BOLT (UB)), so a renamed class books in
   the UI's model and silently never books in the bot's, while the countdown ticks on. */
function pickNameDrift(p){
  if(!p || !p.name) return null;
  const want = String(p.name).toLowerCase();
  const bad = pickOccurrences(p).filter(c => String(c.name||'').toLowerCase().indexOf(want) < 0);
  return bad.length ? bad[0] : null;
}
/* Single source of truth shared by the hero and the Picks list, so the two can
   never disagree about the same pick. */
function pickState(p){
  const now = Date.now();
  const occ = pickOccurrences(p);
  /* correctness #10 — key on date|studio|TIME as well, so "the bot booked THIS class" can
     be told apart from "something else in this studio that day is blocking it". They mean
     opposite things to the user and only the first is a fulfilled pick. Bookings whose
     studio can't be established are ignored entirely rather than asserted. */
  const exact = {}, sameStudio = {};
  ((bookings&&bookings.bookings)||[]).forEach(b=>{
    if(!b || !b.date) return;
    const st = studioOfBooking(b);
    if(!st) return;
    sameStudio[b.date+'|'+st] = b;
    if(b.time) exact[b.date+'|'+st+'|'+b.time] = b;
  });
  let blocked = null;
  for(let i=0;i<occ.length;i++){
    const c = occ[i];
    if(exact[c.date+'|'+c.studio+'|'+c.time]) continue;   // the bot already won this one
    const other = sameStudio[c.date+'|'+c.studio];
    if(other){ if(!blocked) blocked = {cls:c, by:other}; continue; }
    const o = new Date(c.opens_iso).getTime();
    if(!isFinite(o)) continue;
    return {kind: o <= now ? 'open' : 'waiting', opens:o, cls:c};
  }
  if(blocked) return {kind:'blocked', opens:null, cls:blocked.cls, by:blocked.by};
  if(occ.length) return {kind:'booked', opens:null, cls:occ[0]};
  /* a one-off whose date has already gone — or is earlier today — is spent, not broken */
  if(isOneOff(p) && pickDate(p) <= sydToday()) return {kind:'expired', opens:null, cls:null};
  return {kind:'missing', opens:null, cls:null};
}

/* the soonest booking window among the OWNER'S PICKS — the hero */
function nextPickWindow(){
  if(heroCache && heroCache.at > Date.now() - 5000) return heroCache.v;
  const now = Date.now();
  let best = null;
  picks.forEach(p=>{
    let hit = null;
    pickOccurrences(p).forEach(c=>{
      const o = new Date(c.opens_iso).getTime();
      if(isFinite(o) && o > now && (!hit || o < hit.opens)) hit = {opens:o, cls:c, pick:p};
    });
    if(!hit){
      /* a one-off can only ever open on its own date — never project it forward */
      const o = isOneOff(p) ? oneOffOpensMs(p) : nextWindowMs(p);
      if(o !== null && o > now) hit = {opens:o, cls:null, pick:p};
    }
    if(hit && (!best || hit.opens < best.opens)) best = hit;
  });
  heroCache = {at:Date.now(), v:best};
  return best;
}

function weekHeadHTML(){

  const t = fmt12(c.time);

  const opensMs = new Date(c.opens_iso).getTime();
  const open = opensMs <= Date.now();
  const pk = pickFor(c);
  const picked = !!pk, once = picked && isOneOff(pk);
  const conflict = bookedStudios[c.studio];
  const clash = (picked || conflict || av.full) ? null : pickClash(c);

  let stTxt, stCls = '', stG = '';
  if(av.full){
    stTxt = av.label + (open ? '' : ' · opens ' + relTime(opensMs - Date.now()));
    stCls = 'bad';
  } else if(open){
    stTxt = 'Open now'; stCls = 'go'; stG = G.bolt;
  } else {
    const dt = opensMs - Date.now();
    stTxt = dt < 36*3600000 ? 'Opens in '+relTime(dt)
                            : 'Opens '+WD_SHORT[dowMon0(isoDateStr(c.opens_iso))]+' '+isoClock(c.opens_iso);
    stCls = 'amb'; stG = G.clock;

  const tail = (SLABEL[c.studio]||c.studio) + (staff ? ' · ' + staff : '');
  /* CONTRACT §5 gates Book on window-open + not-full only. A same-day booking in the
     same studio is a WARNING (bookings.json can be up to 8 hours stale), never a block. */
  const canBook = open && !av.full;

  return '<div class="crow'+(picked?' ispick':'')+(once?' once':'')+(av.full?' isfull':'')+'" data-bid="'+esc(c.bid)+'" id="row-'+esc(c.bid)+'">'+

        '<span>'+esc(SLABEL[c.studio]||c.studio)+' already booked today — FIT allows one per day</span></span></div>' : '')+
      (clash ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+

/* ── week paging ────────────────────────────────────────────── */
function stepWeek(delta){
  if(!weekStart) return;
  const next = clampWeek(addDays(weekStart, delta*7));
  const slide = $('#railslide');
  if(next === weekStart){
    if(slide){ slide.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
               slide.style.transform='translateX('+(delta>0?-10:10)+'px)';
               setTimeout(()=>{ slide.style.transform=''; setTimeout(()=>{ slide.style.transition=''; },320); },130); }
    return;
  }
  if(slide) slide.classList.add(delta > 0 ? 'out-l' : 'out-r');
  weekStart = next;
  setTimeout(()=>{
    renderBook();
    const s2 = $('#railslide');
    if(s2){
      s2.classList.add(delta > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
  }, slide ? 150 : 0);
}

/* ── Booked screen ──────────────────────────────────────────── */
/* correctness #10 — mirrors fitbot.booking_studio(), which deliberately returns None
   rather than guessing ("an unknown row must not block a real pick"). The old single
   guesser could never say "I don't know": every unclassifiable booking — a PT session, a
   renamed class — became a phantom "Exhale booked that day" that both suppressed a real
   exhale pick and claimed on screen that the bot had won it.
   `studioOfBooking` is the honest one and is what any CLAIM must use; `studioFromBooking`
   keeps the old always-answer behaviour for cosmetics (row dots) and cancel routing, where
   the bot matches on date+time anyway. */
function studioOfBooking(b){
  const s = (((b&&b.name)||'')+' '+((b&&b.location)||'')).toLowerCase();
  if(s.indexOf('reformer')>=0) return 'reformer';
  if(s.indexOf('sauna')>=0 || s.indexOf('nurture')>=0) return 'nurture';
  if(s.indexOf('cycle')>=0) return 'cycle';
  /* word-start match so a future class called "Core Crunch" isn't mapped to run */
  if(s.indexOf('bolt')>=0 || s.indexOf('afterburner')>=0 || /\brun/.test(s) || /\bwod\b/.test(s)) return 'run';
  if(/\b(exhale|yoga|pilates|barre|vinyasa|hatha|yin|meditation|stretch|mobility)\b/.test(s)) return 'exhale';
  return null;
}
function studioFromBooking(b){ return studioOfBooking(b) || 'exhale'; }
/* Resolve a Sydney wall-clock date+time to a real instant.
   A hard-coded +10:00 is wrong for half the year (AEDT is +11:00) and that error
   lands squarely on the free-cancel / strike boundary, so solve it against the same
   Intl formatter everything else uses instead of guessing the offset. */
function sydWallToMs(dateStr, hhmm){
  const a = String(dateStr).split('-').map(Number);
  const b = String(hhmm).split(':').map(Number);
  if(a.length < 3 || b.length < 2 || a.some(isNaN) || b.some(isNaN)) return null;
  let ms = Date.UTC(a[0], a[1]-1, a[2], b[0]-10, b[1]);   // seed at AEST, then correct
  let ok = false;
  for(let k=0;k<4;k++){
    const p = sydParts(new Date(ms));
    const drift = (Number(p.hour)*60 + Number(p.minute)) - (b[0]*60 + b[1]);
    if(!drift){ ok = true; break; }
    /* wrap a drift that crossed midnight (±23h) back into ±12h */
    const d = drift > 720 ? drift - 1440 : (drift < -720 ? drift + 1440 : drift);
    ms -= d * 60000;
  }
  /* correctness #19c — the hour skipped by spring-forward does not exist (2026-10-04
     02:30 has no instant). The loop used to give up and hand back 01:30, a plausible-
     looking wrong answer that would land on the free-cancel/strike boundary. Say null. */
  if(!ok || !isFinite(ms)) return null;
  return ms;
}
function bookingStartMs(b){
  if(!b.date || !b.time) return null;
  const c = (timetable.classes||[]).find(x => x.date===b.date && x.time===b.time);
  if(c && c.start_iso) return new Date(c.start_iso).getTime();
  /* no timetable match (e.g. half-hourly sauna slots) — resolve the offset properly */
  const sameDay = (timetable.classes||[]).find(x => x.date===b.date && x.start_iso);
  if(sameDay){
    const off = String(sameDay.start_iso).slice(-6);
    if(/^[+-]\d\d:\d\d$/.test(off)){
      const t = Date.parse(b.date+'T'+b.time+':00'+off);
      if(isFinite(t)) return t;
    }
  }
  return sydWallToMs(b.date, b.time);
}

const LOG_LOUD = {snipe_failed:1, snipe_skipped:1, snipe_late:1, snipe_rejected:1,
                  snipe_full:1, pick_bad_date:1, pick_unusable:1, picks_unreadable:1,
                  booknow_notfound:1, booknow_ambiguous:1};
const LOG_QUIET = {book_attempt:1, booknow:1};
function logVariant(kind, tone){
  if(LOG_LOUD[kind]) return 'lv-bad';
  if(LOG_QUIET[kind]) return '';
  if(tone === 'amber') return 'lv-warn';
  if(tone === 'go') return 'lv-good';
  return '';
}
function logDetail(e){
  if(e.pick) return e.pick.day+' '+fmt12(e.pick.time).full+' · '+(e.pick.name||SLABEL[e.pick.studio]||e.pick.studio||'');
  if(e.target){

    if(e.target.time) parts.push(fmt12(e.target.time).full);
    return parts.filter(Boolean).join(' · ');

  if(e.classes !== undefined) return e.classes+' classes · '+(e.bookings||0)+' bookings';
  if(e.result && e.result.verified !== undefined) return e.result.verified ? 'Verified' : 'Not verified';
  return '';
}
function logWhen(iso){
  const ds = isoDateStr(iso), today = sydToday();

}

  if(once) bits.push(once + (once===1?' one-off':' one-offs'));
  return bits.join(' · ');

function renderSetup(msg){
  $('#tabbar').classList.add('hidden');
  $('#tabfade').classList.add('hidden');
  $('#app').classList.add('setupmode');
  $('#app').classList.remove('dirty');
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-book').classList.add('active');
  /* One screen: a real FIT login — email + password, verified against the gym, refused if
     the gym refuses. There is no other way in. The paste-a-PAT fallback was removed when
     the app stopped holding any repo credential: a shared credential let anyone who had it
     write to anyone else's data, which is exactly what the Worker now prevents.
     F8 — enterkeyhint on both fields turns the generic iOS "return" key into next/Go; the
     keydown handlers below make them actually move on and submit. Without them the only
     way to submit was a button the keyboard was covering. */
  $('#w-book').innerHTML =
    '<div class="setup">'+
      '<div class="mark">'+G.mark+'</div>'+
      '<h1>FIT Booker</h1>'+
      '<p>Sign in with the email and password you use for the FIT app.</p>'+
      '<input type="email" id="loginemail" name="fitbooker-email" placeholder="Email" '+
        'autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" '+
        'inputmode="email" enterkeyhint="next">'+
      '<input type="password" id="loginpass" name="fitbooker-pass" placeholder="Password" '+
        'autocomplete="current-password" autocapitalize="off" autocorrect="off" '+
        'spellcheck="false" enterkeyhint="go">'+
      '<button class="btn filled" id="loginbtn" data-act="login" style="margin-top:12px">Sign in</button>'+
      '<div class="warn" id="loginwarn"'+(msg ? '' : ' style="display:none"')+'>'+
        (msg ? esc(msg) : '')+'</div>'+
    '</div>';
  const em = $('#loginemail'), pw = $('#loginpass');
  if(em && pw){
    em.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.focus(); }
    });
    pw.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.blur(); login(); }
    });
  }
  /* F8 — iOS does not resize the LAYOUT viewport for the keyboard in a standalone web
     app (only visualViewport shrinks), and #app is fixed to the layout viewport, so
     nothing reflowed and the submit button sat ~30px under the keyboard. Lift the setup
     block by the occluded height — the login form is two fields and a button, so it is
     occluded generously. */
  const vv = window.visualViewport;
  if(vv && !vv.__fitbookerBound){
    vv.__fitbookerBound = true;
    const fit = ()=>{
      const el = $('.setup'); if(!el) return;
      const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      el.style.paddingBottom = hidden ? (hidden + 12) + 'px' : '';
      if(hidden) el.scrollIntoView({block:'end'});
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }
  $('#navTitle').style.opacity = 0;
}
function doSignOut(){
  /* Tell the Worker to forget the session so a copied string is dead the moment the user
     signs out. Fire-and-forget on purpose: the local state must clear instantly even with
     no connection, and a failure here changes nothing this app can see. */
  try{ wapi('/logout', {}).catch(()=>{}); }catch(e){}
  signOut();
  lastDataJson = null;
  booted = false;
  stopPolling(); clearPostPoll(); syncing = false; syncStartedAt = 0;
  clearFlight();
  closeSheet();
  /* Everything in memory belongs to the member who just left — blank it, or the next
     person briefly sees the previous person's bookings behind the login screen. */
  timetable = {updated:null, classes:[]};
  bookings  = {updated:null, bookings:[]};
  logdata = []; picks = []; picksSha = null; savedPicksJson = '[]';
  renderSetup('');
}

function loginWarn(m){
  const w = $('#loginwarn'); if(!w) return;
  w.textContent = m || '';
  w.style.display = m ? '' : 'none';
}

/* Real sign-in. The Worker attempts an actual login against the FIT portal with what was
   typed: if the gym rejects it, the app rejects it. There is no local "password" to get
   wrong, and no way in without a working FIT account. On success it returns which member
   this is plus an opaque session — never a credential this app could misuse. */
async function login(){
  const em = $('#loginemail'), pw = $('#loginpass'), btn = $('#loginbtn');
  if(!em || !pw) return;
  const email = em.value.trim(), password = pw.value;
  if(!email || !password){ loginWarn('Enter your email and password'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  loginWarn('');
  /* A hung request must not leave the button stuck on "Signing in…" forever. */
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const kill = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, 25000);
  try {
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + '/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
      signal: ctl ? ctl.signal : undefined
    });
    let d = null;
    try { d = await r.json(); } catch(e){}
    if(!d || !d.ok || !d.session){
      loginWarn((d && d.error) || 'Could not sign in right now — try again');
      return;
    }
    session = d.session;
    USER = d.user || 'josh';
    USERNAME = d.name || '';
    /* a fresh sign-in must not inherit the last member's cached payload */
    lastDataJson = null;
    try {
      localStorage.setItem('fitbooker_session', session);
      localStorage.setItem('fitbooker_user', USER);
      localStorage.setItem('fitbooker_name', USERNAME);
    } catch(e){ toast('This browser blocked local storage'); }
    /* The password itself is never stored on the phone — only the Worker keeps it, and
       only because it proved valid a moment ago. */
    pw.value = '';
    enterApp();
  } catch(e){
    loginWarn(String(e && e.name) === 'AbortError'
      ? 'That took too long — check your connection and try again'
      : 'Could not reach the sign-in service — check your connection');
  } finally {
    clearTimeout(kill);
    if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}

function enterApp(){
  $('#tabbar').classList.remove('hidden');
  $('#tabfade').classList.remove('hidden');
  $('#app').classList.remove('setupmode');
  $('#w-book').innerHTML = '<div class="ltitle">Book</div><div class="emptystate"><div class="es">Connecting…</div></div>';
  loadAll().then(()=>{ startPolling(); if(isStale()) autoSync(); });

function layoutDiag(){
  const bar = document.querySelector('.tabbar');
  const r = bar ? bar.getBoundingClientRect() : null;
  const cs = getComputedStyle(document.documentElement);
  const vv = window.visualViewport;
  const standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const rows = [
    ['mode', standalone ? 'standalone (home screen)' : 'browser tab'],
    ['screen', screen.width + ' x ' + screen.height],
    ['innerHeight', String(window.innerHeight)],
    ['visualViewport', vv ? Math.round(vv.height) + ' (offsetTop ' + Math.round(vv.offsetTop) + ')' : 'n/a'],
    ['100dvh measures', (function(){
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100dvh;visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      var h = Math.round(d.getBoundingClientRect().height);
      d.remove();
      return h + 'px' + (h !== window.innerHeight ? '  <-- MISMATCH' : '');
    })()],
    ['safe-area TOP', cs.getPropertyValue('--sat').trim() || '0px'],
    ['safe-area bottom', cs.getPropertyValue('--sab').trim() || '0px'],
    ['doc clientHeight', String(document.documentElement.clientHeight)],
    ['outerHeight', String(window.outerHeight)],
    ['missing vs screen', (screen.height - window.innerHeight) + 'px'],
    ['reserved (--tabpadref)', cs.getPropertyValue('--tabpadref').trim() || 'n/a'],
    ['tab bar top', r ? Math.round(r.top) + 'px' : 'n/a'],
    ['tab bar bottom', r ? Math.round(r.bottom) + 'px' : 'n/a'],
    ['gap below bar', r ? Math.round(window.innerHeight - r.bottom) + 'px' : 'n/a'],
  ];
  return '<div class="rulerow"><div class="rt"><b>Layout diagnostics</b><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;display:block">' +
    rows.map(function(x){ return x[0] + ': <b>' + x[1] + '</b>'; }).join('<br>') +

}

/* ════════════════════════════════════════════════════════════════
   Actions (every destructive/committing action confirms)
   ════════════════════════════════════════════════════════════════ */
async function bookNow(bid, fromSheet){
  const c = findClass(bid); if(!c) return;
  const t = fmt12(c.time);
  const conflict = bookedStudiosOn(c.date)[c.studio];
  const choice = await actionSheet({
    title: 'Book ' + (c.name || c.studio) + '?',
    message: longDate(c.date) + ' at ' + t.full + ' · ' + (SLABEL[c.studio]||c.studio) +
             '\nThis books immediately on your FIT account.' +
             (conflict ? '\nHeads up: you already have ' + (SLABEL[c.studio]||c.studio) +
                         ' booked that day. FIT allows one class per studio per day, so this may be refused.' : ''),
    actions: [{label: conflict ? 'Book Anyway' : 'Book Now', style:'default'}]
  });
  if(choice !== 0){ if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }
  try{
    /* correctness #2 — `date` pins the occurrence. Without it the bot resolves the
       (day,time,studio) triple to the SOONEST future match, and the two-week timetable
       makes every triple ambiguous: for the first hour after a window opens that is LAST
       week's slot repeating today, i.e. a class starting within the hour that he never
       asked for. A no-show there is a strike, and cancelling it is also a strike.
       booknow.yml already declares a `date` input (it is used for cancel), so sending it
       is safe whether or not the bot-side patch has landed. */
    await dispatch('booknow.yml', {day:c.day, time:c.time, studio:c.studio, date:c.date});
    beginFlight('Booking… the Booked tab updates in about a minute.');
  }catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
}

async function cancelBooking(i){
  const list = ((bookings&&bookings.bookings)||[]).slice()
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.time||'').localeCompare(String(b.time||'')));
  const b = list[i]; if(!b) return;
  const startMs = bookingStartMs(b);
  /* correctness #3 — judge against the instant the BOT will POST, not against now */
  const atRun = startMs ? (startMs - (Date.now() + CANCEL_LATENCY_MS)) : null;
  const late  = atRun !== null && atRun < 3600000;
  /* correctness #10 — the studio we send is a guess when the name/location don't say */
  const knownStudio = studioOfBooking(b);
  const choice = await actionSheet({
    title: 'Cancel ' + (b.name||'this booking') + '?',
    message: (b.date_raw || shortDate(b.date)) + ' at ' + (b.time_raw || fmt12(b.time).full) +
      (startMs === null
        ? '\nCancelling within 1 hour of the class counts as a strike. 3 strikes in 7 days = a 7-day ban.'
        : (late ? '\nThe bot takes about a minute to reach FIT and that lands inside the last hour — this WILL count as a strike. Cancel in the FIT app instead if you can. 3 strikes in 7 days = a 7-day ban.'
                : '\nFree cancel: the bot will reach FIT more than 1 hour before the class.')) +
      (knownStudio ? '' : '\nThe studio for this booking isn’t obvious from its name, so the bot matches on date and time.'),
    actions: [{label: late ? 'Cancel Anyway (strike)' : 'Cancel Booking', style:'destructive'}],
    cancelLabel:'Keep Booking'
  });
  if(choice !== 0) return;
  try{
    await dispatch('booknow.yml', {day:'MON', time:b.time, studio:studioFromBooking(b), action:'cancel', date:b.date});
    beginFlight('Cancelling… this list refreshes in about a minute.');
  }catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
}

/* Manual sync is now a fallback, not the primary path — the poller and the
   staleness check drive refresh.yml on their own. */
async function syncNow(){
  reapSync();                     // F2 — a stale latch must never block a manual sync
  if(syncing){ toast('Already syncing — new data lands in about a minute.', 2600); return; }
  const now = Date.now(), last = lastDispatchMs();
  if(now - last < DISPATCH_MIN){
    loadAll(true);
    toast('Synced '+ageShort(now - last).replace(' ago','')+' ago — data reloaded.', 2600);
    return;
  }
  autoBusy = true;
  markDispatch(now);              // F3
  syncBaseline = dataUpdatedMs();
  try{
    await dispatch('refresh.yml');
    syncing = true; syncStartedAt = Date.now(); updateFresh();
    beginFlight('Syncing with FIT — new data in about a minute.', 78000);
    pollAfterDispatch();
  }catch(e){ syncing = false; syncStartedAt = 0; updateFresh(); if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
  finally{ autoBusy = false; }
}

function switchTab(t){
  if(t === activeTab) return;
  const cur = $('#page-'+activeTab);
  if(cur) scrollMemo[activeTab] = cur.scrollTop;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $$('.tabbtn').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===t)));
  activeTab = t;
  const next = $('#page-'+activeTab);
  next.classList.add('active');
  void next.offsetHeight;
  next.scrollTop = scrollMemo[activeTab] || 0;
  updateNav();
}

function updateNav(){
  const page = $('#page-'+activeTab);
  const st = page ? page.scrollTop : 0;
  const p = clamp((st - 8) / 30, 0, 1);
  const el = $('#navTitle');
  el.style.opacity = p;
  el.style.transform = 'translateY('+(9*(1-p))+'px)';
  el.textContent = (activeTab==='book' && selDate) ? relDayLabel(selDate) : NAV_TITLES[activeTab];
  $('#app').classList.toggle('scrolled', st > 8);
}

let navTick = false;
$$('.page').forEach(p=>{

function setDay(date, dir){
  if(!date || date === selDate) return;
  const slide = $('#dayslide');
  if(slide && dir) slide.classList.add(dir > 0 ? 'out-l' : 'out-r');
  selDate = date;
  weekStart = clampWeek(mondayOf(date));   // the strip follows the day, one week at a time
  setTimeout(()=>{
    renderBook();
    const s2 = $('#dayslide');
    if(s2 && dir){
      s2.classList.add(dir > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
    updateNav();
  }, dir ? 165 : 0);
}
function stepDay(delta){
  if(!allDates.length) return;
  const i = allDates.indexOf(selDate);
  if(i < 0) return;
  const j = i + delta;
  if(j < 0 || j >= allDates.length){
    const s = $('#dayslide');
    if(s){ s.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
           s.style.transform='translateX('+(delta>0?-12:12)+'px)';
           setTimeout(()=>{ s.style.transform=''; setTimeout(()=>{ s.style.transition=''; },320); },130); }
    return;
  }
  setDay(allDates[j], delta);
}

/* ════════════════════════════════════════════════════════════════
   Gestures (§4) — one axis-locked handler per scrollable tab:
     vertical intent at scrollTop ≤ 0 → pull to refresh
     horizontal intent on the strip   → previous / next week
     horizontal intent anywhere else  → previous / next day (Book only)
   ════════════════════════════════════════════════════════════════ */
const PTR_TRIGGER = 66;      // finger travel that arms the refresh
const PTR_MAX     = 116;
let ptrBusy = false;

function ptrSet(dist, ready){
  const el = $('#ptr'); if(!el) return;
  const ring = el.firstElementChild; if(!ring) return;
  const d = clamp(dist, 0, PTR_MAX);
  const p = Math.min(1, d / PTR_TRIGGER);
  el.classList.remove('anim','spinning');
  el.classList.toggle('ready', !!ready);
  ring.style.opacity = String(Math.min(1, p * 1.3));
  ring.style.transform = 'translateY('+(d*0.6)+'px) scale('+(0.7 + 0.3*p)+') rotate('+(d*3.4)+'deg)';
}
function ptrEnd(spinning){
  const el = $('#ptr'); if(!el) return;
  const ring = el.firstElementChild; if(!ring) return;
  el.classList.add('anim');
  el.classList.remove('ready');
  if(spinning){
    el.classList.add('spinning');
    ring.style.opacity = '1';
    ring.style.transform = 'translateY(42px) scale(1) rotate(0deg)';
  }else{
    el.classList.remove('spinning');
    ring.style.opacity = '0';
    ring.style.transform = 'translateY(0) scale(.7) rotate(0deg)';
  }
}
async function pullRefresh(){
  if(ptrBusy) return;
  ptrBusy = true;
  ptrEnd(true);
  let fired = false, reloaded = false;
  try{
    fired = await autoSync(true);      // a REAL refresh.yml dispatch (still ≤1 per 5 min)
    reloaded = await loadAll(true);    // …plus an immediate re-read of the data files
  }catch(e){}
  /* F22 — never claim "Up to date" for a refresh that was debounced away behind a hung
     fetch: that is the exact moment the user is pulling BECAUSE it looks stuck. */
  if(!fired && !syncing){
    if(reloaded) toast(loadError ? 'Still offline — showing the cached view' : 'Up to date', 1800);
    else toast('Still loading…', 1500);
  }
  setTimeout(()=>{ ptrBusy = false; ptrEnd(false); }, 700);
}

function attachGestures(page, daySwipe){
  let sx=0, sy=0, locked=null, active=false, onRail=false, onChips=false, edgeStart=false;
  /* F4 — undo every visual side effect a partial gesture left behind. A second finger, a
     touchcancel the system raises for you (call banner, Control Centre, Reachability, the
     edge swipe) or a sheet opening mid-drag all used to strand #dayslide translated and
     faded, or the PTR ring frozen mid-pull at a random rotation, until another gesture
     happened to complete. touchstart cleared `active` before deciding whether it cared,
     and `end` then refused to clean up because `active` was already false. */
  function resetGestureVisuals(){
    const rs = $('#railslide'), ds = $('#dayslide');
    [rs,ds].forEach(s=>{ if(s){ s.classList.remove('drag'); s.style.transform=''; s.style.opacity=''; } });
    if(locked === 'ptr' && !ptrBusy) ptrEnd(false);
  }
  page.addEventListener('touchstart', e=>{
    if(active) resetGestureVisuals();      // a re-entrant touchstart aborts the old gesture
    locked = null; active = false;
    if(e.touches.length !== 1 || sheetOpen() || ptrBusy) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    onRail  = !!(e.target.closest && (e.target.closest('.rail') || e.target.closest('.weekhead')));
    onChips = !!(e.target.closest && e.target.closest('.chips'));
    /* F20 — iOS standalone web apps ship a system back/forward edge swipe authors cannot
       disable (w3c/manifest#1041). A horizontal gesture begun in the edge strip is claimed
       by the system and we get a touchcancel; refuse it outright so the failure is a clean
       no-op rather than a half-animated abort. */
    edgeStart = (sx <= 24 || sx >= (page.clientWidth - 24));
    active = true;
  }, {passive:true});

  page.addEventListener('touchmove', e=>{
    if(!active) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(locked === null){
      /* axis lock: horizontal wins only on clear horizontal intent */
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){
        locked = (onChips || edgeStart) ? 'none' : ((onRail || daySwipe) ? 'x' : 'none');   // F20
      } else if(dy > 9 && dy > Math.abs(dx) * 1.4 && page.scrollTop <= 0){
        locked = 'ptr';
      } else if(Math.abs(dy) > 9){
        locked = 'y';                       // ordinary scrolling — hands off
      }
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      const s = onRail ? $('#railslide') : $('#dayslide');
      if(s){
        s.classList.add('drag');
        s.style.transform = 'translateX('+(dx*(onRail?0.28:0.32))+'px)';
        s.style.opacity = String(1 - Math.min(0.5, Math.abs(dx)/420));
      }
    } else if(locked === 'ptr'){
      /* F5 — the finger came back above where it started: the user changed their mind and
         wants to scroll. Hand the gesture back. Waiting for scrollTop>0 could never happen,
         because we are the reason it cannot scroll — 215px of upward travel stayed
         preventDefault()ed, which reads as a frozen app. */
      if(dy <= 0 || page.scrollTop > 0){ locked = 'y'; ptrEnd(false); return; }
      if(e.cancelable) e.preventDefault();
      ptrSet(dy, dy >= PTR_TRIGGER);
    }
  }, {passive:false});

  const end = e=>{
    /* F4 — always clean up, even for a gesture we already disowned: an orphaned transform
       or a frozen PTR ring is far worse than an ignored swipe */
    const wasActive = active; active = false;
    resetGestureVisuals();
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const was = locked; locked = null;
    if(!wasActive || !t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(was === 'x'){
      if(onRail){ if(dx < -44) stepWeek(1); else if(dx > 44) stepWeek(-1); }
      else if(daySwipe){ if(dx < -56) stepDay(1); else if(dx > 56) stepDay(-1); }
    } else if(was === 'ptr'){
      if(dy >= PTR_TRIGGER) pullRefresh(); else ptrEnd(false);
    }
  };
  page.addEventListener('touchend', end, {passive:true});
  page.addEventListener('touchcancel', end, {passive:true});
}
attachGestures($('#page-book'), true);
attachGestures($('#page-booked'), false);
attachGestures($('#page-picks'), false);

/* F12 — the .grabber pill is *the* iOS "drag me down to dismiss" affordance and every
   sheet drew one, but none of them could be dragged. Combined with body{overscroll-
   behavior:none} there was not so much as a wiggle for feedback, which reads as frozen. */
(function attachSheetDismiss(){
  const root = $('#sheetRoot');
  let sy = 0, dragging = false, sh = null, scrimEl = null;
  root.addEventListener('touchstart', e=>{
    dragging = false;
    if(e.touches.length !== 1) return;
    sh = e.target.closest && e.target.closest('.sheet'); if(!sh) return;
    const sc = e.target.closest('.sheet-scroll');
    if(sc && sc.scrollTop > 0) return;             // let an inner scroller scroll first
    scrimEl = $('.scrim', root);
    sy = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  root.addEventListener('touchmove', e=>{
    if(!dragging || !sh) return;
    const dy = e.touches[0].clientY - sy;
    if(dy <= 0) return;
    if(e.cancelable) e.preventDefault();
    sh.style.transition = 'none';
    sh.style.transform = 'translateY('+dy+'px)';
    if(scrimEl) scrimEl.style.opacity = String(Math.max(0, 1 - dy/420));
  }, {passive:false});
  const settle = e=>{
    if(!dragging || !sh) return; dragging = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dy = t ? t.clientY - sy : 0;
    sh.style.transition = ''; sh.style.transform = '';
    if(scrimEl) scrimEl.style.opacity = '';
    if(dy > 110) closeSheet();
  };
  root.addEventListener('touchend', settle, {passive:true});
  root.addEventListener('touchcancel', settle, {passive:true});
})();

function jumpToClass(date, bid){
  const go = ()=>{
    const row = document.getElementById('row-'+bid);
    const page = $('#page-book');
    if(row && page){
      const y = row.getBoundingClientRect().top - page.getBoundingClientRect().top + page.scrollTop;
      page.scrollTop = Math.max(0, y - 200);
      row.classList.add('flash');
      setTimeout(()=>row.classList.remove('flash'), 1700);

  if(studioFilter !== 'all'){ studioFilter = 'all'; }
  if(date !== selDate){ selDate = date; weekStart = clampWeek(mondayOf(date)); renderBook(); setTimeout(go, 60); }
  else { renderBook(); setTimeout(go, 60); }
}

async function handlePickToggle(bid, btn){
  const c = findClass(bid); if(!c) return;
  const existing = pickFor(c);

  if(existing){
    const wasOnce = isOneOff(existing);
    removePick(existing.day, existing.time, existing.studio, pickDate(existing));
    toast(wasOnce ? 'One-off pick removed' : 'Weekly pick removed', 1800);
    rerenderBook();
    safeRender('picks', renderPicks);
    return;
  }

  const opensMs = new Date(c.opens_iso).getTime();
  const open = isFinite(opensMs) && opensMs <= Date.now();
  let once = false;
  /* correctness #15 — ALWAYS ask. This branch used to be skipped whenever the window had
     already opened, which turned one tap on today's class into a RECURRING FOREVER pick,
     disclosed only by a 2.2s toast. Every following week the bot books a class he never
     asked for; two absences plus any third strike in the same rolling week is a 7-day ban.
     When the window is already open a one-off would book nothing extra, so say that rather
     than silently choosing weekly on his behalf. */
  const choice = await actionSheet({
    title: (c.name || c.studio),
    message: longDate(c.date)+' · '+fmt12(c.time).full+' · '+(SLABEL[c.studio]||c.studio)+
             '\nHow should the bot book this?'+
             (open ? '\nThis one is already open — use Book to take it now.' : ''),
    actions: open
      ? [{label:'Auto-book every '+c.day+' from next week', style:'default'}]
      : [{label:'Auto-book every '+c.day, style:'default'},
         {label:'Auto-book just '+shortDate(c.date)}]
  });
  if(choice === 0) once = false;
  else if(choice === 1 && !open) once = true;
  else return;

  addPick(c.day, c.time, c.studio, c.name, once ? c.date : null);
  toast(once ? 'One-off pick added for '+shortDate(c.date)
             : 'Weekly pick added — every '+c.day+', until you remove it', 3000);
  const clash = pickClash(c);
  if(clash) toast('Heads up: you already pick '+fmt12(clash.time).full+' '+(SLABEL[c.studio]||c.studio)+
                  ' on '+c.day+' — FIT allows one per studio per day', 4200);
  rerenderBook();
  safeRender('picks', renderPicks);
}

document.addEventListener('click', function(e){
  const T = sel => e.target.closest(sel);

  const tab = T('.tabbtn'); if(tab){ switchTab(tab.dataset.tab); return; }

  const dcell = T('[data-date][data-act="jump"]');
  if(dcell){ jumpToClass(dcell.dataset.date, dcell.dataset.bid); return; }

  const wk = T('[data-week]'); if(wk){ stepWeek(Number(wk.dataset.week)); return; }

  const dc = T('.dcell[data-date]');
  if(dc){
    if(dc.classList.contains('past')) return;      // a past day is never selectable
    const d = dc.dataset.date; setDay(d, d > selDate ? 1 : -1); return;
  }

  const chip = T('[data-studio]'); if(chip){
    studioFilter = chip.dataset.studio;
    $$('.chip').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.studio===studioFilter)));
    const slide = $('#dayslide');
    if(slide) slide.style.opacity = '.3';
    const chips = $('#chips'); const cs = chips ? chips.scrollLeft : 0;
    setTimeout(()=>{ renderBook(); const c2 = $('#chips'); if(c2) c2.scrollLeft = cs; }, 100);
    return;
  }

  const bk = T('[data-book]'); if(bk){ bookNow(bk.dataset.book, false); return; }

  const pt = T('[data-pick]'); if(pt){ handlePickToggle(pt.dataset.pick, pt); return; }

  const rm = T('[data-remove]'); if(rm){
    const a = rm.dataset.remove.split('|');
    removePick(a[0], a[1], a[2], a[3] || '');
    safeRender('picks', renderPicks);
    rerenderBook();
    return;
  }
  const cn = T('[data-cancel]'); if(cn){ cancelBooking(Number(cn.dataset.cancel)); return; }

  const act = T('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a === 'sync'){ if(sheetOpen()) closeSheet(); syncNow(); }
    else if(a === 'snipe') firePass();
    else if(a === 'login') login();
    else if(a === 'signout') doSignOut();
    else if(a === 'reload') loadAll();
    else if(a === 'goBook') switchTab('book');
    else if(a === 'goPicks') switchTab('picks');
    else if(a === 'close') closeSheet();
    else if(a === 'booknow'){ closeSheet(); setTimeout(()=>bookNow(act.dataset.bid, true), 200); }
    else if(a === 'togglepick' || a === 'toggleonce'){
      const c = findClass(act.dataset.bid);
      if(c){
        const date = (a === 'toggleonce') ? c.date : null;
        const on = togglePick(c.day, c.time, c.studio, c.name, date);
        act.setAttribute('aria-checked', String(on));
        /* a weekly pick already covers this date — drop a redundant one-off */
        if(a === 'togglepick' && on) removePick(c.day, c.time, c.studio, c.date);
        safeRender('picks', renderPicks);
        rerenderBook();
        const sib = $('[data-act="'+(a==='togglepick'?'toggleonce':'togglepick')+'"][data-bid="'+c.bid+'"]');
        if(sib) sib.setAttribute('aria-checked', String(pickIndex(c.day,c.time,c.studio, a==='togglepick'?c.date:'') >= 0));
      }
    }
    return;
  }

  const row = T('.crow[data-bid]'); if(row){ openClassSheet(row.dataset.bid); return; }
}, false);

/* ── safe-area top backstop ─────────────────────────────────────
   Under the iOS 26/27 standalone regression env(safe-area-inset-top) reports 0, which
   silently removes the .navbar's Dynamic Island clearance and puts the Info button under
   the Island. Nothing in CSS can detect that, so measure it.

   Deliberately narrow, so it cannot misfire:
     • only when the RESOLVED --sat really is 0 (a healthy device keeps its own value);
     • only in standalone display mode (in a browser tab the missing height is Safari's
       own toolbars, not an inset — treating those as a top inset would wreck the layout);
     • only when the window is 40–200px shorter than the physical screen, which is the
       signature of the regression on a notched device and not of anything else.
   Re-measured on rotate/resize because screen and window swap axes.                    */
function fixSafeAreaTop(){
  try{
    const root = document.documentElement;
    root.style.removeProperty('--sat');            // re-measure the stylesheet's own value
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:var(--sat);' +
                          'visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    const measured = probe.getBoundingClientRect().height;
    probe.remove();
    if(measured > 0) return;                       // env() works here — leave it alone
    const standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(!standalone) return;
    const missing = (window.screen && window.screen.height ? window.screen.height : 0) -
                    window.innerHeight;
    if(missing >= 40 && missing <= 200) root.style.setProperty('--sat', missing + 'px');
  }catch(e){}
}

/* Under the same regression the web view ends ~62px above the physical bottom, which means
   the home indicator sits in the dead strip OUTSIDE the viewport — so reserving room for it
   inside the tab bar strands the icons even higher for no benefit. Reclaim it. Self-undoing:
   the property is removed and re-decided on every call. */
function fixBottomInset(){
  try{
    const root = document.documentElement;
    root.style.removeProperty('--tabpadref');
    const standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(!standalone) return;
    const missing = (window.screen && window.screen.height ? window.screen.height : 0) -
                    window.innerHeight;
    if(missing >= 40 && missing <= 200) root.style.setProperty('--tabpadref', '2px');
  }catch(e){}
}
fixBottomInset();
/* Re-run rather than latch: every call first REMOVES its own inline value and re-measures,
   so the moment env() starts reporting a real inset the override is dropped again. Run once
   now (before first paint) and again after load, in case styles resolve late. */
fixSafeAreaTop(); fixBottomInset();
window.addEventListener('load', fixSafeAreaTop);
setTimeout(fixSafeAreaTop, 400);
window.addEventListener('resize', fixSafeAreaTop);
window.addEventListener('orientationchange', ()=> setTimeout(fixSafeAreaTop, 250));

/* ── boot ───────────────────────────────────────────────────── */
(function boot(){
  try{
    if(!session){ renderSetup(''); return; }
    $('#w-book').innerHTML = '<div class="ltitle">Book</div>'+
      '<div class="emptystate"><div class="es">Loading your timetable…</div></div>';
    /* §3: load, then let the staleness check dispatch a real FIT sync by itself */
    loadAll().then(()=>{ startPolling(); if(isStale()) autoSync(); });
  }catch(e){
    try{ $('#w-book').innerHTML = errorBlock(e); }catch(x){}
  }
})();
</script>
<script>
/* Network-first service worker. Two reasons: (1) the NRL Tips app on the same phone
   registers one and renders full height, making this one of three structural differences
   under test; (2) it independently fixes the offline cold-launch, which today is a WebKit
   error page with no reload button. Network-first, never cache-first — a cache-first worker
   is what pins a home-screen app to a stale build, and this app ships often. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
