<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FIT Booker">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>FIT Booker</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   FIT Booker — single-file iOS-native controller for the booking bot

   Colour has one job each:
     ink    → you act now      (Book, Save, selected day)
     amber  → the bot acts later (picks, countdowns, windows)
     green  → open / free
     red    → full / blocked / destructive
     studio hues → identification only, small and always labelled
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* safe-area insets, exposed as custom properties so they are testable */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);

  --navh:44px;
  --tabh:52px;
  --gx:16px;
  --pl: calc(var(--gx) + var(--sal));
  --pr: calc(var(--gx) + var(--sar));

  /* warm neutral scale */
  --bg:#F3F3F0;
  --bg0:rgba(243,243,240,0);
  --card:#FFFFFF;
  --card2:#EAEAE5;
  --ink:#101113;
  --ink2:#5B6067;
  --ink3:#6E747C;
  --hair:rgba(18,20,24,.15);
  --hair2:rgba(18,20,24,.10);
  --fill:rgba(18,20,24,.055);
  --fill2:rgba(18,20,24,.10);
  --barbg:rgba(243,243,240,.94);
  --tabbg:rgba(243,243,240,.965);
  --sheet:#FFFFFF;
  --scrim:rgba(14,16,18,.34);
  --shadow:0 1px 2px rgba(12,14,18,.05),0 8px 22px -14px rgba(12,14,18,.30);

  /* the one variable pair that flips every primary button between themes */
  --btn-ink:#141618;
  --btn-on:#FFFFFF;

  /* semantic */
  --amber:#A76A00;      --amber-bg:#F8EFDB;   --amber-rail:#D08A11;
  --go:#0B7A45;         --go-bg:#E1F2E8;
  --bad:#B02318;        --bad-bg:#FAE6E3;

  /* ink laid ON a saturated tile — never assume #fff, it fails on amber */
  --tile-ink:#FFFFFF;   --on-amber:#26190A;

  /* studios — identification only */
  --s-exhale:#6D4BE0;
  --s-reformer:#0E7C74;
  --s-run:#C2410C;
  --s-cycle:#2563C9;
  --s-nurture:#A03A6E;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0C0D;
    --bg0:rgba(11,12,13,0);
    --card:#17191B;
    --card2:#222528;
    --ink:#F2F3F4;
    --ink2:#A2A8B0;
    --ink3:#767C85;
    --hair:rgba(255,255,255,.13);
    --hair2:rgba(255,255,255,.08);
    --fill:rgba(255,255,255,.075);
    --fill2:rgba(255,255,255,.14);
    --barbg:rgba(12,13,15,.92);
    --tabbg:rgba(10,11,13,.955);
    --sheet:#1B1D20;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.5);

    --btn-ink:#F2F3F4;
    --btn-on:#0B0C0D;

    --amber:#F2B441;    --amber-bg:#2D2412;   --amber-rail:#F2B441;
    --go:#3ED884;       --go-bg:#0F2A1C;
    --bad:#FF7B6C;      --bad-bg:#2E1614;

    /* dark semantics are BRIGHT fills — white glyphs on them read at ~1.9:1 */
    --tile-ink:#0B0C0D; --on-amber:#26190A;

    --s-exhale:#AF9CFF;
    --s-reformer:#3ED8C6;
    --s-run:#FF8C4B;
    --s-cycle:#7FADFF;
    --s-nurture:#E88ABF;
  }
}
@media (max-width:359px){ :root{ --gx:12px } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100%;height:100%;overflow-x:hidden;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
svg{display:block;flex:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.hidden{display:none !important}

#app{position:fixed;inset:0;overflow:hidden;max-width:100%}

/* ── nav bar (translucent material) ──────────────────────────── */
.navbar{
  position:absolute;top:0;left:0;right:0;z-index:60;
  padding-top:var(--sat);
  background:var(--barbg);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
}
.navbar::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;
  background:var(--hair);opacity:0;transition:opacity .2s ease;
}
#app.scrolled .navbar::after{opacity:1}
.nav-inner{
  height:var(--navh);display:flex;align-items:center;position:relative;
  padding-left:calc(8px + var(--sal));padding-right:calc(8px + var(--sar));
  max-width:592px;margin:0 auto;
}
.nav-title{
  position:absolute;left:calc(56px + var(--sal));right:calc(56px + var(--sar));text-align:center;
  font-size:16px;font-weight:650;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(9px);
  transition:opacity .22s ease,transform .22s ease;pointer-events:none;
}
.nav-title .cd{color:var(--amber);font-variant-numeric:tabular-nums}
.nav-spacer{flex:1;min-width:0}
.navbtn{
  width:44px;height:44px;flex:none;border-radius:22px;
  display:flex;align-items:center;justify-content:center;color:var(--ink2);
}
.navbtn:active{opacity:.4}
.navbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.flightbar{position:absolute;left:0;right:0;bottom:-2px;height:2px;overflow:hidden;display:none;pointer-events:none}
.flightbar.on{display:block}
.flightbar i{
  position:absolute;inset:0;display:block;
  background:linear-gradient(90deg,transparent,var(--amber-rail),transparent);
  transform:translateX(-100%);animation:flight 1.5s cubic-bezier(.45,0,.25,1) infinite;
}
@keyframes flight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ── pages ───────────────────────────────────────────────────── */
#pages{position:absolute;inset:0;overflow:hidden}
.page{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  display:none;
}
.page.active{display:block}
.page::-webkit-scrollbar{width:0;height:0}
#app.dirty .wrap{padding-bottom:calc(var(--sab) + var(--tabh) + 104px)}
.wrap{
  max-width:592px;margin:0 auto;width:100%;min-width:0;
  padding-top:calc(var(--sat) + var(--navh));
  padding-bottom:calc(var(--sab) + var(--tabh) + 58px);
}

.ltitle{
  font-size:30px;line-height:35px;font-weight:760;letter-spacing:-.7px;
  padding:0 var(--pr) 0 var(--pl);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lsub{
  font-size:13.5px;color:var(--ink2);letter-spacing:-.1px;font-weight:500;
  padding:3px var(--pr) 0 var(--pl);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ── grouped inset lists (one list idiom everywhere) ─────────── */
.ghead{
  font-size:11.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  padding:16px calc(var(--pr) + 4px) 7px calc(var(--pl) + 4px);min-width:0;
  display:flex;align-items:baseline;gap:8px;
}
.ghead.tight{padding-top:9px}
.ghead .gh-r{margin-left:auto;font-weight:600;letter-spacing:.04em;color:var(--ink3);flex:none}
.group{
  background:var(--card);border-radius:16px;overflow:hidden;
  margin-left:var(--pl);margin-right:var(--pr);min-width:0;
  box-shadow:var(--shadow);
}
.gfoot{
  font-size:12.5px;line-height:17px;color:var(--ink3);letter-spacing:-.05px;
  padding:8px calc(var(--pr) + 4px) 0 calc(var(--pl) + 4px);min-width:0;
}
.gfoot .ig{display:inline-flex;vertical-align:-2px;color:var(--amber)}
.spacer{height:16px}

/* generic row */
.row{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 13px;min-height:60px;position:relative;min-width:0;
}
.row + .row::before,.row + .rulerow::before,.rulerow + .row::before{
  content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2);
}
.row.tapme{transition:background-color .12s ease}
.row.tapme:active{background:var(--fill)}
.rbody{flex:1;min-width:0}
.rtitle{font-size:16.5px;font-weight:600;letter-spacing:-.3px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--ink2);margin-top:2px;min-width:0;
  display:flex;align-items:center;gap:6px;letter-spacing:-.05px}
.rsub .txt{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink3);flex:none}

/* ── countdown hero ──────────────────────────────────────────── */
.hero{
  display:block;width:100%;text-align:left;position:relative;min-width:0;overflow:hidden;
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:9px 40px 10px 17px;
  transition:transform .15s ease;
}
.herowrap{padding:7px var(--pr) 0 var(--pl);min-width:0}
.alertline{
  display:flex;align-items:center;gap:9px;width:100%;min-width:0;margin-top:6px;
  min-height:46px;padding:0 12px 0 14px;border-radius:14px;
  background:var(--go-bg);color:var(--go);text-align:left;
}
.alertline > span:first-of-type{flex:1;min-width:0;font-size:13.5px;font-weight:650;letter-spacing:-.15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alertline .ac{flex:none;opacity:.55}
.alertline:active{opacity:.6}
.hero:active{transform:scale(.99)}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber-rail)}
.hero.go::before{background:var(--go)}
.hero.none::before{background:var(--ink3);opacity:.5}
.hk{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hbig{display:block;font-size:30px;line-height:34px;font-weight:780;letter-spacing:-.045em;color:var(--amber);
  margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hero.go .hbig{color:var(--go)}
.hero.none .hbig{color:var(--ink);font-size:22px;line-height:28px}
.hsub{display:block;font-size:13px;line-height:17px;font-weight:500;color:var(--ink2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero.none .hsub{white-space:normal}
.hchev{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink3)}

/* ── sticky date rail + studio chips ─────────────────────────── */
.stickybar{
  position:sticky;top:calc(var(--sat) + var(--navh));z-index:30;
  margin-top:7px;min-width:0;
  background:var(--barbg);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
}
.stickybar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--hair)}

.rail{
  display:flex;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;
  padding:5px calc(var(--pr) - 4px) 5px calc(var(--pl) - 4px);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;
}
.rail::-webkit-scrollbar{width:0;height:0}
.dcell{
  flex:0 0 auto;width:50px;height:54px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--card);box-shadow:var(--shadow);overflow:hidden;padding:0 2px;
  transition:background-color .2s ease,color .2s ease;
}
.dcell .dw{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.dcell .dn{font-size:19px;font-weight:720;letter-spacing:-.03em;line-height:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.dcell .pips{display:flex;gap:2.5px;height:4px;align-items:center}
.dcell .pips i{width:4px;height:4px;border-radius:2px;display:block}
.dcell.today .dw{color:var(--amber)}
/* NOTE: the modifier is `noclass`, NOT `empty` — `.empty` is the empty-state block
   below and an equal-specificity collision silently reshaped every class-free cell. */
.dcell.noclass{opacity:.38}
/* belt-and-braces: nothing bolted onto a date cell may change its box */
.dcell[class]{width:50px;height:54px;gap:2px;padding:0 2px}

.dcell.sel{background:var(--btn-ink)}
.dcell.sel .dn{color:var(--btn-on)}
.dcell.sel .dw{color:var(--btn-on);opacity:.62}
.dcell.sel .pips i{opacity:.95;box-shadow:0 0 0 .5px rgba(255,255,255,.35)}
.dcell:active{opacity:.6}

.chips{
  display:flex;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;
  padding:0 var(--pr) 8px var(--pl);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chips::-webkit-scrollbar{width:0;height:0}
.chip{
  flex:0 0 auto;height:44px;border-radius:12px;padding:0 13px;
  display:flex;align-items:center;gap:7px;
  background:var(--card);box-shadow:var(--shadow);
  font-size:14px;font-weight:600;letter-spacing:-.2px;color:var(--ink2);
}
.chip .cd{width:8px;height:8px;border-radius:4px;flex:none}
.chip .cd.all{width:14px;height:8px;border-radius:4px;
  background:linear-gradient(90deg,var(--s-exhale),var(--s-reformer),var(--s-run),var(--s-cycle),var(--s-nurture))}
.chip[aria-selected="true"]{background:var(--btn-ink);color:var(--btn-on)}
.chip:active{opacity:.6}

/* ── day header + agenda ─────────────────────────────────────── */
.dayhead{display:flex;align-items:baseline;gap:8px;min-width:0;padding:10px var(--pr) 0 var(--pl)}
.dayhead .dh{font-size:20px;font-weight:720;letter-spacing:-.45px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead .dc{font-size:12.5px;font-weight:600;color:var(--ink3);flex:none;margin-left:auto;white-space:nowrap}
.dayhead .dc b{color:var(--go)}

.dayslide{transition:opacity .2s ease,transform .2s ease;will-change:transform}
.dayslide.out-l{opacity:0;transform:translateX(-26px)}
.dayslide.out-r{opacity:0;transform:translateX(26px)}
.dayslide.drag{transition:none}

.nowrule{
  display:flex;align-items:center;gap:8px;min-width:0;
  padding:11px var(--pr) 0 var(--pl);
}
.nowrule i{width:7px;height:7px;border-radius:4px;background:var(--bad);flex:none}
.nowrule s{flex:1;min-width:0;height:1px;background:var(--bad);opacity:.35;text-decoration:none}
.nowrule span{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--bad);
  flex:none;white-space:nowrap}
.nowrule em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--bad);flex:none;white-space:nowrap;
  font-variant-numeric:tabular-nums;margin-left:-3px}

/* ── class row (2 lines, ~62px) ──────────────────────────────── */
.crow{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 9px 9px 12px;min-height:62px;position:relative;min-width:0;
  transition:background-color .12s ease;
}
.crow + .crow::before{content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2)}
.crow:active{background:var(--fill)}
.crow.ispick{background:var(--amber-bg)}
.crow.flash{animation:flash 1.6s ease}
@keyframes flash{0%,55%{background:var(--amber-bg)}100%{background:transparent}}
.ctime{flex:none;width:45px;min-width:0}
.ctime b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.4px;line-height:18px;font-variant-numeric:tabular-nums}
.ctime span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--ink3);margin-top:1px}
.cbody{flex:1;min-width:0}
.cname{font-size:16px;font-weight:620;letter-spacing:-.32px;line-height:20px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.isfull .cname{color:var(--ink2)}
.cmeta{display:flex;align-items:center;flex-wrap:wrap;gap:1px 8px;min-width:0;margin-top:2px;
  font-size:12.5px;line-height:16px;letter-spacing:-.05px}
/* text-overflow is inert on a flex box — the ellipsis has to live on the inner span */
.cst{flex:0 1 auto;min-width:0;max-width:100%;display:flex;align-items:center;gap:4px;
  font-weight:650;color:var(--ink2);overflow:hidden}
.cst > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cst.go{color:var(--go)}
.cst.bad{color:var(--bad)}
.cst.amb{color:var(--amber)}
.cst svg{width:12px;height:12px;flex:none}
/* no modifier bolted onto .cst may change its box (`.wrap` is the tab scroller — a
   name collision here is exactly the bug that mangled .dcell) */
.cst[class]{padding:0;margin:0}
/* a warning that owns its own row wraps instead of truncating — the second half of
   "FIT allows one per day" is the actionable half */
.cst.longform{align-items:flex-start;overflow:visible}
.cst.longform > span{white-space:normal;overflow:visible;text-overflow:clip}
.cst.longform svg{margin-top:2px}
.csep{flex:none;color:var(--ink3);opacity:.7}
.ctail{flex:1 1 92px;min-width:0;color:var(--ink3);display:flex;align-items:center;gap:5px}
.ctail .sdot{width:7px;height:7px;border-radius:4px;flex:none}
.ctail span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cact{flex:none;display:flex;align-items:center;gap:4px;min-width:0}
.bookpill{
  height:44px;min-width:56px;padding:0 11px;border-radius:12px;flex:none;
  background:var(--btn-ink);color:var(--btn-on);
  font-size:14.5px;font-weight:700;letter-spacing:-.2px;
  display:flex;align-items:center;justify-content:center;gap:4px;
}
.bookpill:active{opacity:.6}
/* bookable, but you already have that studio today — warn, never block */
.bookpill.caution{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1.5px var(--amber-rail)}
.ptog{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ptog .pk{
  width:30px;height:30px;border-radius:15px;border:1.6px solid var(--hair);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}
.ptog[aria-pressed="true"] .pk{background:var(--amber-rail);border-color:var(--amber-rail);color:var(--on-amber)}
.ptog:active{transform:scale(.86)}
.ptog.rm .pk{border-color:transparent;background:var(--fill);color:var(--bad)}

/* ── buttons ─────────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:50px;border-radius:14px;font-size:16.5px;font-weight:650;letter-spacing:-.35px;
  padding:0 18px;width:100%;min-width:0;transition:opacity .15s ease,transform .15s ease;
}
.btn:active{opacity:.7;transform:scale(.985)}
.btn.filled{background:var(--btn-ink);color:var(--btn-on)}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn[disabled]{pointer-events:none;background:var(--fill);color:var(--ink3);font-weight:600}
.btn-sm{
  min-height:44px;padding:0 14px;border-radius:12px;font-size:14.5px;font-weight:650;
  width:auto;flex:none;letter-spacing:-.2px;display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn-sm.redtxt{color:var(--bad);background:var(--fill)}
.btn-sm.ink{background:var(--btn-ink);color:var(--btn-on)}
.btn-sm:active{opacity:.5}

/* ── save bar (docked material) ──────────────────────────────── */
.savebar{
  position:absolute;left:0;right:0;z-index:55;bottom:calc(var(--sab) + var(--tabh));
  padding:9px var(--pr) 9px var(--pl);
  background:var(--barbg);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.32,.9,.32,1),opacity .2s ease;
}
.savebar::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair)}
#app.dirty .savebar{transform:translateY(0);opacity:1;pointer-events:auto}
.savebar-inner{display:flex;align-items:center;gap:12px;max-width:592px;margin:0 auto;min-width:0}
.savebar .sn{flex:1;min-width:0;font-size:12.5px;line-height:16px;color:var(--ink3)}
.savebar .sn b{display:block;color:var(--ink);font-size:14.5px;font-weight:680;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar .sn i{display:block;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── tab bar ─────────────────────────────────────────────────── */
.tabfade{
  position:absolute;left:0;right:0;z-index:48;pointer-events:none;
  bottom:calc(var(--sab) + var(--tabh));height:40px;
  background:linear-gradient(to top,var(--bg),var(--bg0));
  transition:opacity .2s ease;
}
#app.dirty .tabfade{opacity:0}
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;min-width:0;
  padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar);
  background:var(--tabbg);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  backdrop-filter:saturate(180%) blur(30px);
}
.tabbar::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair)}
.tabbtn{
  flex:1 1 0;min-width:0;height:var(--tabh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink3);position:relative;padding-top:2px;
}
.tabbtn .tl{font-size:10px;font-weight:650;letter-spacing:.02px;line-height:12px;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbtn[aria-selected="true"]{color:var(--ink)}
.tabbtn[aria-selected="true"] svg{stroke-width:2.3}
.tabbtn:active{opacity:.5}
.tabbtn .tbadge{

  font-size:10.5px;font-weight:800;line-height:17px;text-align:center;
  font-variant-numeric:tabular-nums;
  transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.tabbtn .tbadge.on{transform:scale(1)}
.tabbtn[aria-selected="true"] .tbadge{background:var(--ink);color:var(--bg)}
#app.dirty .tabbtn[data-tab="picks"] .tbadge{background:var(--amber-rail);color:var(--on-amber)}

/* ── empty state ─────────────────────────────────────────────── */
/* deliberately NOT called `.empty`: that name is generic enough to collide with a
   modifier on an unrelated component (it did — on .dcell). */
.emptystate{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0;
  padding:40px calc(26px + var(--sar)) 16px calc(26px + var(--sal));
}
.emptystate .eg{color:var(--ink3);opacity:.5;margin-bottom:2px}
.emptystate .et{font-size:19px;font-weight:700;letter-spacing:-.45px}
.emptystate .es{font-size:14.5px;color:var(--ink2);line-height:20px;letter-spacing:-.15px;max-width:300px}

/* ── colour-tiled rule rows ──────────────────────────────────── */
.rulerow{display:flex;gap:12px;padding:12px 13px;align-items:flex-start;min-width:0;position:relative}
.rulerow + .rulerow::before{content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2)}
.rulerow .ri{width:28px;height:28px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
.rulerow .rt{flex:1;min-width:0;font-size:14.5px;letter-spacing:-.2px;line-height:19px}
.rulerow .rt b{font-weight:680;display:block}
.rulerow .rt span{color:var(--ink2);font-size:12.5px;line-height:17px;display:block;margin-top:2px}

/* ── log rows ────────────────────────────────────────────────── */
.logrow{display:flex;gap:11px;padding:10px 13px;align-items:center;min-width:0;position:relative;min-height:52px}
.logrow + .logrow::before{content:'';position:absolute;left:13px;right:0;top:0;height:.5px;background:var(--hair2)}
.logrow .li{width:26px;height:26px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center}

/* ── tinted icon tiles: background + a legible ink, always as a pair ─── */
.ri[data-tone],.li[data-tone]{color:var(--tile-ink)}
.ri[data-tone="go"],.li[data-tone="go"]{background:var(--go)}
.ri[data-tone="bad"],.li[data-tone="bad"]{background:var(--bad)}
.ri[data-tone="n3"],.li[data-tone="n3"]{background:var(--ink3)}
.ri[data-tone="n2"],.li[data-tone="n2"]{background:var(--ink2)}
.ri[data-tone="amber"],.li[data-tone="amber"]{background:var(--amber-rail);color:var(--on-amber)}
.logrow .lb{flex:1;min-width:0}
.logrow .lt{font-size:14.5px;letter-spacing:-.2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logrow .ls{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.logrow .lw{font-size:12px;color:var(--ink3);flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── iOS switch ──────────────────────────────────────────────── */
.swrow{display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:58px;min-width:0;position:relative}
.swrow::before{content:'';position:absolute;left:18px;right:0;top:0;height:.5px;background:var(--hair2)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);flex:none;position:relative;
  transition:background-color .28s cubic-bezier(.32,.9,.32,1)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);
  transition:transform .28s cubic-bezier(.32,.9,.32,1)}
/* the accessible control IS the 44px hit area — role/state live on .swtap itself */
.swtap{width:51px;min-height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.swtap[aria-checked="true"] .sw{background:var(--amber-rail)}

/* ── sheets ──────────────────────────────────────────────────── */

.sheet{

  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.factrow .fk{font-size:14.5px;color:var(--ink2);letter-spacing:-.2px;flex:none}
.factrow .fv{font-size:14.5px;font-weight:600;letter-spacing:-.2px;margin-left:auto;min-width:0;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-actions{padding:14px 18px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.sheet-note{font-size:11.5px;line-height:16px;color:var(--ink3);padding:0 18px 16px;min-width:0}

/* UIAlertController-style action sheet */
.asheet{padding-bottom:calc(8px + var(--sab))}
.as-group{background:var(--sheet);border-radius:16px;overflow:hidden;max-width:576px;margin:0 auto 8px;min-width:0}
.as-title{padding:16px 18px;text-align:center;font-size:12.5px;line-height:17px;color:var(--ink2);
  white-space:pre-line;position:relative;min-width:0;overflow-wrap:anywhere}
.as-title b{display:block;color:var(--ink);font-size:15px;font-weight:680;margin-bottom:3px}
.as-btn{width:100%;min-height:57px;display:flex;align-items:center;justify-content:center;
  font-size:19px;letter-spacing:-.4px;color:var(--ink);position:relative;padding:0 18px;text-align:center}
.as-btn::before{content:'';position:absolute;left:0;right:0;top:0;height:.5px;background:var(--hair2)}
.as-btn:active{background:var(--fill)}
.as-btn.destructive{color:var(--bad)}
.as-btn.bold{font-weight:680}
.as-cancel{background:var(--sheet);border-radius:16px;max-width:576px;margin:0 auto;overflow:hidden}
.as-cancel .as-btn{font-weight:680}
.as-cancel .as-btn::before{display:none}

/* ── toast ───────────────────────────────────────────────────── */
#toast{position:fixed;z-index:200;left:12px;right:12px;top:calc(var(--sat) + 6px);
  display:flex;justify-content:center;pointer-events:none}
#toast .tt{
  max-width:100%;min-width:0;background:var(--sheet);color:var(--ink);
  border-radius:22px;padding:11px 18px;
  font-size:13.5px;line-height:18px;font-weight:550;letter-spacing:-.15px;text-align:center;
  box-shadow:0 10px 34px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.10);
  opacity:0;transform:translateY(-16px) scale(.94);overflow-wrap:anywhere;
  transition:opacity .3s ease,transform .42s cubic-bezier(.32,.72,0,1);
}
#toast.on .tt{opacity:1;transform:translateY(0) scale(1)}

/* ── setup ───────────────────────────────────────────────────── */
#app.setupmode .wrap{min-height:100%;display:flex;flex-direction:column}
#app.setupmode .wrap{padding-bottom:calc(var(--sab) + 20px)}
#app.setupmode .navbtn{opacity:0;pointer-events:none}
#app.setupmode .savebar,#app.setupmode .tabfade{display:none}
.setup{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;
  padding:0 calc(24px + var(--sar)) 30px calc(24px + var(--sal))}
.setup .mark{
  width:72px;height:72px;border-radius:20px;margin:0 auto 18px;
  background:linear-gradient(160deg,var(--amber-rail),var(--s-run));
  display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 12px 30px -10px rgba(208,138,17,.55);
}
.setup h1{font-size:27px;font-weight:760;letter-spacing:-.7px;text-align:center}
.setup p{font-size:14.5px;line-height:20px;color:var(--ink2);text-align:center;margin-top:8px;letter-spacing:-.2px}
.setup input{
  width:100%;min-width:0;font-size:17px;font-family:inherit;color:var(--ink);
  background:var(--card);border:0;border-radius:14px;padding:15px 16px;margin-top:22px;min-height:52px;
  box-shadow:var(--shadow);
}
.setup input::placeholder{color:var(--ink3)}
.setup .btn{margin-top:12px}
.setup .warn{font-size:12.5px;line-height:17px;color:var(--amber);text-align:center;margin-top:14px;overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* ── narrow phones (320) — last in the sheet so these actually win ───── */
@media (max-width:359px){
  /* buys back the few px that were eating the studio name in a booked/log row */
  .cmeta{font-size:12px}
  .logrow .ls{font-size:12px}
  .logrow{gap:9px;padding:10px 11px}
  .crow{gap:8px;padding-left:10px}
}
</style>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   Contract constants (§1)
   ════════════════════════════════════════════════════════════════ */
const OWNER = 's1l3ncy', REPO = 'fit-booker', API = 'https://api.github.com';
const DAY_ORDER = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const TZ = 'Australia/Sydney';
const STUDIOS = ['exhale','reformer','run','cycle','nurture'];
const SCOLOR = {exhale:'var(--s-exhale)',reformer:'var(--s-reformer)',run:'var(--s-run)',
                cycle:'var(--s-cycle)',nurture:'var(--s-nurture)'};
const SLABEL = {exhale:'Exhale',reformer:'Reformer',run:'Run',cycle:'Cycle',nurture:'Nurture'};

let token = '';
try { token = localStorage.getItem('fitbooker_token') || ''; } catch(e){ token = ''; }

let timetable = {updated:null, classes:[]};
let bookings  = {updated:null, bookings:[]};
let logdata   = [];
let picks = [], picksSha = null, savedPicksJson = '[]';
let loadError = null, booted = false;

let activeTab = 'book';
let studioFilter = 'all';
let selDate = null;
let allDates = [];
let scrollMemo = {book:0, booked:0, picks:0};
let railScroll = null;
let inFlight = 0;
let heroCache = null;

/* ════════════════════════════════════════════════════════════════
   Helpers
   ════════════════════════════════════════════════════════════════ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);

const SYD_PARTS = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',
  day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function sydParts(d){
  const o = {};
  try { SYD_PARTS.formatToParts(d||new Date()).forEach(p=>{ o[p.type]=p.value; }); }
  catch(e){ const x=d||new Date(); o.year=String(x.getFullYear()); o.month=String(x.getMonth()+1).padStart(2,'0');
            o.day=String(x.getDate()).padStart(2,'0'); o.hour=String(x.getHours()).padStart(2,'0'); o.minute='00'; }
  return o;
}
function sydToday(){ const p = sydParts(new Date()); return p.year+'-'+p.month+'-'+p.day; }
function sydNowClock(){ const p = sydParts(new Date()); return fmt12(p.hour+':'+p.minute).full; }

function dstr(y,m,d){ return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function toUTC(ds){ const a=String(ds).split('-').map(Number); return Date.UTC(a[0],a[1]-1,a[2]); }
function fromUTC(ms){ const d=new Date(ms); return dstr(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
function addDays(ds,n){ return fromUTC(toUTC(ds)+n*86400000); }
function dowMon0(ds){ return (new Date(toUTC(ds)).getUTCDay()+6)%7; }
const WD_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WD_SHORT= ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON_LONG= ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayNum(ds){ return Number(String(ds).split('-')[2]); }
function monIdx(ds){ return Number(String(ds).split('-')[1])-1; }
function longDate(ds){ return WD_LONG[dowMon0(ds)]+' '+dayNum(ds)+' '+MON_LONG[monIdx(ds)]; }
function shortDate(ds){ return WD_SHORT[dowMon0(ds)]+' '+dayNum(ds)+' '+MON_SHORT[monIdx(ds)]; }
function relDayLabel(ds){
  const t = sydToday();
  if(ds === t) return 'Today';
  if(ds === addDays(t,1)) return 'Tomorrow';
  return longDate(ds);
}

function fmt12(t){
  const a = String(t||'').split(':'); let h = Number(a[0])||0; const m = a[1]||'00';
  const ap = h>=12 ? 'pm' : 'am'; h = h%12 || 12;
  return {h:h+':'+m, ap:ap, full:h+':'+m+' '+ap};
}
function isoClock(iso){ const p = sydParts(new Date(iso)); return fmt12(p.hour+':'+p.minute).full; }
function isoDateStr(iso){ const p = sydParts(new Date(iso)); return p.year+'-'+p.month+'-'+p.day; }

/* coarse "3d 4h" */
function relTime(ms){
  if(ms < 0) ms = 0;
  const s = Math.round(ms/1000);
  if(s < 60) return s+'s';
  const m = Math.round(s/60); if(m < 60) return m+'m';
  const h = Math.floor(m/60), rm = m%60;
  if(h < 24) return rm ? h+'h '+rm+'m' : h+'h';
  const d = Math.floor(h/24), rh = h%24;
  return rh ? d+'d '+rh+'h' : d+'d';
}
/* live hero countdown — seconds inside the hour */
function cdText(ms){
  if(ms <= 0) return 'Open now';
  const s = Math.floor(ms/1000);
  if(s < 3600){ return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'; }
  const h = Math.floor(s/3600);
  if(h < 24) return h+'h '+String(Math.floor((s%3600)/60)).padStart(2,'0')+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function durationMins(c){
  try{
    const m = String(c.end||'').match(/(\d{1,2}):(\d{2})\s*([AaPp])/);
    if(!m) return null;
    let eh = Number(m[1])%12; if(m[3].toLowerCase()==='p') eh += 12;
    const em = Number(m[2]);
    const sa = String(c.time).split(':').map(Number);
    let mins = (eh*60+em) - (sa[0]*60+sa[1]);
    if(mins < 0) mins += 1440;
    return (mins>0 && mins<300) ? mins : null;
  }catch(e){ return null; }
}
function endLabel(c){
  const d = durationMins(c); if(d === null) return '';
  const a = String(c.time).split(':').map(Number);
  const tot = (a[0]*60 + a[1] + d) % 1440;
  return fmt12(String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0')).full;
}

/* availability wording from `avail` + `notfull` */
function availInfo(c){
  const a = String(c.avail||'');
  if(!c.notfull){
    if(a.indexOf('waitlist')>=0 && a.indexOf('no_waitlist')<0)
      return {full:true, label:'Full · waitlist', cls:'bad', long:'Full — waitlist open'};
    return {full:true, label:'Full', cls:'bad', long:'Full'};
  }
  if(a==='less_than_100') return {full:false, label:'Almost full', cls:'', long:'Almost full'};
  if(a==='less_than_90')  return {full:false, label:'Filling up',  cls:'', long:'Filling up'};
  return {full:false, label:'Spaces', cls:'', long:'Spaces'};
}

/* ════════════════════════════════════════════════════════════════
   Toast + sheets
   ════════════════════════════════════════════════════════════════ */
let toastTimer = null;
function toast(msg, ms){
  const t = $('#toast'); $('#toastText').textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('on'), ms || 2800);
}
function sheetOpen(){ return !!$('#sheetRoot').innerHTML; }
function closeSheet(){
  const root = $('#sheetRoot');
  const sc = $('.scrim', root), sh = $('.sheet', root);
  if(sc) sc.classList.remove('on');
  if(sh) sh.classList.remove('on');
  setTimeout(()=>{ root.innerHTML = ''; }, 460);
}
function openSheet(innerHTML, extraClass){
  const root = $('#sheetRoot');
  root.innerHTML = '<div class="scrim"></div><div class="sheet '+(extraClass||'')+'">'+innerHTML+'</div>';
  const sc = $('.scrim', root), sh = $('.sheet', root);
  sc.addEventListener('click', ()=> closeSheet());
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ sc.classList.add('on'); sh.classList.add('on'); }); });
  return root;
}
/* UIAlertController-style action sheet — never window.confirm() */
function actionSheet(opts){
  return new Promise(resolve=>{
    const acts = opts.actions || [];
    let html = '<div class="as-group">';
    if(opts.title || opts.message){
      html += '<div class="as-title">'+(opts.title?'<b>'+esc(opts.title)+'</b>':'')+
              (opts.message?esc(opts.message):'')+'</div>';
    }
    acts.forEach((a,i)=>{
      html += '<button class="as-btn '+(a.style==='destructive'?'destructive':'')+' '+
              (a.style==='default'?'bold':'')+'" data-as="'+i+'">'+esc(a.label)+'</button>';
    });
    html += '</div><div class="as-cancel"><button class="as-btn" data-as="-1">'+
            esc(opts.cancelLabel||'Cancel')+'</button></div>';
    const root = openSheet(html, 'asheet');
    let done = false;
    const finish = v => { if(done) return; done = true; closeSheet(); resolve(v); };
    root.addEventListener('click', e=>{
      const b = e.target.closest('[data-as]');
      if(b) finish(Number(b.dataset.as));
      else if(e.target.classList.contains('scrim')) finish(-1);
    });
  });
}

/* ════════════════════════════════════════════════════════════════
   GitHub API (contract §2–§4)
   ════════════════════════════════════════════════════════════════ */
function hdrs(){
  return {Authorization:'Bearer '+token, Accept:'application/vnd.github+json',
          'X-GitHub-Api-Version':'2022-11-28'};
}
async function apiGet(path, raw){
  const h = hdrs(); if(raw) h.Accept = 'application/vnd.github.raw+json';
  const r = await fetch(API+'/repos/'+OWNER+'/'+REPO+'/contents/'+path+'?nocache='+Date.now(), {headers:h});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(path+': '+r.status);
  return raw ? r.text() : r.json();
}
async function dispatch(workflow, inputs){
  const r = await fetch(API+'/repos/'+OWNER+'/'+REPO+'/actions/workflows/'+workflow+'/dispatches', {
    method:'POST', headers:hdrs(), body: JSON.stringify({ref:'main', inputs: inputs||{}})});
  if(r.status !== 204) throw new Error(workflow+' dispatch failed: '+r.status);
}
function isAuthErr(e){ const s = String(e && e.message || e); return s.indexOf('401')>=0 || s.indexOf('403')>=0; }
/* CONTRACT §2: ANY 401/403 clears the token and returns to setup — not just the
   initial load, or an expired PAT leaves the user tapping Save forever. */
function bailToSetup(msg){
  try { localStorage.removeItem('fitbooker_token'); } catch(x){}
  token = ''; booted = false;
  closeSheet();
  renderSetup(msg || 'That token was rejected. Generate a new fine-grained token with Contents + Actions write access and paste it again.');
}
function handleApiErr(e){
  if(isAuthErr(e)){ bailToSetup(); return true; }
  return false;
}
function safeParse(txt, fallback){ try { return txt ? JSON.parse(txt) : fallback; } catch(e){ return fallback; } }
function b64(str){
  try { return btoa(unescape(encodeURIComponent(str))); }
  catch(e){ return btoa(str); }
}

async function loadAll(silent){
  let failed = 0;
  /* a background refresh must never silently eat pick edits the user hasn't saved */
  const keepLocalPicks = !!(silent && isDirty());
  try{
    const soft = pr => pr.catch(e=>{ if(isAuthErr(e)) throw e; failed++; return null; });
    const res = await Promise.all([
      soft(apiGet('data/timetable.json', true)),
      soft(apiGet('data/bookings.json', true)),
      soft(apiGet('data/log.json', true)),
      soft(apiGet('data/picks.json'))
    ]);
    const tt = safeParse(res[0], null);
    if(tt && Array.isArray(tt.classes)) timetable = tt;
    const bk = safeParse(res[1], null);
    if(bk && Array.isArray(bk.bookings)) bookings = bk;
    const lg = safeParse(res[2], null);
    /* only replace the activity list when log.json actually came back — a partial
       failure must not blank it while the banner claims a cached view */
    if(Array.isArray(lg)) logdata = lg;
    else if(res[2] === null && !failed) logdata = [];   // genuine 404 → really empty
    if(res[3]){
      /* capture the sha even for a byte-empty file, or every later PUT 422s */
      if(res[3].sha) picksSha = res[3].sha;
      let decoded = [];
      const raw = String(res[3].content||'').replace(/\s/g,'');
      if(raw){
        try { decoded = JSON.parse(decodeURIComponent(escape(atob(raw)))); }
        catch(e){ try { decoded = JSON.parse(atob(raw)); } catch(e2){ decoded = []; } }
      }
      if(Array.isArray(decoded)){
        if(keepLocalPicks) savedPicksJson = JSON.stringify(decoded);   // keep the edits, rebase "saved"
        else picks = decoded;
      }
    } else if(res[3] === null){
      picksSha = null;                                   // 404: no file yet, PUT without a sha
    }
    if(!keepLocalPicks) savedPicksJson = JSON.stringify(picks);
    if(failed){
      loadError = failed >= 4
        ? 'Couldn’t reach GitHub. Showing whatever this device loaded last — pull to sync when you’re back online.'
        : 'Some data couldn’t be refreshed. Showing the last copy this device loaded.';
      if(!silent) toast('Offline — showing the cached view', 3200);
    } else {
      loadError = null;
    }
  }catch(e){
    if(isAuthErr(e)){ bailToSetup(); return; }
    loadError = 'Couldn’t reach GitHub. Showing the last data this device loaded.';
    if(!silent) toast('Offline — showing the cached view', 3200);
  }
  indexDates();
  booted = true;
  renderAll();
}

function indexDates(){
  const set = {};
  (timetable.classes||[]).forEach(c=>{ if(c && c.date) set[c.date] = true; });
  const all = Object.keys(set).sort();
  const today = sydToday();
  /* days already gone can never be booked — keeping them only pushed the strip's
     scroll offset around and made "today" hard to find */
  allDates = all.filter(d => d >= today);
  if(!allDates.length) allDates = all;
  if(!selDate || allDates.indexOf(selDate) < 0){
    if(allDates.indexOf(today) >= 0 && dayHasClasses(today)) selDate = today;
    else selDate = allDates.filter(dayHasClasses)[0] || allDates[0] || today;
  }
}

/* ════════════════════════════════════════════════════════════════
   Picks
   ════════════════════════════════════════════════════════════════ */
function pickIndex(day,time,studio){
  return picks.findIndex(p => p.day===day && p.time===time && p.studio===studio);
}
function isPicked(c){ return pickIndex(c.day,c.time,c.studio) >= 0; }
function togglePick(day,time,studio,name){
  const i = pickIndex(day,time,studio);
  if(i >= 0) picks.splice(i,1);
  else picks.push({day:day, time:time, studio:studio, name:name||''});
  heroCache = null;
  syncDirty();
  return i < 0;
}
function isDirty(){ return JSON.stringify(picks) !== savedPicksJson; }
function syncDirty(){
  const app = $('#app'), d = isDirty();
  app.classList.toggle('dirty', d);
  if(d){
    const saved = safeParse(savedPicksJson, []);
    const added = picks.filter(p => !saved.some(q=>q.day===p.day&&q.time===p.time&&q.studio===p.studio)).length;
    const removed = saved.filter(q => !picks.some(p=>p.day===q.day&&p.time===q.time&&p.studio===q.studio)).length;
    const bits = [];
    if(added) bits.push(added+' added');
    if(removed) bits.push(removed+' removed');
    $('#saveTitle').textContent = bits.join(', ') || 'Picks changed';
    $('#saveSub').textContent = picks.length + (picks.length===1?' weekly pick':' weekly picks') + ' after saving';
  }
  updateBadges();
}
function updateBadges(){
  const nb = ((bookings&&bookings.bookings)||[]).length;
  const bb = $('#badgeBooked');
  bb.textContent = nb > 99 ? '99+' : String(nb);
  bb.classList.toggle('on', nb > 0);
  const np = picks.length;
  const pb = $('#badgePicks');
  pb.textContent = np > 99 ? '99+' : String(np);
  pb.classList.toggle('on', np > 0 || isDirty());
  if(np === 0 && isDirty()) pb.textContent = '0';
}

async function savePicks(){
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const body = {message:'update picks', content: b64(JSON.stringify(picks, null, 1)), branch:'main'};
    if(picksSha) body.sha = picksSha;
    const r = await fetch(API+'/repos/'+OWNER+'/'+REPO+'/contents/data/picks.json',
      {method:'PUT', headers:hdrs(), body: JSON.stringify(body)});
    if(r.status === 401 || r.status === 403){
      bailToSetup('Your token no longer has write access. Generate a new fine-grained token with Contents + Actions write access and paste it again.');
      return;
    }
    if(r.status === 409 || r.status === 422){
      /* stale or missing sha — re-read the file and let the user hit Save again */
      try{
        const cur = await apiGet('data/picks.json');
        picksSha = (cur && cur.sha) || null;
      }catch(e2){}
      throw new Error('Picks changed on GitHub — tap Save picks again');
    }
    if(!r.ok) throw new Error('Save failed ('+r.status+')');
    const j = await r.json();
    if(j && j.content && j.content.sha) picksSha = j.content.sha;
    savedPicksJson = JSON.stringify(picks);
    syncDirty();
    heroCache = null;
    renderPicks(); renderBook();
    toast('Picks saved — the bot will book them automatically');
    maybeKickSnipe();
  }catch(e){
    toast(String(e.message || e), 4200);
  }finally{
    btn.disabled = false; btn.textContent = 'Save picks';
  }
}

/* Mirror of the bot's bookable_occurrence (contract §4). Do not change. */
function bookableOpensMs(p){
  const now = new Date(), wd = DAY_ORDER.indexOf(p.day);
  const parts = String(p.time).split(':').map(Number), h = parts[0], m = parts[1];
  for(let i=0;i<10;i++){
    const d = new Date(now); d.setDate(now.getDate()+i);
    if(((d.getDay()+6)%7) === wd){
      const start = new Date(d); start.setHours(h,m,0,0);
      const opens = start.getTime() - (7*24*60+60)*60000;
      if(opens >= now.getTime() - 20*60000) return opens;
    }
  }
  return null;
}
/* display-only: identical maths, longer horizon, so a countdown always exists */
function nextWindowMs(p){
  const now = new Date(), wd = DAY_ORDER.indexOf(p.day);
  const parts = String(p.time).split(':').map(Number), h = parts[0], m = parts[1];
  for(let i=0;i<21;i++){
    const d = new Date(now); d.setDate(now.getDate()+i);
    if(((d.getDay()+6)%7) === wd){
      const start = new Date(d); start.setHours(h,m,0,0);
      const opens = start.getTime() - (7*24*60+60)*60000;
      if(opens >= now.getTime() - 20*60000) return opens;
    }
  }
  return null;
}

async function maybeKickSnipe(){
  const now = Date.now();
  const imminent = picks.some(p => { const o = bookableOpensMs(p); return o !== null && (o - now) <= 45*60000; });
  if(imminent){
    try{
      await dispatch('snipe.yml');
      beginFlight('A pick opens within the hour — booking run started now.');
    }catch(e){}
  }
}

/* ════════════════════════════════════════════════════════════════
   In-flight feedback
   ════════════════════════════════════════════════════════════════ */
function beginFlight(msg, ms){
  inFlight++;
  $('#flightbar').classList.add('on');
  if(msg) toast(msg, 4200);
  const wait = ms || 75000;
  setTimeout(()=>{
    inFlight = Math.max(0, inFlight-1);
    if(!inFlight) $('#flightbar').classList.remove('on');
  }, wait);
  setTimeout(()=> loadAll(true), wait);
}

/* ════════════════════════════════════════════════════════════════
   Derived data
   ════════════════════════════════════════════════════════════════ */
function futureClasses(){
  const now = Date.now();
  return (timetable.classes||[]).filter(c => c && c.start_iso && new Date(c.start_iso).getTime() > now);
}
function classesFor(date){
  const now = Date.now();
  return (timetable.classes||[])
    .filter(c => c && c.date===date && new Date(c.start_iso).getTime() > now)
    .filter(c => studioFilter==='all' || c.studio===studioFilter)
    .sort((a,b)=> String(a.time).localeCompare(String(b.time)) || String(a.studio).localeCompare(String(b.studio)));
}
function dayHasClasses(date){
  const now = Date.now();
  return (timetable.classes||[]).some(c => c && c.date===date && new Date(c.start_iso).getTime() > now);
}
function studiosOn(date){
  const now = Date.now(), seen = {};
  (timetable.classes||[]).forEach(c=>{
    if(c && c.date===date && new Date(c.start_iso).getTime() > now) seen[c.studio] = 1;
  });
  return STUDIOS.filter(s => seen[s]);
}
/* studio already booked on this calendar date (one class per studio per day) */
function bookedStudiosOn(date){
  const out = {};
  ((bookings&&bookings.bookings)||[]).forEach(b=>{ if(b && b.date===date) out[studioFromBooking(b)] = b; });
  return out;
}
/* another saved pick in the same studio on the same weekday */
function pickClash(c){
  return picks.find(p => p.studio===c.studio && p.day===c.day && p.time!==c.time) || null;
}

/* Every future timetable occurrence of a saved pick, soonest first. */
function pickOccurrences(p){
  const now = Date.now();
  return (timetable.classes||[])
    .filter(c => c && c.day===p.day && c.time===p.time && c.studio===p.studio &&
                 new Date(c.start_iso).getTime() > now)
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}
/* Single source of truth shared by the hero and the Picks list, so the two can
   never disagree about the same pick. */
function pickState(p){
  const now = Date.now();
  const occ = pickOccurrences(p);
  const bookedKey = {};
  ((bookings&&bookings.bookings)||[]).forEach(b=>{ if(b&&b.date) bookedKey[b.date+'|'+studioFromBooking(b)] = 1; });
  for(let i=0;i<occ.length;i++){
    const c = occ[i];
    if(bookedKey[c.date+'|'+c.studio]) continue;          // the bot already won this one
    const o = new Date(c.opens_iso).getTime();
    if(!isFinite(o)) continue;
    return {kind: o <= now ? 'open' : 'waiting', opens:o, cls:c};
  }
  if(occ.length) return {kind:'booked', opens:null, cls:occ[0]};
  return {kind:'missing', opens:null, cls:null};
}

/* the soonest booking window among the OWNER'S PICKS — the hero */
function nextPickWindow(){
  if(heroCache && heroCache.at > Date.now() - 5000) return heroCache.v;
  const now = Date.now();
  let best = null;
  picks.forEach(p=>{
    let hit = null;
    pickOccurrences(p).forEach(c=>{
      const o = new Date(c.opens_iso).getTime();
      if(isFinite(o) && o > now && (!hit || o < hit.opens)) hit = {opens:o, cls:c, pick:p};
    });
    if(!hit){
      const o = nextWindowMs(p);
      if(o !== null && o > now) hit = {opens:o, cls:null, pick:p};
    }
    if(hit && (!best || hit.opens < best.opens)) best = hit;
  });
  heroCache = {at:Date.now(), v:best};
  return best;
}

  const rail = $('#rail'); if(!rail) return;

                       Math.max(0, rail.scrollWidth - rail.clientWidth));
  if(instant){
    const prev = rail.style.scrollBehavior;
    rail.style.scrollBehavior = 'auto';
    rail.scrollLeft = target;

    rail.scrollLeft = railScroll !== null ? railScroll : target;
    requestAnimationFrame(()=>{ try{ rail.scrollLeft = target; }catch(e){} });

  railScroll = target;

  if(s.indexOf('sauna')>=0 || s.indexOf('nurture')>=0) return 'nurture';

  /* word-start match so a future class called "Core Crunch" isn't mapped to run */
  if(s.indexOf('bolt')>=0 || s.indexOf('afterburner')>=0 || /\brun/.test(s) || /\bwod\b/.test(s)) return 'run';
  return 'exhale';
}
/* Resolve a Sydney wall-clock date+time to a real instant.
   A hard-coded +10:00 is wrong for half the year (AEDT is +11:00) and that error
   lands squarely on the free-cancel / strike boundary, so solve it against the same
   Intl formatter everything else uses instead of guessing the offset. */
function sydWallToMs(dateStr, hhmm){
  const a = String(dateStr).split('-').map(Number);
  const b = String(hhmm).split(':').map(Number);
  if(a.length < 3 || b.length < 2 || a.some(isNaN) || b.some(isNaN)) return null;
  let ms = Date.UTC(a[0], a[1]-1, a[2], b[0]-10, b[1]);   // seed at AEST, then correct
  for(let k=0;k<3;k++){
    const p = sydParts(new Date(ms));
    const drift = (Number(p.hour)*60 + Number(p.minute)) - (b[0]*60 + b[1]);
    if(!drift) break;
    /* wrap a drift that crossed midnight (±23h) back into ±12h */
    const d = drift > 720 ? drift - 1440 : (drift < -720 ? drift + 1440 : drift);
    ms -= d * 60000;
  }
  return isFinite(ms) ? ms : null;
}
function bookingStartMs(b){
  if(!b.date || !b.time) return null;
  const c = (timetable.classes||[]).find(x => x.date===b.date && x.time===b.time);
  if(c && c.start_iso) return new Date(c.start_iso).getTime();
  /* no timetable match (e.g. half-hourly sauna slots) — resolve the offset properly */
  const sameDay = (timetable.classes||[]).find(x => x.date===b.date && x.start_iso);
  if(sameDay){
    const off = String(sameDay.start_iso).slice(-6);
    if(/^[+-]\d\d:\d\d$/.test(off)){
      const t = Date.parse(b.date+'T'+b.time+':00'+off);
      if(isFinite(t)) return t;
    }
  }
  return sydWallToMs(b.date, b.time);
}

/* ════════════════════════════════════════════════════════════════
   Actions (every destructive/committing action confirms)
   ════════════════════════════════════════════════════════════════ */
async function bookNow(bid, fromSheet){
  const c = findClass(bid); if(!c) return;
  const t = fmt12(c.time);
  const conflict = bookedStudiosOn(c.date)[c.studio];
  const choice = await actionSheet({
    title: 'Book ' + (c.name || c.studio) + '?',
    message: longDate(c.date) + ' at ' + t.full + ' · ' + (SLABEL[c.studio]||c.studio) +
             '\nThis books immediately on your FIT account.' +
             (conflict ? '\nHeads up: you already have ' + (SLABEL[c.studio]||c.studio) +
                         ' booked that day. FIT allows one class per studio per day, so this may be refused.' : ''),
    actions: [{label: conflict ? 'Book Anyway' : 'Book Now', style:'default'}]
  });
  if(choice !== 0){ if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }
  try{
    await dispatch('booknow.yml', {day:c.day, time:c.time, studio:c.studio});
    beginFlight('Booking… the Booked tab updates in about a minute.');
  }catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
}

async function cancelBooking(i){
  const list = ((bookings&&bookings.bookings)||[]).slice()
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.time||'').localeCompare(String(b.time||'')));
  const b = list[i]; if(!b) return;
  const startMs = bookingStartMs(b);
  const late = startMs ? (startMs - Date.now()) < 3600000 : false;
  const choice = await actionSheet({
    title: 'Cancel ' + (b.name||'this booking') + '?',
    message: (b.date_raw || shortDate(b.date)) + ' at ' + (b.time_raw || fmt12(b.time).full) +
      (startMs === null
        ? '\nCancelling within 1 hour of the class counts as a strike. 3 strikes in 7 days = a 7-day ban.'
        : (late ? '\nThis is within 1 hour of the class — it counts as a strike. 3 strikes in 7 days = a 7-day ban.'
                : '\nFree cancel: this is more than 1 hour before the class.')),
    actions: [{label:'Cancel Booking', style:'destructive'}],
    cancelLabel:'Keep Booking'
  });
  if(choice !== 0) return;
  try{
    await dispatch('booknow.yml', {day:'MON', time:b.time, studio:studioFromBooking(b), action:'cancel', date:b.date});
    beginFlight('Cancelling… this list refreshes in about a minute.');
  }catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
}

async function syncNow(){
  const b = $('#syncBtn');
  b.classList.add('spin');
  try{
    await dispatch('refresh.yml');
    beginFlight('Syncing with FIT — new data in about a minute.', 70000);
  }catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
  setTimeout(()=> b.classList.remove('spin'), 70000);
}

async function firePass(){
  const choice = await actionSheet({
    title:'Fire a booking pass?',
    message:'The bot checks every saved pick and books anything whose window is open.',
    actions:[{label:'Run Now', style:'default'}]
  });
  if(choice !== 0) return;
  try{ await dispatch('snipe.yml'); beginFlight('Booking pass running — check back in a minute.'); }
  catch(e){ if(!handleApiErr(e)) toast(String(e.message||e), 4200); }
}

/* ════════════════════════════════════════════════════════════════
   Navigation, scroll memory, gestures
   ════════════════════════════════════════════════════════════════ */
function switchTab(t){
  if(t === activeTab) return;
  const cur = $('#page-'+activeTab);
  if(cur) scrollMemo[activeTab] = cur.scrollTop;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $$('.tabbtn').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===t)));
  activeTab = t;
  const next = $('#page-'+activeTab);
  next.classList.add('active');
  void next.offsetHeight;
  next.scrollTop = scrollMemo[activeTab] || 0;
  updateNav();
  if(t === 'book') syncRail(true);
}

function updateNav(){
  const page = $('#page-'+activeTab);
  const st = page ? page.scrollTop : 0;
  const p = clamp((st - 8) / 30, 0, 1);
  const el = $('#navTitle');
  el.style.opacity = p;
  el.style.transform = 'translateY('+(9*(1-p))+'px)';
  el.textContent = (activeTab==='book' && selDate) ? relDayLabel(selDate) : NAV_TITLES[activeTab];
  $('#app').classList.toggle('scrolled', st > 8);
}

let navTick = false;
$$('.page').forEach(p=>{
  p.addEventListener('scroll', ()=>{
    if(navTick) return; navTick = true;
    requestAnimationFrame(()=>{ navTick = false; if(p.classList.contains('active')) updateNav(); });
  }, {passive:true});
});

function setDay(date, dir){
  if(!date || date === selDate) return;
  const slide = $('#dayslide');
  if(slide && dir) slide.classList.add(dir > 0 ? 'out-l' : 'out-r');
  selDate = date;
  railScroll = null;
  setTimeout(()=>{
    renderBook();
    const s2 = $('#dayslide');
    if(s2 && dir){
      s2.classList.add(dir > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
    updateNav();
  }, dir ? 165 : 0);
}
function stepDay(delta){
  if(!allDates.length) return;
  const i = allDates.indexOf(selDate);
  if(i < 0) return;
  const j = i + delta;
  if(j < 0 || j >= allDates.length){
    const s = $('#dayslide');
    if(s){ s.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
           s.style.transform='translateX('+(delta>0?-12:12)+'px)';
           setTimeout(()=>{ s.style.transform=''; setTimeout(()=>{ s.style.transition=''; },320); },130); }
    return;
  }
  setDay(allDates[j], delta);
}

/* rubber-band, finger-tracking day swipe */
(function(){
  const page = $('#page-book');
  let sx=0, sy=0, locked=null, active=false;
  page.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1 || sheetOpen()){ active=false; return; }
    if(e.target.closest('.rail') || e.target.closest('.chips')){ active=false; return; }
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; locked = null; active = true;
  }, {passive:true});
  page.addEventListener('touchmove', e=>{
    if(!active) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(locked === null){
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.6) locked = 'x';
      else if(Math.abs(dy) > 8) locked = 'y';
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      const s = $('#dayslide');
      if(s){
        s.classList.add('drag');
        s.style.transform = 'translateX('+(dx*0.32)+'px)';
        s.style.opacity = String(1 - Math.min(0.5, Math.abs(dx)/420));
      }
    }
  }, {passive:false});
  const end = e=>{
    if(!active) return; active = false;
    const s = $('#dayslide');
    if(s){ s.classList.remove('drag'); s.style.transform = ''; s.style.opacity = ''; }
    if(locked !== 'x') return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if(!t) return;
    const dx = t.clientX - sx;
    if(dx < -56) stepDay(1);
    else if(dx > 56) stepDay(-1);
  };
  page.addEventListener('touchend', end, {passive:true});
  page.addEventListener('touchcancel', end, {passive:true});
})();

function jumpToClass(date, bid){
  const go = ()=>{
    const row = document.getElementById('row-'+bid);
    const page = $('#page-book');
    if(row && page){
      const y = row.getBoundingClientRect().top - page.getBoundingClientRect().top + page.scrollTop;
      page.scrollTop = Math.max(0, y - 200);
      row.classList.add('flash');
      setTimeout(()=>row.classList.remove('flash'), 1700);
    }
  };
  switchTab('book');
  if(studioFilter !== 'all'){ studioFilter = 'all'; }
  if(date !== selDate){ selDate = date; railScroll = null; renderBook(); setTimeout(go, 60); }
  else { renderBook(); setTimeout(go, 60); }
}

/* ── delegated events ───────────────────────────────────────── */
document.addEventListener('click', function(e){
  const T = sel => e.target.closest(sel);

  const tab = T('.tabbtn'); if(tab){ switchTab(tab.dataset.tab); return; }

  const dcell = T('[data-date][data-act="jump"]');
  if(dcell){ jumpToClass(dcell.dataset.date, dcell.dataset.bid); return; }

  const dc = T('.dcell[data-date]');
  if(dc){ const d = dc.dataset.date; setDay(d, d > selDate ? 1 : -1); return; }

  const chip = T('[data-studio]'); if(chip){
    studioFilter = chip.dataset.studio;
    $$('.chip').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.studio===studioFilter)));
    const slide = $('#dayslide');
    if(slide) slide.style.opacity = '.3';
    const chips = $('#chips'); const cs = chips ? chips.scrollLeft : 0;
    setTimeout(()=>{ renderBook(); const c2 = $('#chips'); if(c2) c2.scrollLeft = cs; }, 100);
    return;
  }

  const bk = T('[data-book]'); if(bk){ bookNow(bk.dataset.book, false); return; }

  const pt = T('[data-pick]'); if(pt){
    const c = findClass(pt.dataset.pick);
    if(c){
      const on = togglePick(c.day, c.time, c.studio, c.name);
      pt.setAttribute('aria-pressed', String(on));
      const row = pt.closest('.crow'); if(row) row.classList.toggle('ispick', on);
      const clash = on ? picks.find(p => p.studio===c.studio && p.day===c.day && p.time!==c.time) : null;
      if(clash) toast('Heads up: you already pick '+fmt12(clash.time).full+' '+(SLABEL[c.studio]||c.studio)+' on '+c.day+' — FIT allows one per studio per day', 4200);
      safeRender('picks', renderPicks);
    }
    return;
  }
  const rm = T('[data-remove]'); if(rm){
    const a = rm.dataset.remove.split('|');
    togglePick(a[0], a[1], a[2], '');
    safeRender('picks', renderPicks);
    safeRender('book', renderBook);
    return;
  }
  const cn = T('[data-cancel]'); if(cn){ cancelBooking(Number(cn.dataset.cancel)); return; }

  const act = T('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a === 'sync') syncNow();
    else if(a === 'snipe') firePass();
    else if(a === 'connect') connect();
    else if(a === 'reload') loadAll();
    else if(a === 'goBook') switchTab('book');
    else if(a === 'goPicks') switchTab('picks');
    else if(a === 'close') closeSheet();
    else if(a === 'booknow'){ closeSheet(); setTimeout(()=>bookNow(act.dataset.bid, true), 200); }
    else if(a === 'togglepick'){
      const c = findClass(act.dataset.bid);
      if(c){
        const on = togglePick(c.day, c.time, c.studio, c.name);
        act.setAttribute('aria-checked', String(on));
        safeRender('picks', renderPicks);
        safeRender('book', renderBook);
      }
    }
    return;
  }

  const row = T('.crow[data-bid]'); if(row){ openClassSheet(row.dataset.bid); return; }
}, false);

$('#infoBtn').addEventListener('click', openInfoSheet);

/* ── live countdowns (hero ticks every second) ──────────────── */
let flipQueued = false;
setInterval(function(){
  try{
    if(!booted) return;
    const now = Date.now();
    let flip = false;
    const nodes = document.querySelectorAll('[data-cd]');
    for(let i=0;i<nodes.length;i++){
      const el = nodes[i], at = Number(el.dataset.cd), mode = el.dataset.cdmode || 'hero';
      const left = at - now;
      if(left <= 0){ flip = true; continue; }
      if(mode === 'hero'){ el.textContent = cdText(left); }
      else if(mode === 'pick'){ const s = el.lastElementChild; if(s) s.textContent = 'Books in '+relTime(left); }
      else if(mode === 'free'){ const s = el.lastElementChild; if(s) s.textContent = 'Free cancel for '+relTime(left); }
    }
    if(flip && !flipQueued){
      flipQueued = true;
      setTimeout(()=>{ flipQueued = false; heroCache = null; renderAll(); }, 500);
    }
  }catch(e){}
}, 1000);

/* keep the lists honest as classes fall into the past */
setInterval(function(){
  try{
    if(!booted || sheetOpen()) return;
    heroCache = null;
    indexDates();
    const p = $('#page-'+activeTab), s = p ? p.scrollTop : 0;
    renderAll();
    if(p) p.scrollTop = s;
  }catch(e){}
}, 300000);

/* ── boot ───────────────────────────────────────────────────── */
(function boot(){
  try{
    if(!token){ renderSetup(''); return; }
    $('#w-book').innerHTML = '<div class="ltitle">Book</div>'+
      '<div class="emptystate"><div class="es">Loading your timetable…</div></div>';
    loadAll();
  }catch(e){
    try{ $('#w-book').innerHTML = errorBlock(e); }catch(x){}
  }
})();
</script>
</body>
