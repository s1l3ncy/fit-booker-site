/* ════════════════════════════════════════════════════════════════
   Toast + sheets
   ════════════════════════════════════════════════════════════════ */
/* One element and one timer meant the second of two messages in the same pass simply
   replaced the first, unseen — and two settle decisions land in the same pass routinely.
   Queue them: every message is shown for its own duration, in order. Anything that
   matters beyond a few seconds is ALSO written to `alerts` (see pushAlert), because a
   toast cannot survive being backgrounded and must never be the only witness. */
let toastTimer = null, toastQueue = [], toastShowing = false;
function toast(msg, ms){
  if(msg == null || msg === '') return;
  toastQueue.push({msg: String(msg), ms: ms || 2800});
  if(toastQueue.length > 8) toastQueue.splice(0, toastQueue.length - 8);
  pumpToast();
}
function pumpToast(){
  if(toastShowing) return;
  const next = toastQueue.shift();
  const t = $('#toast'); if(!t) return;
  if(!next){ t.classList.remove('on'); return; }
  toastShowing = true;
  $('#toastText').textContent = next.msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    t.classList.remove('on');
    /* let the fade finish before the next one starts, so two messages never read as one */
    toastTimer = setTimeout(()=>{ toastShowing = false; pumpToast(); }, 260);
  }, next.ms);
}

/* ── persistent notices ────────────────────────────────────────────────────────────
   `id` makes a notice idempotent: the same condition re-detected on every poll updates
   one row rather than stacking. `tone` drives the colour. `until` (optional) is a
   predicate name resolved in alertResolved() so a notice can retire itself when the
   thing it warns about is genuinely fixed. */
function alertsKey(){ return memberKey('alerts'); }
function loadAlerts(){
  try{
    const raw = localStorage.getItem(alertsKey());
    const v = raw ? JSON.parse(raw) : null;
    alerts = Array.isArray(v) ? v.filter(a => a && a.id) : [];
  }catch(e){ alerts = []; }
}
function persistAlerts(){
  try{
    if(!USER) return;
    if(alerts.length) localStorage.setItem(alertsKey(), JSON.stringify(alerts.slice(-12)));
    else localStorage.removeItem(alertsKey());
  }catch(e){}
}
/* ── row warnings that outlive the log entry they came from ─────────────────────────
   botRowWarnings() derives "Couldn't cancel this — cancel it in the FIT app or it becomes
   a no-show" from ONE `cancel_failed` entry. The bot keeps only the last 200 entries and
   has become far chattier (`recheck`, `book_attempt`, `*_transport_error`, `*_recovered`),
   so that entry can age out of the file while the booking is still sitting on the account,
   silently taking the warning with it — the app would stop warning about a no-show that is
   still coming. A booking's status does not expire because a log did, so once the app has
   seen the warning it keeps it, per member, in localStorage.
   It is not "sticky forever": it is cleared the moment either half of what it asserts
   stops being true — a later settling entry (`cancelled` / `cancel_recovered`) proves the
   booking is gone, or the booking simply leaves the FIT account list. */
let stickyWarn = {};
function stickyWarnKey(){ return memberKey('rowwarn'); }
function loadStickyWarn(){
  try{
    const v = JSON.parse(localStorage.getItem(stickyWarnKey()) || 'null');
    stickyWarn = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  }catch(e){ stickyWarn = {}; }
}
function persistStickyWarn(){
  try{
    if(!USER) return;
    const keys = Object.keys(stickyWarn);
    if(keys.length) localStorage.setItem(stickyWarnKey(), JSON.stringify(stickyWarn));
    else localStorage.removeItem(stickyWarnKey());
  }catch(e){}
}
/* Write a row warning the app worked out for itself (rather than read out of the bot log)
   into the SAME member-scoped persisted store, so it behaves identically: it is drawn on
   the booking row it is about, it survives a relaunch, and it retires itself when the
   booking leaves the FIT account or the bot logs a settling outcome for it. This is how a
   cancel that provably did not happen stays loud without the app having to keep anything
   in memory. */
function setStickyRowWarn(b, warn){
  const k = (bookingRowKeys(b) || [])[0];
  if(!k || !warn) return;
  stickyWarn[k] = warn;
  persistStickyWarn();
}
function pushAlert(a){
  if(!a || !a.id) return;
  const i = alerts.findIndex(x => x.id === a.id);
  const rec = {id:a.id, tone:a.tone||'amber', title:a.title||'', body:a.body||'',
               at: Date.now(), tab: a.tab || 'booked'};
  if(i >= 0) alerts[i] = rec; else alerts.push(rec);
  persistAlerts();
}
function dropAlert(id){
  const n = alerts.length;
  alerts = alerts.filter(a => a.id !== id);
  if(alerts.length !== n) persistAlerts();
}
/* A notice AND a toast: the toast catches the eye now, the notice is still there in an
   hour when the app is reopened. Strike-relevant outcomes always use this. */
function announce(a){
  pushAlert(a);
  toast((a.title ? a.title+' — ' : '') + a.body, a.ms || 5200);
}
function alertsHTML(tab){
  const mine = alerts.filter(a => (a.tab || 'booked') === tab);
  if(!mine.length) return '';
  return '<div class="group" style="margin-top:12px">' + mine.map(a =>
    '<div class="rulerow"><div class="ri" data-tone="'+(a.tone==='bad'?'bad':'amber')+'">'+G.warn+'</div>'+
    '<div class="rt"><b>'+esc(a.title||'Heads up')+'</b><span>'+esc(a.body)+'</span></div>'+
    '<button class="btn-sm" data-dismiss="'+esc(a.id)+'" aria-label="Dismiss this notice">Got it</button>'+
    '</div>').join('') + '</div>';
}
function sheetOpen(){ return !!$('#sheetRoot').innerHTML; }
/* F1 — the wipe that finishes the dismiss animation MUST be cancellable and MUST belong to
   the sheet that scheduled it. It used to be a bare setTimeout: any sheet opened inside the
   460ms window (booknow -> confirm, confirm-Cancel -> class sheet, Info -> Data) was deleted
   out from under the user by the PREVIOUS close's timer, and an actionSheet destroyed that
   way never resolved its promise, so bookNow() hung forever and nothing was ever dispatched.
   This is the app's primary booking path. */
let sheetWipeTimer = null;
function cancelSheetWipe(){ if(sheetWipeTimer){ clearTimeout(sheetWipeTimer); sheetWipeTimer = null; } }
function closeSheet(){
  const root = $('#sheetRoot');
  const sc = $('.scrim', root), sh = $('.sheet', root);
  if(sc) sc.classList.remove('on');
  if(sh) sh.classList.remove('on');
  /* F12 — release the shell as soon as the dismiss starts, not when the node is wiped */
  try{ $('#app').removeAttribute('inert'); }catch(e){}
  cancelSheetWipe();
  const mine = sh;                      // key the teardown to THIS sheet instance
  sheetWipeTimer = setTimeout(()=>{
    sheetWipeTimer = null;
    /* if something opened a new sheet in the meantime, `mine` is no longer in the DOM and
       this timer has nothing left to do */
    if(!mine || root.contains(mine)) root.innerHTML = '';
  }, 460);
}
function openSheet(innerHTML, extraClass){
  const root = $('#sheetRoot');
  cancelSheetWipe();                    // F1 — a new sheet cancels the pending wipe
  root.innerHTML = '<div class="scrim"></div><div class="sheet '+(extraClass||'')+
    '" role="dialog" aria-modal="true">'+innerHTML+'</div>';
  const sc = $('.scrim', root), sh = $('.sheet', root);
  sc.addEventListener('click', ()=> closeSheet());
  /* F12 — standalone has no browser chrome to escape to, so the shell behind the scrim has
     to be genuinely unreachable; otherwise VoiceOver swipes straight past it onto Book
     buttons the user cannot see. */
  try{ $('#app').setAttribute('inert',''); }catch(e){}
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ sc.classList.add('on'); sh.classList.add('on'); }); });
  return root;
}
/* UIAlertController-style action sheet — never window.confirm() */
function actionSheet(opts){
  return new Promise(resolve=>{
    const acts = opts.actions || [];
    let html = '<div class="as-group">';
    if(opts.title || opts.message){
      html += '<div class="as-title">'+(opts.title?'<b>'+esc(opts.title)+'</b>':'')+
              (opts.message?esc(opts.message):'')+'</div>';
    }
    acts.forEach((a,i)=>{
      html += '<button class="as-btn '+(a.style==='destructive'?'destructive':'')+' '+
              (a.style==='default'?'bold':'')+'" data-as="'+i+'">'+esc(a.label)+'</button>';
    });
    html += '</div><div class="as-cancel"><button class="as-btn" data-as="-1">'+
            esc(opts.cancelLabel||'Cancel')+'</button></div>';
    const root = openSheet(html, 'asheet');
    const mine = $('.sheet', root);
    let done = false, obs = null;
    const onClick = e=>{
      const b = e.target.closest('[data-as]');
      if(b) finish(Number(b.dataset.as));
      else if(e.target.classList.contains('scrim')) finish(-1);
    };
    const teardown = ()=>{ if(obs) obs.disconnect(); root.removeEventListener('click', onClick); };
    const finish = v => { if(done) return; done = true; teardown(); closeSheet(); resolve(v); };
    /* F1 belt-and-braces: if this sheet is torn out of the DOM by anything other than
       finish() — a stale wipe, another sheet, bailToSetup() — resolve as cancelled rather
       than leaving the awaiting caller hung forever. */
    if(window.MutationObserver){
      obs = new MutationObserver(()=>{
        if(!done && mine && !root.contains(mine)){ done = true; teardown(); resolve(-1); }
      });
      obs.observe(root, {childList:true});
    }
    root.addEventListener('click', onClick);
  });
}

/* ════════════════════════════════════════════════════════════════
   Worker API (contract §2–§4)
   ════════════════════════════════════════════════════════════════ */
/* Every call is the same shape: POST JSON to WORKER_URL + path with the session folded in,
   get JSON back with an `ok` flag. The Worker resolves the session to a member and scopes
   the read/write itself, so a path can never name someone else's data.

   F22 — the 12s abort stops one hung cell pinning `loadingNow` for iOS's full network
   timeout, during which every poll and every pull-to-refresh was a silent no-op.

   Errors are thrown with the HTTP status IN THE MESSAGE, because isAuthErr() (and every
   caller that funnels through handleApiErr) recognises an expired session by finding
   '401' in the text. The raw response is attached as `.res` so the 409 merge path in
   savePicks() can read the server's copy of the list. */
async function wapi(path, payload){
  const ac = ('AbortController' in window) ? new AbortController() : null;
  const kill = ac ? setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, 12000) : null;
  try{
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({session: session}, payload || {})),
      cache:'no-store', signal: ac ? ac.signal : undefined});
    let d = null;
    try{ d = await r.json(); }catch(e){}
    if(!d || !d.ok){
      const err = new Error(((d && d.error) || (path+' failed')) + ' ('+r.status+')');
      err.status = r.status;
      err.res = d || null;
      throw err;
    }
    return d;
  } finally { if(kill) clearTimeout(kill); }
}
async function dispatch(workflow, inputs){
  /* booknow acts on ONE member's account. The Worker stamps the member from the session,
     so sending a `user` input is both pointless and ignored — and that is the whole point
     of the change: a client can no longer ask to act as somebody else. */
  await wapi('/dispatch', {workflow: workflow, inputs: inputs || {}});
}
/* CONTRACT §1b — "any 401 from any endpoint means sign in again". Read the STATUS, never
   the message: this used to sniff the text for '401'/'403', and the Worker's dispatch
   errors quote GitHub's own status back ("Could not start that run (403)"), so a problem
   with the WORKER's GitHub token signed the MEMBER out of an app whose session was fine —
   and signing in again could not possibly fix it. The Worker now keeps those digits out of
   the message as well; this is the half that cannot be got wrong from the other side. */
function isAuthErr(e){
  const st = e && typeof e.status === 'number' ? e.status : null;
  return st === 401 || st === 403;
}
/* Did the Worker DEFINITELY refuse, or do we simply not know?
   `wapi` throws for three different things and only one of them is knowledge:
     • a JSON answer that says no (any status < 500, including a 200 with ok:false) —
       the Worker made a decision and no workflow was started. We may say so.
     • a 5xx, a 408/429, a dropped connection, or our own 12s abort — the request may
       have reached GitHub and dispatched the run. We know NOTHING. Saying "nothing was
       booked" here is the app asserting a state it cannot observe, and the audit caught
       exactly that: the class was booked on FIT while the app declared it wasn't.
   Anything not provably a refusal is treated as unknown, and unknown means the pending
   record stays and the settle window decides. */
function isDefiniteReject(e){
  const st = e && typeof e.status === 'number' ? e.status : null;
  if(st === null) return false;                       // network failure or client abort
  if(st >= 500 || st === 408 || st === 429) return false;
  return true;
}
/* CONTRACT §2: ANY 401/403 clears the session and returns to setup — not just the
   initial load, or an expired session leaves the user tapping Save forever. */
function bailToSetup(msg){
  booted = false;
  stopPolling(); clearPostPoll(); syncing = false; syncStartedAt = 0;
  fastUntil = 0;
  /* F24 — these timers were left running behind the setup screen forever */
  clearDispatchWatch();
  closeSheet();
  /* This lands on the sign-in screen, and the next person to use it may not be the one
     who was just here. Erase EVERYTHING — draft picks, saved picks + sha, bookings,
     timetable, log, notices, the cached payload, the member identity — not just the
     session. The audit demonstrated the alternative: a failed first load rendered the
     previous member's bookings, with a working Cancel button. */
  wipeMemberState();
  renderSetup(msg || 'Your session expired. Sign in again.');
}
function handleApiErr(e){
  if(isAuthErr(e)){ bailToSetup(); return true; }
  return false;
}
function safeParse(txt, fallback){ try { return txt ? JSON.parse(txt) : fallback; } catch(e){ return fallback; } }

/* F22 — returns true when this call actually did the work, false when it was debounced
   away. Pull-to-refresh needs to know, or it tells the user "Up to date" having done
   nothing at all — at the exact moment they are pulling BECAUSE they think it is stuck. */
/* The ONE entry point that establishes a live app — used by boot, by sign-in, and by
   nothing else. Polling and `booted` are established whatever the load did, because the
   manual controls that used to rescue a stranded app were deliberately removed: if this
   path can fail to arm the timers, the only remedy left on the phone is a force-quit. */
function bootLoad(){
  return loadAll()
    .catch(e => { if(window.console && console.warn) console.warn('bootLoad', e); })
    .then(()=>{
      try{
        if(!session) return;              // a 401 during the load already sent us to sign-in
        booted = true;                    // …even if the load itself failed
        startPolling();
        if(isStale()) autoSync();
        /* a throw partway through the load can leave the boot placeholder on screen —
           draw the real screens from whatever state we do have */
        renderAll();
      }catch(e){ if(window.console && console.warn) console.warn('bootLoad tail', e); }
    });
}
async function loadAll(silent){
  if(loadingNow) return false;    // debounce: poll + visibility + PTR can all land at once
  loadingNow = true;
  try{ await loadAllInner(silent); return true; } finally { loadingNow = false; }
}
/* F18 — the old four-file read used ETags so a 45s poll that found nothing new was free
   and, more importantly, did not re-render. POST /data is a single unconditional call, so
   the cheap check moves up a layer: stringify what came back and compare it with the last
   payload. Identical ⇒ nothing on screen can legitimately differ, so skip renderAll() and
   leave scroll positions, the chip rail and any open sheet exactly as they were. */
let lastDataJson = null;
async function loadAllInner(silent){
  let unchanged = false;
  freshFromServer = false;
  /* an identical payload only means "nothing to redraw" if the screen was not showing an
     offline banner a moment ago — clearing that banner IS a change */
  const hadError = loadError !== null;
  /* a background refresh must never silently eat pick edits the user hasn't saved */
  const keepLocalPicks = !!(silent && isDirty());
  try{
    /* ONE call replaces the four file reads. The Worker picks the member from the session,
       so there is no per-member path to get wrong here any more. */
    /* Advertise that this build can CONFIRM. The Worker refuses to arm the sweep for a
       member whose phone has not been seen sending this, so an app that predates the
       feature can never have its classes auto-cancelled with no way to keep them. Deploy
       order is supposed to prevent that; this makes it impossible rather than intended. */
    const d = await wapi('/data', {ui: UI_CAPS});
    /* confirm + sweepArmed are part of the change hash. Leaving them out would mean a
       confirmation landing from another device, or the sweep being armed, never redrew
       the Booked tab — the row would keep offering a Confirm button for something already
       confirmed, and keep promising an auto-cancel that had just become real. */
    const fresh = JSON.stringify([d.timetable, d.bookings, d.log, d.picks, d.picksSha,
                                  d.confirm, d.sweepArmed]);
    unchanged = (lastDataJson !== null && fresh === lastDataJson);
    lastDataJson = fresh;

    /* the Worker is authoritative about who this session is — keep the local copy in step
       so the Sign out label and the boot-time defaults never drift */
    if(d.user) USER = d.user;
    if(typeof d.name === 'string') USERNAME = d.name;
    try {
      localStorage.setItem('fitbooker_user', USER);
      localStorage.setItem('fitbooker_name', USERNAME);
    } catch(e){}

    const tt = d.timetable;
    if(tt && Array.isArray(tt.classes)) timetable = tt;
    const bk = d.bookings;
    if(bk && Array.isArray(bk.bookings)) bookings = bk;
    /* the server's list is authoritative, so an optimistic row has to be re-applied to
       every copy of it — see reconcilePending() */
    /* only replace the activity list when the log actually came back as a list — a
       malformed payload must not blank it while the banner claims a cached view */
    if(Array.isArray(d.log)) logdata = d.log;
    /* Only replace on a real list. The Worker sends `null` when the file could not be
       parsed, and an old Worker sends nothing at all; neither may be read as "nothing is
       on the roster and nothing is confirmed", because that hides every Confirm button
       while the bot goes on cancelling. Keeping the last good copy is strictly safer. */
    if(Array.isArray(d.confirm)) confirmData = d.confirm;
    /* NOT retained, unlike confirmData. The two point in opposite safety directions:
       keeping the last roster leaves MORE Confirm buttons on screen, which is harmless;
       keeping the last `true` leaves the app promising "this cancels itself" after it
       has lost the ability to check — and a Worker that stops sending the field is a
       Worker with no sweep, so the class becomes a no-show while the app says it will
       remove itself. Cannot tell and off must read identically. */
    sweepArmed = (typeof d.sweepArmed === 'boolean') ? d.sweepArmed : false;
    sweepPaused = d.sweepPaused === true;
    /* correctness #12 — the sha is captured even for an empty list, or every later save
       is rejected as a conflict for a file that never changed. null is legitimate: it
       means this member has never saved, and /picks takes sha:null for that case. */
    picksSha = (typeof d.picksSha === 'string' && d.picksSha) ? d.picksSha : null;
    if(Array.isArray(d.picks)){
      if(keepLocalPicks) savedPicksJson = JSON.stringify(d.picks);   // keep the edits, rebase "saved"
      else picks = d.picks;
    }
    if(!keepLocalPicks) savedPicksJson = JSON.stringify(picks);
    loadError = null;
    freshFromServer = true;
  }catch(e){
    unchanged = false;
    if(isAuthErr(e)){ bailToSetup(); return; }
    loadError = 'Couldn’t reach the booking service. Showing the last data this device loaded.';
    if(!silent) toast('Offline — showing the cached view', 3200);
  }
  /* F7 — first load after a cold launch: if this device was killed mid-edit, put the draft
     back and leave the app dirty so the save bar reappears. Done here, not earlier, because
     savedPicksJson only becomes the real server baseline once the load has landed. */
  if(!booted){
    try{
      const draft = readDraft();
      if(draft && JSON.stringify(draft) !== savedPicksJson){
        picks = draft;
        toast('Restored unsaved pick changes — tap Save picks', 4200);
      } else if(draft){ localStorage.removeItem(draftKey()); }
    }catch(e){}
    try{ loadAlerts(); }catch(e){}
    try{ loadStickyWarn(); }catch(e){}
  }
  /* Everything from here on is bookkeeping over data that has already landed, and NONE of
     it may be allowed to strand the app. It used to be bare: a throw out of
     reconcilePending() or indexDates() meant boot's `loadAll().then(startPolling…)` never
     ran, `booted` stayed false, every poll early-returned forever and — with the manual
     controls deliberately gone — the only way out was a force-quit. `booted` is now set
     first and each step is independently contained, so a partly-failed load still leaves a
     live, polling app. */
  booted = true;
  let settled = false;
  /* Optimistic book/cancel rows are re-applied to (or resolved against) the list that just
     landed, BEFORE anything reads it. `settled` is true when a pending action was decided
     this pass — a decision the user must see even if the payload itself was byte-identical. */
  try{ settled = reconcilePending(); }
  catch(e){ if(window.console && console.warn) console.warn('reconcilePending', e); }
  try{ syncBotAlerts(); }
  catch(e){ if(window.console && console.warn) console.warn('syncBotAlerts', e); }
  try{ indexDates(); }
  catch(e){ if(window.console && console.warn) console.warn('indexDates', e); }
  /* a sync we started has landed the moment the stamps move past the baseline */
  try{
    if(syncing){
      const t = dataUpdatedMs();
      if(t !== null && (syncBaseline === null || t > syncBaseline)){
        syncing = false; syncStartedAt = 0; clearPostPoll();
      }
    }
    reapSync();                     // F2 — a sync past its deadline is not in flight
  }catch(e){}
  /* the poll's cheap path: byte-identical data, no banner to clear and no pending action
     that just resolved ⇒ nothing on screen can legitimately differ, so don't rebuild it */
  /* the fast poll exists only to settle pending actions; the moment there are none it
     has nothing to watch. Doing this here (rather than only inside the fast timer's own
     tick) means ANY load that resolves the last pending action ends it immediately. */
  try{ if(fastTimer && !pendingCancels.length && !pendingBooks.length && !pendingConfirms.length && !syncing) stopFastPoll(); }catch(e){}
  try{
    if(unchanged && !hadError && !settled && !pendingCancels.length) updateNav();
    else renderAllIdle();
  }catch(e){ if(window.console && console.warn) console.warn('render', e); }
}

function indexDates(){
  const set = {};
  (timetable.classes||[]).forEach(c=>{ if(c && c.date) set[c.date] = true; });
  const all = Object.keys(set).sort();
  const today = sydToday();
  /* days already gone can never be booked — keeping them only pushed the strip's
     scroll offset around and made "today" hard to find */
  allDates = all.filter(d => d >= today);
  if(!allDates.length) allDates = all;
  if(!selDate || allDates.indexOf(selDate) < 0){
    if(allDates.indexOf(today) >= 0 && dayHasClasses(today)) selDate = today;
    else selDate = allDates.filter(dayHasClasses)[0] || allDates[0] || today;
  }
  syncWeek();
}

/* ── one-week-at-a-time strip: paging bounds (§2) ───────────────── */
function firstWeek(){ return mondayOf(sydToday()); }          // never a fully-past week
function lastWeek(){
  const last = allDates.length ? allDates[allDates.length-1] : sydToday();
  const m = mondayOf(last);
  return m < firstWeek() ? firstWeek() : m;
}
function clampWeek(ws){
  const a = firstWeek(), b = lastWeek();
  return ws < a ? a : (ws > b ? b : ws);
}
/* the visible week defaults to the one holding the selected day and is never a week
   that is entirely in the past */
function syncWeek(){
  if(!weekStart) weekStart = mondayOf(selDate || sydToday());
  weekStart = clampWeek(weekStart);
}

/* ════════════════════════════════════════════════════════════════
   Picks
   ════════════════════════════════════════════════════════════════ */
/* A pick is either RECURRING  {day,time,studio,name}
   or ONE-OFF               {day,time,studio,name,date:"YYYY-MM-DD"}
   — the bot reads the optional `date` field to restrict a pick to a single day. */
function pickDate(p){ return (p && p.date) ? String(p.date) : ''; }
function isOneOff(p){ return !!pickDate(p); }
function pickKey(p){ return p.day+'|'+p.time+'|'+p.studio+'|'+pickDate(p); }
function samePick(a,b){
  return a.day===b.day && a.time===b.time && a.studio===b.studio && pickDate(a)===pickDate(b);
}
/* index of an exact pick; `date` omitted/'' means the recurring one */
function pickIndex(day,time,studio,date){
  const d = date || '';
  return picks.findIndex(p => p.day===day && p.time===time && p.studio===studio && pickDate(p)===d);
}
/* the pick that covers THIS class occurrence — recurring wins, else a one-off on its date */
function pickFor(c){
  const rec = pickIndex(c.day,c.time,c.studio,'');
  if(rec >= 0) return picks[rec];
  const one = pickIndex(c.day,c.time,c.studio,c.date);
  return one >= 0 ? picks[one] : null;
}
function isPicked(c){ return !!pickFor(c); }

function addPick(day,time,studio,name,date){
  const p = {day:day, time:time, studio:studio, name:name||''};
  if(date) p.date = date;
  if(pickIndex(day,time,studio,date||'') < 0) picks.push(p);
  heroCache = null; syncDirty();
  return true;
}
function removePick(day,time,studio,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) picks.splice(i,1);
  heroCache = null; syncDirty();
  return false;
}
/* legacy signature kept for the recurring path (sheet switch, remove buttons) */
function togglePick(day,time,studio,name,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) return removePick(day,time,studio,date);
  return addPick(day,time,studio,name,date);
}
function isDirty(){ return JSON.stringify(picks) !== savedPicksJson; }
/* F7 — iOS purges backgrounded home-screen web apps without warning, and picks/
   savedPicksJson lived only in memory: an unsaved pick edit had exactly one lifetime,
   until the user took a phone call. Mirror the dirty buffer into localStorage on
   every edit; the key is removed the moment the list matches the server again.

   The key is scoped per member and the payload carries the member it belongs to. It used
   to be ONE global key: the audit restored Josh's unsaved draft into his partner's
   session, where a single tap on Save would have written his picks to her account. */
function draftKey(){ return memberKey('draft_picks'); }
function saveDraft(){
  try{
    if(!USER) return;                       // no member ⇒ no member-scoped bucket to use
    if(isDirty()) localStorage.setItem(draftKey(), JSON.stringify({u:USER, p:picks}));
    else localStorage.removeItem(draftKey());
  }catch(e){}
}
/* Restore only a draft that is provably this member's — the key says so and so does the
   payload. A mismatch is deleted, never shown. */
function readDraft(){
  try{
    if(!USER) return null;
    const raw = localStorage.getItem(draftKey());
    if(!raw) return null;
    const v = JSON.parse(raw);
    if(v && typeof v === 'object' && Array.isArray(v.p) && v.u === USER) return v.p;
    localStorage.removeItem(draftKey());
  }catch(e){}
  return null;
}
function syncDirty(){
  const app = $('#app'), d = isDirty();
  app.classList.toggle('dirty', d);
  saveDraft();
  if(d){
    const saved = safeParse(savedPicksJson, []);
    const added = picks.filter(p => !saved.some(q=>samePick(q,p))).length;
    const removed = saved.filter(q => !picks.some(p=>samePick(p,q))).length;
    const bits = [];
    if(added) bits.push(added+' added');
    if(removed) bits.push(removed+' removed');
    $('#saveTitle').textContent = bits.join(', ') || 'Picks changed';
    const once = picks.filter(isOneOff).length;
    $('#saveSub').textContent = picks.length + (picks.length===1?' pick':' picks') +
      (once ? ' ('+once+' one-off)' : '') + ' after saving';
  }
  updateBadges();
}
function updateBadges(){
  /* The Booked badge counts what NEEDS DOING, not what exists. There are no push
     notifications — the confirm prompt is only ever seen by opening the app — so the badge
     is the only thing that can carry "something here will delete itself if you ignore it".
     A count of bookings carried no such information: it was the same number whether
     everything was settled or three classes were hours from cancelling themselves.
     It goes to zero, and off, the moment nothing is waiting on him. */
  const nb = ((bookings&&bookings.bookings)||[]).filter(needsConfirm).length;
  const bb = $('#badgeBooked');
  bb.textContent = nb > 99 ? '99+' : String(nb);
  bb.classList.toggle('on', nb > 0);
  const np = picks.length;
  const pb = $('#badgePicks');
  pb.textContent = np > 99 ? '99+' : String(np);
  pb.classList.toggle('on', np > 0 || isDirty());
  if(np === 0 && isDirty()) pb.textContent = '0';
}

async function savePicks(){
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    let res;
    try{
      res = await wapi('/picks', {picks: picks, sha: picksSha});
    }catch(e1){
      if(e1 && (e1.status === 401 || e1.status === 403)){
        bailToSetup('This app has lost write access to your bookings. Sign in again.');
        return;
      }
      if(!(e1 && e1.status === 409)) throw e1;
      /* correctness #12 — the app KNEW the remote had changed, then invited the user to
         press a button that uploads his in-memory list verbatim over it. (The bot removes
         a one-off the moment it books it; "tap Save again" resurrected it.) MERGE instead:
         keep everything he added, keep everything they added, and honour his removals
         only. Nothing the user typed is ever discarded silently. The Worker hands back the
         current list and sha with the 409, so no extra read is needed. */
      const cur = e1.res || {};
      picksSha = (typeof cur.sha === 'string' && cur.sha) ? cur.sha : null;
      const theirs = Array.isArray(cur.picks) ? cur.picks : null;
      let merged = null;
      if(theirs){
        const base = safeParse(savedPicksJson, []);
        const iAdded   = picks.filter(p => !base.some(q=>samePick(q,p)));
        const iRemoved = base.filter(q => !picks.some(p=>samePick(p,q)));
        merged = theirs.filter(t => !iRemoved.some(q=>samePick(q,t)))
                       .concat(iAdded.filter(p => !theirs.some(t=>samePick(t,p))));
      }
      if(!merged) throw new Error('Picks changed elsewhere — tap Save picks again');
      picks = merged; heroCache = null; syncDirty(); renderPicks(); renderBook();
      /* retry ONCE, against the sha the conflict just handed us. If that also conflicts
         the list is being edited from two places right now — stop and let the user look. */
      try{
        res = await wapi('/picks', {picks: picks, sha: picksSha});
      }catch(e2){
        if(e2 && (e2.status === 401 || e2.status === 403)){
          bailToSetup('This app has lost write access to your bookings. Sign in again.');
          return;
        }
        if(e2 && e2.status === 409 && e2.res && typeof e2.res.sha === 'string') picksSha = e2.res.sha;
        throw new Error('Picks had also changed elsewhere — merged. Check the list, then Save again.');
      }
    }
    if(res && typeof res.sha === 'string' && res.sha) picksSha = res.sha;
    savedPicksJson = JSON.stringify(picks);
    syncDirty();
    heroCache = null;
    renderPicks(); renderBook();
    toast('Picks saved — the bot will book them automatically');
    maybeKickSnipe();
  }catch(e){
    toast(String(e.message || e), 4200);
  }finally{
    btn.disabled = false; btn.textContent = 'Save picks';
  }
}

/* Mirror of the bot's bookable_occurrence (contract §4).
   correctness #6 — the bot subtracts 7 days + 1 hour from an AWARE Australia/Sydney
   datetime, which Python evaluates as WALL-CLOCK arithmetic: 7 calendar days back, then
   one hour. Subtracting 169 hours of absolute time (the old `(7*24*60+60)*60000`) is off
   by exactly 60 minutes for every class starting in the week after a DST change — next on
   4–10 Oct 2026 — so the UI and the bot disagreed about when a window opened.
   correctness #19d — the old scan also walked DEVICE-local days and used setHours(), so
   every countdown shifted if the phone left Sydney while the date strip stayed on Sydney
   dates. Both are solved by doing the whole thing in Sydney wall clock. */
function opensMsForSyd(dateStr, hhmm){
  const a = String(hhmm).split(':').map(Number);
  if(a.length < 2 || isNaN(a[0]) || isNaN(a[1])) return null;
  let h = a[0] - 1, day = String(dateStr);          // minus 1 hour, wall clock…
  if(h < 0){ h += 24; day = addDays(day, -1); }     // …which can cross midnight
  day = addDays(day, -7);                           // …and minus 7 CALENDAR days
  return sydWallToMs(day, String(h).padStart(2,'0')+':'+String(a[1]).padStart(2,'0'));
}
/* the class start itself, as a real instant, from Sydney wall fields */
function scanOpens(p, horizonDays){
  const now = Date.now(), wd = DAY_ORDER.indexOf(p.day);
  if(wd < 0) return null;
  const t0 = sydToday();
  for(let i=0;i<horizonDays;i++){
    const ds = addDays(t0, i);
    if(dowMon0(ds) !== wd) continue;
    const opens = opensMsForSyd(ds, p.time);
    if(opens === null) continue;                    // e.g. inside the DST gap — say nothing
    if(opens >= now - 20*60000) return opens;
  }
  return null;
}
function bookableOpensMs(p){ return scanOpens(p, 10); }
/* display-only: identical maths, longer horizon, so a countdown always exists */
function nextWindowMs(p){ return scanOpens(p, 21); }

/* A ONE-OFF pick is pinned to one calendar date, so its window is that date's
   start − 7d − 1h. bookableOpensMs above is the contract's recurring maths and is
   left byte-for-byte intact; this is the dated sibling, used only when p.date is set. */
function oneOffOpensMs(p){
  const now = Date.now();
  const c = (timetable.classes||[]).find(x => x && x.date===p.date && x.time===p.time && x.studio===p.studio);
  let opens = null;
  if(c && c.opens_iso){ const o = new Date(c.opens_iso).getTime(); if(isFinite(o)) opens = o; }
  if(opens === null) opens = opensMsForSyd(p.date, p.time);   // #6: calendar 7d+1h, not 169h
  if(opens === null) return null;
  return opens >= now - 20*60000 ? opens : null;
}
function pickOpensMs(p){ return isOneOff(p) ? oneOffOpensMs(p) : bookableOpensMs(p); }

async function maybeKickSnipe(){
  const now = Date.now();
  const imminent = picks.some(p => { const o = pickOpensMs(p); return o !== null && (o - now) <= 45*60000; });
  if(imminent){
    try{
      await dispatch('snipe.yml');
      /* silently — "a booking run started" is background work, and the row on Picks says
         what it needs to say by itself. Only the failure below speaks. */
      watchDispatch();
    }catch(e){
      /* correctness #19f — this used to swallow everything. It is the mechanism that
         removes the cron lead-time requirement; if it fails, "the bot will book them
         automatically" is a lie and nothing started. */
      if(!handleApiErr(e))
        toast('Saved, but the instant booking run didn’t start. The bot’s next scheduled ' +
              'pass will still try for this one.', 5200);
    }
  }
}

/* `autoSnipeIfOpen()` was DELETED. It fired unattended booking passes from the phone and
   every one of its three trigger conditions was wrong:
     • it fired for windows that opened long ago, which the bot structurally cannot book
       (its grace is 20 minutes) — burning its own retry budget on runs that can only fail;
     • it fired for a class the user had JUST cancelled, racing the cancel;
     • it fired for unsaved DRAFT picks that are not in picks.json, spending the debounce
       so the legitimate pass after Save was suppressed.
   It is also redundant: the Cloudflare Worker's every-minute cron dispatches snipe.yml
   from the generated schedule (AUTH.md), and saving picks triggers a pass server-side.
   Nothing replaces it — the phone does not decide when a booking pass runs. */

/* ════════════════════════════════════════════════════════════════
   Optimistic book / cancel
   ════════════════════════════════════════════════════════════════ */
/* A cancel (or a book) is a workflow_dispatch: the row cannot really change for ~a minute.
   Waiting for that is what made the app feel like a remote control rather than an app, so
   the list changes NOW and the server is reconciled against it afterwards.

   Two rules keep that honest:
     • a pending change is re-applied to every payload that lands, so a poll mid-flight
       cannot resurrect a cancelled row or drop a booked one;
     • if the server still disagrees SETTLE_MS after the dispatch, the change is put back
       the way it was and the user is told. A cancel that silently failed becomes a no-show,
       and three of those in 7 days is a booking ban — silence is the one unacceptable
       outcome here.
   IDENTITY IS FIT'S OWN BOOKING ID. It used to be date|time|studio with an unclassifiable
   studio silently guessed as 'exhale' — so two bookings at the same date+time, one of them
   unclassifiable, collided on one key. Cancel then re-found the row BY THAT KEY and spliced
   the wrong one off screen while telling the bot to cancel the other. Screen and reality
   ended up inverted, which is a no-show, which is a strike.
   Every account row carries `cancel_url` = /portal/account/cancelbooking/booking/1024573.
   That number identifies the booking and nothing else does. */
let pendingCancels = [];   // {key, at, b, idx, bookingId}
let pendingBooks   = [];   // {key, at, b, before:Set}
let pendingConfirms = [];  // {id, at, b}  — see confirmBooking()
let freshFromServer = false;   // did the load that is running right now actually land?

/* ── confirm-or-it-cancels ──────────────────────────────────────────────────────────
   The bot books classes the user never explicitly agreed to attend, and a booking he does
   not attend is a no-show: three in a rolling 7 days is a 7-day ban. So a bot-booked class
   has to be CONFIRMED here, and if it is not confirmed 4 hours before it starts, the bot
   cancels it. Not going is what happens unless he says otherwise.

   `confirmData` is data/<user>/confirm.json, an append-only event list with two writers
   (the bot records what it booked, the Worker records what the user confirmed). Both sets
   below are POSITIVE:

     autobooked  the BOT booked this and recorded FIT's booking id at the time
     confirmed   the user has said he is going

   A row is only ever at risk if it is in `autobooked`. That is the whole safety property:
   a class booked by tapping Book, booked in the FIT app, or booked at reception is never
   in that set, so it can never be auto-cancelled and never even shows a Confirm button.
   Nothing here infers "must be the bot's" from the absence of a confirmation — that would
   put every class the user booked himself elsewhere at risk of being deleted. */
let confirmData = [];
/* Is the sweep actually armed, or is it in dry run? Comes from the Worker. The app must
   NOT promise an auto-cancel that will not happen — CONTRACT §7, "things the UI must
   never claim". Default false: an app that cannot tell says the cautious thing. */
let sweepArmed = false;
/* Distinct from "switched off". The sweep has a daily run ceiling as a cost backstop, and
   hitting it means today's auto-cancels are not happening — which is a thing to act on,
   not a setting. Rows fall back to the cautious wording either way (sweepArmed is false);
   this only picks the explanation. */
let sweepPaused = false;
/* Sent on every /data call. The Worker records it per member and will not arm the sweep
   for anyone it has not seen — see worker.js `uiSeen`. */
const UI_CAPS = 'confirm1';
const CONFIRM_LEAD_MS = 4 * 3600000;      // must equal fitbot.SWEEP_LEAD_H
const CONFIRM_FLOOR_MS = 75 * 60000;      // must equal fitbot.SWEEP_FLOOR_MIN

function confirmState(){
  const autob = {}, conf = {};
  (Array.isArray(confirmData) ? confirmData : []).forEach(e=>{
    if(!e || typeof e !== 'object') return;
    const id = bookingId({booking_id: e.booking_id});
    if(!id) return;
    if(e.kind === 'autobooked'){ if(!autob[id]) autob[id] = e; }
    else if(e.kind === 'confirmed'){ conf[id] = e.ts || '1'; }
  });
  /* An optimistic confirm counts immediately — the tap is instant and silent like every
     other action here. If it turns out not to have stuck, reconcilePending() withdraws it
     and says so loudly, because an unconfirmed class WILL be cancelled. */
  pendingConfirms.forEach(p=>{ if(p && p.id) conf[p.id] = '1'; });
  return {autob: autob, conf: conf};
}
/* Does this row need confirming? Positive on every clause. */
function needsConfirm(b){
  if(!b || b.__pending) return false;
  const id = bookingId(b);
  if(!id) return false;
  const st = confirmState();
  return !!st.autob[id] && !st.conf[id];
}
/* When it will cancel itself: 4 hours before the class, as an INSTANT. bookingStartMs()
   already resolves the Sydney offset properly, so subtracting here is real elapsed time
   and stays correct across the 4 Oct 2026 DST change. */
function confirmDeadlineMs(b){
  const s = bookingStartMs(b);
  return s ? s - CONFIRM_LEAD_MS : null;
}
/* "2:00 am Sun 23 Aug", in Sydney, from an instant. */
function sydStampShort(ms){
  const p = sydParts(new Date(ms));
  return fmt12(p.hour+':'+p.minute).full + ' ' + shortDate(p.year+'-'+p.month+'-'+p.day);
}
/* FIT's numeric booking id, or '' when the row has no cancel link to read it from. */
function bookingId(b){
  if(!b) return '';
  const raw = String(b.booking_id || b.cancel_url || '').trim();
  if(raw.length > 256) return '';
  const m = raw.match(/\/booking\/(\d{1,12})(?:\D|$)/);
  if(m) return m[1];
  /* Bounded to 12 digits, the same as worker.js bookingIdOf() and fitbot.booking_id_of().
     An id one side accepts and another rejects is a Confirm button that always fails, or
     a roster entry nothing ever acts on. */
  return /^\d{1,12}$/.test(raw) ? raw : '';
}
/* Can the bot act on this row at all? It only ever cancels rows that carry a cancel link
   (fitbot.cmd_cancel filters on exactly that), so a row without one must not be offered a
   Cancel button that could never work. */
function isCancellable(b){ return !!(b && !b.__pending && String(b.cancel_url || b.booking_id || '')); }
function bookingKey(b){
  if(!b) return '';
  const id = bookingId(b);
  if(id) return 'id:'+id;
  /* No id: fall back, but never to a guess. The cancel link itself is unique per booking
     even when the id cannot be parsed out of it; only when there is no link at all do we
     drop to date+time+studio, and then studioFromBooking() answers 'unknown' rather than
     inventing 'exhale'. */
  const url = String(b.cancel_url || '');
  if(url) return 'u:'+url;
  return 'dts:'+String(b.date||'')+'|'+String(b.time||'')+'|'+studioFromBooking(b);
}
function bookingList(){
  if(!bookings || !Array.isArray(bookings.bookings)) bookings = {updated: bookings && bookings.updated, bookings: []};
  return bookings.bookings;
}
/* rows FIT has actually confirmed — everything that makes a CLAIM must use this, so an
   optimistic row this app invented can never be read back as evidence of a real booking */
function realBookings(){ return bookingList().filter(b => b && !b.__pending); }
function findBookingIdx(key){ return bookingList().findIndex(b => bookingKey(b) === key); }
function hasPending(key){
  return pendingCancels.some(p=>p.key===key) || pendingBooks.some(p=>p.key===key);
}
/* is there a pending optimistic BOOK covering this timetable occurrence? */
function pendingBookFor(date, time, studio){
  return pendingBooks.find(p => p.b && p.b.date === date && p.b.time === time &&
                                p.b.__pendingStudio === studio) || null;
}
/* is this exact slot already on the account (really, not optimistically)? */
function alreadyBookedSlot(c){
  return realBookings().some(b => b.date === c.date && b.time === c.time &&
    (studioOfBooking(b) === null || studioOfBooking(b) === c.studio));
}
/* Re-apply pending changes to the list that just arrived and decide any that have run out
   of time. Returns true when something was decided, so the caller re-renders even if the
   payload was byte-identical. */
function reconcilePending(){
  if(!pendingCancels.length && !pendingBooks.length && !pendingConfirms.length) return false;
  /* Only ever judge against data that actually arrived. A failed load leaves the previous
     (already-edited) list in place, where a cancelled row is missing because WE removed it
     — reading that as "the server agrees" would retire the pending record without ever
     checking, and the settle guarantee would quietly evaporate. */
  if(!freshFromServer) return false;
  const now = Date.now(), list = bookingList();
  let settled = false;
  pendingCancels = pendingCancels.filter(p=>{
    const i = list.findIndex(b => bookingKey(b) === p.key);
    if(i < 0){                                 // the server agrees it is gone — done
      dropAlert('cancelunknown:'+p.key);
      return false;
    }
    if(now - p.at > SETTLE_MS){
      /* Still on the account long after the bot should have acted. Everything up to this
         moment was silent — the row simply vanished and the app behaved as though it were
         cancelled. This is the moment that stops being true, and it is the ONLY moment the
         user hears anything: the row is left where it is (that is the truth — it is still
         booked) and it comes back carrying a persistent warning of its own.

         The row reappearing is the alarm; the warning on it says why, so it cannot read as
         a glitch. It goes into stickyWarn, not into a toast and not into a dismissable
         notice: a cancel the user believes happened and which did not is a no-show, three
         of those in 7 days is a 7-day ban, and the warning must therefore outlive being
         backgrounded, relaunched, or tapped past. */
      setStickyRowWarn(p.b, {tone:'bad', text:'DIDN’T CANCEL — this is still booked. '+
        'Cancel it in the FIT app or it becomes a no-show'});
      dropAlert('cancelunknown:'+p.key);
      settled = true;
      return false;
    }
    list.splice(i,1);                          // keep it hidden while the bot catches up
    return true;
  });
  const claimed = [];
  pendingBooks = pendingBooks.filter(p=>{
    /* A pending BOOK is a row this app invented from a timetable entry; FIT hands the real
       one back with its own name/location, which can classify to a different studio. So the
       studio is NOT compared — but the match must still be a booking that genuinely did not
       exist when the user tapped Book. Matching on date+time alone let an Infrared Sauna
       already sitting at 06:15 instantly "confirm" a Yoga booked at 06:15, after which the
       yoga's real failure was never reported at all. `before` is the set of row keys present
       at dispatch time; only a row outside it counts, and each new row can satisfy at most
       one pending book. */
    const hit = list.find(b => !b.__pending && b.date === p.b.date && b.time === p.b.time &&
                               !(p.before && p.before[bookingKey(b)]) &&
                               claimed.indexOf(b) < 0);
    if(hit){ claimed.push(hit); dropAlert('bookunknown:'+p.key); return false; }
    if(now - p.at > SETTLE_MS){
      announce({id:'bookfail:'+p.key, tone:'amber', tab:'booked',
                title:'That booking didn’t go through',
                body:(p.b && p.b.name ? p.b.name : 'The class')+' is not on your FIT '+
                     'account. Nothing was booked — try again, or book it in the FIT app.'});
      dropAlert('bookunknown:'+p.key);
      settled = true;
      return false;
    }
    if(list.indexOf(p.b) < 0) list.push(p.b);  // hold the optimistic row until it lands
    return true;
  });
  /* Pending CONFIRMS. Only ever reached with a successful /confirm behind them —
     confirmBooking() withdraws its own record on any error, because the Confirm button
     coming back is the honest state and re-tapping is free. So this is pure bookkeeping:
     hold the optimistic "confirmed" look until the server's own list agrees, then let go.

     The timeout is generous and DELIBERATELY SILENT. The Worker answered 200, which means
     the confirmation is written; GitHub's contents API is merely slow to show it. Alarming
     here would train the user to ignore an alarm that is usually wrong — and the state it
     would be complaining about is one the row itself re-advertises the moment the record
     is dropped and the server still disagrees. */
  const serverConfirmed = {};
  (Array.isArray(confirmData) ? confirmData : []).forEach(e=>{
    if(e && e.kind === 'confirmed'){
      const id = bookingId({booking_id: e.booking_id});
      if(id) serverConfirmed[id] = true;
    }
  });
  pendingConfirms = pendingConfirms.filter(p=>{
    if(serverConfirmed[p.id]){ dropAlert('confirmfail:'+p.id); return false; }
    /* the booking has left the account entirely (cancelled elsewhere, or swept) — there is
       nothing left to confirm */
    if(!list.some(b => bookingId(b) === p.id)){ dropAlert('confirmfail:'+p.id); return false; }
    if(now - p.at > SETTLE_MS * 2){ settled = true; return false; }
    return true;
  });
  return settled;
}
/* Snapshot of what was on the account at the instant an optimistic action was taken. */
function bookingKeySnapshot(){
  const o = {};
  realBookings().forEach(b => { o[bookingKey(b)] = true; });
  return o;
}
/* ── never rebuild the screen out from under a finger ───────────────────────────────
   renderBooked() replaces #w-booked wholesale, and this screen redraws on a 45s poll, a
   5-minute past-class sweep and every countdown flip. If one lands between finger-down
   and finger-up, the element the touch started on is detached, so no `click` is
   synthesised on any [data-confirm] — the tap does nothing at all, silently. On a row
   counting down to a deadline that is the worst possible thing for a tap to do.
   (It cannot hit the WRONG row — the buttons carry the booking's identity, not its
   position — but "nothing happened" is still a failure.)
   A tap is down-then-up in ~100ms, so deferring for the duration of one is invisible. */
let pointerHeld = 0, renderHeld = false;
function releasePointer(){
  pointerHeld = 0;
  /* DEFERRED, not immediate. `pointerup` fires BEFORE `mouseup` and before `click`, so
     rendering here tears out the element the touch started on and no click is ever
     synthesised — the latch would guarantee the swallowed tap it exists to prevent
     instead of merely allowing it. A macrotask puts the redraw after the click has been
     dispatched and handled. */
  if(renderHeld){
    renderHeld = false;
    setTimeout(()=>{ try{ renderAll(); }catch(e){} }, 0);
  }
}
try{
  document.addEventListener('pointerdown', ()=>{ pointerHeld = Date.now(); }, true);
  /* Several ways out, on purpose. A latch with a single release is a latch that sticks:
     iOS can swallow a pointerup to a system gesture, a share sheet or a context menu, and
     if that ever happened the countdown flip, the 45s poll redraw and the 5-minute
     past-class sweep would all stop for good — leaving the Booked screen frozen on a
     stale "Confirm by … or this cancels itself" until the next tap. The hold is only ever
     meant to cover the ~100ms of one tap, so a stale one is always a bug. */
  ['pointerup','pointercancel','lostpointercapture','touchend','touchcancel',
   'visibilitychange'].forEach(ev=>{
    document.addEventListener(ev, releasePointer, true);
  });
  /* Window blur ONLY — the app losing focus. NOT a capture-phase 'blur' on document:
     that fires for every element that loses focus, including the one the finger just
     pressed, so it released the latch on the same tick it was taken and the whole guard
     was inert. `blur` does not bubble, so a plain window listener sees only window blur. */
  window.addEventListener('blur', releasePointer);
}catch(e){}
/* every TIMER-driven redraw goes through this; user-initiated ones call renderAll */
function renderAllIdle(){
  /* ...and a watchdog, so even a release event that never arrives cannot outlast one
     redraw interval */
  if(pointerHeld && Date.now() - pointerHeld > 1500) pointerHeld = 0;
  if(pointerHeld){ renderHeld = true; return; }
  renderHeld = false;
  renderAll();
}

/* redraw everything without throwing the reader out of their scroll position */
function rerenderKeepScroll(){
  const p = $('#page-'+activeTab), s = p ? p.scrollTop : 0;
  renderAll();
  if(p) p.scrollTop = s;
}

/* ════════════════════════════════════════════════════════════════
   After a dispatch — invisible
   ════════════════════════════════════════════════════════════════ */
/* This used to be beginFlight()/clearFlight(): an amber hairline under the nav bar plus a
   "Cancelling on FIT — confirming in about a minute" toast. Both are gone. What is NOT gone
   is the thing they were bolted to — a late re-read of the data once the workflow has had
   time to run, which is one of the ways an optimistic row gets confirmed. Deleting the bar
   must not delete the check, so the two are separated: this schedules the re-read and shows
   nothing at all.

   F24 — these timers were untracked and the reload did not check document.hidden, so a
   backgrounded app still burnt requests on a screen nobody was looking at, and a session
   bail-out mid-booking left timers running against a signed-out app. */
let flightTimers = [];
function clearDispatchWatch(){
  flightTimers.forEach(clearTimeout); flightTimers = [];
}
function watchDispatch(ms){
  const wait = ms || 75000;
  /* match pollAfterDispatch: never burn a request for a screen nobody is looking at —
     visibilitychange already re-loads on the way back in */
  const id = setTimeout(()=>{
    flightTimers = flightTimers.filter(x => x !== id);   // don't accumulate dead ids
    if(!document.hidden) loadAll(true);
  }, wait);
  flightTimers.push(id);
}

/* ════════════════════════════════════════════════════════════════
   Live data (§3) — poll while visible, auto-dispatch a real FIT sync
   when the files go stale, and show freshness instead of demanding a tap.
   ════════════════════════════════════════════════════════════════ */
/* ── "this member has never been synced at all" ──────────────────────────────────────
   `bookings.updated` is null only until the bot has read this member's FIT account ONCE —
   fitbot.set_user() seeds the file that way and cmd_refresh() always stamps a real time,
   even for an account holding nothing. So null means NEVER SYNCED, never "no bookings".

   That distinction is the whole bug. dataUpdatedMs() took the oldest NON-NULL stamp, and
   the timetable is shared — Josh's runs keep it minutes old — so a brand-new member read
   as perfectly fresh, isStale() was false, autoSync() never fired and Booked said "Not
   synced yet / Nothing booked" until a scheduled refresh happened along, up to 8 hours
   later. For those hours alreadyBookedSlot() and the one-class-per-studio-per-day warning
   had nothing to work with and the app offered to book classes already on the account.

   A member's own data being absent is the stalest state there is, not a missing input. */
function neverSynced(){
  /* Only ever a verdict about data that ARRIVED. Before the first payload lands, and after
     a failed load, `bookings` is the boot placeholder — reading that as "never synced"
     would dispatch a sync because the network was down. */
  if(lastDataJson === null) return false;
  const u = bookings && bookings.updated;
  if(!u) return true;
  return !isFinite(new Date(u).getTime());
}
/* the OLDER of the two `updated` stamps — both files have to be fresh.
   A member's bookings that are merely OLDER than the timetable already came out right
   here (oldest wins); it was only the null that read as fresh. */
function dataUpdatedMs(){
  if(neverSynced()) return null;        // ⇒ dataAgeMs() Infinity ⇒ isStale() true
  let oldest = null;
  [timetable && timetable.updated, bookings && bookings.updated].forEach(u=>{
    if(!u) return;
    const t = new Date(u).getTime();
    if(isFinite(t) && (oldest === null || t < oldest)) oldest = t;
  });
  return oldest;
}
function dataAgeMs(){ const t = dataUpdatedMs(); return t === null ? Infinity : Math.max(0, Date.now()-t); }
function isStale(){ return dataAgeMs() > STALE_MS; }
/* ageLong() — "updated 4 min ago" / "never synced" — is DELETED with the Booked subtitle
   that was its only caller. dataAgeMs()/isStale() above are untouched: the app still
   decides when to sync from the age of the data, it just never mentions it. */
let postPoll = [], syncBaseline = null;
function clearPostPoll(){ postPoll.forEach(clearTimeout); postPoll = []; }
/* after a dispatch the run takes ~60–75s; poll across that window, non-blocking */
function pollAfterDispatch(){
  clearPostPoll();
  [15000,30000,45000,62000,78000,95000].forEach(ms=>{
    postPoll.push(setTimeout(()=>{ if(!document.hidden) loadAll(true); }, ms));
  });
  /* kept as the fast path while the app stays open; reapSync() is the backstop that
     survives being backgrounded, so this timer being destroyed is no longer fatal.
     `syncing` no longer draws ANYTHING — nothing reads it but autoSync()'s re-entry guard
     and the fast poll's stop condition — so dropping the latch needs no redraw. */
  postPoll.push(setTimeout(()=>{ if(syncing){ syncing = false; syncStartedAt = 0; } }, 115000));
}
/* A never-synced member is stale FOREVER until a run writes their bookings.json, and there
   is one way that never happens: the Worker only creates data/<member>/ on their first
   SAVE, so somebody who signs in and saves nothing is not iterated by refresh.yml at all.
   Unbounded, that is a dispatch of a workflow that cannot help them every DISPATCH_MIN for
   as long as the app is open. Bounded, it is three tries — enough for a slow or unlucky
   first run, not enough to be a storm — and it costs nothing in the case it exists for,
   because the first successful sync clears the condition. Genuine staleness is NOT bounded
   by this: a member with real data that has gone old keeps retrying as it always did. */
const BOOTSTRAP_SYNCS = 3;
let bootstrapSyncs = 0;
/* Debounced + rate-limited: at most one attempt in flight, and never more than one
   refresh.yml dispatch per DISPATCH_MIN however many triggers pile up. */
async function autoSync(force){
  reapSync();                            // F2 — never bail out behind a stale latch
  if(!session || !booted || autoBusy || syncing) return false;
  if(!force && !isStale()) return false;
  const boot = neverSynced();
  if(boot && !force && bootstrapSyncs >= BOOTSTRAP_SYNCS) return false;
  const now = Date.now();
  if(now - lastDispatchMs() < DISPATCH_MIN){
    loadAll(true);                       // too soon to dispatch — just re-read the files
    return false;
  }
  autoBusy = true;
  markDispatch(now);                     // F3 — claim the slot, across restarts too
  if(boot) bootstrapSyncs++;
  syncBaseline = dataUpdatedMs();
  try{
    await dispatch('refresh.yml');
    syncing = true; syncStartedAt = Date.now();
    watchDispatch(78000);                // no chrome of any kind — just a late re-read
    pollAfterDispatch();
    return true;
  }catch(e){
    syncing = false; syncStartedAt = 0;
    if(isAuthErr(e)) bailToSetup();
    return false;
  }finally{ autoBusy = false; }
}
/* ── fast poll: the honesty guarantee behind the optimistic rows ──────────
   After a book or a cancel the app checks every FAST_POLL_MS instead of every 45s, so the
   change is confirmed (or withdrawn) in seconds. It stops itself the moment nothing is
   pending, and never runs longer than FAST_POLL_MAX. */
/* `fastStopOnSettle` is gone. It was only ever set to false (by the deleted
   autoSnipeIfOpen) and reset in stopFastPoll(), so once a booking pass had flipped it, no
   later book or cancel could ever end its fast poll early. Every remaining caller watches a
   specific pending row, so the rule is unconditional: stop when nothing is pending. */
function startFastPoll(){
  fastUntil = Date.now() + FAST_POLL_MAX;
  if(fastTimer || document.hidden) return;
  fastTimer = setInterval(()=>{
    if(document.hidden || !session || !booted) return;
    if(Date.now() > fastUntil){ stopFastPoll(); return; }
    loadAll(true).then(()=>{
      if(!pendingCancels.length && !pendingBooks.length && !pendingConfirms.length && !syncing) stopFastPoll();
    });
  }, FAST_POLL_MS);
}
function stopFastPoll(){
  if(fastTimer){ clearInterval(fastTimer); fastTimer = null; }
  /* clear the deadline too, or the next startPolling() faithfully restarts a window that
     was already resolved and polls every 8s for nothing */
  fastUntil = 0;
}
function startPolling(){
  stopPolling();
  pollTimer = setInterval(()=>{
    if(document.hidden || !session || !booted) return;
    reapSync();
    loadAll(true);
    if(isStale()) autoSync();
  }, POLL_MS);
  /* A pending action that outlived a trip to the background resumes its fast poll here.
     The condition is "is anything still pending", not the old `fastUntil > now` — that
     variable is cleared by stopFastPoll(), which stopPolling() has just called, and a
     stale deadline used to restart an already-resolved window anyway. */
  if(pendingCancels.length || pendingBooks.length || pendingConfirms.length) startFastPoll();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  stopFastPoll();
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ stopPolling(); clearPostPoll(); return; }
  reapSync();                      // F2 — hours may have passed; an "in flight" sync expired
  startPolling();
  if(!session || !booted) return;
  /* coming back is the strongest signal that the screen is about to be read: re-read now,
     dispatch a real sync if the data has gone stale, and settle anything still pending */
  loadAll(true).then(()=>{ if(isStale()) autoSync(); });
});
/* iOS fires pagehide, not always visibilitychange, when a home-screen web app is put away
   or frozen. Stop the timers there too, and flush the unsaved-pick draft (F7). */
window.addEventListener('pagehide', function(){ stopPolling(); clearPostPoll(); try{ saveDraft(); }catch(e){} });
window.addEventListener('pageshow', function(e){
  if(!e.persisted) return;         // a bfcache restore resumes a page whose timers are gone
  reapSync(); startPolling();
  if(session && booted) loadAll(true);
});

/* ════════════════════════════════════════════════════════════════
   Derived data
   ════════════════════════════════════════════════════════════════ */
function futureClasses(){
  const now = Date.now();
  return (timetable.classes||[]).filter(c => c && c.start_iso && new Date(c.start_iso).getTime() > now);
}
function classesFor(date){
  const now = Date.now();
  return (timetable.classes||[])
    .filter(c => c && c.date===date && new Date(c.start_iso).getTime() > now)
    .filter(c => studioFilter==='all' || c.studio===studioFilter)
    .sort((a,b)=> String(a.time).localeCompare(String(b.time)) || String(a.studio).localeCompare(String(b.studio)));
}
function dayHasClasses(date){
  const now = Date.now();
  return (timetable.classes||[]).some(c => c && c.date===date && new Date(c.start_iso).getTime() > now);
}
function studiosOn(date){
  const now = Date.now(), seen = {};
  (timetable.classes||[]).forEach(c=>{
    if(c && c.date===date && new Date(c.start_iso).getTime() > now) seen[c.studio] = 1;
  });
  return STUDIOS.filter(s => seen[s]);
}
/* studio already booked on this calendar date (one class per studio per day) */
function bookedStudiosOn(date){
  const out = {};
  /* correctness #10 — only claim a studio is taken when we actually know which studio it
     was. A guessed 'exhale' put a false "already booked today" caution on real classes.
     realBookings() drops the optimistic rows: a class this app has merely ASKED FIT for is
     not a booking, and must not block or claim anything. */
  realBookings().forEach(b=>{
    if(!b || b.date !== date) return;
    const st = studioOfBooking(b);
    if(st) out[st] = b;
  });
  return out;
}
/* another saved pick in the same studio on the same weekday */
function pickClash(c){
  return picks.find(p => p.studio===c.studio && p.day===c.day && p.time!==c.time &&
                         (!isOneOff(p) || pickDate(p)===c.date)) || null;
}

/* Every future timetable occurrence of a saved pick, soonest first. */
function pickOccurrences(p){
  const now = Date.now(), only = pickDate(p);
  return (timetable.classes||[])
    .filter(c => c && c.day===p.day && c.time===p.time && c.studio===p.studio &&
                 (!only || c.date===only) &&
                 new Date(c.start_iso).getTime() > now)
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}
/* correctness #11 — the bot locates a class by NAME SUBSTRING as well as slot, the UI
   only by slot. FIT rotates suffixes (BOLT (LB) -> BOLT (UB)), so a renamed class books in
   the UI's model and silently never books in the bot's, while the countdown ticks on. */
function pickNameDrift(p){
  if(!p || !p.name) return null;
  const want = String(p.name).toLowerCase();
  const bad = pickOccurrences(p).filter(c => String(c.name||'').toLowerCase().indexOf(want) < 0);
  return bad.length ? bad[0] : null;
}
/* Single source of truth shared by the hero and the Picks list, so the two can
   never disagree about the same pick. */
function pickState(p){
  const now = Date.now();
  const occ = pickOccurrences(p);
  /* correctness #10 — key on date|studio|TIME as well, so "the bot booked THIS class" can
     be told apart from "something else in this studio that day is blocking it". They mean
     opposite things to the user and only the first is a fulfilled pick. Bookings whose
     studio can't be established are ignored entirely rather than asserted. */
  /* correctness: realBookings() only. The optimistic row this app pushes on to the Booked
     list carries `location: <studio>`, so it used to classify perfectly and flip the pick
     to a green "Booked ✓" before FIT had even been asked. A tick that is not a booking is
     the single most dangerous thing this screen can say. */
  const exact = {}, sameStudio = {};
  realBookings().forEach(b=>{
    if(!b || !b.date) return;
    const st = studioOfBooking(b);
    if(!st) return;
    sameStudio[b.date+'|'+st] = b;
    if(b.time) exact[b.date+'|'+st+'|'+b.time] = b;
  });
  let blocked = null;
  for(let i=0;i<occ.length;i++){
    const c = occ[i];
    if(exact[c.date+'|'+c.studio+'|'+c.time]) continue;   // the bot already won this one
    /* asked for, not answered: show the truthful in-between state rather than either a
       tick or a countdown */
    if(pendingBookFor(c.date, c.time, c.studio)) return {kind:'booking', opens:null, cls:c};
    const other = sameStudio[c.date+'|'+c.studio];
    if(other){ if(!blocked) blocked = {cls:c, by:other}; continue; }
    const o = new Date(c.opens_iso).getTime();
    if(!isFinite(o)) continue;
    return {kind: o <= now ? 'open' : 'waiting', opens:o, cls:c};
  }
  if(blocked) return {kind:'blocked', opens:null, cls:blocked.cls, by:blocked.by};
  if(occ.length) return {kind:'booked', opens:null, cls:occ[0]};
  /* a one-off whose date has already gone — or is earlier today — is spent, not broken */
  if(isOneOff(p) && pickDate(p) <= sydToday()) return {kind:'expired', opens:null, cls:null};
  return {kind:'missing', opens:null, cls:null};
}

/* the soonest booking window among the OWNER'S PICKS — the hero */
function nextPickWindow(){
  if(heroCache && heroCache.at > Date.now() - 5000) return heroCache.v;
  const now = Date.now();
  let best = null;
  picks.forEach(p=>{
    let hit = null;
    pickOccurrences(p).forEach(c=>{
      const o = new Date(c.opens_iso).getTime();
      if(isFinite(o) && o > now && (!hit || o < hit.opens)) hit = {opens:o, cls:c, pick:p};
    });
    if(!hit){
      /* a one-off can only ever open on its own date — never project it forward */
      const o = isOneOff(p) ? oneOffOpensMs(p) : nextWindowMs(p);
      if(o !== null && o > now) hit = {opens:o, cls:null, pick:p};
    }
    if(hit && (!best || hit.opens < best.opens)) best = hit;
  });
  heroCache = {at:Date.now(), v:best};
  return best;
}
