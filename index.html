/* ════════════════════════════════════════════════════════════════
   Worker API (contract §2–§4)
   ════════════════════════════════════════════════════════════════ */
/* Every call is the same shape: POST JSON to WORKER_URL + path with the session folded in,
   get JSON back with an `ok` flag. The Worker resolves the session to a member and scopes
   the read/write itself, so a path can never name someone else's data.

   F22 — the 12s abort stops one hung cell pinning `loadingNow` for iOS's full network
   timeout, during which every poll and every pull-to-refresh was a silent no-op.

   Errors are thrown with the HTTP status IN THE MESSAGE, because isAuthErr() (and every
   caller that funnels through handleApiErr) recognises an expired session by finding
   '401' in the text. The raw response is attached as `.res` so the 409 merge path in
   savePicks() can read the server's copy of the list. */
async function wapi(path, payload){
  const ac = ('AbortController' in window) ? new AbortController() : null;
  const kill = ac ? setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, 12000) : null;
  try{
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + path, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({session: session}, payload || {})),
      cache:'no-store', signal: ac ? ac.signal : undefined});
    let d = null;
    try{ d = await r.json(); }catch(e){}
    if(!d || !d.ok){
      const err = new Error(((d && d.error) || (path+' failed')) + ' ('+r.status+')');
      err.status = r.status;
      err.res = d || null;
      throw err;
    }
    return d;
  } finally { if(kill) clearTimeout(kill); }
}
async function dispatch(workflow, inputs){
  /* booknow acts on ONE member's account. The Worker stamps the member from the session,
     so sending a `user` input is both pointless and ignored — and that is the whole point
     of the change: a client can no longer ask to act as somebody else. */
  await wapi('/dispatch', {workflow: workflow, inputs: inputs || {}});
}
/* CONTRACT §1b — "any 401 from any endpoint means sign in again". Read the STATUS, never
   the message: this used to sniff the text for '401'/'403', and the Worker's dispatch
   errors quote GitHub's own status back ("Could not start that run (403)"), so a problem
   with the WORKER's GitHub token signed the MEMBER out of an app whose session was fine —
   and signing in again could not possibly fix it. The Worker now keeps those digits out of
   the message as well; this is the half that cannot be got wrong from the other side. */
function isAuthErr(e){
  const st = e && typeof e.status === 'number' ? e.status : null;
  return st === 401 || st === 403;
}
/* Did the Worker DEFINITELY refuse, or do we simply not know?
   `wapi` throws for three different things and only one of them is knowledge:
     • a JSON answer that says no (any status < 500, including a 200 with ok:false) —
       the Worker made a decision and no workflow was started. We may say so.
     • a 5xx, a 408/429, a dropped connection, or our own 12s abort — the request may
       have reached GitHub and dispatched the run. We know NOTHING. Saying "nothing was
       booked" here is the app asserting a state it cannot observe, and the audit caught
       exactly that: the class was booked on FIT while the app declared it wasn't.
   Anything not provably a refusal is treated as unknown, and unknown means the pending
   record stays and the settle window decides. */
function isDefiniteReject(e){
  const st = e && typeof e.status === 'number' ? e.status : null;
  if(st === null) return false;                       // network failure or client abort
  if(st >= 500 || st === 408 || st === 429) return false;
  return true;
}

  clearDispatchWatch();

     who was just here. Erase EVERYTHING — draft picks, saved picks + sha, bookings,
     timetable, log, notices, the cached payload, the member identity — not just the
     session. The audit demonstrated the alternative: a failed first load rendered the
     previous member's bookings, with a working Cancel button. */
  wipeMemberState();

function handleApiErr(e){

}
function safeParse(txt, fallback){ try { return txt ? JSON.parse(txt) : fallback; } catch(e){ return fallback; } }

/* F22 — returns true when this call actually did the work, false when it was debounced

   nothing at all — at the exact moment they are pulling BECAUSE they think it is stuck. */

   nothing else. Polling and `booted` are established whatever the load did, because the

  return loadAll()
    .catch(e => { if(window.console && console.warn) console.warn('bootLoad', e); })
    .then(()=>{
      try{

       has lost the ability to check — and a Worker that stops sending the field is a

  if(!booted){

  /* Everything from here on is bookkeeping over data that has already landed, and NONE of

/* ── has enough time passed that this screen is now WRONG? ──────────────────────────

   "N left · M open" counter, the Now rule, which cell is TODAY, whether a class can still
   be booked) is computed at render time only, and the 45 s poll deliberately renders
   NOTHING when the payload is byte-identical — which is the normal state between the
   bot's own scrapes. The only clock-driven redraw was a 5-minute interval. So a class kept
   a live Book button for up to five minutes after it started, and across midnight the
   strip still said TODAY on yesterday while offering to book a class that had already
   begun: a booking nobody attends is the no-show this project exists to prevent.
   Cheap to detect: the Sydney date plus how many classes are still in the future. */
let lastTimeBucket = '';
function timeBucket(){
  const now = Date.now();
  let n = 0;
  const cl = (timetable && timetable.classes) || [];
  for(let i=0;i<cl.length;i++){
    const c = cl[i];
    if(c && c.start_iso && new Date(c.start_iso).getTime() > now) n++;
  }
  /* AUDIT round 2 — this bucket was "the Sydney date plus how many classes are still ahead",
     which is what a class STARTING moves. Since 19 Aug a pick also draws rows, and a pick
     stops being live when its window slips past the bot's 20-minute grace — an event that
     moves neither half of the old bucket. So a class the app was calling "Booked" went on
     saying it long after the app itself knew the booking could no longer happen, until some
     unrelated redraw. The count of still-live pick windows is that missing clock hand.
     This is the same defect the bucket was invented to fix (D-43), on the surface added
     after it: when a screen is derived from the clock, the clock has to be able to redraw it. */
  let live = 0;
  const picksArr = picks || [];
  for(let i=0;i<picksArr.length;i++){
    let occ = [];
    try{ occ = pickOccurrences(picksArr[i]) || []; }catch(e){ occ = []; }
    for(let j=0;j<occ.length;j++){
      const o = opensAtMs(occ[j]);
      if(isFinite(o) && o >= now - BOOK_GRACE_MS) live++;
    }
  }

function timeMoved(){
  const b = timeBucket();
  if(b === lastTimeBucket) return false;
  lastTimeBucket = b;
  return true;
}
function indexDates(){
  const set = {};
  (timetable.classes||[]).forEach(c=>{ if(c && c.date) set[c.date] = true; });
  const all = Object.keys(set).sort();
  const today = sydToday();
  /* days already gone can never be booked — keeping them only pushed the strip's
     scroll offset around and made "today" hard to find */
  allDates = all.filter(d => d >= today);
  if(!allDates.length) allDates = all;
  if(!selDate || allDates.indexOf(selDate) < 0){
    /* AUDIT (round 2) — jumping to the first date overall threw a reader who was three weeks
       out all the way back to today, mid-read, on a 45s poll. Land on the nearest surviving
       day ON OR AFTER the one that was taken away; only fall back to today if there is none. */
    const near = selDate ? allDates.filter(d => d >= selDate && dayHasClasses(d))[0] : '';
    if(near) selDate = near;
    else if(allDates.indexOf(today) >= 0 && dayHasClasses(today)) selDate = today;
    else selDate = allDates.filter(dayHasClasses)[0] || allDates[0] || today;

       that day, or it fell into the past). The strip was left where it was, so it pointed at
       a week in September with nothing selected while the list underneath was today's,
       live Book buttons and all. If the day moves, the strip moves with it. Paging by hand
       does not come through here, so browsing ahead is never yanked back. */
    weekStart = null;

/* ── one-week-at-a-time strip: paging bounds (§2) ───────────────── */
/* The strip is a ROLLING seven days from today, not a Monday-anchored calendar week.
   Anchored to Monday it spent most of a Sunday showing six dead, greyed-out cells and put
   "today" in the last column — the one day that always matters, hardest to reach. There is
   no such thing as a past day on this screen any more: a day you cannot book is a day with
   nothing to say. */
function firstWeek(){ return sydToday(); }

/* the plannable range, for anything that moves the selected day by arithmetic */
function clampDate(d){
  const a = sydToday(), b = addDays(a, PLAN_DAYS - 1);
  return d < a ? a : d > b ? b : d;
}
function clampWeek(ws){
  const a = firstWeek(), b = lastWeek();
  return ws < a ? a : (ws > b ? b : ws);
}
/* AUDIT — setDay() and jumpToClass() still did clampWeek(mondayOf(date)), the calendar-week
   model this section replaced. One tap on any cell re-anchored the strip to that date's
   MONDAY, which slid the whole strip and threw TODAY off it entirely — 6 taps out of 7 on a
   Sunday, the exact day the rolling strip was written to fix. The page a date belongs to is
   its offset from TODAY in whole weeks, and nothing else. */
function pageOf(ds){
  const today = sydToday();
  const off = Math.floor((toUTC(ds) - toUTC(today)) / 86400000 / 7) * 7;
  return clampWeek(addDays(today, Math.max(0, off)));
}

/* the visible week defaults to the one holding the selected day and is never a week
   that is entirely in the past */
function syncWeek(){
  const today = sydToday();
  /* snap to whichever seven-day page holds the selected day, counting from today */
  const d = selDate || today;
  if(!weekStart) weekStart = pageOf(d);
  weekStart = clampWeek(weekStart);
}

/* ════════════════════════════════════════════════════════════════
   Picks
   ════════════════════════════════════════════════════════════════ */
/* A pick is either RECURRING  {day,time,studio,name}
   or ONE-OFF               {day,time,studio,name,date:"YYYY-MM-DD"}
   — the bot reads the optional `date` field to restrict a pick to a single day. */
function pickDate(p){ return (p && p.date) ? String(p.date) : ''; }
function isOneOff(p){ return !!pickDate(p); }
function pickKey(p){ return p.day+'|'+p.time+'|'+p.studio+'|'+pickDate(p); }
function samePick(a,b){
  return a.day===b.day && a.time===b.time && a.studio===b.studio && pickDate(a)===pickDate(b);
}
/* index of an exact pick; `date` omitted/'' means the recurring one */
function pickIndex(day,time,studio,date){
  const d = date || '';
  return picks.findIndex(p => p.day===day && p.time===time && p.studio===studio && pickDate(p)===d);
}
/* the pick that covers THIS class occurrence — recurring wins, else a one-off on its date */
function pickFor(c){
  const rec = pickIndex(c.day,c.time,c.studio,'');
  if(rec >= 0) return picks[rec];
  const one = pickIndex(c.day,c.time,c.studio,c.date);
  return one >= 0 ? picks[one] : null;
}
function isPicked(c){ return !!pickFor(c); }

function addPick(day,time,studio,name,date){
  const p = {day:day, time:time, studio:studio, name:name||''};
  if(date) p.date = date;
  if(pickIndex(day,time,studio,date||'') < 0) picks.push(p);
  resetDerived(); syncDirty();
  return true;
}
function removePick(day,time,studio,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) picks.splice(i,1);
  resetDerived(); syncDirty();
  return false;
}
/* legacy signature kept for the recurring path (sheet switch, remove buttons) */
function togglePick(day,time,studio,name,date){
  const i = pickIndex(day,time,studio,date||'');
  if(i >= 0) return removePick(day,time,studio,date);
  return addPick(day,time,studio,name,date);
}
function isDirty(){ return JSON.stringify(picks) !== savedPicksJson; }
/* F7 — iOS purges backgrounded home-screen web apps without warning, and picks/
   savedPicksJson lived only in memory: an unsaved pick edit had exactly one lifetime,
   until the user took a phone call. Mirror the dirty buffer into localStorage on
   every edit; the key is removed the moment the list matches the server again.

   The key is scoped per member and the payload carries the member it belongs to. It used
   to be ONE global key: the audit restored Josh's unsaved draft into his partner's
   session, where a single tap on Save would have written his picks to her account. */
function draftKey(){ return memberKey('draft_picks'); }
function saveDraft(){
  try{
    if(!USER) return;                       // no member ⇒ no member-scoped bucket to use
    if(isDirty()) localStorage.setItem(draftKey(), JSON.stringify({u:USER, p:picks}));
    else localStorage.removeItem(draftKey());
  }catch(e){}
}
/* Restore only a draft that is provably this member's — the key says so and so does the
   payload. A mismatch is deleted, never shown. */
function readDraft(){
  try{
    if(!USER) return null;
    const raw = localStorage.getItem(draftKey());
    if(!raw) return null;
    const v = JSON.parse(raw);
    if(v && typeof v === 'object' && Array.isArray(v.p) && v.u === USER) return v.p;
    localStorage.removeItem(draftKey());
  }catch(e){}
  return null;
}
function syncDirty(){
  const app = $('#app'), d = isDirty();
  /* `dirty` drives the Save bar, and with instant writes the list is dirty only for the
     ~200 ms a write is in flight — a bar that slid up and away on every tap would be the
     narration this app deliberately does not do. It is shown only when something is
     genuinely stranded (see showSaveBar). */
  app.classList.toggle('dirty', d && showSaveBar);
  saveDraft();
  if(d){
    const saved = safeParse(savedPicksJson, []);
    const added = picks.filter(p => !saved.some(q=>samePick(q,p))).length;
    const removed = saved.filter(q => !picks.some(p=>samePick(p,q))).length;
    const bits = [];
    if(added) bits.push(added+' added');
    if(removed) bits.push(removed+' removed');
    $('#saveTitle').textContent = bits.join(', ') || 'Picks changed';
    const once = picks.filter(isOneOff).length;
    $('#saveSub').textContent = picks.length + (picks.length===1?' pick':' picks') +
      (once ? ' ('+once+' one-off)' : '') + ' after saving';
  }
  updateBadges();
}
function updateBadges(){
  /* The Booked badge counts what NEEDS DOING, not what exists. There are no push
     notifications — the confirm prompt is only ever seen by opening the app — so the badge
     is the only thing that can carry "something here will delete itself if you ignore it".
     A count of bookings carried no such information: it was the same number whether
     everything was settled or three classes were hours from cancelling themselves.
     It goes to zero, and off, the moment nothing is waiting on him. */
  const nb = ((bookings&&bookings.bookings)||[]).filter(needsConfirm).length;
  const bb = $('#badgeBooked');
  bb.textContent = nb > 99 ? '99+' : String(nb);
  bb.classList.toggle('on', nb > 0);
  const np = picks.length;
  const pb = $('#badgePicks');
  pb.textContent = np > 99 ? '99+' : String(np);
  pb.classList.toggle('on', np > 0 || isDirty());
  if(np === 0 && isDirty()) pb.textContent = '0';
}

/* ── writing the pick list ─────────────────────────────────────────────────────────
   The network half, shared by the instant path and by the fallback Save bar. Throws if it
   could not resolve the write; PICKS_BAILED means the session is gone and the caller must
   simply stop (the sign-in screen is already up). */
const PICKS_BAILED = '__picks_bailed__';
async function pushPicks(){
  /* AUDIT round 2 — `savedPicksJson = JSON.stringify(picks)` on success wrote the LIVE
     array, and `picks` is mutated in place while the request is in flight. So an edit made
     during a write was recorded as "the server has this" although the server never saw it.
     Two things then read that lie: the 409 merge base (which silently discarded a pick the
     app had just said it added) and, worse, commitPicks's failure revert — which restored
     a list containing a removal the server never received, leaving a pick GONE from the
     screen and LIVE on the server. The bot goes on booking a class he thinks he cancelled,
     which is the no-show this feature exists to prevent. Commit exactly what was sent. */
  const sent = JSON.stringify(picks);
  {
    let res;
    try{
      res = await wapi('/picks', {picks: safeParse(sent, []), sha: picksSha});
    }catch(e1){
      if(e1 && (e1.status === 401 || e1.status === 403)){
        bailToSetup('This app has lost write access to your bookings. Sign in again.');
        throw new Error(PICKS_BAILED);
      }
      if(!(e1 && e1.status === 409)) throw e1;
      /* correctness #12 — the app KNEW the remote had changed, then invited the user to
         press a button that uploads his in-memory list verbatim over it. (The bot removes
         a one-off the moment it books it; "tap Save again" resurrected it.) MERGE instead:
         keep everything he added, keep everything they added, and honour his removals
         only. Nothing the user typed is ever discarded silently. The Worker hands back the
         current list and sha with the 409, so no extra read is needed. */
      const cur = e1.res || {};
      picksSha = (typeof cur.sha === 'string' && cur.sha) ? cur.sha : null;
      const theirs = Array.isArray(cur.picks) ? cur.picks : null;
      let merged = null;
      if(theirs){
        const base = safeParse(savedPicksJson, []);
        const iAdded   = picks.filter(p => !base.some(q=>samePick(q,p)));
        const iRemoved = base.filter(q => !picks.some(p=>samePick(p,q)));
        merged = theirs.filter(t => !iRemoved.some(q=>samePick(q,t)))
                       .concat(iAdded.filter(p => !theirs.some(t=>samePick(t,p))));
      }
      if(!merged) throw new Error('Picks changed elsewhere — try that again');
      picks = merged; resetDerived(); syncDirty(); renderPicks(); renderBook();
      safeRender('booked', renderBooked);
      const merged2 = JSON.stringify(picks);
      /* retry ONCE, against the sha the conflict just handed us. If that also conflicts
         the list is being edited from two places right now — stop and let the user look. */
      try{
        res = await wapi('/picks', {picks: safeParse(merged2, []), sha: picksSha});
      }catch(e2){
        if(e2 && (e2.status === 401 || e2.status === 403)){
          bailToSetup('This app has lost write access to your bookings. Sign in again.');
          throw new Error(PICKS_BAILED);
        }
        if(e2 && e2.status === 409 && e2.res && typeof e2.res.sha === 'string') picksSha = e2.res.sha;
        throw new Error('Picks changed on another device and couldn’t be merged.');
      }
      if(res && typeof res.sha === 'string' && res.sha) picksSha = res.sha;
      savedPicksJson = merged2;
      syncDirty();
      return;
    }
    if(res && typeof res.sha === 'string' && res.sha) picksSha = res.sha;
    savedPicksJson = sent;
    syncDirty();
  }
}

/* ── a pick change writes itself ───────────────────────────────────────────────────
   Josh: "pushing the button should just put the one i selected into picks. no extra
   'save picks' needed." Every other action in this app is already optimistic-and-silent;
   picks were the last thing that made him confirm his own tap.

   The failure direction is what makes this safe to do. An ADD that does not land means a
   class simply is not picked — annoying, never a strike. A REMOVE that does not land
   means the bot goes on booking a class he believes he cancelled, and a booking he does
   not attend IS the strike. So on any failure the list is put back to the last state the
   server is known to hold — which for a failed removal truthfully re-shows the pick — the
   screen is re-read from the Worker, and a failed removal additionally raises a
   persistent notice, because a toast can be missed and this one costs a class.

   Serialised: two /picks writes in flight at once race their shas and the second loses to
   a 409 it cannot merge honestly. A tap during a write sets `again`, and the loop repeats
   with the newer list. */
let pickSaveBusy = false, pickSaveAgain = false, showSaveBar = false;
const PICKSAVE_ALERT = 'picksave:stuck';
async function commitPicks(){
  if(pickSaveBusy){ pickSaveAgain = true; return; }
  pickSaveBusy = true;
  try{
    for(let i = 0; i < 6; i++){
      pickSaveAgain = false;
      const baseline = savedPicksJson;
      try{
        await pushPicks();
      }catch(e){
        if(String(e && e.message) === PICKS_BAILED) return;
        /* AUDIT round 2 — the caller used to say whether this was a removal, and with
           coalescing the caller can be the wrong edit entirely: a failed REMOVAL was
           reported as "nothing was added" and its persistent notice was suppressed.
           Ask the lists instead — anything in the server's last acknowledged copy that is
           missing from what we tried to send IS a removal, whoever asked for it. */
        const base = safeParse(baseline, []);
        const removal = base.some(q => !picks.some(p => samePick(p, q)));
        picks = base;
        showSaveBar = false;
        resetDerived(); syncDirty();
        if(removal){
          /* pushed BEFORE the render, or the notice waits for the next one — and the
             loadAll() below can early-return while a poll is already in flight */
          pushAlert({id:PICKSAVE_ALERT, tone:'bad', tab:'all',
            title:'That class was NOT removed',
            body:'It is still there, so it will still be booked — and a class you don’t go '+
                 'to counts as a no-show. Remove it again, or cancel it at the club.'});
        }
        /* AUDIT (19 Aug) — Booked was missing from this list, and since a pick now DRAWS a
           row on Booked that omission was the worst bug in the batch: he tapped Cancel on a
           class held by a pick, the write failed, the pick was correctly restored — and
           Booked went on saying "Nothing booked" indefinitely, because nothing marked it
           dirty either. He believes it is cancelled; it is not; the class gets booked; that
           is the no-show. Every pick re-render redraws all three tabs now. */
        safeRender('picks', renderPicks); rerenderBook(); safeRender('booked', renderBooked);
        toast(removal ? 'Couldn’t remove that pick — it is still saved'
                      : 'Couldn’t save that pick — nothing was added. '+String(e.message||e), 5000);
        loadAll(true);            // end up showing what is actually saved, not what we hoped
        return;
      }
      if(!pickSaveAgain) break;
    }
    /* AUDIT round 2 — the loop is bounded, and on hitting the bound the newest edit was
       never written while `isDirty()` said everything was saved: no bar, no draft, no
       notice, and in the removal direction a pick live on the server and gone from the
       screen. If anything is still waiting, put the bar back — that is what it is for. */
    if(pickSaveAgain){
      showSaveBar = true; syncDirty();
      toast('Some changes haven’t saved yet — tap Save', 5000);
      return;
    }
    dropAlert(PICKSAVE_ALERT);
    showSaveBar = false;
    resetDerived(); safeRender('picks', renderPicks); rerenderBook();
    safeRender('booked', renderBooked);
    maybeKickSnipe();
  }finally{
    pickSaveBusy = false;
  }
}

/* The Save bar is a fallback now, not a step: it appears only when a change is sitting
   unsaved for a reason the instant path could not resolve — today, a draft restored after
   iOS killed the app mid-edit. */
async function savePicks(){
  const btn = $('#saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    await pushPicks();
    dropAlert(PICKSAVE_ALERT);
    showSaveBar = false;
    resetDerived(); syncDirty(); renderPicks(); renderBook();
    safeRender('booked', renderBooked);
    toast('Saved');
    maybeKickSnipe();
  }catch(e){
    if(String(e && e.message) !== PICKS_BAILED) toast(String(e.message || e), 4200);
  }finally{
    btn.disabled = false; btn.textContent = 'Save';
  }
}

/* Mirror of the bot's bookable_occurrence (contract §4).
   correctness #6 — the bot subtracts 7 days + 1 hour from an AWARE Australia/Sydney
   datetime, which Python evaluates as WALL-CLOCK arithmetic: 7 calendar days back, then
   one hour. Subtracting 169 hours of absolute time (the old `(7*24*60+60)*60000`) is off
   by exactly 60 minutes for every class starting in the week after a DST change — next on
   4–10 Oct 2026 — so the UI and the bot disagreed about when a window opened.
   correctness #19d — the old scan also walked DEVICE-local days and used setHours(), so
   every countdown shifted if the phone left Sydney while the date strip stayed on Sydney
   dates. Both are solved by doing the whole thing in Sydney wall clock. */
/* ── planning horizon ────────────────────────────────────────────────────────────────
   FIT publishes exactly two weeks. That is all the bot ever needs — a class cannot be
   booked until 7 days and 1 hour before it starts — but it is not enough to PLAN with:
   for most of a week the far end of the strip is empty and there is nothing to tap.

   So beyond the published horizon the app repeats the last published week forward. A
   projected class is a pattern, not a listing, and the app never claims otherwise:

     - it carries no availability, because FIT has not said (see availInfo)
     - it has no `bid`, and Book is refused on it outright
     - it is never projected inside the bookable window, so it can never stand in for a
       class you could actually be booking right now
     - a real class always wins for the same date+time+studio

   The only thing it is used for is adding a pick, and a recurring pick does not depend on
   the date existing at all. If a projected class turns out not to run, the pick row says
   "Not on the timetable" once the real week lands — the surface that already existed. */
const PLAN_DAYS = 28;        // how far ahead the strip lets you plan
const PROJECT_MIN_LEAD = 8;  // never project inside the 7d+1h bookable window

function withProjection(tt){
  const real = (tt && Array.isArray(tt.classes)) ? tt.classes : [];
  if(!real.length) return tt;
  const today = sydToday(), horizon = addDays(today, PLAN_DAYS - 1);
  const floor = addDays(today, PROJECT_MIN_LEAD);
  const have = {};
  let last = '';
  real.forEach(c=>{
    if(!c || !c.date) return;
    have[c.date+'|'+c.time+'|'+c.studio] = 1;
    if(c.date > last) last = c.date;
  });
  if(!last || last >= horizon) return tt;
  const src = real.filter(c => c && c.date > addDays(last, -7) && c.date <= last);
  if(!src.length) return tt;
  const out = real.slice();
  for(let shift = 7; shift <= PLAN_DAYS + 7; shift += 7){
    let added = 0;
    for(const c of src){
      const d = addDays(c.date, shift);
      if(d > horizon || d < floor) continue;
      if(have[d+'|'+c.time+'|'+c.studio]) continue;
      const startMs = sydWallToMs(d, c.time), opensMs = opensMsForSyd(d, c.time);
      if(startMs === null || opensMs === null) continue;   // DST gap: say nothing
      have[d+'|'+c.time+'|'+c.studio] = 1;
      /* AUDIT — every projected row used to carry bid:''. bid is this app's ROW KEY:
         findClass() resolves data-bid, and `''` matched the FIRST projected row in the
         array for every one of them. Tapping the repeat glyph on a Wednesday Cycle class
         opened the sheet for a Sunday Reformer class and saved a recurring pick for it.
         The key must be unique. It is deliberately not numeric so it can never be mistaken
         for one of FIT's own booking ids by anything downstream. */
      out.push(Object.assign({}, c, {
        date: d, projected: true,
        bid: 'p-' + d + '-' + String(c.time).replace(':', '') + '-' + c.studio,
        avail: '', notfull: true,
        /* FIT has not rostered this week. Copying last week's instructor and duration
           forward asserts two facts nobody has published, on a row whose whole point is
           that it is a guess. Drop them; the sheet says so in words instead. */
        staff: '', end: '',
        start_iso: new Date(startMs).toISOString(),
        opens_iso: new Date(opensMs).toISOString(),
      }));
      added++;
    }
    /* AUDIT (round 2) — this used to `break` on the first shift that added nothing. When the
       last published date is TODAY every shift-7 date lands below PROJECT_MIN_LEAD, so the
       loop stopped before trying shifts 14 and 21 and produced no projection at all — and
       with the occ.length gate below, every healthy pick then read "Not on the timetable".
       The loop is bounded by the horizon already; there is nothing to break out of. */
    void added;
  }
  return Object.assign({}, tt, {classes: out});
}

function opensMsForSyd(dateStr, hhmm){
  const a = String(hhmm).split(':').map(Number);
  if(a.length < 2 || isNaN(a[0]) || isNaN(a[1])) return null;
  let h = a[0] - 1, day = String(dateStr);          // minus 1 hour, wall clock…
  if(h < 0){ h += 24; day = addDays(day, -1); }     // …which can cross midnight
  day = addDays(day, -7);                           // …and minus 7 CALENDAR days
  return sydWallToMs(day, String(h).padStart(2,'0')+':'+String(a[1]).padStart(2,'0'));
}
/* the class start itself, as a real instant, from Sydney wall fields */
function scanOpens(p, horizonDays){
  const now = Date.now(), wd = DAY_ORDER.indexOf(p.day);
  if(wd < 0) return null;
  const t0 = sydToday();
  for(let i=0;i<horizonDays;i++){
    const ds = addDays(t0, i);
    if(dowMon0(ds) !== wd) continue;
    const opens = opensMsForSyd(ds, p.time);
    if(opens === null) continue;                    // e.g. inside the DST gap — say nothing
    if(opens >= now - BOOK_GRACE_MS) return opens;
  }
  return null;
}
/* The bot's grace, in one place. fitbot.bookable_occurrence() books an occurrence only
   while its window opened within the last 20 minutes; scanOpens() below has always mirrored
   that. pickState() did NOT, which is the whole of the bug this constant exists to close:
   the row walked the timetable, took the first future class, and reported its long-expired
   window as "Open 6d 14h — not booked yet" for a pass the bot had correctly abandoned days
   earlier — while the hero, using scanOpens, simultaneously said the truth. Every surface
   that asks "when does this pick next book?" now goes through the same rule. */
const BOOK_GRACE_MS = 20 * 60000;
/* AUDIT — the horizon was 10 days against fitbot.bookable_occurrence()'s 17, with the bot
   carrying an explicit comment that "a short scan returns None for a perfectly healthy
   pick". 17 days is at least two occurrences of any weekday, so the answer no longer
   depends on which day of the week it is asked. */
function bookableOpensMs(p){ return scanOpens(p, 17); }
/* display-only: identical maths, longer horizon, so a countdown always exists */
function nextWindowMs(p){ return scanOpens(p, 21); }

/* A ONE-OFF pick is pinned to one calendar date, so its window is that date's
   start − 7d − 1h. bookableOpensMs above is the contract's recurring maths and is
   left byte-for-byte intact; this is the dated sibling, used only when p.date is set. */
/* The two strings the 1-second tick and renderBooked both write. One owner each, because
   they drifted the moment only one of the two was reworded. */
function freeCancelText(left){ return 'Free cancel for ' + relTime(left); }
function confirmWithinText(left){
  return 'Confirm within ' + relTime(left) + ' to keep your place' +
         (sweepArmed ? '' : ' (test mode — nothing is released yet)');
}

/* the same both-candidates rule as opensAtMs, for a pick that has no class object yet */
function opensPairMs(startMs, wallMs){
  /* `isFinite(null)` is TRUE in JavaScript — Number(null) is 0 — so a null start (which
     sydWallToMs returns for the hour Sydney skips in October, and for anything unparseable)
     used to yield an "absolute" reading of 0 − 169h, i.e. a window in 1969, which then won
     every Math.min. Test the type, not just finiteness. */
  const okStart = typeof startMs === 'number' && isFinite(startMs);
  const okWall  = typeof wallMs  === 'number' && isFinite(wallMs);
  const abs = okStart ? startMs - 169*3600000 : NaN;
  if(!okWall) return okStart ? abs : null;
  if(!okStart) return wallMs;
  return Math.min(wallMs, abs);
}
function oneOffOpensMs(p){
  const now = Date.now();
  const c = (timetable.classes||[]).find(x => x && x.date===p.date && x.time===p.time && x.studio===p.studio);
  let opens = null;
  /* AUDIT (19 Aug) — this took the WALL-CLOCK reading alone while opensAtMs (and the bot's
     next_window_open) take the earlier of the wall and absolute-169h readings. They differ by
     exactly an hour for the week after each DST change, and pickState would then resolve the
     occurrence one way and this fallback the other: for that hour the class the user had
     "booked" vanished off the Booked tab while the Book tab still said Booked. opensPairMs
     was written for precisely this and had no callers. Change 4 made one-off picks the normal
     product of the Book button, so a once-a-year edge became the main path. */
  const startMs = c && c.start_iso ? new Date(c.start_iso).getTime() : sydWallToMs(p.date, p.time);
  if(c && c.opens_iso){ const o = new Date(c.opens_iso).getTime(); if(isFinite(o)) opens = o; }
  if(opens === null) opens = opensMsForSyd(p.date, p.time);   // #6: calendar 7d+1h, not 169h
  if(opens === null) return null;
  opens = opensPairMs(startMs, opens);
  if(opens === null) return null;
  return opens >= now - 20*60000 ? opens : null;
}
function pickOpensMs(p){ return isOneOff(p) ? oneOffOpensMs(p) : bookableOpensMs(p); }

async function maybeKickSnipe(){
  const now = Date.now();
  const imminent = picks.some(p => { const o = pickOpensMs(p); return o !== null && (o - now) <= 45*60000; });
  if(imminent){
    try{
      await dispatch('snipe.yml');
      /* silently — "a booking run started" is background work, and the row on Picks says
         what it needs to say by itself. Only the failure below speaks. */
      watchDispatch();
    }catch(e){
      /* correctness #19f — this used to swallow everything. It is the mechanism that
         removes the cron lead-time requirement; if it fails, "the bot will book them
         automatically" is a lie and nothing started. */
      if(!handleApiErr(e))
        toast('Saved, but this one is opening very soon and may be missed. Check it ' +
              'pass will still try for this one.', 5200);
    }
  }
}

/* `autoSnipeIfOpen()` was DELETED. It fired unattended booking passes from the phone and
   every one of its three trigger conditions was wrong:
     • it fired for windows that opened long ago, which the bot structurally cannot book
       (its grace is 20 minutes) — burning its own retry budget on runs that can only fail;
     • it fired for a class the user had JUST cancelled, racing the cancel;
     • it fired for unsaved DRAFT picks that are not in picks.json, spending the debounce
       so the legitimate pass after Save was suppressed.
   It is also redundant: the Cloudflare Worker's every-minute cron dispatches snipe.yml
   from the generated schedule (AUTH.md), and saving picks triggers a pass server-side.
   Nothing replaces it — the phone does not decide when a booking pass runs. */

/* ════════════════════════════════════════════════════════════════
   Optimistic book / cancel
   ════════════════════════════════════════════════════════════════ */
/* A cancel (or a book) is a workflow_dispatch: the row cannot really change for ~a minute.
   Waiting for that is what made the app feel like a remote control rather than an app, so
   the list changes NOW and the server is reconciled against it afterwards.

   Two rules keep that honest:
     • a pending change is re-applied to every payload that lands, so a poll mid-flight
       cannot resurrect a cancelled row or drop a booked one;
     • if the server still disagrees SETTLE_MS after the dispatch, the change is put back
       the way it was and the user is told. A cancel that silently failed becomes a no-show,
       and three of those in 7 days is a booking ban — silence is the one unacceptable
       outcome here.
   IDENTITY IS FIT'S OWN BOOKING ID. It used to be date|time|studio with an unclassifiable
   studio silently guessed as 'exhale' — so two bookings at the same date+time, one of them
   unclassifiable, collided on one key. Cancel then re-found the row BY THAT KEY and spliced
   the wrong one off screen while telling the bot to cancel the other. Screen and reality
   ended up inverted, which is a no-show, which is a strike.
   Every account row carries `cancel_url` = /portal/account/cancelbooking/booking/1024573.
   That number identifies the booking and nothing else does. */
let pendingCancels = [];   // {key, at, b, idx, bookingId}
let pendingBooks   = [];   // {key, at, b, before:Set}
let pendingConfirms = [];  // {id, at, b}  — see confirmBooking()
let freshFromServer = false;   // did the load that is running right now actually land?

/* ── confirm-or-it-cancels ──────────────────────────────────────────────────────────
   The bot books classes the user never explicitly agreed to attend, and a booking he does
   not attend is a no-show: three in a rolling 7 days is a 7-day ban. So a bot-booked class
   has to be CONFIRMED here, and if it is not confirmed 4 hours before it starts, the bot
   cancels it. Not going is what happens unless he says otherwise.

   `confirmData` is data/<user>/confirm.json, an append-only event list with two writers
   (the bot records what it booked, the Worker records what the user confirmed). Both sets
   below are POSITIVE:

     autobooked  the BOT booked this and recorded FIT's booking id at the time
     confirmed   the user has said he is going

   A row is only ever at risk if it is in `autobooked`. That is the whole safety property:
   a class booked by tapping Book, booked in the FIT app, or booked at reception is never
   in that set, so it can never be auto-cancelled and never even shows a Confirm button.
   Nothing here infers "must be the bot's" from the absence of a confirmation — that would
   put every class the user booked himself elsewhere at risk of being deleted. */
let confirmData = [];
/* Is the sweep actually armed, or is it in dry run? Comes from the Worker. The app must
   NOT promise an auto-cancel that will not happen — CONTRACT §7, "things the UI must
   never claim". Default false: an app that cannot tell says the cautious thing. */
let sweepArmed = false;
/* Distinct from "switched off". The sweep has a daily run ceiling as a cost backstop, and
   hitting it means today's auto-cancels are not happening — which is a thing to act on,
   not a setting. Rows fall back to the cautious wording either way (sweepArmed is false);
   this only picks the explanation. */
let sweepPaused = false;
/* Sent on every /data call. The Worker records it per member and will not arm the sweep
   for anyone it has not seen — see worker.js `uiSeen`. */
const UI_CAPS = 'confirm1';
const CONFIRM_LEAD_MS = 4 * 3600000;      // must equal fitbot.SWEEP_LEAD_H
const CONFIRM_FLOOR_MS = 75 * 60000;      // must equal fitbot.SWEEP_FLOOR_MIN

function confirmState(){
  const autob = {}, conf = {};
  (Array.isArray(confirmData) ? confirmData : []).forEach(e=>{
    if(!e || typeof e !== 'object') return;
    const id = bookingId({booking_id: e.booking_id});
    if(!id) return;
    if(e.kind === 'autobooked'){ if(!autob[id]) autob[id] = e; }
    else if(e.kind === 'confirmed'){ conf[id] = e.ts || '1'; }
  });
  /* An optimistic confirm counts immediately — the tap is instant and silent like every
     other action here. If it turns out not to have stuck, reconcilePending() withdraws it
     and says so loudly, because an unconfirmed class WILL be cancelled. */
  pendingConfirms.forEach(p=>{ if(p && p.id) conf[p.id] = '1'; });
  return {autob: autob, conf: conf};
}
/* Does this row need confirming? Positive on every clause. */
function needsConfirm(b){
  if(!b || b.__pending) return false;
  const id = bookingId(b);
  if(!id) return false;
  const st = confirmState();
  return !!st.autob[id] && !st.conf[id];
}
/* When it will cancel itself: 4 hours before the class, as an INSTANT. bookingStartMs()
   already resolves the Sydney offset properly, so subtracting here is real elapsed time
   and stays correct across the 4 Oct 2026 DST change. */
function confirmDeadlineMs(b){
  const s = bookingStartMs(b);
  return s ? s - CONFIRM_LEAD_MS : null;
}
/* "2:00 am Sun 23 Aug", in Sydney, from an instant. */
function sydStampShort(ms){
  const p = sydParts(new Date(ms));
  return fmt12(p.hour+':'+p.minute).full + ' ' + shortDate(p.year+'-'+p.month+'-'+p.day);
}
/* FIT's numeric booking id, or '' when the row has no cancel link to read it from. */
function bookingId(b){
  if(!b) return '';
  const raw = String(b.booking_id || b.cancel_url || '').trim();
  if(raw.length > 256) return '';
  const m = raw.match(/\/booking\/(\d{1,12})(?:\D|$)/);
  if(m) return m[1];
  /* Bounded to 12 digits, the same as worker.js bookingIdOf() and fitbot.booking_id_of().
     An id one side accepts and another rejects is a Confirm button that always fails, or
     a roster entry nothing ever acts on. */
  return /^\d{1,12}$/.test(raw) ? raw : '';
}
/* Can the bot act on this row at all? It only ever cancels rows that carry a cancel link
   (fitbot.cmd_cancel filters on exactly that), so a row without one must not be offered a
   Cancel button that could never work. */
function isCancellable(b){ return !!(b && !b.__pending && String(b.cancel_url || b.booking_id || '')); }
function bookingKey(b){
  if(!b) return '';
  const id = bookingId(b);
  if(id) return 'id:'+id;
  /* No id: fall back, but never to a guess. The cancel link itself is unique per booking
     even when the id cannot be parsed out of it; only when there is no link at all do we
     drop to date+time+studio, and then studioFromBooking() answers 'unknown' rather than
     inventing 'exhale'. */
  const url = String(b.cancel_url || '');
  if(url) return 'u:'+url;
  return 'dts:'+String(b.date||'')+'|'+String(b.time||'')+'|'+studioFromBooking(b);
}
function bookingList(){
  if(!bookings || !Array.isArray(bookings.bookings)) bookings = {updated: bookings && bookings.updated, bookings: []};
  return bookings.bookings;
}
/* rows FIT has actually confirmed — everything that makes a CLAIM must use this, so an
   optimistic row this app invented can never be read back as evidence of a real booking */
function realBookings(){ return bookingList().filter(b => b && !b.__pending); }
function findBookingIdx(key){ return bookingList().findIndex(b => bookingKey(b) === key); }
function hasPending(key){
  return pendingCancels.some(p=>p.key===key) || pendingBooks.some(p=>p.key===key);
}
/* is there a pending optimistic BOOK covering this timetable occurrence? */
function pendingBookFor(date, time, studio){
  return pendingBooks.find(p => p.b && p.b.date === date && p.b.time === time &&
                                p.b.__pendingStudio === studio) || null;
}
/* is this exact slot already on the account (really, not optimistically)?
   AUDIT (18 Aug) — this used to accept a row whose studio could NOT be classified, and it
   is a hard block: `bookNow` refuses with "That class is already on your FIT account."
   A PT session or a HIIT class at the same time made that statement false and left no way
   to book the class from the app at all. The `=== null` acceptance was borrowed from
   `fitbot.booking_matches`, where the studio had already been asked for and date+time
   legitimately pin the row; here the studio is the whole question, so the precedent that
   applies is `fitbot.resolve_booking_id`, which refuses a row it cannot classify. */
function alreadyBookedSlot(c){
  return realBookings().some(b => b.date === c.date && b.time === c.time &&
    studioOfBooking(b) === c.studio);
}
/* unknownClashAt() is GONE (24 Aug 2026). It found a same-time booking whose studio could
   not be classified and raised a caution that never blocked. The time-overlap side of
   bookBlock() now covers it — an unclassifiable booking still says WHEN he is busy, and
   "booked at the same time" is a refusal under the owner's no-double-booking rule whatever
   the studio turns out to be. The honesty rule survives inside bookBlock: an unclassified
   studio never satisfies the STUDIO block, only the time one. */
/* Re-apply pending changes to the list that just arrived and decide any that have run out
   of time. Returns true when something was decided, so the caller re-renders even if the
   payload was byte-identical. */
/* rows already used to settle an optimistic book — persists across passes, cleared once
   nothing is pending */
let claimedRows = {};
function reconcilePending(){
  if(!pendingCancels.length && !pendingBooks.length && !pendingConfirms.length){
    claimedRows = {};
    return false;
  }
  /* Only ever judge against data that actually arrived. A failed load leaves the previous
     (already-edited) list in place, where a cancelled row is missing because WE removed it
     — reading that as "the server agrees" would retire the pending record without ever
     checking, and the settle guarantee would quietly evaporate. */
  if(!freshFromServer) return false;
  const now = Date.now(), list = bookingList();
  let settled = false;
  pendingCancels = pendingCancels.filter(p=>{
    const i = list.findIndex(b => bookingKey(b) === p.key);
    if(i < 0){                                 // the server agrees it is gone — done
      dropAlert('cancelunknown:'+p.key);
      return false;
    }
    if(now - p.at > CANCEL_SETTLE_MS){
      /* Still on the account long after the bot should have acted. Everything up to this
         moment was silent — the row simply vanished and the app behaved as though it were
         cancelled. This is the moment that stops being true, and it is the ONLY moment the
         user hears anything: the row is left where it is (that is the truth — it is still
         booked) and it comes back carrying a persistent warning of its own.

         The row reappearing is the alarm; the warning on it says why, so it cannot read as
         a glitch. It goes into stickyWarn, not into a toast and not into a dismissable
         notice: a cancel the user believes happened and which did not is a no-show, three
         of those in 7 days is a 7-day ban, and the warning must therefore outlive being
         backgrounded, relaunched, or tapped past.

         WHAT the warning says is now decided by the bot's log rather than by this deadline
         (19 Aug — this branch told the owner a cancel had failed while it was still queued,
         and FIT cancelled the class six minutes later). Three answers, not two, exactly as
         the BOOK path has had since 18 Aug:
           the bot says it cancelled  → the row goes, silently. Nothing failed.
           the bot says it could NOT  → the red claim, which is now earned.
           the bot has not spoken     → a DOUBT, in amber. It is still on the account and he
                                        should treat it as booked, but "you are still booked
                                        in" and "the cancel failed" are different sentences
                                        and only one of them is true here. */
      const v = cancelVerdictFor(p.b, p.at);
      if(v === 'ok'){
        /* The log is ahead of bookings.json — its own post-action refresh can fail (it logs
           refresh_failed, which this app already surfaces) or simply lag. Believe the
           positive: it is the bot's own written proof, and the next good refresh drops the
           row anyway. */
        dropAlert('cancelunknown:'+p.key);
        list.splice(i,1);
        settled = true;
        return false;
      }
      setStickyRowWarn(p.b, v === 'failed'
        ? {tone:'bad', text:'DIDN’T CANCEL — this is still booked. Cancel it here again, or '+
                            'at the club, or it becomes a no-show'}
        : {tone:'amb', text:'Still booked — this cancel hasn’t come through yet. Check before '+
                            'the class; if it is still here, cancel it again'});
      dropAlert('cancelunknown:'+p.key);
      settled = true;
      return false;
    }
    list.splice(i,1);                          // keep it hidden while the bot catches up
    return true;
  });
  const claimed = [];
  pendingBooks = pendingBooks.filter(p=>{
    /* A pending BOOK is a row this app invented from a timetable entry; FIT hands the real
       one back with its own name/location, which can classify to a different studio. So the
       studio is NOT compared — but the match must still be a booking that genuinely did not
       exist when the user tapped Book. Matching on date+time alone let an Infrared Sauna
       already sitting at 06:15 instantly "confirm" a Yoga booked at 06:15, after which the
       yoga's real failure was never reported at all. `before` is the set of row keys present
       at dispatch time; only a row outside it counts, and each new row can satisfy at most
       one pending book. */
    /* AUDIT (18 Aug) — the studio was deliberately not compared, because FIT hands the
       real row back with its own name and location and that can classify differently. But
       `studioOfBooking` answers null when it cannot tell, so a DEFINITE classification
       that differs is evidence, and throwing it away let an unrelated Cycle class booked
       by the bot's own snipe pass "confirm" a Reformer request that had failed. */
    const hit = list.find(b => !b.__pending && b.date === p.b.date && b.time === p.b.time &&
                               !(p.before && p.before[bookingKey(b)]) &&
                               !claimedRows[bookingKey(b)] &&
                               (studioOfBooking(b) === null ||
                                studioOfBooking(b) === p.b.__pendingStudio) &&
                               claimed.indexOf(b) < 0);
    /* If nothing matched on the strict studio rule but the settle window has passed, a
       single unclaimed new row at exactly this date+time is still better evidence than
       none: FIT does occasionally hand a booking back under a name this app classifies
       elsewhere, and leaving the optimistic row up produces a duplicate. Only when it is
       unambiguous — exactly one candidate. */
    let hit2 = null;
    if(!hit && now - p.at > SETTLE_MS){
      const cands = list.filter(b => !b.__pending && b.date === p.b.date && b.time === p.b.time &&
                                     !(p.before && p.before[bookingKey(b)]) &&
                                     !claimedRows[bookingKey(b)] && claimed.indexOf(b) < 0);
      if(cands.length === 1) hit2 = cands[0];
    }
    if(hit || hit2){
      const got = hit || hit2;
      claimed.push(got);
      /* `claimed` alone was rebuilt every call, so it only de-duplicated within ONE pass:
         two Book taps and one real booking settled both, one per poll. This survives. */
      claimedRows[bookingKey(got)] = true;
      dropAlert('bookunknown:'+p.key); dropAlert('bookfail:'+p.key);
      return false;
    }
    if(now - p.at > SETTLE_MS){
      /* AUDIT (18 Aug) — this announced "Nothing was booked" from `bookings.json` alone.
         That file is written by the bot's post-action refresh, which can fail (it logs
         `refresh_failed` and says so) or simply be slower than the settle window when a
         runner is queued. Meanwhile the bot's own positive proof — `booknow` with
         `booked:true`, "confirmed on the FIT account booking list" — sits unread in the
         same payload. Telling the owner nothing was booked when it WAS is the no-show this
         whole project exists to prevent, so consult the log before speaking. */
      const verdict = botVerdictFor(p.b.date, p.b.time, p.b.__pendingStudio, p.at - 60000);
      if(verdict === 'ok'){
        /* Proven booked by the bot's own account read, just not in the data files yet
           (its post-action refresh failed, or Actions is slow). Hold the row and say
           nothing — botStaleNote already explains why the list lags. Held until the class
           starts rather than for a fixed multiple of the settle window: dropping it early
           made a real booking silently disappear off the screen. */
        const startMs = new Date(p.b.date+'T'+String(p.b.time||'00:00')+':00').getTime();
        if(!isFinite(startMs) || now < startMs){ if(list.indexOf(p.b) < 0) list.push(p.b); return true; }
        return false;
      }
      if(verdict === 'failed'){
        announce({id:'bookfail:'+p.key, tone:'amber', tab:'booked',
                  title:'That booking didn’t go through',
                  body:(p.b && p.b.name ? p.b.name : 'The class')+' is not on your '+
                       'bookings. Nothing was booked — try again, or book it at the club.'});
      }else{
        announce({id:'bookfail:'+p.key, tone:'bad', tab:'booked',
                  title:'Couldn’t confirm that booking',
                  body:(p.b && p.b.name ? p.b.name : 'The class')+' isn’t showing on your '+
                       'bookings, and it hasn’t been confirmed either way. Check before the class: '+
                       'book it again if it isn’t there — and if it IS there and you won’t '+
                       'go, cancel it or it becomes a no-show.'});
      }
      dropAlert('bookunknown:'+p.key);
      settled = true;
      return false;
    }
    if(list.indexOf(p.b) < 0) list.push(p.b);  // hold the optimistic row until it lands
    return true;
  });
  /* Pending CONFIRMS. Only ever reached with a successful /confirm behind them —
     confirmBooking() withdraws its own record on any error, because the Confirm button
     coming back is the honest state and re-tapping is free. So this is pure bookkeeping:
     hold the optimistic "confirmed" look until the server's own list agrees, then let go.

     The timeout is generous and DELIBERATELY SILENT. The Worker answered 200, which means
     the confirmation is written; GitHub's contents API is merely slow to show it. Alarming
     here would train the user to ignore an alarm that is usually wrong — and the state it
     would be complaining about is one the row itself re-advertises the moment the record
     is dropped and the server still disagrees. */
  const serverConfirmed = {};
  (Array.isArray(confirmData) ? confirmData : []).forEach(e=>{
    if(e && e.kind === 'confirmed'){
      const id = bookingId({booking_id: e.booking_id});
      if(id) serverConfirmed[id] = true;
    }
  });
  if(!pendingBooks.length) claimedRows = {};
  pendingConfirms = pendingConfirms.filter(p=>{
    if(serverConfirmed[p.id]){ dropAlert('confirmfail:'+p.id); return false; }
    /* the booking has left the account entirely (cancelled elsewhere, or swept) — there is
       nothing left to confirm */
    if(!list.some(b => bookingId(b) === p.id)){ dropAlert('confirmfail:'+p.id); return false; }
    if(now - p.at > SETTLE_MS * 2){ settled = true; return false; }
    return true;
  });
  return settled;
}
/* Snapshot of what was on the account at the instant an optimistic action was taken. */
function bookingKeySnapshot(){
  const o = {};
  realBookings().forEach(b => { o[bookingKey(b)] = true; });
  return o;
}
/* ── never rebuild the screen out from under a finger ───────────────────────────────
   renderBooked() replaces #w-booked wholesale, and this screen redraws on a 45s poll, a
   5-minute past-class sweep and every countdown flip. If one lands between finger-down
   and finger-up, the element the touch started on is detached, so no `click` is
   synthesised on any [data-confirm] — the tap does nothing at all, silently. On a row
   counting down to a deadline that is the worst possible thing for a tap to do.
   (It cannot hit the WRONG row — the buttons carry the booking's identity, not its
   position — but "nothing happened" is still a failure.)
   A tap is down-then-up in ~100ms, so deferring for the duration of one is invisible. */
let pointerHeld = 0, renderHeld = false, heldTimer = null;
function flushHeld(){
  if(heldTimer){ clearTimeout(heldTimer); heldTimer = null; }
  if(!renderHeld) return;
  renderHeld = false;
  try{ renderAll(); }catch(e){}
}
/* AUDIT (18 Aug) — this deferred the held redraw by ONE MACROTASK on the reasoning that
   `setTimeout(0)` "puts the redraw after the click has been dispatched". On touch it does
   not: iOS synthesises mousedown/mouseup/click ~20-30 ms AFTER touchend, in a later task
   than the 0 ms timer. So the redraw landed in the gap, and the click was then hit-tested
   against a REBUILT list — measured: finger down on one class's repeat glyph, poll lands,
   finger up, and a different class's weekly pick is removed, with a toast whose wording is
   identical either way. That is strictly worse than the swallowed tap this latch was
   written to prevent: it is a silent wrong action on the wrong class.

   So hold until the click has actually been dispatched. The click listener below is
   capture-phase (it runs before the delegated handler) and defers by a macrotask from
   THERE, which lands after the whole click dispatch. The timer is the fallback for the
   taps that never produce a click at all — a scroll, a cancelled gesture, a system
   swipe — and 450 ms is longer than any real tap and shorter than a poll interval. */
function releasePointer(){
  pointerHeld = 0;
  if(!renderHeld) return;
  if(heldTimer) clearTimeout(heldTimer);
  heldTimer = setTimeout(flushHeld, 450);
}
/* AUDIT round 2 — `releasePointer` was also called by the 1 s watchdog at 1.5 s of hold,
   without checking whether the pointer was actually UP: a press held ~2 s got the list
   rebuilt underneath it and the tap landed on a different class — the exact defect the
   click-flush fix was written to remove, reachable by pressing rather than tapping. The
   watchdog still exists (iOS can swallow a pointerup to a system gesture), but a finger
   that is provably down buys a much longer grace, and nothing is flushed until it lifts. */
let pointerDown = false;
function holdActive(){
  if(!pointerHeld) return false;
  if(Date.now() - pointerHeld > (pointerDown ? 6000 : 1500)){
    pointerHeld = 0; pointerDown = false; return false;
  }
  return true;
}
try{
  document.addEventListener('pointerdown', ()=>{ pointerDown = true; pointerHeld = Date.now(); }, true);
  /* capture, so it is seen before the delegated handler; the macrotask from here runs
     after that handler has finished with the DOM it was hit-tested against */
  document.addEventListener('click', ()=>{
    if(renderHeld) setTimeout(flushHeld, 0);
  }, true);
  /* Several ways out, on purpose. A latch with a single release is a latch that sticks:
     iOS can swallow a pointerup to a system gesture, a share sheet or a context menu, and
     if that ever happened the countdown flip, the 45s poll redraw and the 5-minute
     past-class sweep would all stop for good — leaving the Booked screen frozen on a
     stale "Confirm by … or this cancels itself" until the next tap. The hold is only ever
     meant to cover the ~100ms of one tap, so a stale one is always a bug. */
  ['pointerup','pointercancel','lostpointercapture','touchend','touchcancel',
   'visibilitychange'].forEach(ev=>{
    document.addEventListener(ev, ()=>{ pointerDown = false; releasePointer(); }, true);
  });
  /* Window blur ONLY — the app losing focus. NOT a capture-phase 'blur' on document:
     that fires for every element that loses focus, including the one the finger just
     pressed, so it released the latch on the same tick it was taken and the whole guard
     was inert. `blur` does not bubble, so a plain window listener sees only window blur. */
  window.addEventListener('blur', releasePointer);
}catch(e){}
/* every TIMER-driven redraw goes through this; user-initiated ones call renderAll */
function renderAllIdle(){
  /* ...and a watchdog, so even a release event that never arrives cannot outlast one
     redraw interval — but a finger that is still down is not a stuck latch (round 2) */
  if(holdActive()){ renderHeld = true; return; }
  renderHeld = false;
  renderAll();
}

/* redraw everything without throwing the reader out of their scroll position */
function rerenderKeepScroll(){
  const p = $('#page-'+activeTab), s = p ? p.scrollTop : 0;
  renderAll();
  if(p) p.scrollTop = s;
}

/* ════════════════════════════════════════════════════════════════
   After a dispatch — invisible
   ════════════════════════════════════════════════════════════════ */
/* This used to be beginFlight()/clearFlight(): an amber hairline under the nav bar plus a
   "Cancelling on FIT — confirming in about a minute" toast. Both are gone. What is NOT gone
   is the thing they were bolted to — a late re-read of the data once the workflow has had
   time to run, which is one of the ways an optimistic row gets confirmed. Deleting the bar
   must not delete the check, so the two are separated: this schedules the re-read and shows
   nothing at all.

   F24 — these timers were untracked and the reload did not check document.hidden, so a
   backgrounded app still burnt requests on a screen nobody was looking at, and a session
   bail-out mid-booking left timers running against a signed-out app. */
let flightTimers = [];
function clearDispatchWatch(){
  flightTimers.forEach(clearTimeout); flightTimers = [];
}
function watchDispatch(ms){
  const wait = ms || 75000;
  /* match pollAfterDispatch: never burn a request for a screen nobody is looking at —
     visibilitychange already re-loads on the way back in */
  const id = setTimeout(()=>{
    flightTimers = flightTimers.filter(x => x !== id);   // don't accumulate dead ids
    if(!document.hidden) loadAll(true);
  }, wait);
  flightTimers.push(id);
}

/* ════════════════════════════════════════════════════════════════
   Live data (§3) — poll while visible, auto-dispatch a real FIT sync
   when the files go stale, and show freshness instead of demanding a tap.
   ════════════════════════════════════════════════════════════════ */
/* ── "this member has never been synced at all" ──────────────────────────────────────
   `bookings.updated` is null only until the bot has read this member's FIT account ONCE —
   fitbot.set_user() seeds the file that way and cmd_refresh() always stamps a real time,
   even for an account holding nothing. So null means NEVER SYNCED, never "no bookings".

   That distinction is the whole bug. dataUpdatedMs() took the oldest NON-NULL stamp, and
   the timetable is shared — Josh's runs keep it minutes old — so a brand-new member read
   as perfectly fresh, isStale() was false, autoSync() never fired and Booked said "Not
   synced yet / Nothing booked" until a scheduled refresh happened along, up to 8 hours
   later. For those hours alreadyBookedSlot() and the one-class-per-studio-per-day warning

  if(lastDataJson === null) return false;

    if(!u) return;

/* ageLong() — "updated 4 min ago" / "never synced" — is DELETED with the Booked subtitle

  });

     survives being backgrounded, so this timer being destroyed is no longer fatal.
     `syncing` no longer draws ANYTHING — nothing reads it but autoSync()'s re-entry guard

   SAVE, so somebody who signs in and saves nothing is not iterated by refresh.yml at all.
   Unbounded, that is a dispatch of a workflow that cannot help them every DISPATCH_MIN for
   as long as the app is open. Bounded, it is three tries — enough for a slow or unlucky
   first run, not enough to be a storm — and it costs nothing in the case it exists for,

  if(boot && !force && bootstrapSyncs >= BOOTSTRAP_SYNCS) return false;

/* ── fast poll: the honesty guarantee behind the optimistic rows ──────────
   After a book or a cancel the app checks every FAST_POLL_MS instead of every 45s, so the
   change is confirmed (or withdrawn) in seconds. It stops itself the moment nothing is
   pending, and never runs longer than FAST_POLL_MAX. */
/* `fastStopOnSettle` is gone. It was only ever set to false (by the deleted
   autoSnipeIfOpen) and reset in stopFastPoll(), so once a booking pass had flipped it, no
   later book or cancel could ever end its fast poll early. Every remaining caller watches a
   specific pending row, so the rule is unconditional: stop when nothing is pending. */
function startFastPoll(){
  fastUntil = Date.now() + FAST_POLL_MAX;
  if(fastTimer || document.hidden) return;
  fastTimer = setInterval(()=>{
    if(document.hidden || !session || !booted) return;
    if(Date.now() > fastUntil){ stopFastPoll(); return; }
    loadAll(true).then(()=>{
      if(!pendingCancels.length && !pendingBooks.length && !pendingConfirms.length && !syncing) stopFastPoll();
    });

function stopFastPoll(){

     was already resolved and polls every 8s for nothing */

    loadAll(true);

  }, POLL_MS);
  /* A pending action that outlived a trip to the background resumes its fast poll here.
     The condition is "is anything still pending", not the old `fastUntil > now` — that
     variable is cleared by stopFastPoll(), which stopPolling() has just called, and a
     stale deadline used to restart an already-resolved window anyway. */
  if(pendingCancels.length || pendingBooks.length || pendingConfirms.length) startFastPoll();
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  stopFastPoll();

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ stopPolling(); clearPostPoll(); return; }
  reapSync();                      // F2 — hours may have passed; an "in flight" sync expired
  startPolling();
  if(!session || !booted) return;
  /* coming back is the strongest signal that the screen is about to be read: re-read now,
     dispatch a real sync if the data has gone stale, and settle anything still pending */
  loadAll(true).then(()=>{ if(isStale()) autoSync(); });

/* iOS fires pagehide, not always visibilitychange, when a home-screen web app is put away
   or frozen. Stop the timers there too, and flush the unsaved-pick draft (F7). */
window.addEventListener('pagehide', function(){ stopPolling(); clearPostPoll(); try{ saveDraft(); }catch(e){} });
window.addEventListener('pageshow', function(e){
  if(!e.persisted) return;         // a bfcache restore resumes a page whose timers are gone
  reapSync(); startPolling();

     a pick that is always scheduled, while "Booked for Wed" does.

     AUDIT (round 2) — this was a check INSIDE the loop, so a blocked earlier occurrence
     returned first and hid it. Consecutive weekly windows open an hour before the previous
     class starts, so for that hour every week occurrence 2 is booked while occurrence 1 is
     still in the future: the row shouted about a clash and never said he had a class. It is
     a pre-scan now, so nothing can get in front of it. */
  for(let i=0;i<occ.length;i++){
    const c = occ[i];
    if(exact[c.date+'|'+c.studio+'|'+c.time]) return {kind:'booked', opens:null, cls:c};
  }
  let stale = null;
  for(let i=0;i<occ.length;i++){
    const c = occ[i];
    /* asked for, not answered: show the truthful in-between state rather than either a
       tick or a countdown */
    if(pendingBookFor(c.date, c.time, c.studio)) return {kind:'booking', opens:null, cls:c};
    /* AUDIT — this used to record `blocked` and keep looking, so it only ever surfaced if
       EVERY later occurrence also fell through. With four weeks of projected occurrences
       there is always a later one whose window is in the future, which made the warning
       unreachable for recurring picks: the bot logs snipe_skipped_studio_limit and refuses
       to book, and the row said "Booking scheduled". FIT allows one class per studio per
       day; the soonest occurrence being blocked is a fact about a date the owner can still
       act on, so it is reported where it happens, exactly like `booked` above. */
    const other = sameStudio[c.date+'|'+c.studio];
    if(other) return {kind:'blocked', opens:null, cls:c, by:other};
    const o = opensAtMs(c);
    if(!isFinite(o)) continue;
    /* THE FIX. An occurrence whose window opened longer ago than the bot's grace is one no
       pass will ever take — reporting it as "not booked yet" is a countdown for a run that
       cannot happen, and it fires for every recurring pick added after its own window
       opened, which is the normal way a pick gets added. Skip it and keep looking. */
    if(o < now - BOOK_GRACE_MS){ if(!stale) stale = c; continue; }
    return {kind: o <= now ? 'open' : 'waiting', opens:o, cls:c};
  }
  /* Nothing left that the bot can still act on. A RECURRING pick keeps going past the end of
     the published timetable, so fall back to the same rule the bot uses — but ONLY if this
     slot actually exists somewhere in the four weeks the app can see.

     AUDIT — the fallback used to run unconditionally. pickOpensMs() is pure calendar
     arithmetic that never checks the slot exists, so a pick for a class FIT has deleted read
     "Booking scheduled" — and, because the scan is a fixed number of days, whether it did
     depended on the WEEKDAY: the same untouched Wednesday pick said "Not on the timetable"
     on a Sunday and "Booking scheduled" on the Monday. */
  /* AUDIT (round 2) — the gate must not fire when the app simply has no forward timetable to
     check against (never synced, or a scrape old enough that every date it holds is past).
     The bot works from its own scrape, not this copy, so "scheduled" is the true answer
     there and "Not on the timetable" would be the app asserting something it cannot know. */
  if(occ.length || !allDates.length){
    const beyond = pickOpensMs(p);
    if(beyond !== null) return {kind:'waiting', opens:beyond, cls:null};
    /* The class is still on the timetable, still in the future, and its booking window has
       closed with nothing booked — the bot's run was late or down. There is no next window
       for a one-off, so nothing above this can speak for it, and it used to fall all the way
       through to "Not on the timetable", which is false and points the wrong way. */
    if(stale) return {kind:'missed', opens:null, cls:stale};
  }
  /* a one-off whose date has already gone — or is earlier today — is spent, not broken */
  if(isOneOff(p) && pickDate(p) <= sydToday()) return {kind:'expired', opens:null, cls:null};
  return {kind:'missing', opens:null, cls:null};
}

/* the soonest booking window among the OWNER'S PICKS — the hero */
function nextPickWindow(){
  if(heroCache && heroCache.at > Date.now() - 5000) return heroCache.v;
  const now = Date.now();
  let best = null;
  picks.forEach(p=>{
    let hit = null;
    pickOccurrences(p).forEach(c=>{
      const o = opensAtMs(c);
      if(isFinite(o) && o > now && (!hit || o < hit.opens)) hit = {opens:o, cls:c, pick:p};
    });
    if(!hit){
      /* a one-off can only ever open on its own date — never project it forward */
      const o = isOneOff(p) ? oneOffOpensMs(p) : nextWindowMs(p);
      if(o !== null && o > now) hit = {opens:o, cls:null, pick:p};
    }
    if(hit && (!best || hit.opens < best.opens)) best = hit;
  });
  heroCache = {at:Date.now(), v:best};
  return best;
}

const NAV_TITLES = {book:'Book', booked:'Booked', picks:'Picks'};

function renderAll(){
  /* AUDIT (18 Aug) — this rebuilt all three tabs on every poll, countdown flip and idle
     tick: measured 18.0 ms against renderBook's 3.8 ms, two thirds of it spent serialising
     53 KB of HTML into two tabs nobody was looking at. It is also the thing that re-targets
     taps (see releasePointer) and resets scroll positions, so the cheapest fix for both is
     to stop doing the work. The hidden tabs are marked dirty and flushed by switchTab, so
     nothing can be shown stale.
     F10 lives in renderBook() now — it owns the chip rail's scroll. */
  resetDerived();
  const R = {book:renderBook, booked:renderBooked, picks:renderPicks};
  Object.keys(R).forEach(t=>{
    if(t === activeTab) safeRender(t, R[t]);
    else tabDirty[t] = true;
  });
  try{ syncDirty(); updateNav(); }catch(e){}
}
let tabDirty = {book:false, booked:false, picks:false};
function flushTab(t){
  if(!tabDirty[t]) return;
  tabDirty[t] = false;
  safeRender(t, t==='book' ? renderBook : t==='booked' ? renderBooked : renderPicks);
}
function safeRender(tab, fn){
  try{ fn(); }
  catch(e){
    try{ $('#w-'+tab).innerHTML = errorBlock(e); }catch(x){}
    if(window.console && console.warn) console.warn(e);
  }
}
function errorBlock(e){
  return '<div class="emptystate"><div class="eg">'+G.big_cal+'</div>'+
    '<div class="et">Couldn’t draw this screen</div>'+

    '<div class="group" style="margin-top:8px"><button class="row tapme" data-act="reload">'+

/* ── date strip: exactly one week, seven equal columns, never scrolls ─── */
function railHTML(){
  const today = sydToday();
  return weekDates(weekStart).map(d=>{
    const st = studiosOn(d);
    const cls = ['dcell'];
    /* The strip starts at today, so this cannot fire — which is exactly why it stays. It is
       what makes the tap handler's `past` guard, and the .dcell.past rule, load-bearing
       rather than decorative if the anchor is ever wrong again. */
    if(d < today) cls.push('past');
    if(d === selDate) cls.push('sel');   // aria-current below: the strip is the only day control now
    if(d === today) cls.push('today');
    if(!st.length) cls.push('noclass');
    const pips = st.slice(0,5).map(s=>'<i style="background:'+SCOLOR[s]+'"></i>').join('');
    return '<button class="'+cls.join(' ')+'" data-date="'+d+'"'+
         (d === selDate ? ' aria-current="date"' : '')+
         ' aria-label="'+esc(longDate(d))+'">'+
         '<span class="dw">'+(d===today?'TODAY':WD_SHORT[dowMon0(d)].toUpperCase())+'</span>'+
         '<span class="dn">'+dayNum(d)+'</span>'+
         '<span class="pips">'+pips+'</span></button>';
  }).join('');
}
/* weekHeadHTML() is gone: its chevrons are in the nav bar (see #navPrev/#navNext, whose
   disabled state syncWeekNav() owns) and its "17 – 23 Aug · next 7 days" label said what the
   seven dated cells directly beneath it already said. */
function chipsHTML(){
  const items = [{k:'all',label:'All'}].concat(STUDIOS.map(s=>({k:s,label:SLABEL[s]})));
  return items.map(it=>{
    const dot = it.k==='all' ? '<span class="cd all"></span>'
                             : '<span class="cd" style="background:'+SCOLOR[it.k]+'"></span>';
    return '<button class="chip" data-studio="'+it.k+'" role="tab" aria-selected="'+(studioFilter===it.k)+'">'+
           dot+'<span>'+esc(it.label)+'</span></button>';
  }).join('');
}

/* ── class row ──────────────────────────────────────────────── */
function classRowHTML(c){
  const t = fmt12(c.time);
  const av = availInfo(c);
  const opensMs = opensAtMs(c);
  const open = isFinite(opensMs) && opensMs <= Date.now();
  const pk = pickFor(c);
  const picked = !!pk, once = picked && isOneOff(pk);
  const hasRec = pickIndex(c.day, c.time, c.studio, '') >= 0;
  /* the booking that IS this class outranks everything: it is not a conflict with itself,
     it cannot be booked again, and it is the most useful thing this row can say */
  const mine = bookingForClass(c);
  /* "Booked" is the answer for anything that is on the account OR that something is now
     going to put there. A pick is not a booking and this row is the ONE place that blurs
     them, deliberately: the owner asked for a tap to read as done rather than as scheduled
     ("it should just say booked… we always assume that it's booked"). It is safe here and
     only here because this is a CAUTION-side surface — nothing downstream reads a row's
     label as evidence. Every CLAIM in the app still goes through realBookings(); see
     CONTRACT §7a and D-41. If the booking never lands, the pick row and the Booked tab both
     say so loudly, which is the whole failure story the owner asked for. */
  const willBook = !!mine || (picked && pickIsLive(pk, c));
  /* The reason this row cannot be offered at all — a same-studio class already taken that
     day, or a time overlap with something booked. Replaces the old one-per-day CAUTION
     ("Book anyway"): the owner's rule since 24 Aug is that a collision is a refusal, not a
     question. Suppressed for a row that is itself booked or claimed — Booked outranks. */
  const block = (mine || willBook) ? null : bookBlock(c);
  /* AUDIT (18 Aug) — `picked` used to suppress the clash line, which disabled the one
     surface that could report a genuine two-picks-one-studio-one-day conflict exactly
     when it was real. The clash is a fact about the pick beside it, not about this row. */
  const clash = (mine || block || av.full) ? null : pickClash(c);

  /* The status line now only says what the action column CANNOT. "Open now" was six green
     flags down one screen all restating the Book button beside them, and "Not open yet" is
     the stopwatch the owner has twice asked not to see — a class you can act on and a class
     that will be acted on for you look the same, because to him they are the same. What
     survives is the one thing no button can carry: that an unpublished row is the app's own
     guess (D-25 — a projection may assert WHEN and nothing else). */
  /* AUDIT round 2 — the action column moved the full-and-open states above `willBook`, but
     the row TINT and the status caption still read `willBook` directly. A full class held by
     a pick therefore drew in the green "you have this" tint with no "Full" caption, above a
     pill reading "Waitlist full". Three surfaces on one row, two of them answering a question
     the third had already overruled. One value, computed once, for all three. */
  const shownBooked = !!mine || (willBook && !(open && av.full));

  let stTxt = '', stCls = '', stG = '';
  if(shownBooked){
    stTxt = '';                                   // the action column says "Booked"
  } else if(av.full){
    /* av.cls, not a hardcoded tone: the row and the class detail sheet were painting the
       same class two different colours, and the row was calling the worse state calmer. */
    stTxt = av.label; stCls = av.cls;
  } else if(av.projected){
    stTxt = 'Not published yet'; stCls = ''; stG = G.clock;
  } else if(av.label && av.label !== 'Spaces'){
    /* "Filling up" / "Almost full" is the signal that actually drives a booking, and the
       first pass of the sweep took it out along with "Open now". D-27: when a surface is
       removed, check what else was riding on it. Grey — it is information, not an alarm. */
    stTxt = av.label; stCls = '';
  }

  const staff = c.staff && String(c.staff).trim() ? String(c.staff).trim() : '';
  const tail = (SLABEL[c.studio]||c.studio) + (staff ? ' · ' + staff : '');

  /* ── the action column: one slot, one width, six states, decided once ───────────────
     Precedence, and why it is this order (amended by audit round 2 — a pick's claim used to
     sit above the full states, so a full class held by a pick was painted as booked; and on
