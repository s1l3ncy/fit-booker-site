function stepWeek(delta){
  if(!weekStart) return;
  const next = clampWeek(addDays(weekStart, delta*7));
  const slide = $('#railslide');
  if(next === weekStart){
    if(slide){ slide.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
               slide.style.transform='translateX('+(delta>0?-10:10)+'px)';
               setTimeout(()=>{ slide.style.transform=''; setTimeout(()=>{ slide.style.transition=''; },320); },130); }
    return;
  }
  if(slide) slide.classList.add(delta > 0 ? 'out-l' : 'out-r');
  weekStart = next;
  setTimeout(()=>{
    renderBook();
    const s2 = $('#railslide');
    if(s2){
      s2.classList.add(delta > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
  }, slide ? 150 : 0);
}

/* ── Booked screen ──────────────────────────────────────────── */
/* correctness #10 — mirrors fitbot.booking_studio(), which deliberately returns None
   rather than guessing ("an unknown row must not block a real pick"). The old single
   guesser could never say "I don't know": every unclassifiable booking — a PT session, a
   renamed class — became a phantom "Exhale booked that day" that both suppressed a real
   exhale pick and claimed on screen that the bot had won it.
   `studioOfBooking` is the honest one and is what any CLAIM must use. `studioFromBooking`
   is the always-answer sibling used only where a string is structurally required — and it
   now answers 'unknown', never 'exhale'. Guessing 'exhale' collapsed an unclassifiable
   booking onto the key of a real exhale booking at the same time, and the cancel path then
   hid one row and cancelled the other. 'unknown' matches no studio the bot knows, so the
   bot falls through to its date+time path and REFUSES to guess if that is ambiguous. */
function studioOfBooking(b){
  const s = (((b&&b.name)||'')+' '+((b&&b.location)||'')).toLowerCase();
  if(s.indexOf('reformer')>=0) return 'reformer';
  if(s.indexOf('sauna')>=0 || s.indexOf('nurture')>=0) return 'nurture';
  if(s.indexOf('cycle')>=0) return 'cycle';
  /* word-start match so a future class called "Core Crunch" isn't mapped to run */
  if(s.indexOf('bolt')>=0 || s.indexOf('afterburner')>=0 || /\brun/.test(s) || /\bwod\b/.test(s)) return 'run';
  if(/\b(exhale|yoga|pilates|barre|vinyasa|hatha|yin|meditation|stretch|mobility)\b/.test(s)) return 'exhale';
  return null;
}
function studioFromBooking(b){ return studioOfBooking(b) || 'unknown'; }
/* Resolve a Sydney wall-clock date+time to a real instant.
   A hard-coded +10:00 is wrong for half the year (AEDT is +11:00) and that error
   lands squarely on the free-cancel / strike boundary, so solve it against the same
   Intl formatter everything else uses instead of guessing the offset. */
function sydWallToMs(dateStr, hhmm){
  const a = String(dateStr).split('-').map(Number);
  const b = String(hhmm).split(':').map(Number);
  if(a.length < 3 || b.length < 2 || a.some(isNaN) || b.some(isNaN)) return null;
  let ms = Date.UTC(a[0], a[1]-1, a[2], b[0]-10, b[1]);   // seed at AEST, then correct
  let ok = false;
  for(let k=0;k<4;k++){
    const p = sydParts(new Date(ms));
    const drift = (Number(p.hour)*60 + Number(p.minute)) - (b[0]*60 + b[1]);
    if(!drift){ ok = true; break; }
    /* wrap a drift that crossed midnight (±23h) back into ±12h */
    const d = drift > 720 ? drift - 1440 : (drift < -720 ? drift + 1440 : drift);
    ms -= d * 60000;
  }
  /* correctness #19c — the hour skipped by spring-forward does not exist (2026-10-04
     02:30 has no instant). The loop used to give up and hand back 01:30, a plausible-
     looking wrong answer that would land on the free-cancel/strike boundary. Say null. */
  if(!ok || !isFinite(ms)) return null;
  return ms;
}
/* ── the bot's own actionable outcomes (contract §7) ─────────────────────────────────
   The activity list is gone and is not coming back, but a handful of bot log entries are
   not activity — they are unfinished business that only the user can close, and the worst
   of them is `cancel_failed`: the class is STILL on the FIT account, so not acting on it
   is a no-show and a strike. Those are derived from the `log` the app already fetches and
   attached to the row they belong to, where the user is already looking.

   Only the LAST cancel-related entry per booking counts, and a warning is only shown while
   the booking it describes is still on the account — so it retires itself the moment the
   thing it warns about is genuinely resolved. */
function logBookingId(e){
  const t = (e && e.target) || {};
  return String(e && e.booking_id ? e.booking_id : (t.booking_id || '')) || '';
}
function logRowKey(e){
  const id = logBookingId(e);
  if(id) return 'id:'+id;
  const t = (e && e.target) || {};
  const d = t.date || e.date || '', tm = t.time || e.time || '';
  return (d && tm) ? 'dt:'+d+'|'+tm : '';
}
function bookingRowKeys(b){
  const out = [];
  const id = bookingId(b);
  if(id) out.push('id:'+id);
  if(b && b.date && b.time) out.push('dt:'+b.date+'|'+b.time);
  return out;
}
/* ── every kind fitbot.log_event() can emit, and where it reaches the user ───────────
   §7: the app must never claim success from a bot log kind it does not understand, and
   skips/failures must be visually distinct from successes. That only holds if the set of
   kinds is written down, so this table IS the mapping — a kind missing from it is a
   mapping bug and says so in the console (developers only; never the user).
     'row'   — inline warning on the booking row it is about   (botRowWarnings)
     'alert' — persistent notice on Booked, no row to hang off (syncBotAlerts)
     'note'  — freshness note on Booked                        (botStaleNote)
     ''      — deliberately no user surface, for the reason grouped above it            */
const BOT_LOG_SURFACE = {
  /* unfinished business only the user can close */
  cancel_failed:'row', cancel_notfound:'row', cancel_unknown:'row',
  waitlisted:'alert', book_unknown:'alert', booknow_unknown:'alert',
  refresh_failed:'note',

  /* GOOD news, and identical in effect to a clean success: the request failed in transit
     but the action is CONFIRMED on the FIT account — it IS booked / it IS cancelled. Each
     is always followed in the same run by the ordinary `booked` / `booknow` / `cancelled`
     entry, and the Booked list already shows the result, so a surface of its own could
     only make something that went right read like something that went wrong. What these
     must do instead is CLEAR doubt raised earlier, and they do: both are settling kinds
     below, so a recovered booking retires an earlier "couldn't tell" notice. */
  book_recovered:'', cancel_recovered:'',

  /* intermediate diagnostics. A step failed, so the bot went and read the FIT account
     before saying anything at all — none of these is an outcome and none of them means
     the action failed. The outcome is a separate entry, and that one is mapped. */
  book_transport_error:'', cancel_transport_error:'', recheck:'', book_attempt:'',

  /* outcomes and housekeeping the screens already show better than a log line can:
     a booking appears on Booked, a pick shows its own state on Picks, a failed scrape
     shows as stale data. */
  refresh:'', booked:'', booknow:'', cancelled:'',
  booknow_notfound:'', booknow_ambiguous:'', scrape_error:'', cred_fallback:'',
  form_checkbox_skipped:'', picks_unreadable:'', pick_removed:'', pick_bad_date:'',
  pick_day_mismatch:'', pick_name_drift:'', pick_unusable:'',
  snipe_notfound:'', snipe_waiting:'', snipe_full:'', snipe_rejected:'', snipe_failed:'',
  snipe_nopicks:'', snipe_skipped:'', snipe_nothing_due:'', snipe_late:'',
  snipe_skipped_studio_limit:'',

  /* ── confirm-or-it-cancels ────────────────────────────────────────────────────────
     The sweep cancels bot-booked classes the user never confirmed. Every one of these
     describes something done to a REAL booking without being asked, so the bar for
     showing it is lower than anywhere else in this table: silence here means a class
     disappeared and nothing said so. */
  auto_cancelled:'alert',            // it is gone, and he needs to know why
  auto_cancel_failed:'row',          // still booked after the attempt — a coming no-show
  auto_cancel_unknown:'row',         // couldn't be verified — treat as still booked
  sweep_too_late:'row',              // unconfirmed and now inside the late-cancel window
  sweep_uncancellable:'row',         // unconfirmed, due, and FIT gives no cancel link
  sweep_no_start:'row',              // on the roster but its deadline can't be computed
  sweep_would_cancel:'alert',        // DRY RUN: what it would have cancelled
  sweep_no_confirm_source:'note',    // the sweep stood down; nothing was cancelled

  /* recovered/transport are the same "went wrong in transit, outcome still proven" pair
     as their manual twins, and settle doubt rather than raising it */
  auto_cancel_recovered:'', auto_cancel_transport_error:'',
  /* housekeeping: the roster write, the per-run summary, and a failed prune. The Confirm
     button appearing on a row is a better surface for `autobook_tagged` than any notice,
     and `autobook_untagged` means only that a class will NOT be auto-cancelled — i.e.
     exactly the behaviour that existed before this feature. */
  autobook_tagged:'', autobook_untagged:'', sweep:'', sweep_error:''
};
const unmappedKinds = {};
function checkLogKinds(){
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    const k = e && e.kind;
    if(!k || BOT_LOG_SURFACE.hasOwnProperty(k) || unmappedKinds[k]) return;
    unmappedKinds[k] = true;
    /* Console only, once per kind. An unknown kind is never rendered as anything — least
       of all as a success — but it must not vanish without trace either. */
    if(window.console && console.warn) console.warn('bot log kind not mapped in BOT_LOG_SURFACE:', k);
  });
}

/* the cancel-related kinds that describe ONE booking; the last one wins.
   The sweep's own outcomes are in here for the same reason the manual ones are: they are
   statements about whether a specific booking is still on the account, and a later one
   must be able to supersede an earlier one. `auto_cancelled` is a settling kind — it
   retires a warning rather than raising one, exactly like `cancelled`. */
const CANCEL_OUTCOME_KINDS = {cancel_failed:1, cancelled:1, cancel_notfound:1,
                              cancel_unknown:1, cancel_recovered:1,
                              auto_cancelled:1, auto_cancel_failed:1,
                              auto_cancel_unknown:1, auto_cancel_recovered:1,
                              sweep_too_late:1, sweep_uncancellable:1, sweep_no_start:1};
/* {rowKey: {tone, text}} for rows that need a persistent inline warning */
function botRowWarnings(){
  const latest = {};
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!CANCEL_OUTCOME_KINDS[e.kind]) return;
    const k = logRowKey(e);
    if(!k) return;
    /* The log is written by append, so ARRAY ORDER is the chronology and the last entry
       about a booking is the current one. It used to compare `ts` as a STRING, and Sydney
       wall clock repeats an hour every April: at the fall-back, 02:30+11:00 is followed by
       02:30+10:00, which sorts LOWER. A `cancelled` that resolved a `cancel_failed` would
       lose that comparison and the row would keep telling the user it was still booked —
       for a booking that no longer exists. */
    latest[k] = e;
  });
  const out = {};
  Object.keys(latest).forEach(k=>{
    const e = latest[k];
    if(e.kind === 'cancel_failed'){
      out[k] = {tone:'bad', text:'Couldn’t cancel this — cancel it in the FIT app or it becomes a no-show'};
    } else if(e.kind === 'cancel_unknown'){
      /* The cancel request failed AND the FIT account list could not be read, so whether
         this is still booked is genuinely unknown. Only one of the two possible beliefs
         can cost a strike — "it's cancelled" when it is not — so the app takes the other
         one and says so on the row, which is still here precisely because nothing has
         proved it gone. It retires itself: a later `cancelled` supersedes this entry, and
         a booking that leaves the account takes its row (and this line) with it. */
      out[k] = {tone:'bad', text:'The bot couldn’t confirm this cancel — treat it as STILL BOOKED. Check the FIT app and cancel it there, or it becomes a no-show'};
    } else if(e.kind === 'cancel_notfound' && e.ambiguous){
      out[k] = {tone:'bad', text:'The bot can’t tell this apart from another booking at the same time, so it refused to cancel either — cancel this one in the FIT app'};
    } else if(e.kind === 'auto_cancel_failed'){
      /* The auto-cancel ran and the booking is STILL there. Worse than an ordinary failed
         cancel, because he never asked for this one and has no reason to be watching for
         it — the class is one he was on course to skip. */
      out[k] = {tone:'bad', text:'This didn’t confirm and the auto-cancel FAILED — it is still booked. Cancel it in the FIT app or it becomes a no-show'};
    } else if(e.kind === 'auto_cancel_unknown'){
      out[k] = {tone:'bad', text:'The auto-cancel couldn’t be confirmed — treat this as STILL BOOKED. Check the FIT app and cancel it there, or it becomes a no-show'};
    } else if(e.kind === 'sweep_too_late'){
      /* The one case the bot deliberately refuses. Cancelling inside FIT's last hour is a
         late cancel, which is a strike exactly like a no-show, so it left the booking
         alone. Both remaining options are his and both are said out loud. */
      out[k] = {tone:'bad', text:'You never confirmed this and it’s now too late to cancel it safely — go to the class, or cancel in the FIT app and take the strike'};
    } else if(e.kind === 'sweep_uncancellable'){
      out[k] = {tone:'bad', text:'This should have auto-cancelled but FIT gives it no cancel link — cancel it in the FIT app or go to the class'};
    } else if(e.kind === 'sweep_no_start'){
      out[k] = {tone:'bad', text:'The bot can’t read this booking’s start time, so it will NOT auto-cancel — cancel it yourself if you’re not going'};
    }
    /* `cancelled` and `cancel_recovered` deliberately produce nothing: both mean the
       booking is confirmed gone, and both are here so they can supersede a warning. */
  });

  /* ── remember it, so a 200-entry log cannot quietly retract a no-show warning ──── */
  const before = JSON.stringify(stickyWarn);
  Object.keys(latest).forEach(k=>{
    /* the log has since REACHED A CONCLUSION about this booking — that outranks anything
       remembered, in both directions */
    if(out[k]) stickyWarn[k] = out[k];
    else delete stickyWarn[k];
  });
  /* Only ever judged against a list that actually arrived: before the first payload lands
     realBookings() is empty, and pruning against that would drop every remembered warning
     on a cold launch — which is the exact moment it is most needed. */
  if(lastDataJson !== null){
    const live = {};
    realBookings().forEach(b => bookingRowKeys(b).forEach(k => { live[k] = true; }));
    /* A row this app is optimistically HIDING is not a row that has left the FIT account —
       it is a row we have decided not to draw yet. Counting it as gone would let a retry of
       a cancel that already failed once erase the very warning that says it failed, for as
       long as the retry is pending, and permanently if the app were killed in that window.
       The warning belongs to the booking, and the booking is still there. */
    pendingCancels.forEach(p => { if(p && p.b) bookingRowKeys(p.b).forEach(k => { live[k] = true; }); });
    Object.keys(stickyWarn).forEach(k=>{ if(!live[k]) delete stickyWarn[k]; });
  }
  Object.keys(stickyWarn).forEach(k=>{ if(!out[k]) out[k] = stickyWarn[k]; });
  /* A confirmation answers the three sweep warnings that are ABOUT not having confirmed.
     Two of them end "cancel it in the FIT app / cancel it yourself if you're not going",
     so leaving them up tells him to cancel a class he has just said he is attending.
     auto_cancel_failed / auto_cancel_unknown deliberately survive: those are about a
     booking still sitting on the account, which confirming does not change. */
  const SWEEP_ASKS = {sweep_too_late:1, sweep_uncancellable:1, sweep_no_start:1};
  const cs = confirmState();
  realBookings().forEach(b=>{
    const id = bookingId(b);
    if(!id || !cs.conf[id]) return;
    bookingRowKeys(b).forEach(k=>{
      const e = latest[k];
      if(e && SWEEP_ASKS[e.kind]){ delete out[k]; delete stickyWarn[k]; }
    });
  });
  if(JSON.stringify(stickyWarn) !== before) persistStickyWarn();
  return out;
}

/* ── "the bot cannot tell you whether this booked" ───────────────────────────────────
   book_unknown / booknow_unknown: the booking POST's outcome could not be determined AND
   the FIT account list could not be read either, so the bot stopped. It did NOT retry —
   a blind retry after a possible success takes a second spot or trips the
   one-class-per-studio-per-day rule. There is no booking row to attach this to, because
   whether a booking exists is exactly what is in doubt, and BOTH wrong beliefs hurt: a
   class he thinks he has and does not, and a class he has, never sees, and does not
   attend — a no-show, and three in 7 days is a 7-day ban. So it goes up as a persistent
   notice on Booked and stays until something settles it. */
const BOOK_DOUBT_KINDS = {book_unknown:1, booknow_unknown:1};
/* Definite conclusions about the same class, every one of them reached from a FIT account
   read that SUCCEEDED. A later one of these retires the doubt. `book_recovered` is in here
   for its whole purpose: it is the transport failing and the booking existing anyway. */
const BOOK_SETTLED_KINDS = {booked:1, booknow:1, book_recovered:1, snipe_failed:1,
                            snipe_rejected:1, snipe_full:1, waitlisted:1};
/* the class an entry is about — identity is date+time+studio (§6); `name` is a soft label */
function logSlot(e){
  const t = (e && e.target) || {}, p = (e && e.pick) || {};
  const date = t.date || e.date || p.date || '';
  const time = t.time || p.time || e.time || '';
  const studio = String(t.studio || p.studio || e.studio || '').toLowerCase();
  if(!date || !time) return null;
  return {key: date+'|'+time+'|'+(studio||'?'), date:date, time:time, studio:studio,
          name: t.name || e.name || p.name || ''};
}
/* {slotKey: {kind,date,time,studio,name}} — unresolved "did this book?" doubts */
function botBookDoubts(){
  const latest = {};
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || !e.kind) return;
    if(!BOOK_DOUBT_KINDS[e.kind] && !BOOK_SETTLED_KINDS[e.kind]) return;
    const s = logSlot(e);
    if(!s) return;
    latest[s.key] = {e:e, s:s};        // array order is the chronology — see botRowWarnings()
  });
  const out = {}, today = sydToday();
  Object.keys(latest).forEach(k=>{
    const r = latest[k];
    if(!BOOK_DOUBT_KINDS[r.e.kind]) return;          // a later run reached a real answer
    if(r.s.date < today) return;                     // the class has been and gone
    /* It is on the account now, so the doubt is answered and the row itself is the
       answer. realBookings() only — an optimistic row this app invented must never be
       read back as evidence. A row whose studio cannot be classified says null rather
       than guessing, and null must not veto the match. */
    const on = realBookings().some(b => b && b.date === r.s.date && b.time === r.s.time &&
      (!r.s.studio || studioOfBooking(b) === null || studioOfBooking(b) === r.s.studio));
    if(on) return;
    out[k] = {kind:r.e.kind, date:r.s.date, time:r.s.time, studio:r.s.studio, name:r.s.name};
  });
  return out;
}

/* ── the bot's own data re-sync failed ───────────────────────────────────────────────
   `refresh_failed` is logged when the sync that runs AFTER a book or cancel could not
   complete: the outcome itself is already in the log, only the data files are stale. So
   the lists may not yet show what the bot just did. Not an instruction, so no notice and
   no toast — a quiet line that removes itself as soon as a sync lands. */
function botStaleNote(){
  const log = Array.isArray(logdata) ? logdata : [];
  let last = null;
  for(let i = log.length - 1; i >= 0; i--){
    const k = log[i] && log[i].kind;
    if(k === 'refresh_failed'){ last = log[i]; break; }
    if(k === 'refresh'){ break; }                    // a later sync succeeded: settled
  }
  if(!last) return '';
  const t = Date.parse(last.ts || '');
  const u = (bookings && bookings.updated) ? Date.parse(bookings.updated) : NaN;
  if(isFinite(t) && isFinite(u) && u >= t) return '';   // the data is newer than the failure
  return '<div class="group" style="margin-top:12px"><div class="rulerow">'+
    '<div class="ri" data-tone="amber">'+G.warn+'</div><div class="rt">'+
    '<b>This list may be out of date</b><span>The bot’s last sync with FIT didn’t finish, '+
    'so anything it booked or cancelled since may not be shown here yet. It keeps '+
    'retrying on its own.</span></div></div></div>';
}
/* Outcomes with no row to hang off, promoted to persistent notices. `waitlisted` is the
   one that matters: it is NOT a booking, but FIT can promote it into one up to an hour
   before the class — which is a class the user never sees, i.e. a no-show. */
function syncBotAlerts(){
  const seen = {};
  checkLogKinds();
  (Array.isArray(logdata) ? logdata : []).forEach(e=>{
    if(!e || e.kind !== 'waitlisted') return;
    const d = (e.date || (e.pick && e.pick.date) || '');
    if(d && d < sydToday()) return;                       // the class has been and gone
    const id = 'waitlist:'+d+'|'+String(e.bid||'');
    seen[id] = true;
    pushAlert({id:id, tone:'amber', tab:'booked',
      title:'Waitlisted, not booked',
      body:(e.name || (e.pick && e.pick.name) || 'A class')+(d?' on '+d:'')+
           ' is not booked. If FIT promotes you off the waitlist it becomes a real booking '+
           '— check the FIT app and cancel it if you will not attend.'});
  });
  /* drop waitlist notices whose class has passed out of the log entirely */
  alerts.filter(a => a.id.indexOf('waitlist:') === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));

  /* ── the sweep's own outcomes ──────────────────────────────────────────────────────
     `auto_cancelled` has no row to hang off, because the row is exactly what it removed.
     This is the app taking something away from the user without being asked, so it says
     so plainly and persistently — the spec's "say so where the row was". It is the only
     notice here about something that WORKED, and it earns that by being an action he
     never requested.

     `sweep_would_cancel` is the dry run's whole point: it shows what an armed sweep would
     have taken, so the behaviour can be watched for a few days against real classes
     before it is allowed to touch anything. */
  /* Rate-limited, with classes waiting on it. Persistent, because the consequence lands
     hours later and he will not be looking then. */
  if(sweepPaused && ((bookings && bookings.bookings) || []).some(needsConfirm)){
    seen['sweeppaused'] = true;
    pushAlert({id:'sweeppaused', tone:'bad', tab:'booked',
      title:'Auto-cancel is paused today',
      body:'The service has hit its daily limit, so classes you haven’t confirmed will '+
           'NOT be cancelled for you today. Confirm the ones you are going to, and cancel '+
           'the ones you are not — or they become no-shows.'});
  } else {
    dropAlert('sweeppaused');
  }
  const cstate = confirmState();
  [['auto_cancelled', 'autocancel:'], ['sweep_would_cancel', 'wouldcancel:']].forEach(pair=>{
    const kind = pair[0], pre = pair[1];
    (Array.isArray(logdata) ? logdata : []).forEach(e=>{
      if(!e || e.kind !== kind) return;
      const t = e.target || {};
      const d = t.date || '';
      if(d && d < sydToday()) return;                    // the class has been and gone
      const id = String(e.booking_id || t.booking_id || '');
      if(kind === 'sweep_would_cancel'){
        /* A dry-run notice about a class he has since confirmed is answered and must go —
           otherwise the notice outlives the decision it was asking him to make. */
        if(id && cstate.conf[id]) return;
        /* ...and it must not outlive TEST MODE. Arming the sweep is the planned next step
           for this feature, and the old dry-run entries stay in the 200-entry log after
           it: without this the app tells him "nothing was actually changed on your FIT
           account" while the row beside it correctly says "or this cancels itself", and
           then keeps saying it next to the notice announcing the real cancellation. */
        if(sweepArmed) return;
        /* a later definite outcome for the same booking supersedes it */
        if(id && (Array.isArray(logdata) ? logdata : []).some(x =>
             x && x.kind === 'auto_cancelled' &&
             String(x.booking_id || (x.target && x.target.booking_id) || '') === id)) return;
      }
      const aid = pre + (id || (d + '|' + (t.time || '')));
      seen[aid] = true;
      const what = (t.name || 'A class') + (d ? ' · ' + shortDate(d) : '') +
                   (t.time ? ', ' + fmt12(t.time).full : '');
      if(kind === 'auto_cancelled'){
        pushAlert({id:aid, tone:'amber', tab:'booked',
          title:'Cancelled — you didn’t confirm it',
          body: what + ' was booked automatically and never confirmed, so it was cancelled '+
                '4 hours before it started rather than becoming a no-show. Nothing else to do.'});
      } else {
        pushAlert({id:aid, tone:'amber', tab:'booked',
          title:'Would have been cancelled (test mode)',
          body: what + ' was booked automatically and you haven’t confirmed it. Once '+
                'auto-cancel is switched on, this is the one it would have cancelled — '+
                'nothing was actually changed on your FIT account.'});
      }
    });
  });
  ['autocancel:', 'wouldcancel:'].forEach(pre=>{
    alerts.filter(a => a.id.indexOf(pre) === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));
  });

  /* book_unknown / booknow_unknown — see botBookDoubts(). The strongest thing the app
     can say, because it is the one case where it cannot say anything else honestly. */
  const doubts = botBookDoubts();
  Object.keys(doubts).forEach(k=>{
    const d = doubts[k];
    const id = 'bookdoubt:'+k;
    seen[id] = true;
    const what = (d.name || 'A class') + ' · ' + shortDate(d.date) + ', ' +
                 fmt12(d.time).full + (SLABEL[d.studio] ? ' · ' + SLABEL[d.studio] : '') +
                 (d.kind === 'booknow_unknown' ? ' (you asked for this one)' : '');
    pushAlert({id:id, tone:'bad', tab:'booked',
      title:'Check the FIT app — booking not confirmed',
      body: what + '. FIT didn’t answer and your account couldn’t be read, so the bot '+
            'stopped without retrying — this may or may not be booked. Open the FIT app: '+
            'book it if it isn’t there; if it is there and you won’t go, cancel it there '+
            'or it becomes a no-show.'});
  });
  /* Retire it the moment the log stops saying it: a later definite outcome, the class
     appearing on the account, the date passing, or the entry ageing out of the log. */
  alerts.filter(a => a.id.indexOf('bookdoubt:') === 0 && !seen[a.id]).forEach(a => dropAlert(a.id));
  /* A "that cancel didn't go through" / "couldn't confirm that cancel" notice is about ONE
     booking. Once that booking is genuinely off the account there is nothing left to act
     on, so retire it rather than making the user dismiss a solved problem — the notices
     that stay have to mean something or they stop being read. */
  const live = {};
  realBookings().forEach(b => { live[bookingKey(b)] = true; });
  alerts.forEach(a=>{
    ['cancelfail:', 'cancelunknown:'].forEach(pre=>{
      if(a.id.indexOf(pre) === 0 && !live[a.id.slice(pre.length)]) dropAlert(a.id);
    });
  });
  /* "Couldn't confirm that" is raised by confirmBooking()'s catch AFTER it has already
     withdrawn its pending record — so the one place that used to retire it could never
     see that id again, and the notice was permanent unless the user happened to tap
     Confirm successfully. It leaks on the likeliest path of all: /confirm takes longer
     than the app's 12s client timeout while still committing, so the app announces a
     failure for a confirmation that succeeded, and then there is no button left to tap.
     A red banner insisting a confirmed class is unconfirmed and about to auto-cancel is
     the false claim CONTRACT §7 forbids, and acting on it costs the class.
     It keys on the bare FIT id, not on bookingKey(), so it needs its own sweep. */
  const liveIds = {}, cst = confirmState();
  realBookings().forEach(b => { const id = bookingId(b); if(id) liveIds[id] = true; });
  alerts.filter(a => a.id.indexOf('confirmfail:') === 0).forEach(a=>{
    const id = a.id.slice('confirmfail:'.length);
    if(cst.conf[id] || !liveIds[id]) dropAlert(a.id);
  });
}
function bookingStartMs(b){
  if(!b.date || !b.time) return null;
  const c = (timetable.classes||[]).find(x => x.date===b.date && x.time===b.time);
  if(c && c.start_iso) return new Date(c.start_iso).getTime();
  /* No timetable match (e.g. half-hourly sauna slots) — resolve the offset properly.
     The donor class must be CLOSE IN TIME, not merely on the same date: 4 Oct 2026 holds
     both +10:00 and +11:00, so borrowing from an arbitrary class that day puts the start
     an hour out in either direction — and an hour is the whole late-cancel margin. */
  const near = (x) => {
    const a = Number(String(x.time||'').slice(0,2)), c = Number(String(b.time||'').slice(0,2));
    return isFinite(a) && isFinite(c) && Math.abs(a - c) <= 2;
  };
  const sameDay = (timetable.classes||[]).find(x => x.date===b.date && x.start_iso && near(x))
               || (timetable.classes||[]).find(x => x.date===b.date && x.start_iso && false);
  if(sameDay){
    const off = String(sameDay.start_iso).slice(-6);
    if(/^[+-]\d\d:\d\d$/.test(off)){
      const t = Date.parse(b.date+'T'+b.time+':00'+off);
      if(isFinite(t)) return t;
    }
  }
  return sydWallToMs(b.date, b.time);
}

/* pendingCancelHTML() is GONE. It drew a notice naming the class and how long the cancel
   had been waiting — i.e. it narrated background work on the one screen where the whole
   point is that the row went away. A pending cancel is now completely invisible: the row
   disappears and the app behaves as though it is cancelled, because that is what happens
   in every case except one. That one case — reconcilePending() proving the booking is
   STILL there after SETTLE_MS, or the bot logging cancel_failed / cancel_unknown — puts
   the row back with a persistent alarm on it, which is far louder than a progress notice
   and costs nothing when everything works. */

function renderBooked(){
  const w = $('#w-booked');
  const bks = ((bookings && bookings.bookings) || []).slice()
    .sort((a,b)=> String(a.date||'').localeCompare(String(b.date||'')) || String(a.time||'').localeCompare(String(b.time||'')));
  /* The subtitle used to be "Syncing with FIT…" / "From your FIT account, updated 4 min
     ago" / "Not synced yet" — a live readout of whether the app was talking to FIT and how
     long ago it last managed to. All three are gone: they made a background job the user's
     problem, and the age of a list is not something he can act on. What replaces them is
     one flat sentence about where the list comes from, which never changes. */
  const upd = 'Booked by you and by the bot';

  const warn = botRowWarnings();
  let rows = '';
  if(bks.length){
    rows = '<div class="ghead">On your FIT account<span class="gh-r">'+bks.length+'</span></div><div class="group">' +
      bks.map((b,i)=>{
      /* the bot's own unfinished business for THIS row (cancel_failed, ambiguous refusal) */
      let bw = null;
      bookingRowKeys(b).forEach(k=>{ if(!bw && warn[k]) bw = warn[k]; });
      /* correctness #10 — say "Studio unknown" rather than asserting Exhale */
      const stk = studioOfBooking(b), st = stk || 'exhale';
      const stLabel = stk ? (SLABEL[stk]||stk) : 'Studio unknown';
      // shortDate drops the redundant year so studio still fits at 320px
      const when = (b.date ? shortDate(b.date) : (b.date_raw||'')) + ' · ' +
                   (b.time_raw || (b.time ? fmt12(b.time).full : ''));
      const startMs = bookingStartMs(b);
      /* An optimistic row: it is on screen because the user just asked for it, not because
         FIT has confirmed it. It used to announce that with an amber "Booking on FIT…"
         line — a placeholder that told the user about a workflow he cannot influence. It
         now draws as an ORDINARY booked row, because in the overwhelming majority of cases
         that is exactly what it is about to be, and because the failure direction here is
         mild: FIT turns out not to have it, the row is withdrawn with a warning, and he
         turns up to a class without a spot. Annoying — not a strike. (Contrast a pending
         CANCEL, where believing the optimistic answer wrongly IS a no-show; that one is
         invisible too, but it comes back with an alarm rather than a quiet withdrawal.)
         The one thing that must not soften is the guard: no Cancel until FIT confirms it,
         because cancelling something that does not exist yet is how you end up with
         neither. That guard is invisible — the button is simply absent. */
      const pending = !!b.__pending;
      /* correctness #3 — measure against when the BOT will reach FIT, not against now */
      let free = '', freeCls = 'go', freeAt = null, freeG = null;
      if(startMs){
        const freeUntil = startMs - 3600000, dt = freeUntil - Date.now();
        if(dt > CANCEL_LATENCY_MS){
          freeAt = freeUntil - CANCEL_LATENCY_MS;
          free = 'Free cancel for ' + relTime(freeAt - Date.now());
        } else if(dt > 0){
          free = 'Too close to cancel here — use the FIT app'; freeCls = 'bad'; freeG = G.warnS;
        } else {
          free = 'Late cancel = a strike'; freeCls = 'bad'; freeG = G.warnS;
        }
      }
      /* ── confirm-or-it-cancels ───────────────────────────────────────────────────
         Only rows the BOT booked and the user has not confirmed get any of this. A class
         he booked himself — here, in the FIT app, or at reception — is never on the
         roster, so it renders exactly as it always did.

         The line says what will happen and when, in Sydney wall-clock terms, and it tells
         the truth about whether the sweep is actually armed: during the dry run it must
         not promise a cancellation that will not happen (CONTRACT §7). */
      const nc = needsConfirm(b);
      let cf = '', cfCls = 'amb', cfAt = null;
      if(nc){
        const dl = confirmDeadlineMs(b), now = Date.now();
        const toStart = startMs ? startMs - now : null;
        if(toStart !== null && toStart <= CONFIRM_FLOOR_MS){
          /* Past the point where cancelling is free. The bot will REFUSE to cancel this —
             a cancel inside FIT's last hour is a late cancel, which is a strike exactly
             like a no-show — so the only two ways out are his. Say both. */
          cf = 'NOT CONFIRMED, and now too close to cancel safely — go to this class, or '+
               'cancel it in the FIT app and take the strike';
          cfCls = 'bad';
        } else if(dl === null){
          cf = 'Confirm this — its start time couldn’t be read, so it will NOT be '+
               'cancelled for you if you don’t';
          cfCls = 'amb';
        } else if(dl - now <= 0){
          /* Red only when it is actually about to happen. In test mode this is a fact
             about a mechanism that is switched off, and spending the red on it is how a
             colour stops meaning anything. */
          cf = sweepArmed
            ? 'Past the confirm deadline — this cancels itself at the next check'
            : 'Past the confirm deadline — it would cancel itself, but auto-cancel is off';
          cfCls = sweepArmed ? 'bad' : 'amb';
        } else if(dl - now < 12*3600000){
          cfAt = dl;
          cf = (sweepArmed ? 'Cancels itself in ' : 'Would cancel itself in ') +
               relTime(dl - now) + ' — confirm to keep it';
        } else {
          cf = 'Confirm by ' + sydStampShort(dl) +
               (sweepArmed ? ' or this cancels itself'
                           : ' — auto-cancel is in test mode, nothing is cancelled yet');
        }
      }
      /* a row carrying a bad-news warning is a row the app previously hid and has had to
         put back. Make that unmissable rather than glitch-like. */
      /* The row's tint is the loudest thing on it, so it follows the worst news the row
         carries — from the bot's log OR from the confirm state the app worked out itself.
         An unconfirmed booking that is now too close to cancel safely is the single worst
         state this screen has: it is a no-show the system can no longer prevent. It must
         not sit in the same calm amber as one with two days to run. */
      const bad = (bw && bw.tone === 'bad') || cfCls === 'bad';
      return '<div class="crow'+(bad ? ' alarm' : (nc ? ' tocheck' : ''))+'">'+
        '<div class="cbody">'+
          '<div class="cname">'+esc(b.name||'Class')+'</div>'+
          '<div class="cmeta"><span class="ctail"><i class="sdot" style="background:'+(stk?(SCOLOR[stk]||'var(--ink3)'):'var(--ink3)')+'"></i>'+
            '<span>'+esc(when)+' · '+esc(stLabel)+'</span></span></div>'+
          (free ? '<div class="cmeta"><span class="cst '+freeCls+(freeCls==='bad'?' longform':'')+'"'+
                  (freeAt?' data-cd="'+freeAt+'" data-cdmode="free"':'')+'>'+
                  (freeG||G.clock)+'<span>'+esc(free)+'</span></span></div>' : '')+
          /* the confirm deadline. Longform because it wraps — the second half ("or this
             cancels itself") is the half that changes what he does. */
          (cf ? '<div class="cmeta"><span class="cst '+cfCls+' longform"'+
                (cfAt?' data-cd="'+cfAt+'" data-cdmode="confirm"':'')+'>'+G.warnS+
                '<span>'+esc(cf)+'</span></span></div>' : '')+
          /* the bot's last word on this booking, if it was bad news. Persistent: it stays
             on the row for as long as the booking it warns about is still on the account. */
          (bw ? '<div class="cmeta"><span class="cst '+esc(bw.tone)+' longform">'+G.warnS+
                '<span>'+esc(bw.text)+'</span></span></div>' : '')+
          /* no cancel link on the row ⇒ the bot cannot cancel it at all (it only ever acts
             on rows that carry one). Say so instead of offering a button that cannot work. */
          (!pending && !isCancellable(b)
            ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
              '<span>This one can only be cancelled in the FIT app</span></span></div>' : '')+
        '</div>'+
        '<div class="cact'+(nc && !pending && isCancellable(b) ? ' stack' : '')+'">'+
          /* Confirm comes first and is the filled button: keeping the class is the action
             the row is asking for, and the destructive one stays the quiet red text button
             it has always been. */
          /* Keyed on the row's own identity, never on its position. An index is only
             correct while the list the tap resolves against is the exact list that was
             rendered, and this screen re-renders on a 45s poll, a 5-minute sweep of past
             classes, and every countdown flip. Identity removes the whole class of bug
             rather than making it rare. */
          (nc ? '<button class="btn-sm ink" data-confirm="'+esc(bookingKey(b))+'">Confirm</button>' : '')+
          (!pending && isCancellable(b) ? '<button class="btn-sm redtxt" data-cancel="'+esc(bookingKey(b))+'">Cancel</button>' : '')+
        '</div>'+
      '</div>';
    }).join('') + '</div>'+
    '<div class="gfoot">Cancelling takes the class off your FIT account. It leaves this list '+
    'straight away, and comes back with a warning if FIT didn’t take it. You can also cancel '+
    'in the FIT app.'+
    /* Only shown when it is actually relevant. A standing explanation of a mechanism that
       is not currently doing anything is chrome; the same words next to an amber row that
       is counting down are the reason the row makes sense. */
    /* Only claim the auto-cancel for rows that will actually get one. A row inside the
       late-cancel floor, or one whose start time cannot be read, says on itself that it
       will NOT be cancelled — a footer promising the opposite on the same screen is the
       kind of contradiction that makes the whole panel stop being read. */
    (bks.some(b => needsConfirm(b) && confirmDeadlineMs(b) !== null &&
                   (bookingStartMs(b) - Date.now()) > CONFIRM_FLOOR_MS)
      ? ' <b>The highlighted rows were booked for you from your picks.</b> Confirm one and it '+
        'stays; leave it and it ' + (sweepArmed ? 'cancels' : 'would cancel') +
        ' itself 4 hours before the class, so it can’t become a no-show. Anything you '+
        'booked yourself is never touched.' +
        (sweepArmed ? '' : ' Auto-cancel is in test mode right now — nothing is actually '+
                           'cancelled yet.')
      : '')+
    '</div>';
  } else {
    rows = '<div class="emptystate"><div class="eg">'+G.big_chk+'</div>'+
      '<div class="et">Nothing booked</div>'+
      '<div class="es">Classes on your FIT account — booked by you or by the bot — show up here.</div></div>';
  }

  w.innerHTML =
    '<div class="ltitle">Booked</div>'+
    '<div class="lsub">'+esc(upd)+'</div>'+
    offlineBanner()+
    botStaleNote()+
    alertsHTML('booked')+
    '<div style="height:2px"></div>'+
    rows+
    /* the static free-vs-late-cancel rule block lived here. Every row already carries its
       own live "Free cancel for 2h 10m" / "Late cancel = a strike" line, and the confirm
       sheet spells out the consequence at the only moment it can change a decision. */
    '<div class="spacer"></div>';
}

/* ── Picks screen ───────────────────────────────────────────── */
/* The "Bot activity" list lived here — LOG_META and its formatters with it. `logdata` still
   arrives from the Worker and is still parsed; nothing renders it. Anything that section was
   the only witness to now has to reach the user as a toast or as a state on the row itself
   (see the "didn't book" branch in pickRowHTML), which is where they were looking anyway. */

/* one saved pick, recurring or one-off */
function pickRowHTML(p, dupe){
  const once = isOneOff(p);
  const st = pickState(p);
  const drift = pickNameDrift(p);
  let nextTxt, nextCls = 'amb', g = G.clock, opens = null, wide = false;
  if(st.kind === 'open'){
    /* The window is open and the class is still not on the account. For the first few
       minutes that is just the bot on its way. After that it is a failure — and the
       activity log that used to be the only place it was ever visible is gone, so it has
       to be said on the row it belongs to. */
    const openFor = st.opens === null ? 0 : Date.now() - st.opens;
    if(openFor > 10*60000){
      /* amber, not red: much the commonest cause is a pick added AFTER this occurrence's
         window opened, which is nobody's failure — and the bot's own grace is 20 minutes,
         so no pass can rescue it either. If it keeps saying this, the class is full. */
      nextTxt = 'Open '+relTime(openFor)+' — not booked yet';
      nextCls = 'amb'; g = G.warnS; wide = true;
    } else {
      /* was "Open now — booking": the same background narration, and it also made a pick
         the app had just optimistically booked distinguishable from one it had not. Both
         now read "Open now" — the state of the window, which is a fact about the class. */
      nextTxt = 'Open now'; nextCls = 'go'; g = G.bolt;
    }
  }
  else if(st.kind === 'booking'){
    /* The app has asked FIT and has NOT been answered. This used to read "Booking… not
       confirmed yet" — the Picks-tab twin of the amber placeholder on Booked, and the same
       narration of a workflow in progress. It now reads exactly as any other pick whose
       window is open: quiet, and identical whether or not the app happens to be mid-request.
       It is still NOT a tick — pickState() only returns 'booked' from realBookings(), so an
       optimistic row can never turn this green — and if FIT never confirms it, the settle
       window withdraws the row and warns, which is the surface that matters. */
    nextTxt = 'Open now'; nextCls = 'go'; g = G.bolt;
  }
  else if(st.kind === 'waiting'){ opens = st.opens; nextTxt = 'Books in '+relTime(st.opens - Date.now()); }
  else if(st.kind === 'booked'){ nextTxt = 'Booked for '+shortDate(st.cls.date); nextCls = 'go'; g = G.check; }
  else if(st.kind === 'blocked'){
    /* correctness #10 — say WHY it will not book, instead of a green tick that claims the
       bot got it. FIT allows one class per studio per day, so this pick is skipped. */
    nextTxt = 'Won’t book '+shortDate(st.cls.date)+' — '+(SLABEL[p.studio]||p.studio)+
              ' already booked at '+(st.by.time_raw || (st.by.time ? fmt12(st.by.time).full : 'another time'));
    nextCls = 'bad'; g = G.warnS; wide = true;
  }
  else if(st.kind === 'expired'){ nextTxt = 'Date has passed'; nextCls = ''; g = G.warnS; }
  else { nextTxt = 'Not on the timetable'; nextCls = 'bad'; g = G.warnS; }
  /* The bot tried this occurrence and could not find out what happened (book_unknown /
     booknow_unknown). Every line above this asserts something — "not booked yet", "Open
     now — booking" — that the bot does not actually know, so none of them may stand.
     Say the one true thing instead; the notice on Booked carries the rest. */
  const doubt = st.cls ? botBookDoubts()[st.cls.date+'|'+st.cls.time+'|'+(st.cls.studio||'?')] : null;
  if(doubt){
    nextTxt = 'Couldn’t tell if this booked — check the FIT app';
    nextCls = 'bad'; g = G.warnS; wide = true; opens = null;
  }
  return '<div class="crow'+(once?' once ispick':'')+'">'+
    '<div class="ctime"><b style="font-size:13.5px">'+esc(p.day)+'</b>'+
      '<span style="letter-spacing:0;text-transform:none;font-size:11px">'+esc(fmt12(p.time).full)+'</span></div>'+
    '<div class="cbody">'+
      '<div class="cname">'+esc(p.name || SLABEL[p.studio] || p.studio)+'</div>'+
      '<div class="cmeta">'+
        '<span class="cst '+nextCls+(wide?' longform':'')+'"'+(opens?' data-cd="'+opens+'" data-cdmode="pick"':'')+'>'+
          g+'<span>'+esc(nextTxt)+'</span></span>'+
        (once
          ? '<span class="onceTag">'+esc(shortDate(pickDate(p)))+' only</span>'
          : '<span class="ctail"><i class="sdot" style="background:'+(SCOLOR[p.studio]||'var(--ink3)')+'"></i>'+
            '<span>'+esc(SLABEL[p.studio]||p.studio)+'</span></span>')+
      '</div>'+
      (once ? '<div class="cmeta"><span class="ctail"><i class="sdot" style="background:'+(SCOLOR[p.studio]||'var(--ink3)')+'"></i>'+
        '<span>'+esc(SLABEL[p.studio]||p.studio)+' · one-off, not repeated</span></span></div>' : '')+
      (dupe ? '<div class="cmeta"><span class="cst bad longform">'+G.warnS+
        '<span>Two '+esc(SLABEL[p.studio]||p.studio)+' picks on '+esc(p.day)+' — FIT allows one per day</span></span></div>' : '')+
      (drift ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
        '<span>This slot is now “'+esc(drift.name)+'” — the bot matches on name, so re-pick it or it will never book</span></span></div>' : '')+
    '</div>'+
    '<div class="cact"><button class="ptog rm" data-remove="'+esc(p.day+'|'+p.time+'|'+p.studio+'|'+pickDate(p))+'" '+
      'aria-label="Remove this '+(once?'one-off':'weekly')+' pick"><span class="pk">'+G.xmark+'</span></button></div>'+
  '</div>';
}

function picksSummary(){
  const once = picks.filter(isOneOff).length, rec = picks.length - once;
  if(!picks.length) return 'Nothing scheduled for the bot yet';
  const bits = [];
  if(rec) bits.push(rec + (rec===1?' class every week':' classes every week'));
  if(once) bits.push(once + (once===1?' one-off':' one-offs'));
  return bits.join(' · ');
}
function renderPicks(){
  const w = $('#w-picks');
  const byDay =(a,b)=> (DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day)) || String(a.time).localeCompare(String(b.time));
  const weekly = picks.filter(p=>!isOneOff(p)).sort(byDay);
  const single = picks.filter(isOneOff).sort((a,b)=>
    String(pickDate(a)).localeCompare(String(pickDate(b))) || String(a.time).localeCompare(String(b.time)));

  let pickHTML = '';

    pickHTML = '<div class="emptystate"><div class="eg">'+G.big_rep+'</div>'+
      '<div class="et">No picks yet</div>'+
      '<div class="es">Pick a class on the Book tab — every week, or just this one — and the bot grabs it the instant its window opens.</div>'+
      '<div style="width:100%;max-width:280px;margin-top:14px">'+
      '<button class="btn gray" data-act="goBook">Browse classes</button></div></div>';
  } else {

      pickHTML += '<div class="ghead">Every week<span class="gh-r">'+weekly.length+'</span></div><div class="group">' +
        weekly.map(p=>{
          const key = p.day+'|'+p.studio, dupe = !!seen[key]; seen[key] = true;

    if(single.length){
      const seen = {};
      pickHTML += '<div class="ghead">Just this one<span class="gh-k">one-off</span>'+
        '<span class="gh-r">'+single.length+'</span></div><div class="group">' +
        single.map(p=>{
          const key = pickDate(p)+'|'+p.studio, dupe = !!seen[key]; seen[key] = true;
          return pickRowHTML(p, dupe);
        }).join('') + '</div>'+
        '<div class="gfoot">A one-off pick is booked on its date only and never repeats. '+
        'Remove it any time with '+'×'+'.</div>';
    }
    pickHTML += '<div class="gfoot">Bookings open 7 days + 1 hour before class starts. Saving a pick whose window is '+
      'within 45 minutes fires a booking run straight away.</div>';
  }

  w.innerHTML =
    '<div class="ltitle">Picks</div>'+
    '<div class="lsub">'+esc(picksSummary())+'</div>'+
    offlineBanner()+
    heroHTML()+
    pickHTML+
    '<div class="spacer"></div>';
}

/* ── Setup ──────────────────────────────────────────────────── */
function renderSetup(msg){
  $('#tabbar').classList.add('hidden');
  $('#tabfade').classList.add('hidden');
  $('#app').classList.add('setupmode');
  $('#app').classList.remove('dirty');
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-book').classList.add('active');
  /* One screen: a real FIT login — email + password, verified against the gym, refused if
     the gym refuses. There is no other way in. The paste-a-PAT fallback was removed when
     the app stopped holding any repo credential: a shared credential let anyone who had it
     write to anyone else's data, which is exactly what the Worker now prevents.
     F8 — enterkeyhint on both fields turns the generic iOS "return" key into next/Go; the
     keydown handlers below make them actually move on and submit. Without them the only
     way to submit was a button the keyboard was covering. */
  $('#w-book').innerHTML =
    '<div class="setup">'+
      '<div class="mark">'+G.mark+'</div>'+
      '<h1>FIT Booker</h1>'+
      '<p>Sign in with the email and password you use for the FIT app.</p>'+
      '<input type="email" id="loginemail" name="fitbooker-email" placeholder="Email" '+
        'autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" '+
        'inputmode="email" enterkeyhint="next">'+
      '<input type="password" id="loginpass" name="fitbooker-pass" placeholder="Password" '+
        'autocomplete="current-password" autocapitalize="off" autocorrect="off" '+
        'spellcheck="false" enterkeyhint="go">'+
      '<button class="btn filled" id="loginbtn" data-act="login" style="margin-top:12px">Sign in</button>'+
      '<div class="warn" id="loginwarn"'+(msg ? '' : ' style="display:none"')+'>'+
        (msg ? esc(msg) : '')+'</div>'+
    '</div>';
  const em = $('#loginemail'), pw = $('#loginpass');
  if(em && pw){
    em.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.focus(); }
    });
    pw.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.blur(); login(); }
    });
  }
  /* F8 — iOS does not resize the LAYOUT viewport for the keyboard in a standalone web
     app (only visualViewport shrinks), and #app is fixed to the layout viewport, so
     nothing reflowed and the submit button sat ~30px under the keyboard. Lift the setup
     block by the occluded height — the login form is two fields and a button, so it is
     occluded generously. */
  const vv = window.visualViewport;
  if(vv && !vv.__fitbookerBound){
    vv.__fitbookerBound = true;
    const fit = ()=>{
      const el = $('.setup'); if(!el) return;
      const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      el.style.paddingBottom = hidden ? (hidden + 12) + 'px' : '';
      if(hidden) el.scrollIntoView({block:'end'});
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }
  $('#navTitle').style.opacity = 0;
}
function doSignOut(){
  /* Tell the Worker to forget the session so a copied string is dead the moment the user
     signs out. Fire-and-forget on purpose: the local state must clear instantly even with
     no connection, and a failure here changes nothing this app can see. */
  try{ wapi('/logout', {}).catch(()=>{}); }catch(e){}
  booted = false;
  stopPolling(); clearPostPoll(); syncing = false; syncStartedAt = 0;
  fastUntil = 0;
  clearDispatchWatch();
  closeSheet();
  /* Everything in memory AND in storage belongs to the member who just left — the draft
     picks above all, which used to sit under one global key and were restored into the
     next person's session, one tap from writing his picks to her account. */
  wipeMemberState();
  renderSetup('');
}

function loginWarn(m){
  const w = $('#loginwarn'); if(!w) return;
  w.textContent = m || '';
  w.style.display = m ? '' : 'none';
}

/* Real sign-in. The Worker attempts an actual login against the FIT portal with what was
   typed: if the gym rejects it, the app rejects it. There is no local "password" to get
   wrong, and no way in without a working FIT account. On success it returns which member
   this is plus an opaque session — never a credential this app could misuse. */
async function login(){
  const em = $('#loginemail'), pw = $('#loginpass'), btn = $('#loginbtn');
  if(!em || !pw) return;
  const email = em.value.trim(), password = pw.value;
  if(!email || !password){ loginWarn('Enter your email and password'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  loginWarn('');
  /* A hung request must not leave the button stuck on "Signing in…" forever. */
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const kill = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, 25000);
  try {
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + '/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
      signal: ctl ? ctl.signal : undefined
    });
    let d = null;
    try { d = await r.json(); } catch(e){}
    if(!d || !d.ok || !d.session){
      loginWarn((d && d.error) || 'Could not sign in right now — try again');
      return;
    }
    /* A sign-in is a change of member until proven otherwise. Erase whatever the previous
       one left behind BEFORE the new session exists — the audit showed a failed first load
       rendering the previous member's bookings, complete with a working Cancel button. */
    wipeMemberState();
    session = d.session;
    USER = d.user || '';
    USERNAME = d.name || '';
    try {
      localStorage.setItem('fitbooker_session', session);
      localStorage.setItem('fitbooker_user', USER);
      localStorage.setItem('fitbooker_name', USERNAME);
    } catch(e){ toast('This browser blocked local storage'); }
    /* The password itself is never stored on the phone — only the Worker keeps it, and
       only because it proved valid a moment ago. */
    pw.value = '';
    enterApp();
  } catch(e){
    loginWarn(String(e && e.name) === 'AbortError'
      ? 'That took too long — check your connection and try again'
      : 'Could not reach the sign-in service — check your connection');
  } finally {
    clearTimeout(kill);
    if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}

function enterApp(){
  $('#tabbar').classList.remove('hidden');
  $('#tabfade').classList.remove('hidden');
  $('#app').classList.remove('setupmode');
  $('#w-book').innerHTML = '<div class="ltitle">Book</div><div class="emptystate"><div class="es">Connecting…</div></div>';
  bootLoad();
}

function findClass(bid){ return (timetable.classes||[]).find(c => String(c.bid)===String(bid)); }

function openClassSheet(bid){
  const c = findClass(bid); if(!c) return;
  const av = availInfo(c);
  const opensMs = new Date(c.opens_iso).getTime();
  const open = opensMs <= Date.now();
  const recurring = pickIndex(c.day,c.time,c.studio,'') >= 0;
  const oneOff = pickIndex(c.day,c.time,c.studio,c.date) >= 0;
  const dur = durationMins(c);

  const conflict = bookedStudiosOn(c.date)[c.studio];

    ? '<span style="color:var(--go)">Open now</span>'
    : ((opensMs - Date.now() < 36*3600000)

       hours stale and FIT, not this app, is the authority on what is allowed */
    primary = '<button class="btn filled" data-act="booknow" data-bid="'+esc(c.bid)+'">'+G.boltL+' '+

  }
  const conflictNote = conflict
    ? '<div class="group" style="margin:0 0 12px"><div class="rulerow"><div class="ri" data-tone="amber">'+G.warn+'</div>'+
      '<div class="rt"><b>'+esc(SLABEL[c.studio]||c.studio)+' already booked today</b><span>'+
      esc((conflict.name||'A class')+' at '+(conflict.time_raw || (conflict.time?fmt12(conflict.time).full:'')))+
      '. FIT allows one class per studio per day — cancel that one first, or this booking may be refused.'+
      '</span></div></div></div>'
    : '';

  const html =
  '<div class="sheet-card"><div class="grabber"></div><div class="sheet-scroll">'+
    '<div class="detail-head">'+
      '<div class="detail-kicker"><span class="sdot" style="width:8px;height:8px;border-radius:4px;flex:none;background:'+(SCOLOR[c.studio]||'var(--ink3)')+'"></span>'+
        '<span class="k" style="color:'+(SCOLOR[c.studio]||'var(--ink2)')+'">'+esc(SLABEL[c.studio]||c.studio)+'</span></div>'+
      '<div class="detail-title">'+esc(c.name || c.studio)+'</div>'+
      '<div class="detail-when">'+esc(longDate(c.date))+' · '+esc(t.full)+
        (dur ? ' – '+esc(endLabel(c)) : '')+'</div>'+
    '</div>'+
    '<div>'+
      (c.staff && String(c.staff).trim() ? factRow('Instructor', esc(String(c.staff).trim())) : '')+
      factRow('Availability', '<span style="color:'+(av.full?'var(--bad)':'var(--ink)')+'">'+esc(av.long)+'</span>')+
      factRow('Booking window', windowVal)+
      (dur ? factRow('Duration', dur+' minutes') : '')+

function layoutDiag(){
  const bar = document.querySelector('.tabbar');
  const r = bar ? bar.getBoundingClientRect() : null;
  const cs = getComputedStyle(document.documentElement);
  const vv = window.visualViewport;
  const standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const rows = [
    ['mode', standalone ? 'standalone (home screen)' : 'browser tab'],
    ['screen', screen.width + ' x ' + screen.height],
    ['innerHeight', String(window.innerHeight)],
    ['visualViewport', vv ? Math.round(vv.height) + ' (offsetTop ' + Math.round(vv.offsetTop) + ')' : 'n/a'],
    ['100dvh measures', (function(){
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100dvh;visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      var h = Math.round(d.getBoundingClientRect().height);
      d.remove();
      return h + 'px' + (h !== window.innerHeight ? '  <-- MISMATCH' : '');
    })()],
    ['safe-area TOP', cs.getPropertyValue('--sat').trim() || '0px'],
    ['safe-area bottom', cs.getPropertyValue('--sab').trim() || '0px'],
    ['doc clientHeight', String(document.documentElement.clientHeight)],
    ['outerHeight', String(window.outerHeight)],
    ['missing vs screen', (screen.height - window.innerHeight) + 'px'],
    ['reserved (--tabpadref)', cs.getPropertyValue('--tabpadref').trim() || 'n/a'],
    ['tab bar top', r ? Math.round(r.top) + 'px' : 'n/a'],
    ['tab bar bottom', r ? Math.round(r.bottom) + 'px' : 'n/a'],
    ['gap below bar', r ? Math.round(window.innerHeight - r.bottom) + 'px' : 'n/a'],
  ];
  return '<div class="rulerow"><div class="rt"><b>Layout diagnostics</b><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;display:block">' +
    rows.map(function(x){ return x[0] + ': <b>' + x[1] + '</b>'; }).join('<br>') +
    '</span></div></div>';
}

/* ════════════════════════════════════════════════════════════════
   Actions (every destructive/committing action confirms)
   ════════════════════════════════════════════════════════════════ */
async function bookNow(bid, fromSheet){
  const c = findClass(bid); if(!c) return;
  const t = fmt12(c.time);
  const conflict = bookedStudiosOn(c.date)[c.studio];
  const choice = await actionSheet({
    title: 'Book ' + (c.name || c.studio) + '?',
    message: longDate(c.date) + ' at ' + t.full + ' · ' + (SLABEL[c.studio]||c.studio) +
             '\nThis books immediately on your FIT account.' +
             (conflict ? '\nHeads up: you already have ' + (SLABEL[c.studio]||c.studio) +
                         ' booked that day. FIT allows one class per studio per day, so this may be refused.' : ''),
    actions: [{label: conflict ? 'Book Anyway' : 'Book Now', style:'default'}]
  });
  if(choice !== 0){ if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }

  /* Optimistic: the class appears on Booked immediately, flagged as not yet confirmed and
     with no Cancel button until it is real. It is memory-only — nothing about it is
     persisted — so the worst case is that it disappears at the next launch, never that a
     phantom booking outlives the session. reconcilePending() withdraws it with a toast if
     FIT does not have it SETTLE_MS from now. */
  const optimistic = {
    date: c.date, time: c.time,
    name: c.name || SLABEL[c.studio] || c.studio,
    location: c.studio,                  // keeps studioOfBooking() honest for this row
    time_raw: fmt12(c.time).full,
    /* __pending marks this row as an ASK, not a booking. realBookings() filters it out, so
       nothing that makes a claim — pickState's green tick, the one-per-studio-per-day
       caution, the pending-book match — can ever be satisfied by a row this app invented.
       __pendingStudio is what we asked for, and is never read as what FIT confirmed. */
    __pending: true,
    __pendingStudio: c.studio
  };
  const key = bookingKey(optimistic);
  /* Guard the DISPATCH, not just the row. The row guard alone let a double tap send two
     booknow.yml runs: the second one books nothing (FIT already has it) but it is a wasted
     run, and against a slower first run it is a genuine race. */
  /* the guard stays — a double tap must never fire two booknow.yml runs — but it no
     longer reports on a workflow. The row is already on Booked; say only that. */
  if(hasPending(key)){ toast('That one is already on your Booked list.', 2600); return; }
  if(alreadyBookedSlot(c)){ toast('That class is already on your FIT account.', 3000); return; }
  const before = bookingKeySnapshot();
  bookingList().push(optimistic);
  pendingBooks.push({key: key, at: Date.now(), b: optimistic, before: before});
  rerenderKeepScroll();
  try{
    /* correctness #2 — `date` pins the occurrence. Without it the bot resolves the
       (day,time,studio) triple to the SOONEST future match, and the two-week timetable
       makes every triple ambiguous: for the first hour after a window opens that is LAST
       week's slot repeating today, i.e. a class starting within the hour that he never
       asked for. A no-show there is a strike, and cancelling it is also a strike.
       booknow.yml already declares a `date` input (it is used for cancel), so sending it
       is safe whether or not the bot-side patch has landed. */
    await dispatch('booknow.yml', {day:c.day, time:c.time, studio:c.studio, date:c.date});
    watchDispatch(78000);
    startFastPoll();                     // …and confirm it every 8s rather than every 45
  }catch(e){
    if(handleApiErr(e)) return;          // 401/403: the session is gone, so is the state
    if(isDefiniteReject(e)){
      /* The Worker answered and said no. Nothing was dispatched, so nothing was asked of
         FIT — take the row back off the screen and say so plainly. */
      withdrawPending(pendingBooks, key);
      toast('Couldn’t start that booking — nothing was booked. '+String(e.message||e), 5200);
      rerenderKeepScroll();
      return;
    }
    /* Timeout, dropped connection or a 5xx. THE RUN MAY ALREADY HAVE BEEN DISPATCHED — the
       app aborts its own fetch at 12s and the Worker's call to GitHub does not stop when we
       stop listening. The audit demonstrated the old behaviour: the booking succeeded on FIT
       while the app declared "nothing was booked" AND dropped the pending record, so the
       settle net that exists to catch exactly this was disarmed at the same moment.
       Keep the pending record, keep the optimistic row, keep watching. The settle window
       decides in ~3 minutes, from evidence. Never assert a negative the app cannot know. */
    announce({id:'bookunknown:'+key, tone:'amber', tab:'booked',
              title:'Couldn’t confirm that booking request',
              body:(c.name||'The class')+' on '+shortDate(c.date)+' — the request may or may '+
                   'not have reached FIT. The app is checking; it will tell you either way. '+
                   'Do not tap Book again yet.'});
    rerenderKeepScroll();
    startFastPoll();
  }
}
/* drop a pending record and undo its optimistic edit to the list */
function withdrawPending(bucket, key){
  const i = bucket.findIndex(p=>p.key===key);
  if(i < 0) return null;
  const p = bucket[i];
  bucket.splice(i,1);
  const list = bookingList();
  if(bucket === pendingBooks){
    const j = list.findIndex(b => b === p.b);
    if(j >= 0) list.splice(j,1);
  }else{
    if(list.findIndex(b => bookingKey(b) === key) < 0){
      const at = (p.idx === null || p.idx < 0 || p.idx > list.length) ? list.length : p.idx;
      list.splice(at, 0, p.b);
    }
  }
  return p;
}

/* "Yes, I am going to this one." Instant and silent, like every other action here — no
   sheet, no spinner. Keeping a class you already have is not a decision that needs
   confirming twice, and the destructive direction (doing nothing) is the one that is
   already guarded by a deadline the row spells out.

   The one thing that MUST be loud is failure: an unconfirmed class gets cancelled, so a
   confirm that silently did not stick would lose him the class. Hence the optimistic
   confirm is withdrawn on any error at all — definite or unknown — which puts the Confirm
   button straight back. Re-tapping is free: the Worker is idempotent and answers
   `already:true` for a confirmation it already holds. */
async function confirmBooking(rowKey){
  /* Resolved by identity out of the LIVE list, so a re-render between the render and the
     tap cannot move the target. If the row is no longer there, nothing happens — which is
     right: it has been cancelled, swept, or has already been confirmed elsewhere. */
  const b = bookingList().find(x => bookingKey(x) === rowKey); if(!b) return;
  const id = bookingId(b);
  /* Without FIT's id there is nothing to confirm AGAINST — and equally nothing the sweep
     could ever have matched, so such a row never shows this button. Belt and braces. */
  if(!id){ toast('This booking has no id the app can read, so it can’t be confirmed here.', 4200); return; }
  if(pendingConfirms.some(p => p.id === id)) return;

  pendingConfirms.push({id: id, at: Date.now(), b: b});
  rerenderKeepScroll();

  try{
    await wapi('/confirm', {booking_id: id});
    /* Nothing is written into confirmData here, deliberately. The pending record already
       makes the row look confirmed (confirmState() unions it in), and confirmData is the
       SERVER's answer — writing a local copy of a confirmation into it would mean the app
       kept asserting "confirmed" out of its own memory even after the server had failed
       to produce it, which is the one belief that silently loses the class. The pending
       record is released only when the server actually agrees, or it times out and the
       row goes back to asking. */
    startFastPoll();
  }catch(e){
    if(handleApiErr(e)) return;
    /* Withdraw in BOTH directions. If the write actually landed, the next /data brings the
       confirmation back and the button disappears again; if it did not, he is looking at a
       button that still needs pressing. The wrong belief here — "confirmed" when it is not
       — silently loses him the class four hours before it starts. */
    pendingConfirms = pendingConfirms.filter(p => p.id !== id);
    announce({id:'confirmfail:'+id, tone:'bad', tab:'booked',
              title:'Couldn’t confirm that',
              body:(b.name||'That class')+' is still unconfirmed'+
                   (sweepArmed ? ', so it will cancel itself 4 hours before it starts. ' : '. ')+
                   'Tap Confirm again — it is safe to tap more than once.'});
    rerenderKeepScroll();
  }
}

async function cancelBooking(rowKey){
  /* By identity, not by index — see confirmBooking(). This used to take the position of
     the row in a re-derived sorted copy, which is correct only while nothing re-renders
     between drawing the button and tapping it. */
  const b = bookingList().find(x => bookingKey(x) === rowKey); if(!b) return;
  const startMs = bookingStartMs(b);
  /* correctness #3 — judge against the instant the BOT will POST, not against now */
  const atRun = startMs ? (startMs - (Date.now() + CANCEL_LATENCY_MS)) : null;
  const late  = atRun !== null && atRun < 3600000;
  /* correctness #10 — the studio we send is a guess when the name/location don't say */
  const knownStudio = studioOfBooking(b);
  /* FIT's own id for THIS booking, read off its cancel link. This is what gets sent. */
  const fitId = bookingId(b);
  const choice = await actionSheet({
    title: 'Cancel ' + (b.name||'this booking') + '?',
    message: (b.date_raw || shortDate(b.date)) + ' at ' + (b.time_raw || fmt12(b.time).full) +
      (startMs === null
        ? '\nCancelling within 1 hour of the class counts as a strike. 3 strikes in 7 days = a 7-day ban.'
        : (late ? '\nThe bot takes about a minute to reach FIT and that lands inside the last hour — this WILL count as a strike. Cancel in the FIT app instead if you can. 3 strikes in 7 days = a 7-day ban.'
                : '\nFree cancel: the bot will reach FIT more than 1 hour before the class.')) +
      /* The old text here said "so the bot matches on date and time". That was FALSE: the
         app sent a GUESSED studio ('exhale') and the bot matched on it. Now the bot is
         given this booking's own FIT id and cancels exactly it, so there is nothing to
         disclaim. Only a row with no id at all falls back to date+time — and then the bot
         refuses outright rather than picking one, which IS worth saying. */
      (fitId ? '' : (knownStudio
        ? ''
        : '\nThis booking has no cancel id the app can read, so the bot will match on date and time — and will refuse to cancel anything at all if another booking shares them.')),
    actions: [{label: late ? 'Cancel Anyway (strike)' : 'Cancel Booking', style:'destructive'}],
    cancelLabel:'Keep Booking'
  });
  if(choice !== 0) return;

  /* Optimistic: the row goes NOW. Waiting ~a minute for a workflow to run before a tapped
     Cancel had any visible effect was the single most remote-control-feeling thing left in
     the app. Everything after this point exists to make sure the disappearance is true.

     The pending record's identity is the FIT booking id. It used to be
     date|time|guessed-studio, which two different bookings could share — so the re-find
     below spliced the WRONG row off the screen while the dispatch cancelled the other. */
  const key = bookingKey(b);
  /* unreachable in practice (the row left the list on the first tap) but the dispatch
     guard stays. It speaks in the app's terms, not the bot's. */
  if(hasPending(key)){ toast('That booking has already been cancelled.', 2600); return; }
  const live = bookingList();
  const idx = live.findIndex(x => bookingKey(x) === key);
  const snapshot = idx >= 0 ? live[idx] : b;
  if(idx >= 0) live.splice(idx, 1);
  pendingCancels.push({key: key, at: Date.now(), b: snapshot, idx: idx, bookingId: fitId});
  rerenderKeepScroll();

  try{
    /* booking_id is the whole identity when we have one; the bot ignores date/time/studio
       entirely in that case and verifies THAT id is gone from the account afterwards.
       studio is still sent for the id-less fallback, and is 'unknown' — never a guess —
       when the row cannot be classified, so the bot cannot match the wrong studio. */
    await dispatch('booknow.yml', {day:'MON', time:b.time, studio:studioFromBooking(b),
                                   action:'cancel', date:b.date, booking_id:fitId});
    watchDispatch(78000);
    startFastPoll();
  }catch(e){
    if(handleApiErr(e)) return;
    /* The cancel path fails SAFE in one direction only: put the row back. A visible row is
       the pessimistic claim ("still booked"), and if the cancel did in fact land, the next
       poll removes it — whereas a hidden row the user believes is cancelled and which is
       not is a no-show, and three of those in 7 days is a 7-day ban. */
    withdrawPending(pendingCancels, key);
    if(isDefiniteReject(e)){
      toast('Couldn’t cancel that — nothing was sent, so it is still booked. '+
            String(e.message||e), 5200);
    }else{
      /* timeout / dropped connection: the run MAY have been dispatched. Say exactly that
         rather than asserting either outcome. */
      announce({id:'cancelunknown:'+key, tone:'bad', tab:'booked',
                title:'Couldn’t confirm that cancel',
                body:(b.name||'That class')+' is shown as still booked because the app could '+
                     'not confirm otherwise. The request may or may not have reached FIT — '+
                     'check the FIT app before the class, or it could become a no-show.'});
    }
    rerenderKeepScroll();
  }
}

/* syncNow(), firePass() and the Live-data sheet they hung off are gone. autoSync() —
   on load, on foreground, on the 45s poll when the data is stale, and on pull-to-refresh —
   is now the only path to refresh.yml. autoSnipeIfOpen() has been DELETED: the phone no
   longer fires unattended booking passes at all — the Worker's cron does, from the
   generated schedule. Nothing in the UI dispatches a workflow except book and cancel. */

/* ════════════════════════════════════════════════════════════════

function switchTab(t){
  if(t === activeTab) return;
  const cur = $('#page-'+activeTab);
  if(cur) scrollMemo[activeTab] = cur.scrollTop;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $$('.tabbtn').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===t)));
  activeTab = t;
  const next = $('#page-'+activeTab);
  next.classList.add('active');
  void next.offsetHeight;
  next.scrollTop = scrollMemo[activeTab] || 0;
  updateNav();
}

function updateNav(){
  const page = $('#page-'+activeTab);
  const st = page ? page.scrollTop : 0;
  const p = clamp((st - 8) / 30, 0, 1);
  const el = $('#navTitle');
  el.style.opacity = p;
  el.style.transform = 'translateY('+(9*(1-p))+'px)';
  el.textContent = (activeTab==='book' && selDate) ? relDayLabel(selDate) : NAV_TITLES[activeTab];

}

let navTick = false;
$$('.page').forEach(p=>{
