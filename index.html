     this app can act on, and it was the last stopwatch left on the screen. Scheduled or
     not scheduled is the whole of what matters. */
  else if(st.kind === 'waiting'){ nextTxt = 'Booking scheduled'; nextCls = ''; g = G.clock; }
  else if(st.kind === 'booked'){ nextTxt = 'Booked for '+shortDate(st.cls.date); nextCls = 'go'; g = G.check; }
  else if(st.kind === 'blocked'){
    /* correctness #10 — say WHY it will not book, instead of a green tick that claims the
       bot got it. FIT allows one class per studio per day, so this pick is skipped. */
    nextTxt = 'Won’t book '+shortDate(st.cls.date)+' — '+(SLABEL[p.studio]||p.studio)+
              ' already booked at '+(st.by.time_raw || (st.by.time ? fmt12(st.by.time).full : 'another time'));
    nextCls = 'bad'; g = G.warnS; wide = true;
  }
  else if(st.kind === 'missed'){
    /* The class is on the timetable, still in the future, and its booking window closed with
       nothing booked — the bot's run was late or down. Nothing else on this screen can say
       so: there is no next window for a one-off, and the occurrence itself is skipped. */
    nextTxt = 'Booking closed for this one';
    nextCls = 'bad'; g = G.warnS; wide = true;
  }
  else if(st.kind === 'expired'){ nextTxt = 'Date has passed'; nextCls = ''; g = G.warnS; }
  else { nextTxt = 'Not on the timetable'; nextCls = 'bad'; g = G.warnS; }
  /* The bot tried this occurrence and could not find out what happened (book_unknown /
     booknow_unknown). Every line above this asserts something — "not booked yet", "Open
     now — booking" — that the bot does not actually know, so none of them may stand.
     Say the one true thing instead; the notice on Booked carries the rest. */
  const doubt = st.cls ? botBookDoubts()[st.cls.date+'|'+st.cls.time+'|'+(st.cls.studio||'?')] : null;
  if(doubt){
    nextTxt = 'Couldn’t tell if this booked — check before the class';
    nextCls = 'bad'; g = G.warnS; wide = true; opens = null;
  }
  return '<div class="crow">'+
    '<div class="ctime"><b style="font-size:13.5px">'+esc(p.day)+'</b>'+
      '<span style="letter-spacing:0;text-transform:none;font-size:11px">'+esc(fmt12(p.time).full)+'</span></div>'+
    '<div class="cbody">'+
      '<div class="cname">'+esc(p.name || SLABEL[p.studio] || p.studio)+'</div>'+
      '<div class="cmeta">'+
        '<span class="cst '+nextCls+(wide?' longform':'')+'">'+
          g+'<span>'+esc(nextTxt)+'</span></span>'+
        (once
          ? '<span class="onceTag">'+esc(shortDate(pickDate(p)))+' only</span>'
          : '<span class="ctail"><i class="sdot" style="background:'+(SCOLOR[p.studio]||'var(--ink3)')+'"></i>'+
            '<span>'+esc(SLABEL[p.studio]||p.studio)+'</span></span>')+
      '</div>'+
      (once ? '<div class="cmeta"><span class="ctail"><i class="sdot" style="background:'+(SCOLOR[p.studio]||'var(--ink3)')+'"></i>'+
        '<span>'+esc(SLABEL[p.studio]||p.studio)+' · one-off, not repeated</span></span></div>' : '')+
      (dupe ? '<div class="cmeta"><span class="cst bad longform">'+G.warnS+
        '<span>Two '+esc(SLABEL[p.studio]||p.studio)+' picks on '+esc(p.day)+' — FIT allows one per day</span></span></div>' : '')+
      (drift ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
        '<span>This slot is now “'+esc(drift.name)+'” — pick it again or it won’t book</span></span></div>' : '')+
      (miss ? '<div class="cmeta"><span class="cst amb longform">'+G.warnS+
        '<span>Didn’t book '+esc(shortDate(miss.date))+' — '+
        esc(PICK_MISS_TEXT[miss.kind] || 'the booking pass did not succeed')+
        '</span></span></div>' : '')+
    '</div>'+
    '<div class="cact"><button class="ptog rm" data-remove="'+esc(p.day+'|'+p.time+'|'+p.studio+'|'+pickDate(p))+'" '+
      'aria-label="Remove this '+(once?'one-off':'weekly')+' pick"><span class="pk">'+G.xmark+'</span></button></div>'+
  '</div>';
}

function picksSummary(){
  const once = picks.filter(isOneOff).length, rec = picks.length - once;
  if(!picks.length) return 'Nothing lined up yet';
  const bits = [];
  if(rec) bits.push(rec + (rec===1?' class every week':' classes every week'));
  if(once) bits.push(once + (once===1?' single class':' single classes'));
  return bits.join(' · ');
}
/* ── picks that compete for the same studio on the same DATE ────────────────────────
   AUDIT (18 Aug) — this was computed twice, in two separate maps: weekly picks keyed on
   `day|studio` inside the weekly group, one-offs keyed on `date|studio` inside theirs. So
   the one pairing nothing compared was a weekly pick against a one-off — which is exactly
   what you create by adding a one-off to a day you already cover. The bot books one and
   logs snipe_skipped_studio_limit for the other; the app said nothing on any surface.
   Resolve every pick to the concrete occurrence the bot will actually take, then group. */
/* Which of two same-studio same-day picks will FIT refuse? The one whose booking window
   opens LATER — the bot takes the earlier window and the studio limit then rejects the other.
   AUDIT round 2: this flagged whichever pick came later in the `picks` ARRAY, i.e. whichever
   was added last, so adding the evening class first put the warning on the morning row — the
   one that will actually book — and left the doomed row saying nothing. Insertion order is
   not chronology. */
function pickDupes(){
  const groups = {}, out = {};
  picks.forEach(p=>{
    let st = null;
    try{ st = pickStateFor(p); }catch(e){ st = null; }
    const d = (st && st.cls) ? st.cls.date : (isOneOff(p) ? pickDate(p) : '');
    if(!d) return;
    const k = d+'|'+p.studio;
    (groups[k] = groups[k] || []).push({p:p, t:(st && st.cls) ? st.cls.time : p.time});
  });
  Object.keys(groups).forEach(k=>{
    const a = groups[k];
    if(a.length < 2) return;
    a.sort((x,y)=> String(x.t||'').localeCompare(String(y.t||'')));
    for(let i=1;i<a.length;i++) out[pickKey(a[i].p)] = true;   // everything after the earliest
  });
  return out;
}
function renderPicks(){
  const w = $('#w-picks');
  resetDerived();
  const dupes = pickDupes();
  const byDay =(a,b)=> (DAY_ORDER.indexOf(a.day)-DAY_ORDER.indexOf(b.day)) || String(a.time).localeCompare(String(b.time));
  const weekly = picks.filter(p=>!isOneOff(p)).sort(byDay);
  const single = picks.filter(isOneOff).sort((a,b)=>
    String(pickDate(a)).localeCompare(String(pickDate(b))) || String(a.time).localeCompare(String(b.time)));

  let pickHTML = '';
  if(!picks.length){
    pickHTML = '<div class="emptystate"><div class="eg">'+G.big_rep+'</div>'+
      '<div class="et">No picks yet</div>'+
      '<div class="es">Anything you set to repeat every week shows up here.</div>'+
      '<div style="width:100%;max-width:280px;margin-top:14px">'+
      '<button class="btn gray" data-act="goBook">Browse classes</button></div></div>';
  } else {
    if(weekly.length){
      pickHTML += '<div class="ghead">Every week<span class="gh-r">'+weekly.length+'</span></div><div class="group">' +
        weekly.map(p => pickRowHTML(p, !!dupes[pickKey(p)])).join('') + '</div>';
    }
    if(single.length){
      pickHTML += '<div class="ghead">Single classes<span class="gh-r">'+single.length+'</span></div><div class="group">' +
        single.map(p => pickRowHTML(p, !!dupes[pickKey(p)])).join('') + '</div>';
    }
    /* Two footers used to sit here, one explaining what a one-off pick is and one giving the
       booking-window rule. Both described the mechanism rather than anything to act on. */
  }

  /* The hero is gone. On Picks it restated the tab it was sitting on — "Auto-booking ·
     1 pick · Next up: …" above the list of those very picks, with a chevron pointing at
     the screen you were already on. Josh: "It isn't required info."
     D-27's rule applies — check what ELSE was riding on the surface before removing it.
     What rode on it: the needy/booked summary ("1 pick needs you"), which every row states
     for itself and more precisely, and the jump-to-class chevron, which the rows also
     carry. What did NOT have another home is the alert strip, so it takes the slot: a
     failed pick write has to be visible on the tab it happened on. */
  w.innerHTML =
    '<div class="lsub">'+esc(picksSummary())+'</div>'+
    offlineBanner()+
    alertsHTML('picks')+
    pickHTML+
    '<div class="spacer"></div>';
}

/* ── Setup ──────────────────────────────────────────────────── */
function renderSetup(msg){
  $('#tabbar').classList.add('hidden');
  $('#tabfade').classList.add('hidden');
  $('#app').classList.add('setupmode');
  $('#app').classList.remove('dirty');
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-book').classList.add('active');
  /* One screen: a real FIT login — email + password, verified against the gym, refused if
     the gym refuses. There is no other way in. The paste-a-PAT fallback was removed when
     the app stopped holding any repo credential: a shared credential let anyone who had it
     write to anyone else's data, which is exactly what the Worker now prevents.
     F8 — enterkeyhint on both fields turns the generic iOS "return" key into next/Go; the
     keydown handlers below make them actually move on and submit. Without them the only
     way to submit was a button the keyboard was covering. */
  $('#w-book').innerHTML =
    '<div class="setup">'+
      '<div class="mark">'+G.mark+'</div>'+
      '<h1>FIT</h1>'+
      '<p>Sign in with your FIT Health Clubs email and password.</p>'+
      '<input type="email" id="loginemail" name="fitbooker-email" placeholder="Email" '+
        'autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" '+
        'inputmode="email" enterkeyhint="next">'+
      '<input type="password" id="loginpass" name="fitbooker-pass" placeholder="Password" '+
        'autocomplete="current-password" autocapitalize="off" autocorrect="off" '+
        'spellcheck="false" enterkeyhint="go">'+
      '<button class="btn filled" id="loginbtn" data-act="login" style="margin-top:12px">Sign in</button>'+
      '<div class="warn" id="loginwarn"'+(msg ? '' : ' style="display:none"')+'>'+
        (msg ? esc(msg) : '')+'</div>'+
    '</div>';
  const em = $('#loginemail'), pw = $('#loginpass');
  if(em && pw){
    em.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.focus(); }
    });
    pw.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); pw.blur(); login(); }
    });
  }
  /* F8 — iOS does not resize the LAYOUT viewport for the keyboard in a standalone web
     app (only visualViewport shrinks), and #app is fixed to the layout viewport, so
     nothing reflowed and the submit button sat ~30px under the keyboard. Lift the setup
     block by the occluded height — the login form is two fields and a button, so it is
     occluded generously. */
  const vv = window.visualViewport;
  if(vv && !vv.__fitbookerBound){
    vv.__fitbookerBound = true;
    const fit = ()=>{
      const el = $('.setup'); if(!el) return;
      const hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      el.style.paddingBottom = hidden ? (hidden + 12) + 'px' : '';
      if(hidden) el.scrollIntoView({block:'end'});
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }
  /* The nav bar is empty chrome on the sign-in screen: no day to name, nothing to page,
     no account to open yet. #app.setupmode hides the title and the actions together. */
}
function doSignOut(){
  /* Tell the Worker to forget the session so a copied string is dead the moment the user
     signs out. Fire-and-forget on purpose: the local state must clear instantly even with
     no connection, and a failure here changes nothing this app can see. */
  try{ wapi('/logout', {}).catch(()=>{}); }catch(e){}
  booted = false;
  stopPolling(); clearPostPoll(); syncing = false; syncStartedAt = 0;
  fastUntil = 0;
  clearDispatchWatch();
  closeSheet();
  /* Everything in memory AND in storage belongs to the member who just left — the draft
     picks above all, which used to sit under one global key and were restored into the
     next person's session, one tap from writing his picks to her account. */
  wipeMemberState();
  renderSetup('');
}

function loginWarn(m){
  const w = $('#loginwarn'); if(!w) return;
  w.textContent = m || '';
  w.style.display = m ? '' : 'none';
}

/* Real sign-in. The Worker attempts an actual login against the FIT portal with what was
   typed: if the gym rejects it, the app rejects it. There is no local "password" to get
   wrong, and no way in without a working FIT account. On success it returns which member
   this is plus an opaque session — never a credential this app could misuse. */
async function login(){
  const em = $('#loginemail'), pw = $('#loginpass'), btn = $('#loginbtn');
  if(!em || !pw) return;
  const email = em.value.trim(), password = pw.value;
  if(!email || !password){ loginWarn('Enter your email and password'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  loginWarn('');
  /* A hung request must not leave the button stuck on "Signing in…" forever. */
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const kill = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, 25000);
  try {
    const r = await fetch(WORKER_URL.replace(/\/+$/,'') + '/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
      signal: ctl ? ctl.signal : undefined
    });
    let d = null;
    try { d = await r.json(); } catch(e){}
    if(!d || !d.ok || !d.session){
      loginWarn((d && d.error) || 'Could not sign in right now — try again');
      return;
    }
    /* A sign-in is a change of member until proven otherwise. Erase whatever the previous
       one left behind BEFORE the new session exists — the audit showed a failed first load
       rendering the previous member's bookings, complete with a working Cancel button. */
    wipeMemberState();
    session = d.session;
    USER = d.user || '';
    USERNAME = d.name || '';
    syncAccountControl();
    try {
      localStorage.setItem('fitbooker_session', session);
      localStorage.setItem('fitbooker_user', USER);
      localStorage.setItem('fitbooker_name', USERNAME);
    } catch(e){ toast('This browser blocked local storage'); }
    /* The password itself is never stored on the phone — only the Worker keeps it, and
       only because it proved valid a moment ago. */
    pw.value = '';
    enterApp();
  } catch(e){
    loginWarn(String(e && e.name) === 'AbortError'
      ? 'That took too long — check your connection and try again'
      : 'Could not reach the sign-in service — check your connection');
  } finally {
    clearTimeout(kill);
    if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}

function enterApp(){
  $('#tabbar').classList.remove('hidden');
  $('#tabfade').classList.remove('hidden');
  $('#app').classList.remove('setupmode');
  $('#w-book').innerHTML = '<div class="emptystate"><div class="es">Connecting…</div></div>';
  bootLoad();
}

/* ════════════════════════════════════════════════════════════════
   Sheets: class detail, info
   ════════════════════════════════════════════════════════════════ */
function findClass(bid){ return (timetable.classes||[]).find(c => String(c.bid)===String(bid)); }

function openClassSheet(bid){
  const c = findClass(bid);
  if(!c){ toast('That class is no longer on the timetable — pull down to refresh.', 3600); return; }
  /* This sheet is the one fresh surface built OUTSIDE a render pass (a row tap reaches it
     directly), so it must drop the per-render memos itself — a stale busyCache here drew
     a refusal for a class whose collision had meanwhile expired (audit F4). */
  resetDerived();
  const av = availInfo(c);
  const opensMs = opensAtMs(c);
  const open = isFinite(opensMs) && opensMs <= Date.now();
  const recurring = pickIndex(c.day,c.time,c.studio,'') >= 0;
  const oneOff = pickIndex(c.day,c.time,c.studio,c.date) >= 0;
  const dur = durationMins(c);
  const t = fmt12(c.time);
  const mine = bookingForClass(c);

  /* The sheet's primary mirrors the row's action column exactly — same precedence, same
     answers. Two controls saying different things about one class is how the "Book
     anyway over a note telling you to cancel what you already hold" defect happened. */
  /* Same predicate and the same precedence as the row (classRowHTML) — two controls giving
     one class two different answers is how the "Book anyway over a note telling you to cancel
     what you already hold" defect happened, and the audit found the sheet drifting again. */
  const pkHere = pickFor(c);
  const willBook = !!mine || (!!pkHere && pickIsLive(pkHere, c));
  /* Same rule as the row (24 Aug): a collision with something booked is a refusal, drawn
     inert, with the note below carrying the why. */
  const block = (mine || willBook) ? null : bookBlock(c);
  const clash = (mine || block) ? null : pickClash(c);
  let primary;
  if(!!mine){
    primary = '<div class="btn inert go">'+G.check+' Booked</div>';
  } else if(block){
    /* Not a disabled <button>: the row's whole argument for the inert states is that a
       greyed-out pill is exactly what people keep poking. It applies here too. */
    primary = '<div class="btn inert">'+G.noentry+' '+
      (block.kind==='studio' ? 'One per day' : 'Clashes')+'</div>';
  } else if(open && av.full && av.waitlist){
    primary = '<button class="btn filled" data-act="waitlist" data-bid="'+esc(c.bid)+'">Join Waitlist</button>';
  } else if(open && av.full){
    primary = '<div class="btn inert">'+G.noentry+' Waitlist full</div>';
  } else if(willBook && !(open && av.full)){
    primary = '<div class="btn inert go">'+G.check+' Booked</div>';
  } else if(!open){
    primary = '<button class="btn filled" data-act="schedule" data-bid="'+esc(c.bid)+'">Book</button>';
  } else {
    primary = '<button class="btn filled" data-act="booknow" data-bid="'+esc(c.bid)+'">Book</button>';
  }
  /* A class held only by a one-off pick has nowhere else in this sheet to be undone — the
     weekly switch is not its control. Same word as the Booked tab uses, because to the
     person tapping it these are the same act. */
  const shownBookedSheet = !!mine || (willBook && !(open && av.full));
  const undoOne = (oneOff && !mine && !recurring && shownBookedSheet)
    ? '<button class="btn gray danger" data-act="unschedule" data-bid="'+esc(c.bid)+'">Cancel booking</button>' : '';
  const blockBy = block ? block.by : null;
  const blockWhen = blockBy && blockBy.time ? fmt12(blockBy.time).full : '';
  const conflictNote = block
    ? '<div class="group" style="margin:0 0 12px"><div class="rulerow"><div class="ri" data-tone="amber">'+G.warn+'</div>'+
      '<div class="rt"><b>'+esc(block.kind==='studio'
        ? (SLABEL[c.studio]||c.studio)+' already booked today'
        : 'You’re booked at that time')+'</b><span>'+
      esc(block.kind==='studio'
        ? (blockBy.name||'A class')+(blockWhen ? ' at '+blockWhen : '')+
          '. FIT allows one class per studio per day — cancel that one first if you want this one instead.'
        : (blockBy.name||'Your booking')+(blockWhen ? ' at '+blockWhen : '')+
          ' overlaps this class — cancel it first if you want this one instead.')+
      '</span></div></div></div>'
    : clash
    ? '<div class="group" style="margin:0 0 12px"><div class="rulerow"><div class="ri" data-tone="amber">'+G.warn+'</div>'+
      '<div class="rt"><b>Clashes with another pick</b><span>'+
      esc('You are already booked into '+fmt12(clash.time).full+' '+(SLABEL[c.studio]||c.studio)+
          ' that day, and FIT allows one class per studio per day — only one of them will book.')+
      '</span></div></div></div>'
    : '';

  /* A projected row is the app repeating the last published week forward. It may assert WHEN
     and nothing else (D-25), so the sheet still says so — that is an honesty rule, not
     machinery. What changed is the advice: pinning this date IS now allowed (the owner's
     call), and the bot retires the pick by itself if the real week turns up without it. */
  const projNote = c.projected
    ? '<div class="group" style="margin:0 0 12px"><div class="rulerow"><div class="ri">'+G.clock+'</div>'+
      '<div class="rt"><b>This week isn’t out yet</b><span>'+
      'The timetable this far ahead is last week’s repeated, so the class, its time and its '+
      'instructor could still change. Book it and the spot is held for you as soon as it is '+
      'released; if the class doesn’t end up running, it drops off by itself.</span></div></div></div>'
    : '';

  const html =
  '<div class="sheet-card"><div class="grabber"></div><div class="sheet-scroll">'+
    '<div class="detail-head">'+
      '<div class="detail-kicker"><span class="sdot" style="width:8px;height:8px;border-radius:4px;flex:none;background:'+(SCOLOR[c.studio]||'var(--ink3)')+'"></span>'+
        '<span class="k" style="color:'+(SCOLOR[c.studio]||'var(--ink2)')+'">'+esc(SLABEL[c.studio]||c.studio)+'</span></div>'+
      '<div class="detail-title">'+esc(c.name || c.studio)+'</div>'+
      '<div class="detail-when">'+esc(longDate(c.date))+' · '+esc(t.full)+
        (dur ? ' – '+esc(endLabel(c)) : '')+'</div>'+
    '</div>'+
    projNote+
    '<div>'+
      (c.staff && String(c.staff).trim() ? factRow('Instructor', esc(String(c.staff).trim())) : '')+
      /* av.long is empty for a projected class, which rendered a labelled row with nothing
         after it — a rendering fault, not a silence. Omit the row entirely instead. */
      (av.long ? factRow('Availability', '<span style="color:'+(av.full?'var(--bad)':'var(--ink)')+'">'+esc(av.long)+'</span>') : '')+
      (dur ? factRow('Duration', dur+' minutes') : '')+
    '</div>'+
    /* One switch, because there is now one thing a switch can mean. "Just this one" was the
       other half of a pair that no longer exists — the Book button above is that half. */
    '<div class="swrow">'+
      '<div class="rbody"><div class="rtitle">Every week</div>'+
      '<div class="rsub"><span class="txt">'+esc(WD_LONG[dowMon0(c.date)]+'s at '+t.full+' · '+(SLABEL[c.studio]||c.studio))+'</span></div></div>'+
      '<button class="swtap" role="switch" aria-checked="'+recurring+'" data-act="togglepick" data-bid="'+esc(c.bid)+'" '+
        'aria-label="Book this every '+esc(WD_LONG[dowMon0(c.date)])+'">'+
        '<span class="sw" aria-hidden="true"><i></i></span></button>'+
    '</div>'+
    '<div class="sheet-actions">'+ conflictNote + primary + undoOne +
      '<button class="btn gray" data-act="close">Done</button>'+
    '</div>'+
  '</div></div>';
  openSheet(html);
}
function factRow(k,v){
  return '<div class="factrow"><span class="fk">'+k+'</span><span class="fv">'+v+'</span></div>';
}

function layoutDiag(){
  const bar = document.querySelector('.tabbar');
  const r = bar ? bar.getBoundingClientRect() : null;
  const cs = getComputedStyle(document.documentElement);
  const vv = window.visualViewport;
  const standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const rows = [
    ['mode', standalone ? 'standalone (home screen)' : 'browser tab'],
    ['screen', screen.width + ' x ' + screen.height],
    ['innerHeight', String(window.innerHeight)],
    ['visualViewport', vv ? Math.round(vv.height) + ' (offsetTop ' + Math.round(vv.offsetTop) + ')' : 'n/a'],
    ['100dvh measures', (function(){
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:100dvh;visibility:hidden;pointer-events:none';
      document.body.appendChild(d);
      var h = Math.round(d.getBoundingClientRect().height);
      d.remove();
      return h + 'px' + (h !== window.innerHeight ? '  <-- MISMATCH' : '');
    })()],
    ['safe-area TOP', cs.getPropertyValue('--sat').trim() || '0px'],
    ['safe-area bottom', cs.getPropertyValue('--sab').trim() || '0px'],
    ['doc clientHeight', String(document.documentElement.clientHeight)],
    ['outerHeight', String(window.outerHeight)],
    ['missing vs screen', (screen.height - window.innerHeight) + 'px'],
    ['reserved (--tabpadref)', cs.getPropertyValue('--tabpadref').trim() || 'n/a'],
    ['container', (function(){
      var m = screen.height - window.innerHeight;
      var sa = (window.navigator.standalone === true) ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if(!sa) return 'browser tab (' + m + 'px is Safari chrome, not the bug)';
      if(m <= 8) return 'full height';
      if(m >= 40 && m <= 200) return 'letterboxed below status bar (WebKit 301994; bottom edge is flush)';
      return 'other (' + m + 'px short)';
    })()],
    ['tab bar top', r ? Math.round(r.top) + 'px' : 'n/a'],
    ['tab bar bottom', r ? Math.round(r.bottom) + 'px' : 'n/a'],
    ['gap below bar', r ? Math.round(window.innerHeight - r.bottom) + 'px' : 'n/a'],
  ];
  return '<div class="rulerow"><div class="rt"><b>Layout diagnostics</b><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;display:block">' +
    rows.map(function(x){ return x[0] + ': <b>' + x[1] + '</b>'; }).join('<br>') +
    '</span></div></div>';
}

/* Initials for the header monogram. Two letters at most; falls back to a person glyph when
   the name has not arrived yet (USERNAME is '' until the first /data lands). */
function acctInitials(){
  const parts = String(USERNAME || '').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '';
  const first = parts[0][0] || '';
  const last  = parts.length > 1 ? (parts[parts.length-1][0] || '') : '';
  return (first + last).toUpperCase();
}
function syncAccountControl(){
  const el = $('#acctInitials');
  if(!el) return;
  const ini = acctInitials();
  if(ini) el.textContent = ini;          // textContent, not innerHTML — a display name is user data
  else    el.innerHTML = G.person;
  const btn = $('#acctBtn');
  if(btn) btn.setAttribute('aria-label', USERNAME ? ('Account — ' + USERNAME) : 'Account');
}

/* The "How this works" sheet is gone. It was four rules explaining the machinery — the
   booking window, weekly vs one-off, the studio limit, strikes — which is exactly the
   register this app is not supposed to speak in. What was load-bearing inside it survives:
   sign-out (its only home) and the layout diagnostics (the only instrument that can read
   this phone's geometry — see the WebKit-301994 comment at the top of the file), now a
   collapsed disclosure that shows nothing until it is asked for. */
function openAccountSheet(){
  const html =
  '<div class="sheet-card"><div class="grabber"></div><div class="sheet-scroll">'+
    '<div class="detail-head">'+
      '<div class="detail-title">'+esc(USERNAME || 'Your account')+'</div>'+
      '<div class="detail-when">FIT Health Clubs · Lane Cove</div>'+
    '</div>'+
    /* Sign out first and Done last, matching the class sheet — the dismiss control is the
       floor of a sheet, not a peer of its one real action. */
    '<div class="sheet-actions">'+
      '<button class="btn gray danger" data-act="signout">Sign out</button>'+
      '<button class="btn gray" data-act="close">Done</button>'+
    '</div>'+
    /* The diagnostics are a maintenance instrument and the last thing in the app that still
       reads as "somebody built this on top of the gym's app". Collapsed is not hidden, so
       this is as quiet as a reachable control gets: sentence case, the app's own small-print
       size, no tracking, no caps. */
    '<details class="diagwrap"><summary>Display info</summary>'+ layoutDiag() +'</details>'+
  '</div></div>';
  openSheet(html);
}

/* ════════════════════════════════════════════════════════════════
   Actions (every destructive/committing action confirms)
   ════════════════════════════════════════════════════════════════ */
async function bookNow(bid, fromSheet, waitlist){
  const c = findClass(bid);
  /* a poll can replace the timetable between the sheet closing and this running, and the
     old code returned in silence — the user tapped Book and nothing at all happened */
  if(!c){ toast('That class is no longer listed — pull down to refresh.', 3600); return; }
  /* A projected row has no real class behind it to book against, so this path stays shut for
     it even though its Book BUTTON is now live — that button saves the date (scheduleClass)
     and the booking happens for real once FIT publishes the week. */
  if(c.projected){ toast('That week isn’t out yet — tap Book to hold the spot instead.', 4000); return; }
  const t = fmt12(c.time);
  const already = bookingForClass(c);
  /* An optimistic row is an ASK, not an account fact, so say the thing that is true of
     both cases rather than asserting FIT has it (round 2). */
  if(already){ toast(already.__pending ? 'That one is already on your Booked list.'
                                       : 'You’re already booked into this class.', 2800); return; }
  /* Guard the ACTION, not just the button (24 Aug): a blocked row renders no Book button,
     but a poll can land between the render and the tap, and the sheet's button lives on
     until it closes. A refusal must never be silent (P-18), so it says why.
     resetDerived first: busyCache is a per-render memo and this path can be reached with
     no render since it was filled (audit F4 — a stale memo must not refuse a class that
     has come free, nor clear one that has just been taken). */
  resetDerived();
  const blk = bookBlock(c);
  if(blk){ toast(blockLine(blk, c)+'.', 4200); if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }
  /* a booking made this close to the class cannot be cancelled for free (FIT's line is one
     hour) and the dispatch itself takes about a minute — say so rather than let §7's
     "free cancel" promise be made for us by silence */
  const startsIn = new Date(c.start_iso).getTime() - Date.now();
  const tight = isFinite(startsIn) && startsIn < 75*60000;

  /* THE RULE FOR ASKING, and it is the same everywhere in the app now: you are asked only
     when there is something you need to know. A clean booking of a free class is not a
     question — it just happens, which is what "it should just work" means. A booking that
     cannot be cancelled for free, or that is a WAITLIST place rather than a booking, is
     carrying a fact worth a tap. Waitlist always asks, because a place on it is not a place
     in the class and can turn into one hours before the class starts. (The old "may be
     refused" ask is gone — a same-studio or same-time collision now refuses outright,
     above, rather than asking.) */
  const mustAsk = !!(waitlist || tight);
  if(mustAsk){
    const choice = await actionSheet({
      title: waitlist ? 'Join the waitlist?' : 'Book ' + (c.name || c.studio) + '?',
      message: longDate(c.date) + ' at ' + t.full + ' · ' + (SLABEL[c.studio]||c.studio) +
               (waitlist ? '\nThis class is full. A waitlist place is not a booking — if a '+
                           'spot opens up you are put in the class automatically, which can '+
                           'happen as late as an hour before it starts. It also uses up your '+
                           'one class in this studio for the day.' : '') +
               (tight ? '\nIt starts soon, so you won’t be able to cancel it for free — '+
                        'not turning up would count as a no-show.' : ''),
      actions: [{label: waitlist ? 'Join Waitlist' : 'Book', style:'default'}]
    });
    if(choice !== 0){ if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }
    /* AUDIT (24 Aug, F2) — the sheet is awaited, and the poll keeps landing under it. The
       guards above ran BEFORE the await, so a booking that arrived while he read the
       sheet — the bot's own snipe included — was dispatched into. Re-check both after a
       yes, against fresh state; the tight path this sheet exists for is exactly the one
       where the surplus booking cannot be cancelled for free. */
    const again = bookingForClass(c);
    if(again){ toast(again.__pending ? 'That one is already on your Booked list.'
                                     : 'You’re already booked into this class.', 2800); return; }
    resetDerived();
    const blk2 = bookBlock(c);
    if(blk2){ toast(blockLine(blk2, c)+'.', 4200); if(fromSheet) setTimeout(()=>openClassSheet(bid), 120); return; }
  }

  /* A waitlist place is NOT a booking and must never be drawn as one. It has no FIT booking
     id, it never appears on the account page, and the bot logs it as `waitlisted` rather
     than `booked` — which the app already surfaces as a standing notice. So: no optimistic
     row, no pending record, nothing for the settle window to withdraw. The notice is the
     whole feedback, and it is the honest amount. */
  if(waitlist){
    try{
      await dispatch('booknow.yml', {day:c.day, time:c.time, studio:c.studio, date:c.date,
                                     allow_waitlist:'true'});
      watchDispatch(78000);
      startFastPoll();
      toast('Asked for a waitlist place', 2600);
    }catch(e){
      if(handleApiErr(e)) return;
      if(isDefiniteReject(e)){
        toast('Couldn’t join that waitlist — nothing was sent. '+String(e.message||e), 5200);
      }else{
        announce({id:'wlunknown:'+c.date+'|'+c.time+'|'+c.studio, tone:'amber', tab:'booked',
                  title:'Couldn’t confirm that waitlist request',
                  body:(c.name||'That class')+' on '+shortDate(c.date)+' — the request may or '+
                       'may not have gone through. If a place opens up you would be put in the '+
                       'class, so check before it starts.'});
      }
    }
    return;
  }

  /* Optimistic: the class appears on Booked immediately, flagged as not yet confirmed and
     with no Cancel button until it is real. It is memory-only — nothing about it is
     persisted — so the worst case is that it disappears at the next launch, never that a
     phantom booking outlives the session. reconcilePending() withdraws it with a toast if
     FIT does not have it SETTLE_MS from now.
     Since 18 Aug the BOOK tab reads it too (bookingForClass / busyOn): the row says
     "Booked", loses its Book button, and every colliding class — same studio that day, or
     overlapping in time — flips to its inert block label immediately, rather than after
     the next sync (24 Aug: the caution became a refusal).
     Everything that makes a CLAIM still reads realBookings() and cannot see this row. */
  const optimistic = {
    date: c.date, time: c.time,
    name: c.name || SLABEL[c.studio] || c.studio,
    location: c.studio,                  // keeps studioOfBooking() honest for this row
    time_raw: fmt12(c.time).full,
    /* __pending marks this row as an ASK, not a booking. realBookings() filters it out, so
       nothing that makes a claim — pickState's green tick, the one-per-studio-per-day
       caution, the pending-book match — can ever be satisfied by a row this app invented.
       __pendingStudio is what we asked for, and is never read as what FIT confirmed. */
    __pending: true,
    __pendingStudio: c.studio
  };
  const key = bookingKey(optimistic);
  /* Guard the DISPATCH, not just the row. The row guard alone let a double tap send two
     booknow.yml runs: the second one books nothing (FIT already has it) but it is a wasted
     run, and against a slower first run it is a genuine race. */
  /* the guard stays — a double tap must never fire two booknow.yml runs — but it no
     longer reports on a workflow. The row is already on Booked; say only that. */
  if(hasPending(key)){ toast('That one is already on your Booked list.', 2600); return; }
  if(alreadyBookedSlot(c)){ toast('You’re already booked into that class.', 3000); return; }
  const before = bookingKeySnapshot();
  bookingList().push(optimistic);
  pendingBooks.push({key: key, at: Date.now(), b: optimistic, before: before});
  rerenderKeepScroll();
  try{
    /* correctness #2 — `date` pins the occurrence. Without it the bot resolves the
       (day,time,studio) triple to the SOONEST future match, and the two-week timetable
       makes every triple ambiguous: for the first hour after a window opens that is LAST
       week's slot repeating today, i.e. a class starting within the hour that he never
       asked for. A no-show there is a strike, and cancelling it is also a strike.
       booknow.yml already declares a `date` input (it is used for cancel), so sending it
       is safe whether or not the bot-side patch has landed. */
    await dispatch('booknow.yml', {day:c.day, time:c.time, studio:c.studio, date:c.date});
    watchDispatch(78000);
    startFastPoll();                     // …and confirm it every 8s rather than every 45
  }catch(e){
    if(handleApiErr(e)) return;          // 401/403: the session is gone, so is the state
    if(isDefiniteReject(e)){
      /* The Worker answered and said no. Nothing was dispatched, so nothing was asked of
         FIT — take the row back off the screen and say so plainly. */
      withdrawPending(pendingBooks, key);
      toast('Couldn’t start that booking — nothing was booked. '+String(e.message||e), 5200);
      rerenderKeepScroll();
      return;
    }
    /* Timeout, dropped connection or a 5xx. THE RUN MAY ALREADY HAVE BEEN DISPATCHED — the
       app aborts its own fetch at 12s and the Worker's call to GitHub does not stop when we
       stop listening. The audit demonstrated the old behaviour: the booking succeeded on FIT
       while the app declared "nothing was booked" AND dropped the pending record, so the
       settle net that exists to catch exactly this was disarmed at the same moment.
       Keep the pending record, keep the optimistic row, keep watching. The settle window
       decides in ~3 minutes, from evidence. Never assert a negative the app cannot know. */
    announce({id:'bookunknown:'+key, tone:'amber', tab:'booked',
              title:'Couldn’t confirm that booking request',
              body:(c.name||'The class')+' on '+shortDate(c.date)+' — the request may or may '+
                   'not have reached FIT. The app is checking; it will tell you either way. '+
                   'Do not tap Book again yet.'});
    rerenderKeepScroll();
    startFastPoll();
  }
}
/* drop a pending record and undo its optimistic edit to the list */
function withdrawPending(bucket, key){
  const i = bucket.findIndex(p=>p.key===key);
  if(i < 0) return null;
  const p = bucket[i];
  bucket.splice(i,1);
  const list = bookingList();
  if(bucket === pendingBooks){
    const j = list.findIndex(b => b === p.b);
    if(j >= 0) list.splice(j,1);
  }else{
    if(list.findIndex(b => bookingKey(b) === key) < 0){
      const at = (p.idx === null || p.idx < 0 || p.idx > list.length) ? list.length : p.idx;
      list.splice(at, 0, p.b);
    }
  }
  return p;
}

/* "Yes, I am going to this one." Instant and silent, like every other action here — no
   sheet, no spinner. Keeping a class you already have is not a decision that needs
   confirming twice, and the destructive direction (doing nothing) is the one that is
   already guarded by a deadline the row spells out.

   The one thing that MUST be loud is failure: an unconfirmed class gets cancelled, so a
   confirm that silently did not stick would lose him the class. Hence the optimistic
   confirm is withdrawn on any error at all — definite or unknown — which puts the Confirm
   button straight back. Re-tapping is free: the Worker is idempotent and answers
   `already:true` for a confirmation it already holds. */
async function confirmBooking(rowKey){
  /* Resolved by identity out of the LIVE list, so a re-render between the render and the
     tap cannot move the target. If the row is no longer there, nothing happens — which is
     right: it has been cancelled, swept, or has already been confirmed elsewhere. */
  const b = bookingList().find(x => bookingKey(x) === rowKey); if(!b) return;
  const id = bookingId(b);
  /* Without FIT's id there is nothing to confirm AGAINST — and equally nothing the sweep
     could ever have matched, so such a row never shows this button. Belt and braces. */
  if(!id){ toast('This booking has no id the app can read, so it can’t be confirmed here.', 4200); return; }
  if(pendingConfirms.some(p => p.id === id)) return;

  pendingConfirms.push({id: id, at: Date.now(), b: b});
  rerenderKeepScroll();

  try{
    await wapi('/confirm', {booking_id: id});
    /* Nothing is written into confirmData here, deliberately. The pending record already
       makes the row look confirmed (confirmState() unions it in), and confirmData is the
       SERVER's answer — writing a local copy of a confirmation into it would mean the app
       kept asserting "confirmed" out of its own memory even after the server had failed
       to produce it, which is the one belief that silently loses the class. The pending
       record is released only when the server actually agrees, or it times out and the
       row goes back to asking. */
    startFastPoll();
  }catch(e){
    if(handleApiErr(e)) return;
    /* Withdraw in BOTH directions. If the write actually landed, the next /data brings the
       confirmation back and the button disappears again; if it did not, he is looking at a
       button that still needs pressing. The wrong belief here — "confirmed" when it is not
       — silently loses him the class four hours before it starts. */
    pendingConfirms = pendingConfirms.filter(p => p.id !== id);
    announce({id:'confirmfail:'+id, tone:'bad', tab:'booked',
              title:'Couldn’t confirm that',
              body:(b.name||'That class')+' is still unconfirmed'+
                   (sweepArmed ? ', so it will cancel itself 4 hours before it starts. ' : '. ')+
                   'Tap Confirm again — it is safe to tap more than once.'});
    rerenderKeepScroll();
  }
}

async function cancelBooking(rowKey){
  /* By identity, not by index — see confirmBooking(). This used to take the position of
     the row in a re-derived sorted copy, which is correct only while nothing re-renders
     between drawing the button and tapping it. */
  const b = bookingList().find(x => bookingKey(x) === rowKey); if(!b) return;
  const startMs = bookingStartMs(b);
  /* correctness #3 — judge against the instant the BOT will POST, not against now */
  const atRun = startMs ? (startMs - (Date.now() + CANCEL_LATENCY_MS)) : null;
  const late  = atRun !== null && atRun < 3600000;
  /* correctness #10 — the studio we send is a guess when the name/location don't say */
  const knownStudio = studioOfBooking(b);
  /* FIT's own id for THIS booking, read off its cancel link. This is what gets sent. */
  const fitId = bookingId(b);
  const choice = await actionSheet({
    title: 'Cancel ' + (b.name||'this booking') + '?',
    message: (b.date_raw || shortDate(b.date)) + ' at ' + (b.time_raw || fmt12(b.time).full) +
      (startMs === null
        ? '\nCancelling within 1 hour of the class counts as a strike. 3 strikes in 7 days = a 7-day ban.'
        : (late ? '\nThis will land inside the last hour before the class, so it WILL count as a strike. 3 strikes in 7 days = a 7-day ban.'
                : '\nFree cancel — this lands more than 1 hour before the class.')) +
      /* The old text here said "so the bot matches on date and time". That was FALSE: the
         app sent a GUESSED studio ('exhale') and the bot matched on it. Now the bot is
         given this booking's own FIT id and cancels exactly it, so there is nothing to
         disclaim. Only a row with no id at all falls back to date+time — and then the bot
         refuses outright rather than picking one, which IS worth saying. */
      (fitId ? '' : (knownStudio
        ? ''
        : '\nThis booking has no id the app can read, so it is matched on date and time — and nothing will be cancelled at all if another booking shares them.')),
    actions: [{label: late ? 'Cancel Anyway (strike)' : 'Cancel Booking', style:'destructive'}],
    cancelLabel:'Keep Booking'
  });
  if(choice !== 0) return;

  /* Optimistic: the row goes NOW. Waiting ~a minute for a workflow to run before a tapped
     Cancel had any visible effect was the single most remote-control-feeling thing left in
     the app. Everything after this point exists to make sure the disappearance is true.

     The pending record's identity is the FIT booking id. It used to be
     date|time|guessed-studio, which two different bookings could share — so the re-find
     below spliced the WRONG row off the screen while the dispatch cancelled the other. */
  const key = bookingKey(b);
  /* unreachable in practice (the row left the list on the first tap) but the dispatch
     guard stays. It speaks in the app's terms, not the bot's. */
  if(hasPending(key)){ toast('That booking has already been cancelled.', 2600); return; }
  const live = bookingList();
  const idx = live.findIndex(x => bookingKey(x) === key);
  const snapshot = idx >= 0 ? live[idx] : b;
  if(idx >= 0) live.splice(idx, 1);
  pendingCancels.push({key: key, at: Date.now(), b: snapshot, idx: idx, bookingId: fitId});
  rerenderKeepScroll();

  try{
    /* booking_id is the whole identity when we have one; the bot ignores date/time/studio
       entirely in that case and verifies THAT id is gone from the account afterwards.
       studio is still sent for the id-less fallback, and is 'unknown' — never a guess —
       when the row cannot be classified, so the bot cannot match the wrong studio. */
    await dispatch('booknow.yml', {day:'MON', time:b.time, studio:studioFromBooking(b),
                                   action:'cancel', date:b.date, booking_id:fitId});
    watchDispatch(78000);
    startFastPoll();
  }catch(e){
    if(handleApiErr(e)) return;
    /* The cancel path fails SAFE in one direction only: put the row back. A visible row is
       the pessimistic claim ("still booked"), and if the cancel did in fact land, the next
       poll removes it — whereas a hidden row the user believes is cancelled and which is
       not is a no-show, and three of those in 7 days is a 7-day ban. */
    withdrawPending(pendingCancels, key);
    if(isDefiniteReject(e)){
      toast('Couldn’t cancel that — nothing was sent, so it is still booked. '+
            String(e.message||e), 5200);
    }else{
      /* timeout / dropped connection: the run MAY have been dispatched. Say exactly that
         rather than asserting either outcome. */
      announce({id:'cancelunknown:'+key, tone:'bad', tab:'booked',
                title:'Couldn’t confirm that cancel',
                body:(b.name||'That class')+' is shown as still booked because the app could '+
                     'not confirm otherwise. The request may or may not have reached FIT — '+
                     'check before the class, or it could become a no-show.'});
    }
    rerenderKeepScroll();
  }
}

/* syncNow(), firePass() and the Live-data sheet they hung off are gone. autoSync() —
   on load, on foreground, on the 45s poll when the data is stale, and on pull-to-refresh —
   is now the only path to refresh.yml. autoSnipeIfOpen() has been DELETED: the phone no
   longer fires unattended booking passes at all — the Worker's cron does, from the
   generated schedule. Nothing in the UI dispatches a workflow except book and cancel. */

/* ════════════════════════════════════════════════════════════════
   Navigation, scroll memory, gestures
   ════════════════════════════════════════════════════════════════ */
function switchTab(t){
  if(t === activeTab) return;
  const cur = $('#page-'+activeTab);
  if(cur) scrollMemo[activeTab] = cur.scrollTop;
  $$('.page').forEach(p=>p.classList.remove('active'));
  $$('.tabbtn').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===t)));
  activeTab = t;
  const next = $('#page-'+activeTab);
  next.classList.add('active');
  /* AUDIT round 2 — flushing BEFORE the page was activated meant renderBook measured a
     display:none page: offsetLeft/clientWidth are 0, so the chip rail's scroll restore and
     the keep-the-selected-chip-visible guard both silently did nothing. Activate, then
     draw. */
  flushTab(t);
  void next.offsetHeight;
  next.scrollTop = scrollMemo[activeTab] || 0;
  updateNav();
}

/* The title no longer fades in on scroll — it is the only place the selected day is named,
   so it is always on. All that is left scroll-linked is the hairline under the bar. */
function updateNav(){
  const page = $('#page-'+activeTab);
  const st = page ? page.scrollTop : 0;
  const el = $('#navTitle');
  if(activeTab === 'book' && selDate){
    el.innerHTML = esc(relDayLabel(selDate)) + ' <span class="nt-d">' + esc(shortDate(selDate)) + '</span>';
  } else {
    el.textContent = NAV_TITLES[activeTab];
  }
  syncWeekNav();
  $('#app').classList.toggle('scrolled', st > 8);
}

/* The chevrons live in the nav bar but page the Book tab's date strip, so their enabled
   state is derived here rather than being rebuilt with the strip. */
function syncWeekNav(){
  const app = $('#app');
  if(app) app.classList.toggle('tab-book', activeTab === 'book');
  const prev = $('#navPrev'), next = $('#navNext');
  if(!prev || !next) return;
  const canPrev = !!weekStart && weekStart > firstWeek();
  const canNext = !!weekStart && weekStart < lastWeek();
  prev.disabled = !canPrev;
  next.disabled = !canNext;
}

let navTick = false;
$$('.page').forEach(p=>{
  p.addEventListener('scroll', ()=>{
    if(navTick) return; navTick = true;
    requestAnimationFrame(()=>{ navTick = false; if(p.classList.contains('active')) updateNav(); });
  }, {passive:true});
});

function setDay(date, dir){
  if(!date || date === selDate) return;
  const slide = $('#dayslide');
  if(slide && dir) slide.classList.add(dir > 0 ? 'out-l' : 'out-r');
  selDate = date;
  weekStart = pageOf(date);   // the strip follows the day, one rolling page at a time
  bookRenderSoon(dir ? 165 : 0, ()=>{
    const s2 = $('#dayslide');
    if(s2 && dir){
      s2.classList.add(dir > 0 ? 'out-r' : 'out-l');
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ s2.classList.remove('out-r','out-l'); }); });
    }
    updateNav();
  });
}
function stepDay(delta){
  if(!allDates.length) return;
  const i = allDates.indexOf(selDate);
  /* AUDIT (18 Aug) — `allDates` only holds days that HAVE classes, while the strip renders
     every cell of the page and lets you tap any of them. Landing on a class-free day
     therefore killed the day swipe in both directions, silently, until the user noticed
     the strip still worked. Step from the nearest neighbour instead of bailing. */
  if(i < 0){
    const to = delta > 0 ? allDates.filter(d => d > selDate)[0]
                         : allDates.filter(d => d < selDate).slice(-1)[0];
    if(to) setDay(to, delta);
    return;
  }
  const j = i + delta;
  if(j < 0 || j >= allDates.length){
    const s = $('#dayslide');
    if(s){ s.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
           s.style.transform='translateX('+(delta>0?-12:12)+'px)';
           setTimeout(()=>{ s.style.transform=''; setTimeout(()=>{ s.style.transition=''; },320); },130); }
    return;
  }
  setDay(allDates[j], delta);
}

/* ════════════════════════════════════════════════════════════════
   Gestures (§4) — one axis-locked handler per scrollable tab:
     vertical intent at scrollTop ≤ 0 → pull to refresh
     horizontal intent on the strip   → previous / next week
     horizontal intent anywhere else  → previous / next day (Book only)
   ════════════════════════════════════════════════════════════════ */
const PTR_TRIGGER = 66;      // finger travel that arms the refresh
const PTR_MAX     = 116;
let ptrBusy = false;

function ptrSet(dist, ready){
  const el = $('#ptr'); if(!el) return;
  const ring = el.firstElementChild; if(!ring) return;
  const d = clamp(dist, 0, PTR_MAX);
  const p = Math.min(1, d / PTR_TRIGGER);
  el.classList.remove('anim','spinning');
  el.classList.toggle('ready', !!ready);
  ring.style.opacity = String(Math.min(1, p * 1.3));
  ring.style.transform = 'translateY('+(d*0.6)+'px) scale('+(0.7 + 0.3*p)+') rotate('+(d*3.4)+'deg)';
}
function ptrEnd(spinning){
  const el = $('#ptr'); if(!el) return;
  const ring = el.firstElementChild; if(!ring) return;
  el.classList.add('anim');
  el.classList.remove('ready');
  if(spinning){
    el.classList.add('spinning');
    ring.style.opacity = '1';
    ring.style.transform = 'translateY(42px) scale(1) rotate(0deg)';
  }else{
    el.classList.remove('spinning');
    ring.style.opacity = '0';
    ring.style.transform = 'translateY(0) scale(.7) rotate(0deg)';
  }
}
async function pullRefresh(){
  if(ptrBusy) return;
  ptrBusy = true;
  ptrEnd(true);
  let fired = false, reloaded = false;
  try{
    fired = await autoSync(true);      // a REAL refresh.yml dispatch (still ≤1 per 5 min)
    reloaded = await loadAll(true);    // …plus an immediate re-read of the data files
  }catch(e){}
  /* F22 — never claim "Up to date" for a refresh that was debounced away behind a hung
     fetch: that is the exact moment the user is pulling BECAUSE it looks stuck. */
  if(!fired && !syncing){
    if(reloaded) toast(loadError ? 'Still offline — showing the cached view' : 'Up to date', 1800);
    else toast('Still loading…', 1500);
  }
  setTimeout(()=>{ ptrBusy = false; ptrEnd(false); }, 700);
}

function attachGestures(page, daySwipe){
  let sx=0, sy=0, locked=null, active=false, onRail=false, onChips=false, edgeStart=false;
  /* F4 — undo every visual side effect a partial gesture left behind. A second finger, a
     touchcancel the system raises for you (call banner, Control Centre, Reachability, the
     edge swipe) or a sheet opening mid-drag all used to strand #dayslide translated and
     faded, or the PTR ring frozen mid-pull at a random rotation, until another gesture
     happened to complete. touchstart cleared `active` before deciding whether it cared,
     and `end` then refused to clean up because `active` was already false. */
  function resetGestureVisuals(){
    const rs = $('#railslide'), ds = $('#dayslide');
    [rs,ds].forEach(s=>{ if(s){ s.classList.remove('drag'); s.style.transform=''; s.style.opacity=''; } });
    if(locked === 'ptr' && !ptrBusy) ptrEnd(false);
  }
  page.addEventListener('touchstart', e=>{
    if(active) resetGestureVisuals();      // a re-entrant touchstart aborts the old gesture
    locked = null; active = false;
    if(e.touches.length !== 1 || sheetOpen() || ptrBusy) return;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    /* .weekhead used to be part of this hit area; it no longer exists (its chevrons are in
       the nav bar, which is outside the page and so outside this listener entirely). The
       strip itself is what a horizontal swipe pages. */
    onRail  = !!(e.target.closest && e.target.closest('.rail'));
    onChips = !!(e.target.closest && e.target.closest('.chips'));
    /* F20 — iOS standalone web apps ship a system back/forward edge swipe authors cannot
       disable (w3c/manifest#1041). A horizontal gesture begun in the edge strip is claimed
       by the system and we get a touchcancel; refuse it outright so the failure is a clean
       no-op rather than a half-animated abort. */
    edgeStart = (sx <= 24 || sx >= (page.clientWidth - 24));
    active = true;
  }, {passive:true});

  page.addEventListener('touchmove', e=>{
    if(!active) return;
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(locked === null){
      /* axis lock: horizontal wins only on clear horizontal intent */
      if(Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5){
        locked = (onChips || edgeStart) ? 'none' : ((onRail || daySwipe) ? 'x' : 'none');   // F20
      } else if(dy > 9 && dy > Math.abs(dx) * 1.4 && page.scrollTop <= 0){
        locked = 'ptr';
      } else if(Math.abs(dy) > 9){
        locked = 'y';                       // ordinary scrolling — hands off
      }
    }
    if(locked === 'x'){
      if(e.cancelable) e.preventDefault();
      const s = onRail ? $('#railslide') : $('#dayslide');
      if(s){
        s.classList.add('drag');
        s.style.transform = 'translateX('+(dx*(onRail?0.28:0.32))+'px)';
        s.style.opacity = String(1 - Math.min(0.5, Math.abs(dx)/420));
      }
    } else if(locked === 'ptr'){
      /* F5 — the finger came back above where it started: the user changed their mind and
         wants to scroll. Hand the gesture back. Waiting for scrollTop>0 could never happen,
         because we are the reason it cannot scroll — 215px of upward travel stayed
         preventDefault()ed, which reads as a frozen app. */
      if(dy <= 0 || page.scrollTop > 0){ locked = 'y'; ptrEnd(false); return; }
      if(e.cancelable) e.preventDefault();
      ptrSet(dy, dy >= PTR_TRIGGER);
    }
  }, {passive:false});

  const end = e=>{
    /* F4 — always clean up, even for a gesture we already disowned: an orphaned transform
       or a frozen PTR ring is far worse than an ignored swipe */
    const wasActive = active; active = false;
    resetGestureVisuals();
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const was = locked; locked = null;
    if(!wasActive || !t) return;
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(was === 'x'){
      if(onRail){ if(dx < -44) stepWeek(1); else if(dx > 44) stepWeek(-1); }
      else if(daySwipe){ if(dx < -56) stepDay(1); else if(dx > 56) stepDay(-1); }
    } else if(was === 'ptr'){
      if(dy >= PTR_TRIGGER) pullRefresh(); else ptrEnd(false);
    }
  };
  page.addEventListener('touchend', end, {passive:true});
  page.addEventListener('touchcancel', end, {passive:true});
}
attachGestures($('#page-book'), true);
attachGestures($('#page-booked'), false);
attachGestures($('#page-picks'), false);

/* F12 — the .grabber pill is *the* iOS "drag me down to dismiss" affordance and every
   sheet drew one, but none of them could be dragged. Combined with body{overscroll-
   behavior:none} there was not so much as a wiggle for feedback, which reads as frozen. */
(function attachSheetDismiss(){
  const root = $('#sheetRoot');
  let sy = 0, dragging = false, sh = null, scrimEl = null;
  root.addEventListener('touchstart', e=>{
    dragging = false;
    if(e.touches.length !== 1) return;
    sh = e.target.closest && e.target.closest('.sheet'); if(!sh) return;
    const sc = e.target.closest('.sheet-scroll');
    if(sc && sc.scrollTop > 0) return;             // let an inner scroller scroll first
    scrimEl = $('.scrim', root);
    sy = e.touches[0].clientY; dragging = true;
  }, {passive:true});
  root.addEventListener('touchmove', e=>{
    if(!dragging || !sh) return;
    const dy = e.touches[0].clientY - sy;
    if(dy <= 0) return;
    if(e.cancelable) e.preventDefault();
    sh.style.transition = 'none';
    sh.style.transform = 'translateY('+dy+'px)';
    if(scrimEl) scrimEl.style.opacity = String(Math.max(0, 1 - dy/420));
  }, {passive:false});
  const settle = e=>{
    if(!dragging || !sh) return; dragging = false;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    const dy = t ? t.clientY - sy : 0;
    sh.style.transition = ''; sh.style.transform = '';
    if(scrimEl) scrimEl.style.opacity = '';
    if(dy > 110) closeSheet();
  };
  root.addEventListener('touchend', settle, {passive:true});
  root.addEventListener('touchcancel', settle, {passive:true});
})();

function jumpToClass(date, bid){
  const go = ()=>{
    const row = document.getElementById('row-'+bid);
    const page = $('#page-book');
    if(row && page){
      const y = row.getBoundingClientRect().top - page.getBoundingClientRect().top + page.scrollTop;
      page.scrollTop = Math.max(0, y - 200);
      row.classList.add('flash');
      setTimeout(()=>row.classList.remove('flash'), 1700);
    }
  };
  switchTab('book');
  if(studioFilter !== 'all'){ studioFilter = 'all'; }
  if(date !== selDate){ selDate = date; weekStart = pageOf(date); renderBook(); setTimeout(go, 60); }
  else { renderBook(); setTimeout(go, 60); }
}

/* ── pick toggle: every week vs just this one (§5) ───────────── */
/* redraw Book without losing the reader's place */
function rerenderBook(){
  const p = $('#page-book'), s = p ? p.scrollTop : 0;
  safeRender('book', renderBook);
  if(p) p.scrollTop = s;
}
/* AUDIT (18 Aug) — the chip filter, setDay and stepWeek each redraw Book from their own
   setTimeout, and all three called renderBook() directly, so `pointerHeld` was never
   consulted: a finger that went down on a row during those 100-165 ms had its row detached
   and its click resolved against whatever slid into those coordinates. Waiting for the
   finger to lift is invisible (a tap is ~100 ms) and cannot mis-target. */
function bookRenderSoon(ms, after){
  setTimeout(function run(){
    if(holdActive()){ setTimeout(run, 60); return; }
    try{ renderBook(); }catch(e){ safeRender('book', renderBook); }
    if(after) try{ after(); }catch(e){}
  }, ms);
}
/* Said on every route that adds a pick, because the route that had it was not the route
   the app's own empty state tells you to use. AUDIT (18 Aug): adding a clashing pick from
   the class sheet's switch produced no warning at all — the guard was on the repeat glyph
   only, which is D-25's round-2 lesson repeating in mirror image. */
function warnPickClash(c){
  const clash = pickClash(c);
  if(clash) toast('Heads up: you already pick '+fmt12(clash.time).full+' '+
                  (SLABEL[c.studio]||c.studio)+' on '+c.day+
                  ' — FIT allows one per studio per day', 4200);
}
/* A weekly pick makes every one-off for the same slot redundant — it books strictly more.
   Leaving both in place schedules the same occurrence twice, and the bot books one and logs
   the other as a studio-limit skip, which reads on screen as a failure that is not one. */
function dropRedundantOneOffs(day, time, studio){
  let n = 0;
  for(let i = picks.length - 1; i >= 0; i--){
    const p = picks[i];
    if(p.day===day && p.time===time && p.studio===studio && pickDate(p)){ picks.splice(i,1); n++; }
  }
  if(n){ resetDerived(); syncDirty(); }
  return n;
}

/* The repeat glyph is now the WEEKLY control, full stop, and there is no chooser sheet.
   Book saves the single date; this saves every week. The old sheet existed only because one
   control had to carry both meanings, and it asked the user to answer a question about the
   machinery ("How should the bot book this?") right after they had already said what they
   wanted by tapping. Two controls, two meanings, no question. */
function handlePickToggle(bid, btn){
  const c = findClass(bid);
  if(!c){ toast('That class is no longer listed — pull down to refresh.', 3600); return; }
  const hasRec = pickIndex(c.day, c.time, c.studio, '') >= 0;

  if(hasRec){
    removePick(c.day, c.time, c.studio, '');
    toast('No longer booking every ' + WD_LONG[dowMon0(c.date)], 2200);
  } else {
    /* AUDIT (24 Aug) — the glyph was the one commit path the collision blocks did not
       guard: it wrote a weekly pick from a blocked row, said "Every Wednesday", and the
       row flipped from its refusal straight to "Booked" — while for a TIME collision the
       bot would then book the overlap for real (it enforces FIT's studio limit, not the
       no-two-rooms rule, which lives only here). Same rule as bookNow/scheduleClass now:
       a colliding date refuses out loud; the glyph on any clear week of the same slot
       still works, and REMOVING a pick is never blocked. */
    resetDerived();
    const blk = bookBlock(c);
    if(blk){ toast(blockLine(blk, c)+'.', 4200); return; }
    addPick(c.day, c.time, c.studio, c.name, null);
    dropRedundantOneOffs(c.day, c.time, c.studio);
    toast('Every ' + WD_LONG[dowMon0(c.date)], 2200);
    warnPickClash(c);
  }
  afterPickChange();
}

/* Book on a class whose window has not opened yet. It saves the single date and says
   "Booked", because that is what the user just asked for and what will happen. No
   confirmation sheet: the owner's rule is that an action he took is not a background job
   and is never a question asked back to him. */
function scheduleClass(bid){
  const c = findClass(bid);
  if(!c){ toast('That class is no longer listed — pull down to refresh.', 3600); return; }
  if(bookingForClass(c)) return;                   // already booked; the row already says so
  const cover = pickFor(c);
  /* Only a pick that will actually take THIS occurrence covers it. A pick blocked on another
     date does not, and refusing on its behalf left the Book button doing nothing at all —
     no write, no sheet, no toast. Whatever happens after this point, something is said. */
  if(cover && pickIsLive(cover, c)) return;
  if(cover && !isOneOff(cover)){
    toast('That one is already booked every ' + WD_LONG[dowMon0(c.date)], 3000);
    return;
  }
  /* Same refusal as bookNow (24 Aug): saving the date for a class that collides with
     something already booked ends in FIT refusing it or a class he cannot attend. The
     button on a blocked row is already gone; this catches the sheet and any stale render,
     and it speaks (P-18). resetDerived: same stale-memo argument as bookNow (audit F4). */
  resetDerived();
  const blk = bookBlock(c);
  if(blk){ toast(blockLine(blk, c)+'.', 4200); return; }
  addPick(c.day, c.time, c.studio, c.name, c.date);
  warnPickClash(c);
  afterPickChange();
}

/* Cancelling a class that a WEEKLY pick is holding cancels every future one, not just the
   date on the row. The row names one date and looks exactly like the real booking beside it,
   whose Cancel raises a confirmation — so this one asks too, and says what it is really
   about to do. (AUDIT 19 Aug: one tap silently emptied a standing weekly choice, with no
   sheet, no toast and no undo.) A one-off is what it appears to be and needs no ceremony. */
async function unbookScheduled(spec){
  const a = spec.split('|');
  if(a.length !== 4) return;
  const day = a[0], time = a[1], studio = a[2], date = a[3];
  if(!date){
    const wd = WD_LONG[DAY_ORDER.indexOf(day)] || day;
    const choice = await actionSheet({
      title: 'Cancel every ' + wd + '?',
      message: 'This class is booked for you every week at ' + fmt12(time).full + ' · ' +
               (SLABEL[studio] || studio) + '. Cancelling here stops all of them, not just '+
               'this one.',
      actions: [{label:'Stop booking every ' + wd, style:'destructive'}],
      cancelLabel: 'Keep it'
    });
    if(choice !== 0) return;
  }
  /* The sheet is awaited, and a 45s poll replaces `picks` wholesale — so by the time it is
     answered the pick may be gone, or may have become a different pick for the same slot.
     Acting blind meant the user said "yes, stop all of them", nothing changed, and nothing
     was said. Re-check, and speak either way. */
  if(pickIndex(day, time, studio, date || '') < 0){
    toast('That one has already been removed', 3000);
    safeRender('booked', renderBooked);
    return;
  }
  removePick(day, time, studio, date);
  afterPickChange();
}

/* Every pick write lands on all three tabs at once. Booked is in the list because a
   scheduled class appears there now — the owner asked for a tap to put the class straight
   onto Booked rather than leave it somewhere separate. */
function afterPickChange(){
  rerenderBook();
  safeRender('picks', renderPicks);
  safeRender('booked', renderBooked);
  commitPicks();
}

/* ── delegated events ───────────────────────────────────────── */
document.addEventListener('click', function(e){
  const T = sel => e.target.closest(sel);

  const tab = T('.tabbtn'); if(tab){ switchTab(tab.dataset.tab); return; }

  const dcell = T('[data-date][data-act="jump"]');
  if(dcell){ jumpToClass(dcell.dataset.date, dcell.dataset.bid); return; }

  const wk = T('[data-week]'); if(wk){ stepWeek(Number(wk.dataset.week)); return; }

  const dc = T('.dcell[data-date]');
  if(dc){
    if(dc.classList.contains('past')) return;      // a past day is never selectable
    const d = dc.dataset.date; setDay(d, d > selDate ? 1 : -1); return;
  }

  const chip = T('[data-studio]'); if(chip){
    studioFilter = chip.dataset.studio;
    $$('.chip').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.studio===studioFilter)));
    const slide = $('#dayslide');
    if(slide) slide.style.opacity = '.3';
    bookRenderSoon(100);          // renderBook preserves the chip rail's own scroll now
    return;
  }

  /* One button, three jobs, decided by the mode the row stamped on it rather than by
     re-deriving the window state here — the row already made that decision and two places
     computing it is how they drift. */
  const bk = T('[data-book]');
  if(bk){
    const mode = bk.dataset.mode || 'now';
    if(mode === 'pick') scheduleClass(bk.dataset.book);
    else bookNow(bk.dataset.book, false, mode === 'waitlist');
    return;
  }

  const pt = T('[data-pick]'); if(pt){ handlePickToggle(pt.dataset.pick, pt); return; }

  /* Three routes reach "stop booking this": the × here, Cancel on a scheduled row on Booked,
     and the repeat glyph on a Book row. Only ONE of them needs to ask first, and it is not
     this one: a × on a row sitting under the heading "EVERY WEEK", beside the words "every
     Friday", is not a surprising scope — asking here would be confirming his own tap, which
     is the ceremony he asked to be rid of. What it did need was to stop being SILENT, which
     is a toast, not a sheet. The Booked row is the one that asks, because there the scope
     genuinely is a surprise: it names one date and removes every week (see unbookScheduled). */
  const rm = T('[data-remove]'); if(rm){
    const a = String(rm.dataset.remove || '').split('|');
    if(a.length === 4){
      removePick(a[0], a[1], a[2], a[3]);
      toast(a[3] ? 'Removed'
                 : 'No longer booking every ' + (WD_LONG[DAY_ORDER.indexOf(a[0])] || a[0]), 2400);
      afterPickChange();
    }
    return;
  }
  const cf = T('[data-confirm]'); if(cf){ confirmBooking(cf.dataset.confirm); return; }
  const cn = T('[data-cancel]'); if(cn){ cancelBooking(cn.dataset.cancel); return; }

  /* Cancelling a class that a pick is holding: there is nothing on FIT to undo, so this is
     a pick removal wearing the same word the row beside it uses. Keyed on the pick's own
     identity rather than a row index — this list redraws on a poll, a countdown flip and a
     past-class sweep, and an index is only correct against the exact list that was drawn. */
  const ub = T('[data-unbook]');
  if(ub){ unbookScheduled(String(ub.dataset.unbook || '')); return; }

  /* dismissing a persistent notice is the user saying "I have dealt with this" — it is the
     only thing that removes one that has not resolved by itself */
  const dm = T('[data-dismiss]'); if(dm){ dropAlert(dm.dataset.dismiss); rerenderKeepScroll(); return; }

  const act = T('[data-act]');
  if(act){
    const a = act.dataset.act;
    /* 'sync' and 'snipe' used to live here. There is no manual dispatch of any kind now:
       syncing is automatic, and the only workflows this app fires are the ones behind an
       explicit book or cancel. */
    if(a === 'login') login();
    else if(a === 'signout') doSignOut();
    else if(a === 'reload') loadAll();
    else if(a === 'goBook') switchTab('book');
    else if(a === 'goPicks') switchTab('picks');
    else if(a === 'close') closeSheet();
    else if(a === 'booknow'){ closeSheet(); setTimeout(()=>bookNow(act.dataset.bid, true, false), 200); }
    else if(a === 'waitlist'){ closeSheet(); setTimeout(()=>bookNow(act.dataset.bid, true, true), 200); }
    else if(a === 'schedule'){ closeSheet(); setTimeout(()=>scheduleClass(act.dataset.bid), 200); }
    else if(a === 'unschedule'){
      const c = findClass(act.dataset.bid);
      if(!c){ toast('That class is no longer listed — pull down to refresh.', 3600); return; }
      closeSheet();
      removePick(c.day, c.time, c.studio, c.date);
      afterPickChange();
    }
    else if(a === 'togglepick'){
      const c = findClass(act.dataset.bid);
      if(!c){ toast('That class is no longer listed — pull down to refresh.', 3600); return; }
      /* AUDIT (24 Aug) — same guard as handlePickToggle: turning the weekly switch ON
         from a colliding date is the third commit path and must refuse like the other
         two. Turning it OFF is never blocked. */
      if(pickIndex(c.day, c.time, c.studio, '') < 0){
        resetDerived();
        const blk = bookBlock(c);
        if(blk){ toast(blockLine(blk, c)+'.', 4200); return; }
      }
      const on = togglePick(c.day, c.time, c.studio, c.name, null);
      act.setAttribute('aria-checked', String(on));
      /* a weekly pick covers every date in the slot — drop the one-offs it makes redundant */
      if(on){ dropRedundantOneOffs(c.day, c.time, c.studio); warnPickClash(c); }
      afterPickChange();
    }
    return;
  }

  const row = T('.crow[data-bid]'); if(row){ openClassSheet(row.dataset.bid); return; }
}, false);

/* Escape closes the sheet. Nothing on the phone sends it, but the app is also opened on
   a Mac, and a modal with no keyboard dismissal is a trap there. */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && sheetOpen()) closeSheet();
});
$('#acctBtn').addEventListener('click', openAccountSheet);
$('#saveBtn').addEventListener('click', savePicks);

/* ── live countdowns (hero ticks every second) ──────────────── */
let flipQueued = false;
setInterval(function(){
  try{
    /* F19 — this used to run a document-wide querySelectorAll every second for the life of
       the page, hidden or not */
    if(!booted || document.hidden) return;
    /* `now` is read by every countdown node below. An 18 Aug edit replaced the old
       watchdog line and took this declaration with it, and because the whole tick is
       wrapped in a swallowing try/catch the symptom was silent: a ReferenceError on the
       first [data-cd] node aborted the tick, so every live countdown on Booked froze and a
       deadline passing never triggered its redraw. tests/tick_probe.py catches it. */
    const now = Date.now();
    if(!holdActive() && renderHeld) releasePointer();
    let flip = false;
    const nodes = document.querySelectorAll('[data-cd]');
    for(let i=0;i<nodes.length;i++){
      /* No default: the only two producers of [data-cd] both set a mode, and the old
         `|| 'hero'` fallback would have run `el.textContent = cdText(left)` over any future
         node that forgot one — wiping its glyph and its inner span rather than failing. */
      const el = nodes[i], at = Number(el.dataset.cd), mode = el.dataset.cdmode || '';
      const left = at - now;
      if(left <= 0){ flip = true; continue; }
      /* These two lines are written TWICE — here and in renderBooked — and this copy is the
         one the user actually reads, because the tick overwrites the rendered text within a
         second. The copy sweep only read the renderer, so "Cancels itself in 4h 59m" survived
         on screen while the string one bucket away said "Confirm within 4h 59m to keep your
         place". Keep the two in step; a mutation test that changes only the renderer's copy
         will pass while the screen still says the old thing. */
      else if(mode === 'free'){ const s = el.lastElementChild; if(s) s.textContent = freeCancelText(left); }
      else if(mode === 'confirm'){
        const s = el.lastElementChild;
        if(s) s.textContent = confirmWithinText(left);
      }
    }
    if(flip && !flipQueued){
      flipQueued = true;
      setTimeout(()=>{ flipQueued = false; heroCache = null; renderAllIdle(); }, 500);
    }
  }catch(e){}
}, 1000);

/* keep the lists honest as classes fall into the past.
   Was every 5 minutes, which was the window in which a started class kept a Book button.
   Every 30 s now, and it costs nothing when nothing has changed: timeMoved() is a date
   string and one pass over the class list, and a redraw only happens when the answer it
   gives has actually moved. Still skipped while hidden or while a sheet is open — but a
   skipped tick is made up by the next one, because the bucket comparison is stateful. */
setInterval(function(){
  try{
    if(!booted || document.hidden || sheetOpen()) return;   // F19
    if(!timeMoved()) return;
    indexDates();
    const p = $('#page-'+activeTab), s = p ? p.scrollTop : 0;
    renderAllIdle();
    if(p) p.scrollTop = s;
  }catch(e){}
}, 30000);

/* ── safe-area backstops for the no-cover world ─────────────────
   Without viewport-fit=cover, iOS reports env(safe-area-inset-*) as 0 — always — so the
   stylesheet's env() fallbacks resolve to 0 and these two functions restore the values by
   MEASUREMENT, only where the geometry actually demands them. Measured on-device 18 Aug
   2026 (iOS 26.6, dt/ probes — see IOS-VIEWPORT.md):

     • LETTERBOXED (the current 301994 behaviour, probe t5): the standalone view is
       62px short and seated BELOW the status bar, ending at the PHYSICAL bottom.
       Top clearance needed: NONE (the island is above the view). Bottom clearance:
       the home indicator floats over the view's bottom → restore --sab.
     • FULL-BLEED (classic behaviour, and the likely shape of any Apple fix): the view
       is full-height, underlapping the island at the top and the indicator at the
       bottom → restore BOTH --sat and --sab.

   Signature-gated exactly like their with-cover predecessors: standalone only (a browser
   tab's shortfall is Safari's own chrome), iOS only (Android standalone measures a
   shortfall from its own system bars but its view never underlaps them), and env() wins
   whenever it reports anything — so an iOS that starts reporting insets again silently
   takes over. Self-undoing: every call removes its own override and re-decides. */
function isIOSDevice(){
  const ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function measuredVar(name){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:var(' + name + ');' +
                        'visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const h = probe.getBoundingClientRect().height;
  probe.remove();
  return h;
}
/* A pinch/accessibility zoom shrinks innerHeight without changing the layout, which would
   misread as a container change mid-gesture. While zoomed, hold the last scale-1 decision. */
function zoomHeld(){
  return window.visualViewport && Math.abs(window.visualViewport.scale - 1) > 0.02;
}
function containerShortfall(){
  return (window.screen && window.screen.height ? window.screen.height : 0) -
         window.innerHeight;
}
function fixSafeAreaTop(){
  try{
    if(zoomHeld()) return;
    const root = document.documentElement;
    root.style.removeProperty('--sat');            // re-measure the stylesheet's own value
    if(measuredVar('--sat') > 0) return;           // env() works here — leave it alone
    if(!isStandalone() || !isIOSDevice()) return;
    const missing = containerShortfall();
    /* FULL-BLEED only: the view reaches the physical top, so the Dynamic Island overlaps
